는 것입니다. 무릇 이 여러 군자들은 큰 붓을 호미와 쟁기로 삼고, 종이와 서찰을 좋은 밭으로 삼으며, 그윽한 침묵을 농사로 삼고, 의리(義理)를 풍년으로 삼으며, 담론을 꽃송이로 삼고, 충서(忠恕)를 보배로 삼으며, 문장을 지어 비단을 삼고, 오경(五經)을 쌓아 명주를 삼으며, 겸허함에 앉아 자리를 삼고, 의로운 사양을 펼쳐 휘장을 삼으며, 인의(仁義)를 행하여 집으로 삼고, 도덕을 닦아 너른 저택으로 삼습니다.\"", ["비평", "학문", "청담"]], ["賞譽", 21, "人問王夷甫：「山巨源義理何如？是誰輩？」王曰：「此人初不肯以談自居，然不讀老、莊，時聞其詠，往往與其旨合。」", "누군가 왕이보(王夷甫, 왕연王衍)에게 물었다. \"산거원(山巨源, 산도山濤)의 의리(義理)는 어떠하며, 누구의 무리에 견줄 만합니까?\" 왕연이 말하였다. \"이 사람은 애초에 담론으로 자처하려 하지 않았으나, 그렇다고 『노자(老子)』와 『장자(莊子)』를 읽지도 않았는데, 때때로 그가 읊는 것을 들어보면 왕왕 그 뜻과 부합하였다.\"", ["비평", "청담"]], ["賞譽", 22, "洛中雅雅有三嘏：劉粹字純嘏，宏字終嘏，漠字沖嘏，是親兄弟。王安豐甥，並是王安豐女壻。宏，真長祖也。洛中錚錚馮惠卿，名蓀，是播子。蓀與邢喬俱司徒李胤外孫，及胤子順並知名。時稱：「馮才清，李才明，純粹邢。」", "낙양(洛陽) 안에 우아하기로 이름난 세 명의 '하(嘏)'가 있었으니, 유수(劉粹)는 자가 순하(純嘏)요, 유굉(劉宏)은 자가 종하(終嘏)요, 유막(劉漠)은 자가 충하(沖嘏)로, 이들은 친형제이며 안풍후(安豐侯) 왕융(王戎)의 생질이자 모두 왕융의 사위였다. 유굉은 유진장(劉眞長, 유담劉惔)의 조부이다. 낙양에서 쟁쟁하기로는 풍혜경(馮惠卿)이 있으니 이름은 손(蓀)이요 풍파(馮播)의 아들이다. 풍손과 형교(邢喬)는 모두 사도(司徒) 이윤(李胤)의 외손이며, 이윤의 아들 이순(李順)과 더불어 모두 이름이 알려졌다. 당시 사람들이 일컫기를 \"풍씨는 재주가 맑고, 이씨는 재주가 밝으며, 형씨는 순수하다\"라고 하였다.", ["비평", "재능"]], ["賞譽", 23, "衛伯玉為尚書令，見樂廣與中朝名士談議，奇之曰：「自昔諸人沒已來，常恐微言將絕。今乃復聞斯言於君矣！」命子弟造之曰：「此人，人之水鏡也，見之若披雲霧覩青天。」", "위백옥(衛伯玉)이 상서령(尙書令)이 되었을 때, 악광(樂廣)이 중조(中朝)의 명사들과 담의(談議)하는 것을 보고 기이하게 여기며 말하였다. \"옛적 여러 사람들이 세상을 떠난 이래로, 늘 미언(微言)이 끊어질까 두려워하였는데, 이제 다시 그대에게서 이 말을 듣는구나!\" 그러고는 자제들에게 명하여 그를 찾아가게 하며 말하였다. \"이 사람은 사람들의 물거울(水鏡)이니, 그를 보면 마치 구름과 안개를 헤치고 푸른 하늘을 보는 것 같다.\"", ["비평", "청담"]], ["賞譽", 24, "王太尉曰：「見裴令公精明朗然，籠蓋人上，非凡識也。若死而可作，當與之同歸。」或云王戎語。", "왕태위(王太尉, 왕연王衍)가 말하였다. \"배령공(裴令公, 배해裴楷)을 보면 정밀하고 밝아 사람들 위에 우뚝 솟으니, 보통의 식견이 아니다. 만약 죽은 이를 다시 살릴 수 있다면, 마땅히 그와 함께 돌아가리라.\" 혹자는 왕융(王戎)의 말이라고도 한다.", ["비평", "용모"]], ["賞譽", 25, "王夷甫自嘆：「我與樂令談，未嘗不覺我言為煩。」", "왕이보(王夷甫, 왕연王衍)가 스스로 탄식하며 말하였다. \"내가 악령(樂令, 악광樂廣)과 담론하면, 내 말이 번거롭다고 느끼지 않은 적이 없다.\"", ["비평", "청담", "겸손"]], ["賞譽", 26, "郭子玄有儁才，能言老、莊。庾敳嘗稱之，每曰：「郭子玄何必減庾子嵩！」", "곽자현(郭子玄)은 뛰어난 재주가 있어 『노자』와 『장자』를 잘 논하였다. 유애(庾敳)가 일찍이 그를 칭찬하여 매번 말하였다. \"곽자현이 어찌 반드시 유자숭(庾子嵩, 유애庾敳)만 못하겠는가!\"", ["비평", "청담"]], ["賞譽", 27, "王平子目太尉：「阿兄形似道，而神鋒太儁。」太尉答曰：「誠不如卿落落穆穆。」", "왕평자(王平子)가 태위(太尉, 왕연王衍)를 평하였다. \"형님은 모습이 도(道)에 가까우나, 신기(神氣)의 칼날이 너무 빼어납니다.\" 태위가 답하였다. \"진실로 너의 시원시원하고 온화함만은 못하다.\"", ["비평", "용모"]], ["賞譽", 28, "太傅府有三才：劉慶孫長才，潘陽仲大才，裴景聲清才。", "태부부(太傅府)에 세 가지 재주가 있었으니, 유경손(劉慶孫)의 뛰어난 재주(長才), 반양중(潘陽仲)의 큰 재주(大才), 배경성(裴景聲)의 맑은 재주(淸才)였다.", ["비평", "재능"]], ["賞譽", 29, "林下諸賢，各有儁才子。籍子渾，器量弘曠。康子紹，清遠雅正。濤子簡，疏通高素。咸子瞻，虛夷有遠志。瞻弟孚，爽朗多所遺。秀子純、悌，並令淑有清流。戎子萬子，有大成之風，苗而不秀。唯伶子無聞。凡此諸子，唯瞻為冠，紹、簡亦見重當世。", "죽림(竹林)의 여러 현인들에게는 각기 뛰어난 재주를 가진 아들이 있었다. 완적(阮籍)의 아들 완혼(阮渾)은 기량(器量)이 넓고 트였다. 혜강(嵇康)의 아들 혜소(嵇紹)는 맑고 멀며 바르고 단정하였다. 산도(山濤)의 아들 산간(山簡)은 소통하고 고상하며 소박하였다. 완함(阮咸)의 아들 완첨(阮瞻)은 허심하고 평이하며 원대한 뜻이 있었다. 완첨의 아우 완부(阮孚)는 시원스러우나 빠뜨리는 것이 많았다. 향수(向秀)의 아들 향순(向純)과 향제(向悌)는 모두 어질고 맑은 풍류가 있었다. 왕융(王戎)의 아들 만자(萬子)는 크게 이룰 풍모가 있었으나 싹만 트고 꽃을 피우지 못하였다. 오직 유령(劉伶)의 아들만은 알려진 바가 없다. 무릇 이 여러 아들 중에 오직 완첨이 으뜸이요, 혜소와 산간도 당세에 중히 여겨졌다.", ["비평", "재능"]], ["賞譽", 30, "庾子躬有廢疾，甚知名。家在城西，號曰城西公府。", "유자궁(庾子躬)은 폐질(廢疾)이 있었으나 매우 이름이 알려졌다. 집이 성 서쪽에 있어 '성서공부(城西公府)'라 불렸다.", ["비평", "병과늙음"]], ["賞譽", 31, "王夷甫語樂令：「名士無多人，故當容平子知。」", "왕이보(王夷甫, 왕연王衍)가 악령(樂令, 악광樂廣)에게 말하였다. \"명사가 많지 않으니, 진실로 마땅히 평자(平子, 왕징王澄)는 인정해 주어야 합니다.\"", ["비평"]], ["賞譽", 32, "王太尉云：「郭子玄語議如懸河寫水，注而不竭。」", "왕태위(王太尉, 왕연王衍)가 말하였다. \"곽자현(郭子玄)의 말과 논의는 마치 매달린 강물을 쏟아붓는 듯하여, 끊임없이 흘러 마르지 않는다.\"", ["비평", "청담"]], ["賞譽", 33, "司馬太傅府多名士，一時儁異。庾文康云：「見子嵩在其中，常自神王。」", "사마태부부(司馬太傅府)에는 명사가 많아 한때의 빼어난 인재들이었다. 유문강(庾文康, 유량庾亮)이 말하였다. \"자숭(子嵩, 유애庾敳)이 그 가운데 있는 것을 보면, 늘 절로 신기(神氣)가 왕성하였다.\"", ["비평"]], ["賞譽", 34, "太傅東海王鎮許昌，以王安期為記室參軍，雅相知重。敕世子毗曰：「夫學之所益者淺，體之所安者深。閑習禮度，不如式瞻儀形。諷味遺言，不如親承音旨。王參軍人倫之表，汝其師之！」或曰：「王、趙、鄧三參軍，人倫之表，汝其師之！」謂安期、鄧伯道、趙穆也。袁宏作名士傳直云王參軍。或云，趙家先猶有此本。", "태부(太傅) 동해왕(東海王)이 허창(許昌)을 진수할 때, 왕안기(王安期)를 기실참군(記室參軍)으로 삼아 매우 알아주고 중히 여겼다. 세자 비(毗)에게 명하여 말하였다. \"무릇 배움으로 얻는 이익은 얕고, 몸소 익혀 편안해지는 바는 깊다. 예법을 익히는 것은 거동과 모습을 직접 우러러보는 것만 못하고, 남긴 말을 외고 음미하는 것은 직접 그 가르침을 받드는 것만 못하다. 왕참군은 인륜(人倫)의 표상이니, 너는 그를 스승으로 삼아라!\" 혹자는 \"왕(王)·조(趙)·등(鄧) 세 참군이 인륜의 표상이니, 너는 그들을 스승으로 삼아라\"라고 하였으니, 안기(安期)·등백도(鄧伯道)·조목(趙穆)을 이른다. 원굉(袁宏)이 지은 『명사전(名士傳)』에는 다만 왕참군이라 하였다. 혹자는 조씨 집안에 예전에 이 판본이 있었다고 한다.", ["학문", "비평", "간언"]], ["賞譽", 35, "庾太尉少為王眉子所知。庾過江，嘆王曰：「庇其宇下，使人忘寒暑。」", "유태위(庾太尉, 유량庾亮)는 젊어서 왕미자(王眉子)에게 인정을 받았다. 유량이 강을 건넌 뒤 왕미자를 찬탄하며 말하였다. \"그 처마 밑에 깃들면, 사람으로 하여금 추위와 더위를 잊게 하였다.\"", ["비평", "우정"]], ["賞譽", 36, "謝幼輿曰：「友人王眉子清通簡暢，嵇延祖弘雅劭長，董仲道卓犖有致度。」", "사유여(謝幼輿, 사곤謝鯤)가 말하였다. \"벗 왕미자(王眉子)는 맑고 통달하며 간결하고 화창하고, 혜연조(嵇延祖, 혜소嵇紹)는 너그럽고 우아하며 아름답고 뛰어나며, 동중도(董仲道)는 탁월하고 운치와 도량이 있다.\"", ["비평", "우정"]], ["賞譽", 37, "王公目太尉：「巖巖清峙，壁立千仞。」", "왕공(王公, 왕도王導)이 태위(太尉, 왕연王衍)를 평하였다. \"우뚝하게 맑게 솟아, 천 길 벼랑처럼 서 있다.\"", ["비평", "용모"]], ["賞譽", 38, "庾太尉在洛下，問訊中郎。中郎留之云：「諸人當來。」尋溫元甫、劉王喬、裴叔則俱至，酬酢終日。庾公猶憶劉、裴之才儁，元甫之清中。", "유태위(庾太尉, 유량庾亮)가 낙양에 있을 때 중랑(中郎, 왕탄지王坦之)에게 문안하였다. 중랑이 그를 붙잡으며 말하였다. \"여러 사람들이 올 것이오.\" 이윽고 온원보(溫元甫)·유왕교(劉王喬)·배숙칙(裴叔則, 배해裴楷)이 모두 이르러 하루 종일 술잔을 주고받았다. 유공(庾公)은 지금도 유교·배해의 빼어난 재주와 원보의 맑고 적중함을 기억한다.", ["비평", "술과취흥", "우정"]], ["賞譽", 39, "蔡司徒在洛，見陸機兄弟住參佐廨中，三間瓦屋，士龍住東頭，士衡住西頭。士龍為人，文弱可愛。士衡長七尺餘，聲作鍾聲，言多忼慨。", "채사도(蔡司徒)가 낙양에 있을 때, 육기(陸機) 형제가 참좌(參佐)의 관사 안에 거처하는 것을 보았는데, 세 칸 기와집에 사룡(士龍, 육운)은 동쪽 끝에, 사형(士衡, 육기)은 서쪽 끝에 거처하였다. 사룡의 사람됨은 문약(文弱)하여 사랑스러웠다. 사형은 키가 일곱 자 남짓이요, 목소리는 종소리 같았으며, 말에 강개함이 많았다.", ["비평", "용모"]], ["賞譽", 40, "王長史是庾子躬外孫，丞相目子躬云：「入理泓然，我已上人。」", "왕장사(王長史, 왕몽王濛)는 유자궁(庾子躬)의 외손이다. 승상(丞相, 왕도王導)이 자궁을 평하여 말하였다. \"이치(理)에 깊이 들어감이 그윽하여, 나보다 윗사람이다.\"", ["비평", "청담"]], ["賞譽", 41, "庾太尉目庾中郎：家從談談之許。", "유태위(庾太尉, 유량庾亮)가 유중랑(庾中郎, 유애庾敳)을 평하였다. \"우리 집안은 담담(談談, 담론)하는 것을 좇는다.\"", ["비평", "청담"]], ["賞譽", 42, "庾公目中郎：「神氣融散，差如得上。」", "유공(庾公, 유량庾亮)이 중랑(中郎, 유애庾敳)을 평하였다. \"신기(神氣)가 화락하고 트였으니, 그런대로 윗자리를 얻을 만하다.\"", ["비평"]], ["賞譽", 43, "劉琨稱祖車騎為朗詣，曰：「少為王敦所歎。」", "유곤(劉琨)이 조거기(祖車騎, 조적祖逖)를 일컬어 명쾌하고 통달했다(朗詣)고 하며 말하였다. \"젊어서 왕돈(王敦)의 찬탄을 받았다.\"", ["비평"]], ["賞譽", 44, "時人目庾中郎：「善於託大，長於自藏。」", "당시 사람들이 유중랑(庾中郎, 유애庾敳)을 평하였다. \"큰 것에 의탁하는 데 능하고, 스스로를 감추는 데 뛰어나다.\"", ["비평"]], ["賞譽", 45, "王平子邁世有儁才，少所推服。每聞衛玠言，輒歎息絕倒。", "왕평자(王平子)는 세상을 뛰어넘는 빼어난 재주가 있어, 젊어서는 추켜세우고 탄복하는 일이 드물었다. 그러나 매번 위개(衛玠)의 말을 들으면 곧 탄식하며 쓰러질 듯 감탄하였다.", ["비평", "재능"]], ["賞譽", 46, "王大將軍與元皇表云：「舒風概簡正，允作雅人，自多於邃。最是臣少所知拔。中間夷甫、澄見語：『卿知處明、茂弘。茂弘已有令名，真副卿清論；處明親疎無知之者，吾常以卿言為意，殊未有得，恐已悔之？』臣慨然曰：『君以此試，頃來始乃有稱之者。』言常人正自患知之使過，不知使負實。」", "왕대장군(王大將軍, 왕돈王敦)이 원황제(元皇帝)에게 올린 표문에서 말하였다. \"왕서(王舒)는 풍모와 기개가 간결하고 바르니 진실로 우아한 사람이 될 만하여, 절로 왕수(王邃)보다 낫습니다. 이는 신이 젊어서부터 알아보고 발탁한 바입니다. 그 사이에 왕이보(王夷甫, 왕연)와 왕징(王澄)이 신에게 말하기를 '그대는 왕처명(王處明)과 왕무홍(王茂弘, 왕도王導)을 알아보았소. 무홍은 이미 좋은 명성이 있어 진실로 그대의 맑은 평론에 부합하지만, 처명은 가깝건 멀건 그를 아는 자가 없으니, 내가 늘 그대의 말을 마음에 두었으나 도무지 얻은 바가 없소. 아마 이미 후회하지 않으시오?'라고 하였습니다. 신이 개연히 말하였습니다. '그대가 이로써 시험해 보시면, 근래에야 비로소 그를 칭찬하는 자가 있을 것이오.' 보통 사람은 다만 알아주는 것이 지나칠까만 근심하고, 알아주는 것이 실상을 저버릴까는 알지 못함을 말한 것입니다.\"", ["비평", "권력"]], ["賞譽", 47, "周侯於荊州敗績，還，未得用。王丞相與人書曰：「雅流弘器，何可得遺？」", "주후(周侯, 주의周顗)가 형주(荊州)에서 크게 패하고 돌아온 뒤 아직 등용되지 못하였다. 왕승상(王丞相, 왕도王導)이 어떤 사람에게 편지를 보내 말하였다. \"우아한 부류요 큰 그릇이니, 어찌 버려둘 수 있겠는가?\"", ["비평", "도량", "권력"]], ["賞譽", 48, "時人欲題目高坐而未能。桓廷尉以問周侯，周侯曰：「可謂卓朗。」桓公曰：「精神淵箸。」", "당시 사람들이 고좌(高坐) 도인을 평하고자 하였으나 능히 하지 못하였다. 환정위(桓廷尉)가 이를 주후(周侯, 주의周顗)에게 묻자, 주후가 말하였다. \"탁월하고 명랑하다(卓朗) 할 만하다.\" 환공(桓公)이 말하였다. \"정신이 깊고 분명하다.\"", ["비평"]], ["賞譽", 49, "王大將軍稱其兒云：「其神候似欲可。」", "왕대장군(王大將軍, 왕돈王敦)이 그 아들을 일컬어 말하였다. \"그 신기(神氣)와 기색이 그런대로 괜찮을 듯하다.\"", ["비평"]], ["賞譽", 50, "卞令目叔向：「朗朗如百間屋。」", "변령(卞令)이 숙향(叔向)을 평하였다. \"환하기가 백 칸 집과 같다.\"", ["비평"]], ["賞譽", 51, "王敦為大將軍，鎮豫章。衛玠避亂，從洛投敦，相見欣然，談話彌日。于時謝鯤為長史，敦謂鯤曰：「不意永嘉之中，復聞正始之音。阿平若在，當復絕倒。」", "왕돈(王敦)이 대장군이 되어 예장(豫章)을 진수할 때, 위개(衛玠)가 난리를 피해 낙양에서 왕돈에게 의탁하니, 서로 만나 기뻐하며 종일토록 담화하였다. 그때 사곤(謝鯤)이 장사(長史)였는데, 왕돈이 사곤에게 말하였다. \"영가(永嘉) 연간에 다시 정시(正始)의 소리를 들을 줄은 생각지도 못했소. 아평(阿平, 왕징王澄)이 있었다면 다시 쓰러질 듯 감탄하였을 것이오.\"", ["청담", "비평", "우정"]], ["賞譽", 52, "王平子與人書，稱其兒：「風氣日上，足散人懷。」", "왕평자(王平子)가 어떤 사람에게 편지를 보내 그 아들을 일컬어 말하였다. \"풍모와 기상이 날로 향상되어, 사람의 가슴속을 풀어주기에 족하다.\"", ["비평", "용모"]], ["賞譽", 53, "胡毋彥國吐佳言如屑，後進領袖。", "호무언국(胡毋彦國)은 아름다운 말을 옥가루처럼 토해내어, 후진(後進)들의 영수였다.", ["비평", "청담"]], ["賞譽", 54, "王丞相云：「刁玄亮之察察，戴若思之巖巖，卞望之之峯距。」", "왕승상(王丞相, 왕도王導)이 말하였다. \"조현량(刁玄亮)의 밝고 살핌, 대약사(戴若思, 대연戴淵)의 우뚝함, 변망지(卞望之)의 봉우리처럼 버팀이로다.\"", ["비평"]], ["賞譽", 55, "大將軍語右軍：「汝是我佳子弟，當不減阮主簿。」", "왕대장군(王大將軍, 왕돈王敦)이 우군(右軍, 왕희지王羲之)에게 말하였다. \"너는 나의 훌륭한 자제이니, 마땅히 완주부(阮主簿, 완유阮裕)에 못지않을 것이다.\"", ["비평"]], ["賞譽", 56, "世目周侯：嶷如斷山。", "세상에서 주후(周侯, 주의周顗)를 평하였다. \"높이 솟아 잘라낸 산과 같다.\"", ["비평", "용모"]], ["賞譽", 57, "王丞相招祖約夜語，至曉不眠。明旦有客，公頭鬢未理，亦小倦。客曰：「公昨如是，似失眠。」公曰：「昨與士少語，遂使人忘疲。」", "왕승상(王丞相, 왕도王導)이 조약(祖約)을 불러 밤에 이야기하다가 새벽에 이르도록 자지 못하였다. 이튿날 아침 손님이 왔는데, 공의 머리와 살쩍이 다듬어지지 않았고 또 조금 피곤해 보였다. 손님이 말하였다. \"공께서 어제 이러하셨으니, 잠을 못 주무신 듯합니다.\" 공이 말하였다. \"어제 사소(士少, 조약祖約)와 이야기하다 보니, 마침내 사람으로 하여금 피로를 잊게 하였소.\"", ["우정", "비평"]], ["賞譽", 58, "王大將軍與丞相書，稱楊朗曰：「世彥識器理致，才隱明斷，既為國器，且是楊侯淮之子。位望殊為陵遲，卿亦足與之處。」", "왕대장군(王大將軍, 왕돈王敦)이 승상(丞相, 왕도王導)에게 편지를 보내 양랑(楊朗)을 일컬어 말하였다. \"세언(世彥, 양랑)은 식견과 그릇이 사리에 닿고, 재주를 감추되 분명히 결단하니, 이미 나라의 그릇이요 또한 양후 양준(楊淮)의 아들입니다. 지위와 명망이 자못 침체되어 있으니, 그대도 그와 함께 지낼 만합니다.\"", ["비평", "재능", "권력"]], ["賞譽", 59, "何次道往丞相許，丞相以麈尾指坐呼何共坐曰：「來！來！此是君坐。」", "하차도(何次道)가 승상(丞相, 왕도王導)의 처소로 갔는데, 승상이 주미(麈尾)로 자리를 가리키며 하차도를 불러 함께 앉자고 하며 말하였다. \"오시오! 오시오! 이것이 그대의 자리요.\"", ["우정", "권력"]], ["賞譽", 60, "丞相治楊州廨舍，按行而言曰：「我正為次道治此爾！」何少為王公所重，故屢發此嘆。", "승상(丞相, 왕도王導)이 양주(楊州)의 관사를 수리할 때, 두루 살펴보며 말하였다. \"나는 바로 차도(次道, 하차도)를 위하여 이것을 수리할 따름이다!\" 하차도가 젊어서 왕공(王公)에게 중히 여겨졌으므로 누차 이런 탄식을 한 것이다.", ["우정", "권력"]], ["賞譽", 61, "王丞相拜司徒而嘆曰：「劉王喬若過江，我不獨拜公。」", "왕승상(王丞相, 왕도王導)이 사도(司徒)에 임명되자 탄식하며 말하였다. \"유왕교(劉王喬)가 만약 강을 건너왔다면, 나 혼자 공(公)에 임명되지는 않았을 것이다.\"", ["비평", "겸손"]], ["賞譽", 62, "王藍田為人晚成，時人乃謂之癡。\n王丞相以其東海子，辟為掾。常集聚，王公每發言，眾人競贊之。述於末坐曰：「主非堯、舜，何得事事皆是？」丞相甚相嘆賞。", "왕남전(王藍田, 왕술王述)은 사람됨이 늦게 이루어져, 당시 사람들은 그를 어리석다고 여겼다. 왕승상(王丞相, 왕도王導)이 그가 동해왕(東海王)의 아들이라 하여 불러 연(掾)으로 삼았다. 늘 사람들이 모일 때, 왕공이 매번 말을 하면 사람들이 다투어 그를 칭찬하였다. 왕술이 말석에서 말하였다. \"주인께서 요(堯)·순(舜)이 아니시거늘, 어찌 일마다 다 옳을 수 있겠습니까?\" 승상이 매우 그를 찬탄하고 칭상하였다.", ["간언", "비평"]], ["賞譽", 63, "世目楊朗：「沈審經斷。」蔡司徒云：「若使中朝不亂，楊氏作公方未已。」謝公云：「朗是大才。」", "세상에서 양랑(楊朗)을 평하였다. \"침착하고 신중하며 사리에 밝아 결단한다.\" 채사도(蔡司徒)가 말하였다. \"만약 중조(中朝)가 어지럽지 않았다면, 양씨가 공(公)이 되는 것이 그치지 않았을 것이다.\" 사공(謝公, 사안謝安)이 말하였다. \"양랑은 큰 재목이다.\"", ["비평", "재능"]], ["賞譽", 64, "劉萬安即道真從子。庾公所謂「灼然玉舉」。又云：「千人亦見，百人亦見。」", "유만안(劉萬安)은 곧 도진(道眞)의 종자(從子)이다. 유공(庾公, 유량庾亮)이 이른바 \"빛나는 옥처럼 빼어나다\"고 한 사람이다. 또 말하였다. \"천 사람 가운데서도 눈에 띄고, 백 사람 가운데서도 눈에 띈다.\"", ["비평", "용모"]], ["賞譽", 65, "庾公為護軍，屬桓廷尉覓一佳吏，乃經年。桓後遇見徐寧而知之，遂致於庾公曰：「人所應有，其不必有；人所應無，己不必無。真海岱清士。」", "유공(庾公, 유량庾亮)이 호군(護軍)이 되어 환정위(桓廷尉)에게 부탁하여 좋은 관리 하나를 찾게 하였는데, 한 해가 넘도록 못 찾았다. 환정위가 나중에 서녕(徐寧)을 만나 그를 알아보고 마침내 유공에게 천거하며 말하였다. \"사람이 마땅히 가져야 할 것을 그는 꼭 가진 것은 아니나, 사람이 마땅히 없어야 할 것을 그는 꼭 없는 것이 아닙니다. 참으로 바닷가의 맑은 선비입니다.\"", ["비평", "권력"]], ["賞譽", 66, "桓茂倫云：「褚季野皮裏陽秋。」謂其裁中也。", "환무륜(桓茂倫)이 말하였다. \"저계야(褚季野)는 가죽 속의 춘추(皮裏陽秋)다.\" 그가 마음속으로 시비를 가린다는 것을 이른 것이다.", ["비평", "지혜"]], ["賞譽", 67, "何次道嘗送東人，瞻望見賈寧在後輪中，曰：「此人不死，終為諸侯上客。」", "하차도(何次道)가 일찍이 동쪽 사람을 전송할 때, 가녕(賈寧)이 뒤쪽 수레 안에 있는 것을 바라보고 말하였다. \"이 사람이 죽지 않는다면, 끝내 제후의 상객(上客)이 될 것이다.\"", ["비평", "예언"]], ["賞譽", 68, "杜弘治墓崩，哀容不稱。庾公顧謂諸客曰：「弘治至羸，不可以致哀。」又曰：「弘治哭不可哀。」", "두홍치(杜弘治)의 무덤이 무너졌는데, 슬퍼하는 모습이 격에 맞지 않았다. 유공(庾公, 유량庾亮)이 돌아보며 여러 손님에게 말하였다. \"홍치는 지극히 허약하니, 슬픔을 다하게 할 수 없다.\" 또 말하였다. \"홍치는 곡(哭)을 해도 슬프게 할 수 없다.\"", ["죽음", "비평"]], ["賞譽", 69, "世稱「庾文康為豐年玉，稺恭為荒年穀」。庾家論云是文康稱「恭為荒年穀，庾長仁為豐年玉。」", "세상에서 \"유문강(庾文康, 유량庾亮)은 풍년의 옥이요, 치공(稺恭, 유익庾翼)은 흉년의 곡식이다\"라고 일컬었다. 유씨 집안의 논의로는 문강이 \"치공은 흉년의 곡식이요, 유장인(庾長仁)은 풍년의 옥이다\"라고 일컬었다고 한다.", ["비평"]], ["賞譽", 70, "世目「杜弘治標鮮，季野穆少」。", "세상에서 \"두홍치(杜弘治)는 빼어나고 산뜻하며, 계야(季野, 저부褚裒)는 화목하고 차분하다\"고 평하였다.", ["비평", "용모"]], ["賞譽", 71, "有人目杜弘治：「標鮮清令，盛德之風，可樂詠也。」", "어떤 사람이 두홍치(杜弘治)를 평하였다. \"빼어나고 산뜻하며 맑고 아름다워, 성대한 덕의 풍모이니, 즐거이 노래할 만하다.\"", ["비평", "용모"]], ["賞譽", 72, "庾公云：「逸少國舉。」故庾倪為碑文云：「拔萃國舉。」", "유공(庾公, 유량庾亮)이 말하였다. \"일소(逸少, 왕희지王羲之)는 나라의 빼어난 인물이다.\" 그러므로 유예(庾倪)가 비문을 지어 말하였다. \"무리에서 뛰어나 나라의 빼어난 인물이다.\"", ["비평", "재능"]], ["賞譽", 73, "庾稺恭與桓溫書，稱「劉道生日夕在事，大小殊快。義懷通樂，既佳，且足作友，正實良器，推此與君，同濟艱不者也。」", "유치공(庾稺恭, 유익庾翼)이 환온(桓溫)에게 편지를 보내 일컬어 말하였다. \"유도생(劉道生)은 밤낮으로 일에 임하니 크고 작은 일이 자못 시원스럽고, 의로운 마음과 통달한 즐거움이 이미 훌륭하며, 또한 벗으로 삼기에 족하고, 참으로 좋은 그릇입니다. 이를 미루어 그대에게 추천하니, 함께 어려움을 건널 만한 자입니다.\"", ["비평", "우정"]], ["賞譽", 74, "王藍田拜揚州，主簿請諱，教云：「亡祖先君，名播海內，遠近所知。內諱不出於外，餘無所諱。」", "왕남전(王藍田, 왕술王述)이 양주(揚州)에 임명되자, 주부(主簿)가 피휘(避諱)할 이름을 청하니, 명을 내려 말하였다. \"돌아가신 조부와 선친의 이름은 해내(海內)에 널리 알려져 원근이 다 아는 바이다. 안의 휘(內諱)는 밖으로 내지 않으니, 그 밖에는 피휘할 것이 없다.\"", ["효", "겸손"]], ["賞譽", 75, "蕭中郎，孫丞公婦父。劉尹在撫軍坐，時擬為太常，劉尹云：「蕭祖周不知便可作三公不？自此以還，無所不堪。」", "소중랑(蕭中郎)은 손승공(孫丞公)의 장인이다. 유윤(劉尹, 유담劉惔)이 무군(撫軍)의 자리에 있을 때, 그를 태상(太常)으로 추천하려 하니, 유윤이 말하였다. \"소조주(蕭祖周)는 곧 삼공(三公)이 될 수 있을지는 모르겠으나, 이로부터 그 아래로는 감당하지 못할 것이 없다.\"", ["비평", "권력"]], ["賞譽", 76, "謝太傅未冠，始出西，詣王長史，清言良久。去後，苟子問曰：「向客何如尊？」長史曰：「向客亹亹，為來逼人。」", "사안(謝安)이 아직 관례를 치르기 전, 처음으로 서쪽으로 나가 왕장사(王長史, 왕몽)를 찾아가 청언(淸言)을 나눈 지 한참이 되었다. 그가 떠난 뒤 구자(苟子)가 물었다. \"방금 그 손님은 아버님과 견주어 어떻습니까?\" 장사가 말했다. \"방금 그 손님은 말이 막힘없이 흘러나와 사람을 압도할 만하더라.\"", ["비평", "청담"]], ["賞譽", 77, "王右軍語劉尹：「故當共推安石。」劉尹曰：「若安石東山志立，當與天下共推之。」", "왕희지(王羲之)가 유담(劉惔)에게 말했다. \"마땅히 다 함께 사안(謝安)을 추대해야 합니다.\" 유담이 말했다. \"만약 사안이 동산(東山)에서의 뜻을 세운다면, 마땅히 천하 사람들과 함께 그를 추대해야 할 것입니다.\"", ["비평", "은둔"]], ["賞譽", 78, "謝公稱藍田：「掇皮皆真。」", "사안(謝安)이 남전(藍田, 왕술)을 일컬어 말했다. \"껍질을 벗겨 보아도 모두 진짜다.\"", ["비평"]], ["賞譽", 79, "桓溫行經王敦墓邊過，望之云：「可兒！可兒！」", "환온(桓溫)이 길을 가다 왕돈(王敦)의 묘 옆을 지나가게 되었는데, 그것을 바라보며 말했다. \"대단한 사람이로다! 대단한 사람이로다!\"", ["비평"]], ["賞譽", 80, "殷中軍道王右軍云：「逸少清貴人。吾於之甚至，一時無所後。」", "은호(殷浩)가 왕희지(王羲之)를 평하여 말했다. \"일소(逸少)는 맑고 귀한 사람이다. 나는 그에게 지극히 잘 대하니, 한때도 뒤처지는 바가 없다.\"", ["비평", "우정"]], ["賞譽", 81, "王仲祖稱殷淵源：「非以長勝人，處長亦勝人。」", "왕몽(王濛)이 은연원(殷淵源, 은호)을 일컬어 말했다. \"장점으로 남을 이길 뿐 아니라, 그 장점에 처하는 방식 또한 남보다 낫다.\"", ["비평", "재능"]], ["賞譽", 82, "王司州與殷中軍語，嘆云：「己之府奧，蚤已傾寫而見，殷陳勢浩汗，眾源未可得測。」", "왕사주(王司州, 왕호지)가 은호(殷浩)와 더불어 이야기를 나누고 탄식하여 말했다. \"나의 깊은 속내는 일찌감치 다 쏟아 내어 드러났으나, 은호의 펼치는 기세는 넓고 아득하여, 여러 근원을 아직 다 헤아릴 수가 없다.\"", ["비평", "청담"]], ["賞譽", 83, "王長史謂林公：「真長可謂金玉滿堂。」林公曰：「金玉滿堂，復何為簡選？」王曰：「非為簡選，直致言處自寡耳。」", "왕장사(王長史, 왕몽)가 임공(林公, 지둔)에게 말했다. \"진장(眞長, 유담)은 금옥이 집안에 가득하다 할 만합니다.\" 임공이 말했다. \"금옥이 집안에 가득하다면, 다시 무엇을 가려 뽑겠습니까?\" 왕장사가 말했다. \"가려 뽑는 것이 아니라, 다만 그가 말을 내는 곳이 절로 드물 따름입니다.\"", ["비평"]], ["賞譽", 84, "王長史道江道羣：「人可應有，乃不必有；人可應無，己必無。」", "왕장사(王長史, 왕몽)가 강도군(江道羣, 강관)을 평하여 말했다. \"남이 마땅히 가지고 있을 만한 것을 그는 도리어 반드시 가지고 있지는 않으며, 남이 마땅히 없을 만한 것을 그는 반드시 없다.\"", ["비평"]], ["賞譽", 85, "會稽孔沈、魏顗、虞球、虞存、謝奉，並是四族之儁，于時之傑。孫興公目之曰：「沈為孔家金，顗為魏家玉，虞為長、琳宗，謝為弘道伏。」", "회계(會稽)의 공침(孔沈), 위의(魏顗), 우구(虞球), 우존(虞存), 사봉(謝奉)은 모두 네 가문의 빼어난 인물이요 당대의 걸출한 자들이었다. 손작(孫綽)이 그들을 평하여 말했다. \"공침은 공씨 가문의 금이요, 위의는 위씨 가문의 옥이며, 두 우씨는 우씨 가문의 으뜸이요, 사봉은 도를 넓히는 데에 엎드린 자다.\"", ["비평", "재능"]], ["賞譽", 86, "王仲祖、劉真長造殷中軍談，談竟，俱載去。劉謂王曰：「淵源真可。」王曰：「卿故墮其雲霧中。」", "왕몽(王濛)과 유담(劉惔)이 은호(殷浩)를 찾아가 담론하였는데, 담론이 끝나자 함께 수레를 타고 돌아갔다. 유담이 왕몽에게 말했다. \"연원(淵源, 은호)은 참으로 훌륭하오.\" 왕몽이 말했다. \"그대가 그의 구름과 안개 속에 빠진 것이오.\"", ["비평", "청담"]], ["賞譽", 87, "劉尹每稱王長史云：「性至通，而自然有節。」", "유담(劉惔)이 늘 왕장사(王長史, 왕몽)를 일컬어 말했다. \"성품이 지극히 통달하면서도, 자연스럽게 절도가 있다.\"", ["비평"]], ["賞譽", 88, "王右軍道謝萬石「在林澤中，為自遒上」。歎林公「器朗神儁」。道祖士少「風領毛骨，恐沒世不復見如此人」。道劉真長「標雲柯而不扶疎」。", "왕희지(王羲之)가 사만(謝萬)을 평하여 \"산림과 못 속에 있어도 절로 굳세고 높다\"고 하였다. 임공(林公, 지둔)을 탄미하여 \"기량이 밝고 정신이 빼어나다\"고 하였다. 조사소(祖士少, 조약)를 평하여 \"풍채와 골격이 빼어나니, 죽을 때까지 다시는 이런 사람을 보지 못할까 두렵다\"고 하였다. 유담(劉惔)을 평하여 \"높이 구름까지 가지를 뻗었으되 가지가 흐트러지지 않았다\"고 하였다.", ["비평", "용모"]], ["賞譽", 89, "簡文目庾赤玉：「省率治除。」謝仁祖云：「庾赤玉胷中無宿物。」", "간문제(簡文帝)가 유적옥(庾赤玉, 유통)을 평하여 \"맑고 솔직하며 다스려져 깔끔하다\"고 하였다. 사상(謝尚)이 말했다. \"유적옥은 가슴속에 묵은 것이 없다.\"", ["비평"]], ["賞譽", 90, "殷中軍道韓太常曰：「康伯少自標置，居然是出羣器。及其發言遣辭，往往有情致。」", "은호(殷浩)가 한태상(韓太常, 한백)을 평하여 말했다. \"강백(康伯, 한백)은 어려서부터 스스로를 높이 세웠으니, 분명히 무리에서 빼어난 그릇이다. 그가 말을 내고 글을 지음에 이르러서는 종종 정취가 있다.\"", ["비평", "학문"]], ["賞譽", 91, "簡文道王懷祖：「才既不長，於榮利又不淡；直以真率少許，便足對人多多許。」", "간문제(簡文帝)가 왕회조(王懷祖, 왕술)를 평하여 말했다. \"재주가 뛰어나지도 않고 영리에 담박하지도 않다. 다만 약간의 진솔함만으로도 능히 남의 여러 장점을 상대할 만하다.\"", ["비평"]], ["賞譽", 92, "林公謂王右軍云：「長史作數百語，無非德音，如恨不苦。」王曰：「長史自不欲苦物。」", "임공(林公, 지둔)이 왕희지(王羲之)에게 말했다. \"장사(長史, 왕몽)가 수백 마디를 하였는데 덕스러운 말 아닌 것이 없었으나, 다만 매섭지 못한 것이 아쉽소.\" 왕희지가 말했다. \"장사는 본래 남을 매섭게 대하려 하지 않습니다.\"", ["비평", "청담"]], ["賞譽", 93, "殷中軍與人書，道謝萬「文理轉遒，成殊不易」。", "은호(殷浩)가 어떤 이에게 편지를 보내, 사만(謝萬)을 평하여 \"글의 이치가 갈수록 굳세어지니, 이루어 냄이 자못 쉽지 않다\"고 하였다.", ["비평", "학문"]], ["賞譽", 94, "王長史云：「江思悛思懷所通，不翅儒域。」", "왕장사(王長史, 왕몽)가 말했다. \"강사전(江思悛, 강관)의 사유가 통달한 바는 유가의 영역만이 아니다.\"", ["비평", "학문"]], ["賞譽", 95, "許玄度送母，始出都，人問劉尹：「玄度定稱所聞不？」劉曰：「才情過於所聞。」", "허순(許詢)이 어머니를 모셔 가려고 처음 도성으로 나오자, 어떤 이가 유담(劉惔)에게 물었다. \"허순은 과연 들리는 명성에 걸맞습니까?\" 유담이 말했다. \"재주와 정취가 들리는 것보다 낫다.\"", ["비평", "효"]], ["賞譽", 96, "阮光祿云：「王家有三年少：右軍、安期、長豫。」", "완광록(阮光祿, 완유)이 말했다. \"왕씨 집안에 세 젊은이가 있으니, 우군(右軍, 왕희지)과 안기(安期, 왕응지)와 장예(長豫, 왕열)다.\"", ["비평"]], ["賞譽", 97, "謝公道豫章：「若遇七賢，必自把臂入林。」", "사안(謝安)이 예장(豫章, 사곤)을 평하여 말했다. \"만약 죽림칠현을 만났더라면, 분명 스스로 팔을 끼고 죽림으로 들어갔을 것이다.\"", ["비평", "은둔"]], ["賞譽", 98, "王長史歎林公：「尋微之功，不減輔嗣。」", "왕장사(王長史, 왕몽)가 임공(林公, 지둔)을 탄미하여 말했다. \"미묘한 이치를 탐구하는 공부가 보사(輔嗣, 왕필)에 못지않다.\"", ["비평", "청담"]], ["賞譽", 99, "殷淵源在墓所幾十年。于時朝野以擬管、葛，起不起，以卜江左興亡。", "은연원(殷淵源, 은호)이 묘소에서 거의 십 년을 지냈다. 그때 조정과 재야에서 그를 관중(管仲)과 제갈량(諸葛亮)에 견주어, 그가 일어나느냐 일어나지 않느냐로 강좌(江左)의 흥망을 점쳤다.", ["비평", "은둔", "예언"]], ["賞譽", 100, "殷中軍道右軍：「清鑒貴要。」", "은호(殷浩)가 왕희지(王羲之)를 평하여 말했다. \"맑은 감식안이 귀하고 요긴하다.\"", ["비평", "지혜"]], ["賞譽", 101, "謝太傅為桓公司馬，桓詣謝，值謝梳頭，遽取衣幘，桓公云：「何煩此。」因下共語至暝。既去，謂左右曰：「頗曾見如此人不？」", "사안(謝安)이 환온(桓溫)의 사마(司馬)였을 때, 환온이 사안을 찾아갔는데 마침 사안이 머리를 빗고 있었다. 사안이 급히 옷과 두건을 가져오게 하자, 환온이 말했다. \"어찌 이리 번거롭게 하시오.\" 그리하여 함께 앉아 이야기를 나누다 날이 저물었다. 떠난 뒤 환온이 좌우에게 말했다. \"일찍이 이런 사람을 본 적이 있는가?\"", ["비평", "용모"]], ["賞譽", 102, "謝公作宣武司馬，屬門生數十人於田曹中郎趙悅子。悅子以告宣武，宣武云：「且為用半。」趙俄而悉用之，曰：「昔安石在東山，縉紳敦逼，恐不豫人事；況今自鄉選，反違之邪？」", "사안(謝安)이 환온(桓溫)의 사마(司馬)가 되었을 때, 문하생 수십 명을 전조중랑(田曹中郎) 조열자(趙悅子)에게 부탁하였다. 조열자가 이를 환온에게 아뢰니, 환온이 말했다. \"우선 절반만 쓰라.\" 조열자가 이윽고 그들을 모두 임용하고 말했다. \"옛날 사안이 동산(東山)에 있을 때, 사대부들이 간곡히 핍박하면서도 그가 인사에 관여하지 않을까 걱정하였다. 하물며 지금 스스로 향리에서 가려 뽑은 자들인데, 도리어 그 뜻을 어기겠는가?\"", ["비평", "권력", "도량"]], ["賞譽", 103, "桓宣武表云：「謝尚神懷挺率，少致民譽。」", "환온(桓溫)이 표문(表文)에서 말했다. \"사상(謝尚)은 정신과 마음이 빼어나고 솔직하여, 젊어서부터 백성의 칭송을 받았습니다.\"", ["비평", "권력"]], ["賞譽", 104, "世目謝尚為令達，阮遙集云：「清暢似達。」或云：「尚自然令上。」", "세상에서 사상(謝尚)을 평하여 영달(令達)하다 하였는데, 완요집(阮遙集, 완부)이 말했다. \"맑고 화창함이 통달한 듯하다.\" 어떤 이는 \"사상은 자연스러우면서도 뛰어나다\"고 하였다.", ["비평"]], ["賞譽", 105, "桓大司馬病。謝公往省病，從東門入。桓公遙望，嘆曰：「吾門中久不見如此人！」", "환온(桓溫)이 병이 들었다. 사안(謝安)이 문병을 가서 동쪽 문으로 들어왔다. 환온이 멀리서 바라보고 탄식하여 말했다. \"내 문중에 오래도록 이런 사람을 보지 못했다!\"", ["비평", "병과늙음"]], ["賞譽", 106, "簡文目敬豫為「朗豫」。", "간문제(簡文帝)가 경예(敬豫, 왕흡)를 평하여 \"밝고 화락하다\"고 하였다.", ["비평"]], ["賞譽", 107, "孫興公為庾公參軍，共遊白石山。衛君長在坐，孫曰：「此子神情都不關山水，而能作文。」庾公曰：「衛風韻雖不及卿諸人，傾倒處亦不近。」孫遂沐浴此言。", "손작(孫綽)이 유량(庾亮)의 참군(參軍)이었을 때, 함께 백석산(白石山)에서 노닐었다. 위군장(衛君長, 위영)이 자리에 있었는데, 손작이 말했다. \"이 사람은 정신과 정취가 도무지 산수와 관계가 없으면서도 능히 글을 짓는다.\" 유량이 말했다. \"위영의 풍운(風韻)은 비록 그대들 여러 사람에게 미치지 못하나, 그가 마음을 기울이는 경지 또한 가깝지 않다.\" 손작이 마침내 이 말을 깊이 음미하였다.", ["비평", "자연과산수"]], ["賞譽", 108, "王右軍目陳玄伯：「壘塊有正骨。」", "왕희지(王羲之)가 진현백(陳玄伯, 진태)을 평하여 말했다. \"가슴에 응어리가 있으되 바른 골격이 있다.\"", ["비평"]], ["賞譽", 109, "王長史云：「劉尹知我，勝我自知。」", "왕장사(王長史, 왕몽)가 말했다. \"유담(劉惔)이 나를 아는 것이, 내가 나 자신을 아는 것보다 낫다.\"", ["우정", "비평"]], ["賞譽", 110, "王、劉聽林公講，王語劉曰：「向高坐者，故是凶物。」復東聽，王又曰：「自是鉢釪後王，何人也。」", "왕몽(王濛)과 유담(劉惔)이 임공(林公, 지둔)의 강론을 들었는데, 왕몽이 유담에게 말했다. \"저 높은 자리에 앉은 자는 참으로 무서운 인물이오.\" 다시 동쪽에서 듣고 나서 왕몽이 또 말했다. \"이는 바리때 든 자들 뒤의 왕이니, 어떤 사람이겠소.\"", ["비평", "청담"]], ["賞譽", 111, "許玄度言：「琴賦所謂『非至精者，不能與之析理』，劉尹其人；『非淵靜者，不能與之閑止』，簡文其人。」", "허순(許詢)이 말했다. \"「금부(琴賦)」에 이른바 '지극히 정밀한 자가 아니면 더불어 이치를 분석할 수 없다'고 한 것은 유담(劉惔)이 그 사람이요, '깊고 고요한 자가 아니면 더불어 한가로이 머물 수 없다'고 한 것은 간문제(簡文帝)가 그 사람이다.\"", ["비평", "음악"]], ["賞譽", 112, "魏隱兄弟，少有學義，總角詣謝奉。奉與語，大說之，曰：「大宗雖衰，魏氏已復有人。」", "위은(魏隱) 형제가 어려서부터 학문과 의리가 있어, 어린 나이에 사봉(謝奉)을 찾아갔다. 사봉이 그들과 이야기를 나누고 크게 기뻐하며 말했다. \"종가가 비록 쇠하였으나, 위씨 가문에 이미 다시 인재가 나왔구나.\"", ["비평", "학문", "신동"]], ["賞譽", 113, "簡文云：「淵源語不超詣簡至；然經綸思尋處，故有局陳。」", "간문제(簡文帝)가 말했다. \"연원(淵源, 은호)의 말은 뛰어나게 지극히 간결하지는 않으나, 세상을 다스리는 사유를 탐구하는 곳에서는 참으로 짜임새가 있다.\"", ["비평", "청담"]], ["賞譽", 114, "初，法汰北來未知名，王領軍供養之。每與周旋，行來往名勝許，輒與俱。不得汰，便停車不行。因此名遂重。", "처음에 법태(法汰)가 북쪽에서 와 아직 이름이 알려지지 않았을 때, 영군(領軍) 왕흡(王洽)이 그를 공양하였다. 매번 그와 왕래하며 이름난 명사들의 모임에 오갈 때마다 늘 함께 데리고 다녔다. 법태를 데려가지 못하면 곧 수레를 멈추고 가지 않았다. 이로 인해 그의 명성이 마침내 무거워졌다.", ["우정", "비평"]], ["賞譽", 115, "王長史與大司馬書，道淵源「識致安處，足副時談。」", "왕장사(王長史, 왕몽)가 환온(桓溫)에게 편지를 보내, 연원(淵源, 은호)을 평하여 \"식견과 운치가 평안한 곳에 처하니, 당대의 담론에 걸맞을 만하다\"고 하였다.", ["비평", "청담"]], ["賞譽", 116, "謝公云：「劉尹語審細。」", "사안(謝安)이 말했다. \"유담(劉惔)의 말은 세밀하게 살펴 정밀하다.\"", ["비평", "청담"]], ["賞譽", 117, "桓公語嘉賓：「阿源有德有言，向使作令僕，足以儀刑百揆。朝廷用違其才耳。」", "환온(桓溫)이 가빈(嘉賓, 치초)에게 말했다. \"아원(阿源, 은호)은 덕도 있고 말솜씨도 있으니, 만약 상서령이나 복야로 삼았더라면 능히 모든 관리의 본보기가 되었을 것이다. 조정이 그의 재능을 잘못 썼을 따름이다.\"", ["비평", "권력"]], ["賞譽", 118, "簡文語嘉賓：「劉尹語末後亦小異，回復其言，亦乃無過。」", "간문제(簡文帝)가 가빈(嘉賓, 치초)에게 말했다. \"유담(劉惔)의 말은 끝에 가서 또한 조금 달라지는데, 그 말을 되짚어 보면 또한 허물이 없다.\"", ["비평", "청담"]], ["賞譽", 119, "孫興公、許玄度共在白樓亭，共商略先往名達。林公既非所關，聽訖云：「二賢故自有才情。」", "손작(孫綽)과 허순(許詢)이 함께 백루정(白樓亭)에 있으면서, 함께 앞서간 이름난 명사들을 헤아려 논평하였다. 임공(林公, 지둔)은 관여한 바가 아니었으나, 다 듣고 나서 말했다. \"두 현인은 참으로 재주와 정취가 있다.\"", ["비평", "풍류"]], ["賞譽", 120, "王右軍道東陽「我家阿林，章清太出」。", "왕희지(王羲之)가 동양(東陽, 사랑)을 평하여 말했다. \"우리 집안의 아림(阿林, 사랑)은 빛나고 맑음이 크게 빼어나다.\"", ["비평", "용모"]], ["賞譽", 121, "王長史與劉尹書，道淵源「觸事長易」。", "왕장사(王長史, 왕몽)가 유담(劉惔)에게 편지를 보내, 연원(淵源, 은호)을 평하여 \"일을 대함에 한결같이 평이하다\"고 하였다.", ["비평"]], ["賞譽", 122, "謝中郎云：「王脩載樂託之性，出自門風。」", "사중랑(謝中郎, 사만)이 말했다. \"왕수재(王脩載, 왕탄)의 즐겁고 트인 성품은 그 가문의 기풍에서 나온 것이다.\"", ["비평"]], ["賞譽", 123, "林公云：「王敬仁是超悟人。」", "임공(林公, 지둔)이 말했다. \"왕경인(王敬仁, 왕수)은 뛰어나게 깨달은 사람이다.\"", ["비평"]], ["賞譽", 124, "劉尹先推謝鎮西，謝後雅重劉曰：「昔嘗北面。」", "유담(劉惔)이 처음에 사진서(謝鎮西, 사상)를 추대하였는데, 사상이 뒤에 유담을 매우 존중하여 말했다. \"옛날 일찍이 그를 스승으로 섬겼다.\"", ["비평", "겸손"]], ["賞譽", 125, "謝太傅稱王脩齡曰：「司州可與林澤遊。」", "사안(謝安)이 왕수령(王脩齡, 왕호지)을 일컬어 말했다. \"사주(司州, 왕호지)는 더불어 산림과 못에서 노닐 만하다.\"", ["비평", "자연과산수"]], ["賞譽", 126, "諺曰：「楊州獨步王文度，後來出人郗嘉賓。」", "속담에 이런 말이 있다. \"양주에서 홀로 걸음을 하는 이는 왕문도(王文度, 왕탄지)요, 뒤에 나와 남을 능가하는 이는 치가빈(郗嘉賓, 치초)이다.\"", ["비평"]], ["賞譽", 127, "人問王長史江虨兄弟羣從，王答曰：「諸江皆復足自生活。」", "어떤 이가 왕장사(王長史, 왕몽)에게 강빈(江虨)의 형제와 일족에 대해 물으니, 왕몽이 답하여 말했다. \"여러 강씨들은 모두 다 스스로 살아갈 만하다.\"", ["비평"]], ["賞譽", 128, "謝太傅道安北：「見之乃不使人厭，然出戶去，不復使人思。」", "사안(謝安)이 안북(安北, 왕탄지)을 평하여 말했다. \"그를 보면 사람을 싫증나게 하지 않으나, 문을 나서 떠나고 나면 다시 사람을 그립게 하지는 않는다.\"", ["비평"]], ["賞譽", 129, "謝公云：「司州造勝遍決。」", "사안(謝安)이 말했다. \"사주(司州, 왕호지)는 빼어난 경지에 이르면 두루 단정한다.\"", ["비평"]], ["賞譽", 130, "劉尹云：「見何次道飲酒，使人欲傾家釀。」", "유담(劉惔)이 말했다. \"하차도(何次道, 하충)가 술 마시는 것을 보면, 사람으로 하여금 온 집안의 술을 다 기울이고 싶게 만든다.\"", ["비평", "술과취흥"]], ["賞譽", 131, "謝太傅語真長：「阿齡於此事，故欲太厲。」劉曰：「亦名士之高操者。」", "사안(謝安)이 유담(劉惔)에게 말했다. \"아령(阿齡, 왕호지)은 이 일에 있어 참으로 너무 매섭다.\" 유담이 말했다. \"또한 명사의 높은 지조요.\"", ["비평", "충직"]], ["賞譽", 132, "王子猷說：「世目士少為朗，我家亦以為徹朗。」", "왕휘지(王徽之)가 말했다. \"세상에서 사소(士少, 조약)를 평하여 밝다 하는데, 우리 집안에서도 그를 두루 밝다고 여긴다.\"", ["비평"]], ["賞譽", 133, "謝公云：「長史語甚不多，可謂有令音。」", "사안(謝安)이 말했다. \"장사(長史, 왕몽)는 말이 심히 많지 않으니, 아름다운 음성이 있다 할 만하다.\"", ["비평", "음악"]], ["賞譽", 134, "謝鎮西道敬仁「文學鏃鏃，無能不新」。", "사진서(謝鎮西, 사상)가 경인(敬仁, 왕수)을 평하여 말했다. \"문학이 빼어나고 빼어나서, 능히 새롭지 않은 것이 없다.\"", ["비평", "학문"]], ["賞譽", 135, "劉尹道江道羣「不能言而能不言」。", "유담(劉惔)이 강도군(江道羣, 강관)을 평하여 말했다. \"말을 잘하지는 못하나, 능히 말하지 않을 줄을 안다.\"", ["비평", "지혜"]], ["賞譽", 136, "林公云：「見司州警悟交至，使人不得住，亦終日忘疲。」", "임공(林公, 지둔)이 말했다. \"사주(司州, 왕호지)를 보면 민첩한 깨달음이 번갈아 이르러, 사람으로 하여금 멈출 수 없게 하고, 또한 종일토록 피곤함을 잊게 한다.\"", ["비평"]], ["賞譽", 137, "世稱：「苟子秀出，阿興清和。」", "세상에서 일컫기를 \"구자(苟子, 왕수)는 빼어나고, 아흥(阿興, 왕몽)은 맑고 온화하다\"고 하였다.", ["비평"]], ["賞譽", 138, "簡文云：「劉尹茗柯有實理。」", "간문제(簡文帝)가 말했다. \"유담(劉惔)은 차나무 줄기와 같으면서도 실한 이치가 있다.\"", ["비평"]], ["賞譽", 139, "謝胡兒作著作郎，嘗作王堪傳。不諳堪是何似人，咨謝公。謝公答曰：「世冑亦被遇。堪，烈之子，阮千里姨兄弟，潘安仁中外。安仁詩所謂『子親伊姑，我父唯舅』。是許允壻。」", "사호아(謝胡兒, 사랑)가 저작랑(著作郎)이 되어 일찍이 「왕감전(王堪傳)」을 지었다. 왕감(王堪)이 어떤 사람인지 알지 못해 사안(謝安)에게 물었다. 사안이 답하여 말했다. \"세족이면서 또한 대우를 받은 자다. 왕감은 왕열(王烈)의 아들이요, 완천리(阮千里, 완첨)의 이종형제이며, 반안인(潘安仁, 반악)과는 내외종간이다. 반악의 시에 이른바 '그대의 친족은 곧 고모요, 내 아버지는 오직 외삼촌이다'라고 한 것이 그것이다. 또 허윤(許允)의 사위다.\"", ["학문", "비평"]], ["賞譽", 140, "謝太傅重鄧僕射，常言「天地無知，使伯道無兒」。", "사안(謝安)이 등복야(鄧僕射, 등유)를 중히 여겨, 늘 말했다. \"천지가 무지하여, 백도(伯道, 등유)로 하여금 자식이 없게 하였구나.\"", ["비평", "죽음"]], ["賞譽", 141, "謝公與王右軍書曰：「敬和棲託好佳。」", "사안(謝安)이 왕희지(王羲之)에게 편지를 보내 말했다. \"경화(敬和, 왕흡)는 깃들어 의탁함이 매우 아름답습니다.\"", ["비평"]], ["賞譽", 142, "吳四姓舊目云：「張文、朱武、陸忠、顧厚。」", "오(吳) 땅 네 성씨에 대해 예부터 평하여 말했다. \"장씨는 문(文)이요, 주씨는 무(武)요, 육씨는 충(忠)이요, 고씨는 후(厚)다.\"", ["비평"]], ["賞譽", 143, "謝公語王孝伯：「君家藍田，舉體無常人事。」", "사안(謝安)이 왕효백(王孝伯, 왕공)에게 말했다. \"그대 집안의 남전(藍田, 왕술)은 온몸에 평범한 사람의 기색이 없다.\"", ["비평", "용모"]], ["賞譽", 144, "許掾嘗詣簡文，爾夜風恬月朗，乃共作曲室中語。襟情之詠，偏是許之所長。辭寄清婉，有逾平日。簡文雖契素，此遇尤相咨嗟。不覺造厀，共叉手語，達于將旦。既而曰：「玄度才情，故未易多有許。」", "허연(許掾, 허순)이 일찍이 간문제(簡文帝)를 찾아갔는데, 그날 밤 바람이 잔잔하고 달이 밝아 함께 깊숙한 방 안에서 이야기를 나누었다. 흉금과 정회를 읊는 것은 유독 허순이 잘하는 바였다. 말과 표현이 맑고 곱기가 평소보다 뛰어났다. 간문제가 비록 평소에도 마음이 맞았으나, 이번 만남에서는 더욱 감탄하였다. 어느새 무릎이 닿을 만큼 가까이 다가가 함께 손을 맞잡고 이야기를 나누다 동틀 무렵에 이르렀다. 이윽고 간문제가 말했다. \"허순의 재주와 정취는 참으로 그만큼 갖춘 자가 쉽지 않다.\"", ["청담", "풍류", "비평"]], ["賞譽", 145, "殷允出西，郗超與袁虎書云：「子思求良朋，託好足下，勿以開美求之。」世目袁為「開美」，故子敬詩曰：「袁生開美度。」", "은윤(殷允)이 서쪽으로 나갈 때, 치초(郗超)가 원호(袁虎, 원굉)에게 편지를 보내 말했다. \"자사(子思, 은윤)가 좋은 벗을 구하여 그대에게 우정을 의탁하니, 트인 아름다움으로만 그를 헤아리지 마시오.\" 세상에서 원굉을 평하여 \"트인 아름다움(開美)\"이라 하였으므로, 왕헌지(王獻之)의 시에 \"원생(袁生)은 트인 아름다움의 기량이 있다\"고 하였다.", ["우정", "비평"]], ["賞譽", 146, "謝車騎問謝公：「真長性至峭，何足乃重？」答曰：「是不見耳！阿見子敬，尚使人不能已。」", "사현(謝玄)이 사안(謝安)에게 물었다. \"진장(眞長, 유담)은 성품이 지극히 매서운데, 어찌 그리 중히 여길 만합니까?\" 사안이 답하여 말했다. \"이는 그를 보지 못해서다! 내가 자경(子敬, 왕헌지)을 보아도 오히려 마음을 멈출 수 없게 하느니라.\"", ["비평"]], ["賞譽", 147, "謝公領中書監，王東亭有事應同上省，王後至，坐促，王、謝雖不通，太傅猶斂厀容之。王神意閑暢，謝公傾目。還謂劉夫人曰：「向見阿瓜，故自未易有。雖不相關，正是使人不能已已。」", "사안(謝安)이 중서감(中書監)을 겸하였을 때, 왕동정(王東亭, 왕순)이 일이 있어 마땅히 함께 관청에 올라야 했다. 왕순이 뒤늦게 이르렀고 자리가 비좁았는데, 왕순과 사안이 비록 서로 왕래하는 사이는 아니었으나, 사안이 그래도 무릎을 거두어 그를 받아들였다. 왕순의 정신과 뜻이 한가롭고 화창하니, 사안이 눈을 기울여 바라보았다. 돌아와 유부인(劉夫人)에게 말했다. \"방금 아과(阿瓜, 왕순)를 보았는데, 참으로 쉽게 있을 만한 인물이 아니더이다. 비록 서로 관계는 없으나, 바로 사람으로 하여금 마음을 멈출 수 없게 합디다.\"", ["비평", "도량", "용모"]], ["賞譽", 148, "王子敬語謝公：「公故蕭灑。」謝曰：「身不蕭灑。君道身最得，身正自調暢。」", "왕헌지(王獻之)가 사안(謝安)에게 말했다. \"공께서는 참으로 소탈하고 시원하십니다.\" 사안이 말했다. \"나는 소탈하고 시원하지 않다. 그대가 나를 평한 것이 가장 잘 들어맞으니, 나는 다만 절로 조화롭고 화창할 뿐이다.\"", ["비평", "겸손"]], ["賞譽", 149, "謝車騎初見王文度曰：「見文度雖蕭灑相遇，其復愔愔竟夕。」", "사현(謝玄)이 처음 왕문도(王文度, 왕탄지)를 보고 말했다. \"문도(文度, 왕탄지)를 보니, 비록 소탈하고 시원하게 만났으나, 그가 다시 고요하고 그윽하기가 밤새 이어지더라.\"", ["비평"]], ["賞譽", 150, "范豫章謂王荊州：「卿風流儁望，真後來之秀。」王曰：「不有此舅，焉有此甥？」", "범예장(范豫章, 범녕)이 왕형주(王荊州, 왕침)에게 말했다. \"그대의 풍류와 빼어난 명망은 참으로 후대의 빼어난 인재다.\" 왕침이 말했다. \"이런 외삼촌이 없었다면 어찌 이런 생질이 있겠습니까?\"", ["비평", "풍류"]], ["賞譽", 151, "子敬與子猷書，道「兄伯蕭索寡會，遇酒則酣暢忘反，乃自可矜」。", "왕헌지(王獻之)가 왕휘지(王徽之)에게 편지를 보내, \"형 백(伯)은 쓸쓸하여 모임이 적으나, 술을 만나면 흠뻑 취하여 돌아갈 줄을 잊으니, 참으로 가상할 만하다\"고 하였다.", ["비평", "술과취흥", "은둔"]], ["賞譽", 152, "張天錫世雄涼州，以力弱詣京師，雖遠方殊類，亦邊人之桀也。聞皇京多才，欽羡彌至。猶在渚住，司馬著作往詣之。言容鄙陋，無可觀聽。天錫心甚悔來，以遐外可以自固。王彌有儁才美譽，當時聞而造焉。既至，天錫見其風神清令，言話如流，陳說古今，無不貫悉。又諳人物氏族，中來皆有證據。天錫訝服。", "장천석(張天錫)은 대대로 양주(涼州)에 웅거하였으나, 세력이 약해지자 경사(京師)에 나아갔다. 비록 먼 지방의 다른 부류였으나 또한 변방 사람 가운데 걸출한 자였다. 황도(皇都)에 인재가 많다는 말을 듣고 흠모함이 지극하였다. 아직 물가에 머물러 있을 때, 사마 저작(司馬著作)이 그를 찾아갔다. 그러나 말과 용모가 비루하여 보고 들을 만한 것이 없었다. 장천석은 마음속으로 온 것을 몹시 후회하며, 먼 변방이라면 스스로를 굳게 지킬 수 있었으리라 여겼다. 왕미(王彌)는 뛰어난 재주와 아름다운 명예가 있어, 당시에 소문을 듣고 그를 찾아왔다. 이르고 보니 장천석이 보기에 그 풍신(風神)이 맑고 빼어났으며, 말이 물 흐르듯 하고, 고금(古今)을 진술함에 꿰뚫지 못하는 것이 없었다. 또 인물과 씨족에 통달하여 내력마다 모두 증거가 있었다. 장천석이 놀라 탄복하였다.", ["비평", "용모", "재능"]], ["賞譽", 153, "王恭始與王建武甚有情，後遇袁悅之間，遂致疑隟。然每至興會，故有相思。時恭嘗行散至京口射堂，于時清露晨流，新桐初引，恭目之曰：「王大故自濯濯。」", "왕공(王恭)은 처음 왕건무(王建武)와 매우 정이 두터웠으나, 뒤에 원열(袁悅)의 이간을 만나 마침내 의심과 틈이 생겼다. 그러나 흥취가 일 때마다 여전히 서로 그리워하였다. 한번은 왕공이 행산(行散)하러 경구(京口)의 사당(射堂)에 이르렀는데, 이때 맑은 이슬이 새벽에 흐르고 새 오동나무가 막 잎을 피우니, 왕공이 그것을 보며 말하였다. \"왕대(王大)는 참으로 깨끗하고 빛나는구나.\"", ["우정", "비평", "질투"]], ["賞譽", 154, "司馬太傅為二王目曰：「孝伯亭亭直上，阿大羅羅清疎。」", "사마 태부(司馬太傅)가 두 왕씨를 평하여 말하였다. \"효백(孝伯)은 우뚝 솟아 곧게 올라가고, 아대(阿大)는 시원스럽고 맑고 성기다.\"", ["비평"]], ["賞譽", 155, "王恭有清辭簡旨，能敘說，而讀書少，頗有重出。有人道孝伯常有新意，不覺為煩。", "왕공(王恭)은 맑은 말과 간결한 뜻이 있어 능히 서술하였으나, 글을 적게 읽어 자못 거듭 나오는 데가 있었다. 어떤 사람이 \"효백(孝伯)은 늘 새로운 뜻이 있어 번거롭게 느껴지지 않는다\"고 하였다.", ["비평", "청담", "학문"]], ["賞譽", 156, "殷仲堪喪後，桓玄問仲文：「卿家仲堪，定是何似人？」仲文曰：「雖不能休明一世，足以映徹九泉。」", "은중감(殷仲堪)이 죽은 뒤, 환현(桓玄)이 중문(仲文)에게 물었다. \"그대 집안의 중감은 정녕 어떠한 사람이었소?\" 중문이 말하였다. \"비록 한 세상을 아름답고 밝게 빛내지는 못하였으나, 충분히 구천(九泉)을 환히 비출 만합니다.\"", ["비평", "죽음"]], ["品藻", 1, "汝南陳仲舉，潁川李元禮二人，共論其功德，不能定先後。蔡伯喈評之曰：「陳仲舉彊於犯上，李元禮嚴於攝下。犯上難，攝下易。」仲舉遂在三君之下，元禮居八俊之上。", "여남(汝南)의 진중거(陳仲擧)와 영천(潁川)의 이원례(李元禮) 두 사람을 두고, 함께 그 공덕을 논하였으나 우열을 정하지 못하였다. 채백개(蔡伯喈)가 이를 평하여 말하였다. \"진중거는 윗사람을 거스르는 데 강하고, 이원례는 아랫사람을 다스리는 데 엄하다. 윗사람을 거스르기는 어렵고, 아랫사람을 다스리기는 쉽다.\" 이에 진중거는 삼군(三君)의 아래에 있게 되고, 이원례는 팔준(八俊)의 위에 있게 되었다.", ["비평"]], ["品藻", 2, "龐士元至吳，吳人並友之。見陸績、顧劭、全琮而為之目曰：「陸子所謂駑馬有逸足之用，顧子所謂駑牛可以負重致遠。」或問：「如所目，陸為勝邪？」曰：「駑馬雖精速，能致一人耳。駑牛一日行百里，所致豈一人哉？」吳人無以難。「全子好聲名，似汝南樊子昭。」", "방사원(龐士元)이 오(吳)에 이르자 오 사람들이 모두 그와 사귀었다. 그가 육적(陸績), 고소(顧劭), 전종(全琮)을 보고 평하여 말하였다. \"육자(陸子)는 이른바 둔한 말이로되 빨리 달리는 발의 쓰임이 있고, 고자(顧子)는 이른바 둔한 소로되 무거운 짐을 지고 멀리 갈 수 있다.\" 어떤 이가 물었다. \"평한 대로라면 육적이 나은 것입니까?\" 방사원이 말하였다. \"둔한 말은 비록 정밀하고 빠르나 한 사람을 데려갈 뿐이다. 둔한 소는 하루에 백 리를 가니, 데려가는 것이 어찌 한 사람뿐이겠는가?\" 오 사람들이 반박하지 못하였다. \"전자(全子)는 명성을 좋아하니 여남의 번자소(樊子昭)와 비슷하다.\"", ["비평"]], ["品藻", 3, "顧劭嘗與龐士元宿語，問曰：「聞子名知人，吾與足下孰愈？」曰：「陶冶世俗，與時浮沈，吾不如子；論王霸之餘策，覽倚仗之要害，吾似有一日之長。」劭亦安其言。", "고소(顧劭)가 한번은 방사원(龐士元)과 함께 묵으며 이야기하다가 물었다. \"그대가 사람을 알아본다는 이름이 있다고 들었소. 나와 그대 중에 누가 낫소?\" 방사원이 말하였다. \"세속을 도야(陶冶)하고 시류와 부침(浮沈)하는 데는 내가 그대만 못하오. 그러나 왕도(王道)와 패도(覇道)의 남은 책략을 논하고, 의지하고 기댈 요해(要害)를 살피는 데는 내가 하루의 나음은 있는 듯하오.\" 고소도 그 말을 편안히 여겼다.", ["비평", "지혜"]], ["品藻", 4, "諸葛瑾弟亮及從弟誕，並有盛名，各在一國。于時以為「蜀得其龍，吳得其虎，魏得其狗」。誕在魏與夏侯玄齊名；瑾在吳，吳朝服其弘量。", "제갈근(諸葛瑾)의 아우 양(亮)과 사촌아우 탄(誕)은 모두 큰 명성이 있었고, 각각 한 나라에 있었다. 이때 사람들은 \"촉(蜀)은 그 용을 얻었고, 오(吳)는 그 범을 얻었으며, 위(魏)는 그 개를 얻었다\"고 하였다. 탄은 위에서 하후현(夏侯玄)과 명성이 나란하였고, 근은 오에서 오의 조정이 그 넓은 기량(器量)에 탄복하였다.", ["비평", "제갈씨"]], ["品藻", 5, "司馬文王問武陔：「陳玄伯何如其父司空？」陔曰：「通雅博暢，能以天下聲教為己任者，不如也。明練簡至，立功立事，過之。」", "사마 문왕(司馬文王)이 무해(武陔)에게 물었다. \"진현백(陳玄伯)은 그 아버지 사공(司空)에 비해 어떠한가?\" 무해가 말하였다. \"통달하고 우아하며 박식하고 막힘이 없어 천하의 명성과 교화를 자기 임무로 삼는 점은 미치지 못합니다. 그러나 밝게 단련되고 간결하며 지극하여, 공을 세우고 일을 이루는 점은 아버지를 넘어섭니다.\"", ["비평"]], ["品藻", 6, "正始中，人士比論，以五荀方五陳：荀淑方陳寔，荀靖方陳諶，荀爽方陳紀，荀彧方陳羣，荀顗方陳泰。又以八裴方八王：裴徽方王祥，裴楷方王夷甫，裴康方王綏，裴綽方王澄，裴瓚方王敦，裴遐方王導，裴頠方王戎，裴邈方王玄。", "정시(正始) 연간에 인사들이 비교하여 논할 때, 다섯 순씨(荀氏)를 다섯 진씨(陳氏)에 견주었다. 순숙(荀淑)은 진식(陳寔)에, 순정(荀靖)은 진심(陳諶)에, 순상(荀爽)은 진기(陳紀)에, 순욱(荀彧)은 진군(陳羣)에, 순의(荀顗)는 진태(陳泰)에 견주었다. 또 여덟 배씨(裴氏)를 여덟 왕씨(王氏)에 견주었다. 배휘(裴徽)는 왕상(王祥)에, 배해(裴楷)는 왕이보(王夷甫)에, 배강(裴康)은 왕수(王綏)에, 배작(裴綽)은 왕징(王澄)에, 배찬(裴瓚)은 왕돈(王敦)에, 배하(裴遐)는 왕도(王導)에, 배외(裴頠)는 왕융(王戎)에, 배막(裴邈)은 왕현(王玄)에 견주었다.", ["비평"]], ["品藻", 7, "冀州刺史楊淮二子喬與髦，俱總角為成器。淮與裴頠、樂廣友善，遣見之。頠性弘方，愛喬之有高韻，謂淮曰：「喬當及卿，髦小減也。」廣性清淳，愛髦之有神檢，謂淮曰：「喬自及卿，然髦尤精出。」淮笑曰：「我二兒之優劣，乃裴、樂之優劣。」論者評之：以為喬雖高韻，而檢不匝；樂言為得。然並為後出之儁。", "기주 자사(冀州刺史) 양회(楊淮)의 두 아들 교(喬)와 모(髦)는 모두 어린 나이에 큰 그릇을 이루었다. 양회는 배외(裴頠), 악광(樂廣)과 벗으로 친하여, 두 아들을 보내 그들을 만나게 하였다. 배외는 성품이 넓고 반듯하여 교가 높은 운치를 지닌 것을 사랑하여 양회에게 말하였다. \"교는 마땅히 그대에게 미칠 것이나, 모는 조금 못합니다.\" 악광은 성품이 맑고 순박하여 모가 신묘한 단속을 지닌 것을 사랑하여 양회에게 말하였다. \"교는 그대에게 미칠 것이나, 모는 더욱 정묘하고 빼어납니다.\" 양회가 웃으며 말하였다. \"내 두 아들의 우열이 곧 배씨와 악씨의 우열이로구나.\" 논하는 자들이 이를 평하여, 교는 비록 높은 운치가 있으나 단속이 두루 갖추어지지 못하였으니, 악광의 말이 옳다고 여겼다. 그러나 둘 다 후세에 나온 준재(儁才)였다.", ["비평", "신동", "재능"]], ["品藻", 8, "劉令言始入洛，見諸名士而歎曰：「王夷甫太解明，樂彥輔我所敬，張茂先我所不解，周弘武巧於用短，杜方叔拙於用長。」", "유영언(劉令言)이 처음 낙양(洛陽)에 들어가 여러 명사들을 보고 탄식하여 말하였다. \"왕이보(王夷甫)는 지나치게 명민하고, 악언보(樂彥輔)는 내가 공경하는 바이며, 장무선(張茂先)은 내가 이해하지 못하는 바이고, 주홍무(周弘武)는 단점을 쓰는 데 교묘하며, 두방숙(杜方叔)은 장점을 쓰는 데 졸렬하다.\"", ["비평"]], ["品藻", 9, "王夷甫云：「閭丘沖，優於滿奮、郝隆。此三人並是高才，沖最先達。」", "왕이보(王夷甫)가 말하였다. \"여구충(閭丘沖)은 만분(滿奮), 학륭(郝隆)보다 낫다. 이 세 사람은 모두 높은 재주를 지녔으나, 충이 가장 먼저 통달하였다.\"", ["비평"]], ["品藻", 10, "王夷甫以王東海比樂令，故王中郎作碑云：「當時標榜，為樂廣之儷。」", "왕이보(王夷甫)가 왕동해(王東海)를 악령(樂令)에 견주었으므로, 왕중랑(王中郎)이 비문을 지어 말하였다. \"당시에 표방하기를 악광(樂廣)의 짝이라 하였다.\"", ["비평"]], ["品藻", 11, "庾中郎與王平子鴈行。", "유중랑(庾中郎)은 왕평자(王平子)와 어깨를 나란히 하였다.", ["비평"]], ["品藻", 12, "王大將軍在西朝時，見周侯輒扇障面不得住。後度江左，不能復爾。王歎曰：「不知我進，伯仁退？」", "왕대장군(王大將軍)이 서조(西朝)에 있을 때, 주후(周侯)를 보면 곧 부채로 얼굴을 가려 가만히 있을 수가 없었다. 뒤에 강좌(江左)로 건너온 뒤에는 다시 그러지 않았다. 왕돈(王敦)이 탄식하여 말하였다. \"내가 나아간 것인지, 백인(伯仁)이 물러난 것인지 알 수가 없구나.\"", ["비평", "겸손", "도량"]], ["品藻", 13, "會稽虞，元皇時與桓宣武同俠，其人有才理勝望。王丞相嘗謂曰：「孔愉有公才而無公望，丁潭有公望而無公才，兼之者其在卿乎？」未達而喪。", "회계(會稽)의 우(虞) 아무개는 원황제(元皇帝) 때 환선무(桓宣武)와 함께 협객으로 어울렸는데, 그 사람은 재주와 이치(理), 그리고 뛰어난 명망이 있었다. 왕승상(王丞相)이 한번은 그에게 말하였다. \"공유(孔愉)는 공(公)의 재주는 있으나 공의 명망이 없고, 정담(丁潭)은 공의 명망은 있으나 공의 재주가 없으니, 이를 겸한 자는 아마 그대일 것이오.\" 그러나 영달하지 못하고 죽었다.", ["비평", "재능", "권력"]], ["品藻", 14, "明帝問周伯仁：「卿自謂何如郗鑒？」周曰：「鑒方臣，如有功夫。」復問郗。郗曰：「周顗比臣，有國士門風。」", "명제(明帝)가 주백인(周伯仁)에게 물었다. \"경은 스스로 치감(郗鑒)에 비해 어떠하다고 생각하오?\" 주의(周顗)가 말하였다. \"치감이 신(臣)에 비하면 공력이 더 있는 듯합니다.\" 다시 치감에게 물었다. 치감이 말하였다. \"주의가 신에 비하면 국사(國士)의 문풍(門風)이 있습니다.\"", ["비평"]], ["品藻", 15, "王大將軍下，庾公問：「卿有四友，何者是？」答曰：「君家中郎，我家太尉、阿平、胡毋彥國。阿平故當最劣。」庾曰：「似未肯劣。」庾又問：「何者居其右？」王曰：「自有人。」又問：「何者是？」王曰：「噫！其自有公論。」左右躡公，公乃止。", "왕대장군(王大將軍)이 도성으로 내려오자, 유공(庾公)이 물었다. \"그대에게 네 벗이 있다는데, 누구누구요?\" 답하여 말하였다. \"그대 집안의 중랑(中郎), 우리 집안의 태위(太尉), 아평(阿平), 호무언국(胡毋彥國)이오. 아평이 본디 가장 못할 것이오.\" 유공이 말하였다. \"못하다고는 수긍하지 않을 듯하오.\" 유공이 또 물었다. \"누가 그 윗자리에 있소?\" 왕돈이 말하였다. \"따로 사람이 있소.\" 또 물었다. \"누구요?\" 왕돈이 말하였다. \"아! 그것은 절로 공론(公論)이 있을 것이오.\" 좌우 사람이 유공을 밟아 말리니, 유공이 이에 그쳤다.", ["비평", "우정"]], ["品藻", 16, "人問丞相：「周侯何如和嶠？」答曰：「長輿嵯櫱。」", "어떤 사람이 승상(丞相)에게 물었다. \"주후(周侯)는 화교(和嶠)와 비교하면 어떠합니까?\" 답하여 말하였다. \"장여(長輿)는 우뚝 솟은 바위 같다.\"", ["비평"]], ["品藻", 17, "明帝問謝鯤：「君自謂何如庾亮？」答曰：「端委廟堂，使百僚準則，臣不如亮。一丘一壑，自謂過之。」", "명제(明帝)가 사곤(謝鯤)에게 물었다. \"그대는 스스로 유량(庾亮)에 비해 어떠하다고 생각하오?\" 답하여 말하였다. \"단정하게 예복을 갖추고 묘당(廟堂)에 서서 백관(百僚)의 본보기가 되는 데는 신이 유량만 못합니다. 그러나 한 언덕과 한 골짜기에서 노니는 데는 스스로 그를 넘는다고 생각합니다.\"", ["비평", "은둔"]], ["品藻", 18, "王丞相二弟不過江，曰頴，曰敞。時論以頴比鄧伯道，敞比溫忠武。議郎、祭酒者也。", "왕승상(王丞相)의 두 아우는 강을 건너지 않았으니, 영(頴)과 창(敞)이라 하였다. 당시의 논의는 영을 등백도(鄧伯道)에, 창을 온충무(溫忠武)에 견주었다. 의랑(議郎)과 좨주(祭酒)를 지낸 이들이다.", ["비평"]], ["品藻", 19, "明帝問周侯：「論者以卿比郗鑒，云何？」周曰：「陛下不須牽顗比。」", "명제(明帝)가 주후(周侯)에게 물었다. \"논하는 자들이 경을 치감(郗鑒)에 견주는데, 어떻소?\" 주의(周顗)가 말하였다. \"폐하께서는 굳이 저 주의를 끌어다 견주실 것 없습니다.\"", ["비평", "겸손"]], ["品藻", 20, "王丞相云：「頃下論以我比安期、千里。亦推此二人。唯共推太尉，此君特秀。」", "왕승상(王丞相)이 말하였다. \"근래 도성의 논의가 나를 안기(安期), 천리(千里)에 견준다. 또한 이 두 사람을 추켜세우는 것이다. 다만 함께 추켜세우는 것은 태위(太尉)이니, 이분이 유독 빼어나다.\"", ["비평"]], ["品藻", 21, "宋褘曾為王大將軍妾，後屬謝鎮西。鎮西問褘：「我何如王？」答曰：「王比使君，田舍、貴人耳！」鎮西妖冶故也。", "송위(宋褘)는 일찍이 왕대장군(王大將軍)의 첩이었다가, 뒤에 사진서(謝鎮西)에게 속하였다. 진서가 송위에게 물었다. \"나는 왕씨에 비해 어떠하냐?\" 답하여 말하였다. \"왕씨는 사군(使君)에 비하면 시골 농사꾼과 귀인(貴人)의 차이일 뿐입니다.\" 진서가 요염하고 곱게 꾸몄던 까닭이다.", ["비평", "용모"]], ["品藻", 22, "明帝問周伯仁：「卿自謂何如庾元規？」對曰：「蕭條方外，亮不如臣；從容廊廟，臣不如亮。」", "명제(明帝)가 주백인(周伯仁)에게 물었다. \"경은 스스로 유원규(庾元規)에 비해 어떠하다고 생각하오?\" 답하여 말하였다. \"세속 밖에서 소조(蕭條)히 노니는 데는 유량(庾亮)이 신만 못하나, 조정에서 종용(從容)히 처신하는 데는 신이 유량만 못합니다.\"", ["비평", "겸손"]], ["品藻", 23, "王丞相辟王藍田為掾，庾公問丞相：「藍田何似？」王曰：「真獨簡貴，不減父祖；然曠澹處，故當不如爾。」", "왕승상(王丞相)이 왕남전(王藍田)을 속관(掾)으로 불러들이자, 유공(庾公)이 승상에게 물었다. \"남전은 어떠합니까?\" 왕도(王導)가 말하였다. \"참되고 홀로 간결하고 귀한 점은 그 아버지와 할아버지에 못지않다. 그러나 트이고 담박한 점은 본디 그분들만 못할 것이다.\"", ["비평"]], ["品藻", 24, "卞望之云：「郗公體中有三反：方於事上，好下佞己，一反。治身清貞，大脩計校，二反。自好讀書，憎人學問，三反。」", "변망지(卞望之)가 말하였다. \"치공(郗公)의 됨됨이에는 세 가지 상반됨이 있다. 윗사람을 섬기는 데는 반듯하면서도 아랫사람이 자기에게 아첨하기를 좋아하니, 이것이 첫째 상반됨이다. 몸가짐은 맑고 곧으면서도 셈하고 따지기를 크게 하니, 이것이 둘째 상반됨이다. 스스로는 글 읽기를 좋아하면서도 남이 학문하는 것을 미워하니, 이것이 셋째 상반됨이다.\"", ["비평"]], ["品藻", 25, "世論溫太真，是過江第二流之高者。時名輩共說人物，第一將盡之間，溫常失色。", "세상에서는 온태진(溫太眞)을 강을 건너온 인물 가운데 둘째 부류의 높은 자라고 논하였다. 당시 이름난 무리들이 함께 인물을 논할 때, 첫째 부류가 거의 끝나갈 즈음이면 온태진은 늘 안색을 잃었다.", ["비평"]], ["品藻", 26, "王丞相云：「見謝仁祖恆令人得上。與何次道語，唯舉手指地曰：『正自爾馨！』」", "왕승상(王丞相)이 말하였다. \"사인조(謝仁祖)를 보면 늘 사람으로 하여금 마음이 고양되게 한다. 하차도(何次道)와 더불어 말할 때는, 다만 손을 들어 땅을 가리키며 '바로 이렇게 향기로울 뿐이다'라고 할 뿐이었다.\"", ["비평", "풍류"]], ["品藻", 27, "何次道為宰相，人有譏其信任不得其人。阮思曠慨然曰：「次道自不至此。但布衣超居宰相之位，可恨！唯此一條而已。」", "하차도(何次道)가 재상이 되었을 때, 어떤 사람이 그가 사람을 잘못 신임한다고 나무랐다. 완사광(阮思曠)이 개연히 말하였다. \"차도는 본디 이런 데 이르지 않는다. 다만 베옷 입은 처지에서 뛰어올라 재상의 자리에 오른 것이 한스러울 뿐이니, 오직 이 한 가지뿐이다.\"", ["비평", "권력"]], ["品藻", 28, "王右軍少時，丞相云：「逸少何緣復減萬安邪？」", "왕우군(王右軍)이 어렸을 때, 승상(丞相)이 말하였다. \"일소(逸少)가 무슨 까닭에 또 만안(萬安)만 못하겠는가?\"", ["비평"]], ["品藻", 29, "郗司空家有傖奴，知及文章，事事有意。王右軍向劉尹稱之。劉問「何如方回？」王曰：「此正小人有意向耳！何得便比方回？」劉曰：「若不如方回，故是常奴耳！」", "치사공(郗司空) 집에 거친 종이 있었는데, 식견이 문장에 이르렀고 일마다 뜻이 있었다. 왕우군(王右軍)이 유윤(劉尹)에게 그를 칭찬하였다. 유윤이 물었다. \"방회(方回)와 비교하면 어떻소?\" 왕희지(王羲之)가 말하였다. \"이는 그저 소인이 뜻을 향함이 있을 뿐이오. 어찌 곧바로 방회에 견주겠소?\" 유윤이 말하였다. \"만약 방회만 못하다면, 그저 보통 종일 뿐이오.\"", ["비평", "재능"]], ["品藻", 30, "時人道阮思曠：「骨氣不及右軍，簡秀不如真長，韶潤不如仲祖，思致不如淵源，而兼有諸人之美。」", "당시 사람들이 완사광(阮思曠)을 평하였다. \"골기(骨氣)는 우군(右軍)에 미치지 못하고, 간결하고 빼어남은 진장(眞長)만 못하며, 아름답고 윤택함은 중조(仲祖)만 못하고, 생각의 깊이는 연원(淵源)만 못하나, 여러 사람의 아름다움을 겸하여 지녔다.\"", ["비평"]], ["品藻", 31, "簡文云：「何平叔巧累於理，嵇叔夜儁傷其道。」", "간문제(簡文帝)가 말하였다. \"하평숙(何平叔)은 교묘함이 이치(理)를 해치고, 혜숙야(嵇叔夜)는 뛰어남이 그 도(道)를 해친다.\"", ["비평", "청담"]], ["品藻", 32, "時人共論晉武帝出齊王之與立惠帝，其失孰多？多謂立惠帝為重。桓溫曰：「不然，使子繼父業，弟承家祀，有何不可？」", "당시 사람들이 함께 논하기를, 진 무제(晉武帝)가 제왕(齊王)을 내보낸 것과 혜제(惠帝)를 세운 것 가운데 어느 잘못이 더 큰가 하였다. 대부분 혜제를 세운 것을 더 무겁다고 하였다. 환온(桓溫)이 말하였다. \"그렇지 않다. 아들이 아비의 업을 잇고 아우가 집안의 제사를 받드는 것이 무슨 안 될 것이 있겠는가?\"", ["비평", "권력"]], ["品藻", 33, "人問殷淵源：「當世王公以卿比裴叔道，云何？」殷曰：「故當以識通暗處。」", "어떤 사람이 은연원(殷淵源)에게 물었다. \"당세의 왕공(王公)들이 경을 배숙도(裴叔道)에 견주는데, 어떻소?\" 은호(殷浩)가 말하였다. \"본디 식견으로 어두운 데를 통하는 점 때문일 것이오.\"", ["비평"]], ["品藻", 34, "撫軍問殷浩：「卿定何如裴逸民？」良久答曰：「故當勝耳。」", "무군(撫軍)이 은호(殷浩)에게 물었다. \"경은 정녕 배일민(裴逸民)에 비해 어떠하오?\" 한참 만에 답하여 말하였다. \"본디 나을 것입니다.\"", ["비평", "오만"]], ["品藻", 35, "桓公少與殷侯齊名，常有競心。桓問殷：「卿何如我？」殷云：「我與我周旋久，寧作我。」", "환공(桓公)은 젊어서 은후(殷侯)와 명성이 나란하여 늘 경쟁심이 있었다. 환온(桓溫)이 은호(殷浩)에게 물었다. \"경은 나에 비해 어떠하오?\" 은호가 말하였다. \"나는 나 자신과 오래 어울려 왔으니, 차라리 나로 있겠소.\"", ["비평", "오만"]], ["品藻", 36, "撫軍問孫興公：「劉真長何如？」曰：「清蔚簡令。」「王仲祖何如？」曰：「溫潤恬和。」「桓溫何如？」曰：「高爽邁出。」「謝仁祖何如？」曰：「清易令達。」「阮思曠何如？」曰：「弘潤通長。」「袁羊何如？」曰：「洮洮清便。」「殷洪遠何如？」曰：「遠有致思。」「卿自謂何如？」曰：「下官才能所經，悉不如諸賢；至於斟酌時宜，籠罩當世，亦多所不及。然以不才，時復託懷玄勝，遠詠老、莊，蕭條高寄，不與時務經懷，自謂此心無所與讓也。」", "무군(撫軍)이 손흥공(孫興公)에게 물었다. \"유진장(劉眞長)은 어떠하오?\" 답하여 말하였다. \"맑고 무성하며 간결하고 아름답습니다.\" \"왕중조(王仲祖)는 어떠하오?\" 답하였다. \"온화하고 윤택하며 편안하고 화평합니다.\" \"환온(桓溫)은 어떠하오?\" 답하였다. \"높고 시원하며 빼어나게 솟았습니다.\" \"사인조(謝仁祖)는 어떠하오?\" 답하였다. \"맑고 편안하며 아름답고 통달하였습니다.\" \"완사광(阮思曠)은 어떠하오?\" 답하였다. \"넓고 윤택하며 두루 통하고 깁니다.\" \"원양(袁羊)은 어떠하오?\" 답하였다. \"넘실넘실 맑고 편안합니다.\" \"은홍원(殷洪遠)은 어떠하오?\" 답하였다. \"심원하여 정취 있는 생각이 있습니다.\" \"경은 스스로 어떠하다고 생각하오?\" 답하였다. \"제가 거쳐온 재능은 모두 여러 현인만 못합니다. 시의(時宜)를 헤아리고 당세를 아우르는 데도 미치지 못하는 바가 많습니다. 그러나 재주 없는 몸으로 때때로 다시 현묘하고 빼어난 것에 마음을 부쳐, 멀리 노자와 장자를 읊으며, 소조(蕭條)히 높은 데 뜻을 부치고, 세상일을 마음에 두지 않으니, 스스로 이 마음만은 누구에게도 양보할 바 없다고 여깁니다.\"", ["비평", "청담"]], ["品藻", 37, "桓大司馬下都，問真長曰：「聞會稽王語奇進，爾邪？」劉曰：「極進，然故是第二流中人耳！」桓曰：「第一流復是誰？」劉曰：「正是我輩耳！」", "환대사마(桓大司馬)가 도성으로 내려와 진장(眞長)에게 물었다. \"회계왕(會稽王)의 말이 놀랍게 진보하였다 들었는데, 그렇소?\" 유윤(劉惔)이 말하였다. \"지극히 진보하였으나, 본디 둘째 부류 가운데 사람일 뿐입니다.\" 환온(桓溫)이 말하였다. \"첫째 부류는 또 누구요?\" 유윤이 말하였다. \"바로 우리 무리일 뿐입니다.\"", ["비평", "오만"]], ["品藻", 38, "殷侯既廢，桓公語諸人曰：「少時與淵源共騎竹馬，我棄去，己輒取之，故當出我下。」", "은후(殷侯)가 폐출된 뒤, 환공(桓公)이 여러 사람에게 말하였다. \"어렸을 때 연원(淵源)과 함께 죽마(竹馬)를 탔는데, 내가 버리고 가면 그가 곧 그것을 주워 가졌으니, 본디 내 아래에 있어야 마땅하다.\"", ["비평", "권력"]], ["品藻", 39, "人問撫軍：「殷浩談竟何如？」答曰：「不能勝人，差可獻酬羣心。」", "어떤 사람이 무군(撫軍)에게 물었다. \"은호(殷浩)의 담론은 결국 어떠합니까?\" 대답하였다. \"남을 이기지는 못하나, 여러 사람의 마음을 그런대로 주고받을 만하다.\"", ["비평", "청담"]], ["品藻", 40, "簡文云：「謝安南清令不如其弟，學義不及孔巖，居然自勝。」", "간문제(簡文帝)가 말하였다. \"사안남(謝安南)의 맑고 아름다움은 그 아우만 못하고, 학문과 의리는 공암(孔巖)에 미치지 못하나, 분명 절로 그를 이기는 데가 있다.\"", ["비평", "학문"]], ["品藻", 41, "未廢海西公時，王元琳問桓元子：「箕子、比干，迹異心同，不審明公孰是孰非？」曰：「仁稱不異，寧為管仲。」", "해서공(海西公)이 아직 폐위되지 않았을 때, 왕원림(王元琳)이 환원자(桓元子)에게 물었다. \"기자(箕子)와 비간(比干)은 자취는 다르나 마음은 같았는데, 명공께서는 누가 옳고 누가 그르다 여기십니까?\" 대답하였다. \"어질다는 칭송은 다르지 않으나, 차라리 관중(管仲)이 되겠다.\"", ["비평", "충직"]], ["品藻", 42, "劉丹陽、王長史在瓦官寺集，桓護軍亦在坐，共商略西朝及江左人物。或問：「杜弘治何如衛虎？」桓答曰：「弘治膚清，衛虎奕奕神令。」王、劉善其言。", "유단양(劉丹陽)과 왕장사(王長史)가 와관사(瓦官寺)에 모였는데, 환호군(桓護軍)도 자리에 있었다. 함께 서조(西朝)와 강좌(江左)의 인물들을 평하였다. 누군가 물었다. \"두홍치(杜弘治)는 위호(衛虎)와 견주어 어떠한가?\" 환호군이 대답하였다. \"홍치는 살결이 맑고, 위호는 빛나는 신령스러움이 있다.\" 왕장사와 유단양이 그 말을 좋게 여겼다.", ["비평", "용모"]], ["品藻", 43, "劉尹撫王長史背曰：「阿奴比丞相，但有都長。」", "유윤(劉尹)이 왕장사(王長史)의 등을 어루만지며 말하였다. \"자네는 승상(丞相)에 견주어, 다만 도량 넓음(都)과 진중함(長)이 있을 뿐이다.\"", ["비평", "도량"]], ["品藻", 44, "劉尹、王長史同坐，長史酒酣起舞。劉尹曰：「阿奴今日不復減向子期。」", "유윤(劉尹)과 왕장사(王長史)가 함께 앉아 있었는데, 장사가 술이 거나해지자 일어나 춤을 추었다. 유윤이 말하였다. \"자네는 오늘 다시금 상자기(向子期)에 못지않다.\"", ["풍류", "비평", "음악"]], ["品藻", 45, "桓公問孔西陽：「安石何如仲文？」孔思未對，反問公曰：「何如？」答曰：「安石居然不可陵踐其處，故乃勝也。」", "환공(桓溫)이 공서양(孔西陽)에게 물었다. \"안석(謝安)은 중문(仲文)과 견주어 어떠한가?\" 공서양이 생각하며 미처 대답하지 못하고 도리어 환공에게 되물었다. \"어떻습니까?\" 대답하였다. \"안석은 분명 그 경지를 짓밟을 수 없으니, 그래서 이기는 것이다.\"", ["비평"]], ["品藻", 46, "謝公與時賢共賞說，遏、胡兒並在坐。公問李弘度曰：「卿家平陽，何如樂令？」於是李潸然流涕曰：「趙王篡逆，樂令親授璽綬。亡伯雅正，恥處亂朝，遂至仰藥。恐難以相比！此自顯於事實，非私親之言。」謝公語胡兒曰：「有識者果不異人意。」", "사공(謝安)이 당대의 현인들과 함께 평하며 이야기하는데, 알(遏)과 호아(胡兒)가 모두 자리에 있었다. 사공이 이홍도(李弘度)에게 물었다. \"그대 집안의 평양(平陽)은 악령(樂令)과 견주어 어떠한가?\" 이에 이홍도가 주르륵 눈물을 흘리며 말하였다. \"조왕(趙王)이 찬역하였을 때 악령은 친히 옥새와 인끈을 바쳤습니다. 돌아가신 백부는 단정하고 바르시어 어지러운 조정에 머무르기를 부끄러이 여겨 마침내 약을 마시기에 이르렀습니다. 아마도 서로 견주기 어려울 것입니다. 이는 절로 사실에 드러난 것이지 사사로이 친족을 두둔하는 말이 아닙니다.\" 사공이 호아에게 말하였다. \"식견 있는 자는 과연 사람들의 뜻과 다르지 않구나.\"", ["비평", "충직", "죽음"]], ["品藻", 47, "王脩齡問王長史：「我家臨川，何如卿家宛陵？」長史未答，脩齡曰：「臨川譽貴。」長史曰：「宛陵未為不貴。」", "왕수령(王脩齡)이 왕장사(王長史)에게 물었다. \"우리 집안의 임천(臨川)은 그대 집안의 완릉(宛陵)과 견주어 어떠한가?\" 장사가 미처 대답하기 전에 수령이 말하였다. \"임천은 명망이 귀하다.\" 장사가 말하였다. \"완릉도 귀하지 않은 것은 아니다.\"", ["비평"]], ["品藻", 48, "劉尹至王長史許清言，時苟子年十三，倚牀邊聽。既去，問父曰：「劉尹語何如尊？」長史曰：「韶音令辭，不如我；往輒破的，勝我。」", "유윤(劉尹)이 왕장사(王長史)의 거처에 이르러 청담(淸談)을 나누었는데, 당시 구자(苟子)는 나이 열셋으로 평상 가에 기대어 듣고 있었다. 유윤이 떠난 뒤 아버지에게 물었다. \"유윤의 담론은 아버님과 견주어 어떠합니까?\" 장사가 말하였다. \"고운 가락과 아름다운 말은 나만 못하나, 한번 나서면 곧 핵심을 꿰뚫으니 그 점은 나보다 낫다.\"", ["비평", "청담", "신동"]], ["品藻", 49, "謝萬壽春敗後，簡文問郗超：「萬自可敗，那得乃爾失士卒情？」超曰：「伊以率任之性，欲區別智勇。」", "사만(謝萬)이 수춘(壽春)에서 패한 뒤, 간문제(簡文帝)가 치초(郗超)에게 물었다. \"사만이 패할 만은 하나, 어찌하여 그토록 사졸의 마음을 잃었는가?\" 치초가 말하였다. \"그는 멋대로 하는 성품 때문에 지혜로운 자와 용맹한 자를 구별하려 한 것입니다.\"", ["비평", "권력"]], ["品藻", 50, "劉尹謂謝仁祖曰：「自吾有四友，門人加親。」謂許玄度曰：「自吾有由，惡言不及於耳。」二人皆受而不恨。", "유윤(劉尹)이 사인조(謝仁祖)에게 말하였다. \"내게 네 벗이 생긴 뒤로 문인들이 더욱 친애한다.\" 또 허현도(許玄度)에게 말하였다. \"내게 자로(由)가 있은 뒤로 험한 말이 귀에 들리지 않는다.\" 두 사람은 모두 그 말을 받아들이고 서운해하지 않았다.", ["우정", "비평"]], ["品藻", 51, "世目殷中軍：「思緯淹通，比羊叔子。」", "세상에서 은중군(殷浩)을 평하였다. \"사려가 깊고 두루 통하니, 양숙자(羊叔子)에 견줄 만하다.\"", ["비평"]], ["品藻", 52, "有人問謝安石、王坦之優劣於桓公。桓公停欲言，中悔曰：「卿喜傳人語，不能復語卿。」", "어떤 사람이 사안석(謝安)과 왕탄지(王坦之)의 우열을 환공(桓溫)에게 물었다. 환공이 말하려다 멈추고는 중간에 뉘우치며 말하였다. \"그대는 남의 말을 옮기기를 좋아하니, 다시는 그대에게 말하지 못하겠다.\"", ["비평", "거절"]], ["品藻", 53, "王中郎嘗問劉長沙曰：「我何如苟子？」劉答曰：「卿才乃當不勝苟子，然會名處多。」王笑曰：「癡！」", "왕중랑(王坦之)이 일찍이 유장사(劉長沙)에게 물었다. \"나는 구자(苟子)와 견주어 어떠한가?\" 유장사가 대답하였다. \"그대의 재주는 구자를 이기지 못할 것이나, 명망을 모으는 데는 나은 점이 많다.\" 왕중랑이 웃으며 말하였다. \"어리석은 자로다!\"", ["비평", "재능"]], ["品藻", 54, "支道林問孫興公：「君何如許掾？」孫曰：「高情遠致，弟子蚤已服膺；一吟一詠，許將北面。」", "지도림(支遁)이 손흥공(孫綽)에게 물었다. \"그대는 허연(許掾)과 견주어 어떠한가?\" 손흥공이 말하였다. \"높은 정취와 원대한 운치는 제가 일찍부터 마음으로 우러러 따랐고, 한 번 읊고 한 번 노래함에 있어서는 허연이 마땅히 저를 스승으로 모실 것입니다.\"", ["비평", "겸손"]], ["品藻", 55, "王右軍問許玄度：「卿自言何如安石？」許未答，王因曰：「安石故相為雄，阿萬當裂眼爭邪？」", "왕우군(王羲之)이 허현도(許玄度)에게 물었다. \"그대는 스스로 안석(謝安)과 견주어 어떠하다 여기는가?\" 허현도가 미처 대답하지 못하자, 왕우군이 이어 말하였다. \"안석은 본디 으뜸으로 군림하려 하니, 사만(阿萬)인들 눈을 부릅뜨고 다투겠는가?\"", ["비평", "오만"]], ["品藻", 56, "劉尹云：「人言江虨田舍，江乃自田宅屯。」", "유윤(劉尹)이 말하였다. \"사람들은 강반(江虨)을 시골뜨기라 하나, 강반은 오히려 스스로 밭과 집을 일구어 모으는 사람이다.\"", ["비평", "청빈"]], ["品藻", 57, "謝公云：「金谷中蘇紹最勝。」紹是石崇姊夫，蘇則孫，愉子也。", "사공(謝安)이 말하였다. \"금곡(金谷)의 무리 가운데 소소(蘇紹)가 가장 뛰어났다.\" 소소는 석숭(石崇)의 누이의 남편이며, 소칙(蘇則)의 손자이고 소유(蘇愉)의 아들이다.", ["비평"]], ["品藻", 58, "劉尹目庾中郎：「雖言不愔愔似道，突兀差可以擬道。」", "유윤(劉尹)이 유중랑(庾中郎)을 평하였다. \"비록 말은 조용하여 도(道)에 가까운 것 같지 않으나, 우뚝함이 그런대로 도에 견줄 만하다.\"", ["비평", "청담"]], ["品藻", 59, "孫承公云：「謝公清於無奕，潤於林道。」", "손승공(孫承公)이 말하였다. \"사공(謝安)은 무혁(無奕)보다 맑고, 임도(林道)보다 윤택하다.\"", ["비평"]], ["品藻", 60, "或問林公：「司州何如二謝？」林公曰：「故當攀安提萬。」", "누군가 임공(支遁)에게 물었다. \"사주(司州)는 두 사씨와 견주어 어떠합니까?\" 임공이 말하였다. \"진실로 안석(謝安)을 붙들고 사만(謝萬)을 이끌 만하다.\"", ["비평"]], ["品藻", 61, "孫興公、許玄度皆一時名流。或重許高情，則鄙孫穢行；或愛孫才藻，而無取於許。", "손흥공(孫綽)과 허현도(許玄度)는 모두 한 시대의 명사였다. 어떤 이는 허현도의 높은 정취를 중히 여겨 손흥공의 더러운 행실을 비루하다 여겼고, 어떤 이는 손흥공의 재주와 문장을 아끼되 허현도에게서는 취할 것이 없다 하였다.", ["비평", "재능"]], ["品藻", 62, "郗嘉賓道謝公：「造厀雖不深徹，而纏綿綸至。」又曰：「右軍詣嘉賓。」嘉賓聞之云：「不得稱詣，政得謂之朋耳！」謝公以嘉賓言為得。", "치가빈(郗嘉賓)이 사공(謝安)을 평하였다. \"이치에 다가감이 비록 깊이 투철하지는 않으나, 곡진하고 면면히 이른다.\" 또 말하였다. \"우군(王羲之)이 가빈에게 다가갔다(詣).\" 가빈이 이를 듣고 말하였다. \"다가갔다(詣) 할 수는 없고, 다만 벗(朋)이라 이를 수 있을 뿐이다.\" 사공은 가빈의 말이 옳다고 여겼다.", ["비평", "우정"]], ["品藻", 63, "庾道季云：「思理倫和，吾愧康伯；志力彊正，吾愧文度。自此以還，吾皆百之。」", "유도계(庾道季)가 말하였다. \"사려와 이치가 조화로운 점에서 나는 강백(康伯)에게 부끄럽고, 뜻과 힘이 굳세고 바른 점에서 나는 문도(文度)에게 부끄럽다. 이 밖의 일에서는 나는 모두 그들의 백 배가 된다.\"", ["비평", "겸손"]], ["品藻", 64, "王僧恩輕林公，藍田曰：「勿學汝兄，汝兄自不如伊。」", "왕승은(王僧恩)이 임공(支遁)을 가벼이 여기자, 남전(藍田)이 말하였다. \"네 형을 본받지 마라. 네 형이야말로 그만 못하다.\"", ["비평"]], ["品藻", 65, "簡文問孫興公：「袁羊何似？」答曰：「不知者不負其才；知之者無取其體。」", "간문제(簡文帝)가 손흥공(孫綽)에게 물었다. \"원양(袁羊)은 어떠한가?\" 대답하였다. \"그를 모르는 자는 그의 재주를 저버리지 않고, 그를 아는 자는 그의 됨됨이에서 취할 것이 없습니다.\"", ["비평"]], ["品藻", 66, "蔡叔子云：「韓康伯雖無骨榦，然亦膚立。」", "채숙자(蔡叔子)가 말하였다. \"한강백(韓康伯)은 비록 골격은 없으나, 그래도 살결로는 설 만하다.\"", ["비평"]], ["品藻", 67, "郗嘉賓問謝太傅曰：「林公談何如嵇公？」謝云：「嵇公勤著腳，裁可得去耳。」又問：「殷何如支？」謝曰：「正爾有超拔，支乃過殷。然亹亹論辯，恐口欲制支。」", "치가빈(郗嘉賓)이 사태부(謝安)에게 물었다. \"임공(支遁)의 담론은 혜공(嵇康)과 견주어 어떠합니까?\" 사안이 말하였다. \"혜공이 부지런히 발을 디뎌야 겨우 따라잡을 정도다.\" 또 물었다. \"은호(殷浩)는 지둔(支遁)과 견주어 어떠합니까?\" 사안이 말하였다. \"바로 빼어나게 솟구치는 점에서는 지둔이 은호를 능가한다. 그러나 면면히 변론하는 데서는 아마 말로는 지둔을 누를 것이다.\"", ["비평", "청담"]], ["品藻", 68, "庾道季云：「廉頗、藺相如雖千載上死人，懍懍恆如有生氣。曹蜍、李志雖見在，厭厭如九泉下人。人皆如此，便可結繩而治，但恐狐狸猯狢噉盡。」", "유도계(庾道季)가 말하였다. \"염파(廉頗)와 인상여(藺相如)는 비록 천 년 전에 죽은 사람이나, 늠름하여 늘 살아 있는 기운이 있는 듯하다. 조서(曹蜍)와 이지(李志)는 비록 지금 살아 있으나, 시들시들하여 황천 아래 사람 같다. 사람이 모두 이러하다면 곧 노끈을 묶어 다스릴 수 있겠으나, 다만 여우와 살쾡이, 너구리와 담비가 다 먹어치울까 두렵다.\"", ["비평", "죽음"]], ["品藻", 69, "衛君長是蕭祖周婦兄，謝公問孫僧奴：「君家道衛君長云何？」孫曰：「云是世業人。」謝曰：「殊不爾，衛自是理義人。」于時以比殷洪遠。", "위군장(衛君長)은 소조주(蕭祖周) 아내의 오빠인데, 사공(謝安)이 손승노(孫僧奴)에게 물었다. \"그대 집안에서는 위군장을 어떻게 말하는가?\" 손승노가 말하였다. \"대대로 가업을 잇는 사람이라 합니다.\" 사안이 말하였다. \"전혀 그렇지 않다. 위군장은 본디 이치와 의리에 밝은 사람이다.\" 당시 사람들은 그를 은홍원(殷洪遠)에 견주었다.", ["비평", "학문"]], ["品藻", 70, "王子敬問謝公：「林公何如庾公？」謝殊不受，答曰：「先輩初無論，庾公自足沒林公。」", "왕자경(王獻之)이 사공(謝安)에게 물었다. \"임공(支遁)은 유공(庾亮)과 견주어 어떠합니까?\" 사안이 전혀 받아들이지 않으며 대답하였다. \"선배들은 애초에 그런 논의를 하지 않았다. 유공이야말로 임공을 충분히 묻어버릴 만하다.\"", ["비평"]], ["品藻", 71, "謝遏諸人共道竹林優劣，謝公云：「先輩初不臧貶七賢。」", "사알(謝遏) 등 여러 사람이 함께 죽림(竹林)의 우열을 논하였는데, 사공(謝安)이 말하였다. \"선배들은 애초에 칠현(七賢)을 좋다 나쁘다 평하지 않았다.\"", ["비평"]], ["品藻", 72, "有人以王中郎比車騎，車騎聞之曰：「伊窟窟成就。」", "어떤 사람이 왕중랑(王坦之)을 거기장군(車騎將軍)에 견주자, 거기장군이 이를 듣고 말하였다. \"그는 애써 이룬 사람이다.\"", ["비평"]], ["品藻", 73, "謝太傅謂王孝伯：「劉尹亦奇自知，然不言勝長史。」", "사태부(謝安)가 왕효백(王孝伯)에게 말하였다. \"유윤(劉尹)도 자신을 잘 아니, 그러나 장사(王長史)를 이긴다고는 말하지 않았다.\"", ["비평"]], ["品藻", 74, "王黃門兄弟三人俱詣謝公，子猷、子重多說俗事，子敬寒溫而已。既出，坐客問謝公：「向三賢孰愈？」謝公曰：「小者最勝。」客曰：「何以知之？」謝公曰：「吉人之辭寡，躁人之辭多，推此知之。」", "왕황문(王徽之) 형제 세 사람이 함께 사공(謝安)을 찾아갔는데, 자유(子猷)와 자중(子重)은 속된 일을 많이 이야기하였고, 자경(子敬)은 안부 인사만 할 뿐이었다. 그들이 나간 뒤 자리에 있던 손님이 사공에게 물었다. \"방금 세 현인 가운데 누가 낫습니까?\" 사공이 말하였다. \"작은 이가 가장 낫다.\" 손님이 말하였다. \"어찌 그것을 아십니까?\" 사공이 말하였다. \"길한 사람은 말이 적고 조급한 사람은 말이 많으니, 이로 미루어 안 것이다.\"", ["비평", "지혜"]], ["品藻", 75, "謝公問王子敬：「君書何如君家尊？」答曰：「固當不同。」公曰：「外人論殊不爾。」王曰：「外人那得知？」", "사공(謝安)이 왕자경(王獻之)에게 물었다. \"그대의 글씨는 그대 부친과 견주어 어떠한가?\" 대답하였다. \"본디 같지 않습니다.\" 사공이 말하였다. \"세상 사람들의 평은 전혀 그렇지 않다.\" 왕자경이 말하였다. \"세상 사람들이 어찌 알겠습니까?\"", ["비평", "서화"]], ["品藻", 76, "王孝伯問謝太傅：「林公何如長史？」太傅曰：「長史韶興。」問：「何如劉尹？」謝曰：「噫！劉尹秀。」王曰：「若如公言，並不如此二人邪？」謝云：「身意正爾也。」", "왕효백(王孝伯)이 사태부(謝安)에게 물었다. \"임공(支遁)은 장사(王長史)와 견주어 어떠합니까?\" 태부가 말하였다. \"장사는 곱고 흥취가 있다.\" 물었다. \"유윤(劉尹)과는 어떠합니까?\" 사안이 말하였다. \"아! 유윤은 빼어나다.\" 왕효백이 말하였다. \"공의 말씀대로라면 임공은 이 두 사람만 못한 것입니까?\" 사안이 말하였다. \"내 뜻이 바로 그러하다.\"", ["비평"]], ["品藻", 77, "人有問太傅：「子敬可是先輩誰比？」謝曰：「阿敬近撮王、劉之標。」", "어떤 사람이 태부(謝安)에게 물었다. \"자경(子敬)은 선배 중 누구에 견줄 만합니까?\" 사안이 말하였다. \"자경(阿敬)은 왕몽(王濛)과 유담(劉惔)의 풍격을 가까이 모은 사람이다.\"", ["비평"]], ["品藻", 78, "謝公語孝伯：「君祖比劉尹，故為得逮。」孝伯云：「劉尹非不能逮，直不逮。」", "사공(謝安)이 효백(王孝伯)에게 말하였다. \"그대의 조부를 유윤(劉尹)에 견주면, 본디 미칠 수는 있다.\" 효백이 말하였다. \"유윤에게 미칠 수 없는 것이 아니라, 다만 미치지 못할 뿐입니다.\"", ["비평", "겸손"]], ["品藻", 79, "袁彥伯為吏部郎，子敬與郗嘉賓書曰：「彥伯已入，殊足頓興往之氣。故知捶撻自難為人，冀小卻，當復差耳。」", "원언백(袁彥伯)이 이부랑(吏部郎)이 되자, 자경(子敬)이 치가빈(郗嘉賓)에게 편지를 보내 말하였다. \"언백이 이미 들어왔으니, 자못 흥겨워 나서던 기운을 꺾기에 충분하다. 그러니 매질당하는 것이 절로 사람 노릇 하기 어려움을 알겠다. 조금 물러나기를 바라니, 그러면 다시 나아질 것이다.\"", ["비평", "권력"]], ["品藻", 80, "王子猷、子敬兄弟共賞高士傳人及贊。子敬賞井丹高潔，子猷云：「未若長卿慢世。」", "왕자유(王徽之)와 자경(子敬) 형제가 함께 『고사전(高士傳)』의 인물과 그 찬(贊)을 평하였다. 자경은 정단(井丹)의 고결함을 높이 평하였는데, 자유가 말하였다. \"장경(長卿)이 세상을 가벼이 여긴 것만은 못하다.\"", ["비평", "은둔"]], ["品藻", 81, "有人問袁侍中曰：「殷仲堪何如韓康伯？」答曰：「理義所得，優劣乃復未辨；然門庭蕭寂，居然有名士風流，殷不及韓。」故殷作誄云：「荊門晝掩，閑庭晏然。」", "어떤 사람이 원시중(袁侍中)에게 물었다. \"은중감(殷仲堪)은 한강백(韓康伯)과 견주어 어떠합니까?\" 대답하였다. \"이치와 의리에서 얻은 바는 우열을 아직 가릴 수 없으나, 문 앞 뜰의 그윽하고 고요함과 분명히 명사의 풍류가 있는 점에서는 은중감이 한강백에 미치지 못한다.\" 그래서 은중감이 지은 뇌문(誄)에 이르기를, \"형주의 문은 낮에도 닫혀 있고, 한가한 뜰은 편안하고 고요하다\"라고 하였다.", ["비평", "풍류"]], ["品藻", 82, "王子敬問謝公：「嘉賓何如道季？」答曰：「道季誠復鈔撮清悟，嘉賓故自上。」", "왕자경(王獻之)이 사공(謝安)에게 물었다. \"가빈(郗嘉賓)은 도계(庾道季)와 견주어 어떠합니까?\" 대답하였다. \"도계는 진실로 맑은 깨달음을 가려 모았으나, 가빈이 본디 더 위다.\"", ["비평"]], ["品藻", 83, "王珣疾，臨困，問王武岡曰：「世論以我家領軍比誰？」武岡曰：「世以比王北中郎。」東亭轉臥向壁，歎曰：「人固不可以無年！」", "왕순(王珣)이 병이 들어 임종에 이르렀을 때, 왕무강(王武岡)에게 물었다. \"세상의 평은 우리 집안의 영군(領軍)을 누구에 견주는가?\" 무강이 말하였다. \"세상에서는 왕북중랑(王北中郎)에 견줍니다.\" 동정(王珣)이 돌아누워 벽을 향하며 탄식하였다. \"사람은 진실로 수(壽)가 없어서는 안 되는구나!\"", ["비평", "죽음", "병과늙음"]], ["品藻", 84, "王孝伯道謝公：「濃至。」又曰：「長史虛，劉尹秀，謝公融。」", "왕효백(王孝伯)이 사공(謝安)을 평하였다. \"농후함이 지극하다.\" 또 말하였다. \"장사(王長史)는 비어 있고, 유윤(劉尹)은 빼어나며, 사공은 원융하다.\"", ["비평"]], ["品藻", 85, "王孝伯問謝公：「林公何如右軍？」謝曰：「右軍勝林公，林公在司州前亦貴徹。」", "왕효백(王孝伯)이 사공(謝安)에게 물었다. \"임공(支遁)은 우군(王羲之)과 견주어 어떠합니까?\" 사안이 말하였다. \"우군이 임공보다 낫다. 임공도 사주(司州) 앞에서는 역시 귀하고 투철하였다.\"", ["비평"]], ["品藻", 86, "桓玄為太傅，大會，朝臣畢集。坐裁竟，問王楨之曰：「我何如卿第七叔？」于時賓客為之咽氣。王徐徐答曰：「亡叔是一時之標，公是千載之英。」一坐懽然。", "환현(桓玄)이 태부(太傅)가 되어 큰 모임을 열자 조정 신하들이 다 모였다. 자리에 막 앉자마자 왕정지(王楨之)에게 물었다. \"나는 그대의 일곱째 숙부와 견주어 어떠한가?\" 그때 빈객들이 이 때문에 숨을 죽였다. 왕정지가 천천히 대답하였다. \"돌아가신 숙부는 한 시대의 표상이요, 공은 천 년의 영걸이십니다.\" 온 좌중이 기뻐하였다.", ["비평", "기지", "권력"]], ["品藻", 87, "桓玄問劉太常曰：「我何如謝太傅？」劉答曰：「公高，太傅深。」又曰：「何如賢舅子敬？」答曰：「樝、梨、橘、柚，各有其美。」", "환현(桓玄)이 유태상(劉太常)에게 물었다. \"나는 사태부(謝安)와 견주어 어떠한가?\" 유태상이 대답하였다. \"공은 높고, 태부는 깊습니다.\" 또 물었다. \"그대의 외숙 자경(子敬)과는 어떠한가?\" 대답하였다. \"풀명자, 배, 귤, 유자가 각기 그 아름다움이 있습니다.\"", ["비평", "권력"]], ["品藻", 88, "舊以桓謙比殷仲文。桓玄時，仲文入，桓於庭中望見之，謂同坐曰：「我家中軍，那得及此也！」", "예전에는 환겸(桓謙)을 은중문(殷仲文)에 견주었다. 환현(桓玄) 때에 중문이 들어오자, 환현이 뜰 가운데서 그를 바라보고 함께 앉은 이에게 말하였다. \"우리 집안의 중군(中軍)이 어찌 이에 미치겠는가!\"", ["비평"]], ["規箴", 1, "漢武帝乳母嘗於外犯事，帝欲申憲，乳母求救東方朔。朔曰：「此非脣舌所爭，爾必望濟者，將去時但當屢顧帝，慎勿言！此或可萬一冀耳。」乳母既至，朔亦侍側，因謂曰：「汝癡耳！帝豈復憶汝乳哺時恩邪？」帝雖才雄心忍，亦深有情戀，乃悽然愍之，即敕免罪。", "한무제(漢武帝)의 유모가 일찍이 바깥에서 죄를 지어, 무제가 법을 적용하려 하였다. 유모가 동방삭(東方朔)에게 도움을 청하니, 동방삭이 말하였다. \"이는 입과 혀로 다툴 일이 아니다. 그대가 반드시 구제되기를 바란다면, 떠나갈 때 다만 자주 황제를 돌아보되 부디 말은 하지 마시오. 이렇게 하면 만에 하나 바랄 수 있을 것이오.\" 유모가 이르렀을 때 동방삭도 곁에서 모시고 있다가, 이에 말하였다. \"너는 어리석구나! 황제께서 어찌 다시 너의 젖 먹이던 때의 은혜를 기억하시겠느냐?\" 무제가 비록 재주가 뛰어나고 마음이 모질었으나, 역시 깊은 정과 그리움이 있어 처연히 그를 가엾이 여기고는 곧 명을 내려 죄를 면해주었다.", ["기지", "술수", "권력"]], ["規箴", 2, "京房與漢元帝共論，因問帝：「幽、厲之君何以亡？所任何人？」答曰：「其任人不忠。」房曰：「知不忠而任之，何邪？」曰：「亡國之君，各賢其臣，豈知不忠而任之？」房稽首曰：「將恐今之視古，亦猶後之視今也。」", "경방(京房)이 한원제(漢元帝)와 함께 논하다가, 이어 황제에게 물었다. \"유왕(幽王)과 여왕(厲王)은 어찌하여 망하였으며, 어떤 사람을 등용하였습니까?\" 대답하였다. \"그들은 충성스럽지 못한 사람을 등용하였다.\" 경방이 말하였다. \"충성스럽지 못함을 알면서도 등용한 것은 어찌된 일입니까?\" 대답하였다. \"나라를 망친 임금은 각기 그 신하를 어질다 여겼으니, 어찌 충성스럽지 못함을 알면서 등용하였겠는가?\" 경방이 머리를 조아리며 말하였다. \"아마도 지금 사람이 옛일을 보는 것이, 또한 후세 사람이 지금을 보는 것과 같을까 두렵습니다.\"", ["간언", "권력", "지혜"]], ["規箴", 3, "陳元方遭父喪，哭泣哀慟，軀體骨立。其母愍之，竊以錦被蒙上。郭林宗弔而見之，謂曰：「卿海內之儁才，四方是則，如何當喪，錦被蒙上？孔子曰：『衣夫錦也，食夫稻也，於汝安乎？』吾不取也！」奮衣而去。自後賓客絕百所日。", "진원방(陳元方)이 부친상을 당하여 통곡하며 슬퍼한 나머지 몸이 야위어 뼈만 앙상하게 드러났다. 그 어머니가 가엾이 여겨 몰래 비단 이불을 덮어 주었다. 곽림종(郭泰)이 조문하러 왔다가 이를 보고 말하였다. \"그대는 천하의 빼어난 인재로 사방이 본받는 바이거늘, 어찌하여 상을 당하고도 비단 이불을 덮고 있는가? 공자께서 말씀하시기를 '저 비단옷을 입고 저 쌀밥을 먹는 것이 너에게 편안하냐'고 하셨으니, 나는 이를 취하지 않노라!\" 그러고는 옷을 떨치고 가버렸다. 그 뒤로 빈객이 백여 일 동안 끊어졌다.", ["효", "죽음", "간언"]], ["規箴", 4, "孫休好射雉，至其時則晨去夕反。羣臣莫不止諫：「此為小物，何足甚躭？」休曰：「雖為小物，耿介過人，朕所以好之。」", "손휴(孫休)가 꿩 사냥을 좋아하여, 그 철이 되면 새벽에 나갔다가 저녁에 돌아왔다. 신하들이 모두 만류하여 간하지 않는 이가 없었다. \"이는 작은 것이거늘 어찌 그토록 빠지실 만하옵니까?\" 손휴가 말하였다. \"비록 작은 것이나 그 곧고 굳셈이 남보다 뛰어나니, 짐이 이를 좋아하는 까닭이다.\"", ["충직", "간언", "권력"]], ["規箴", 5, "孫皓問丞相陸凱曰：「卿一宗在朝有幾人？」陸曰：「二相、五侯、將軍十餘人。」皓曰：「盛哉！」陸曰：「君賢臣忠，國之盛也。父慈子孝，家之盛也。今政荒民弊，覆亡是懼，臣何敢言盛！」", "손호(孫皓)가 승상 육개(陸凱)에게 물었다. \"경의 한 집안에서 조정에 든 자가 몇이나 되오?\" 육개가 답하였다. \"두 명의 재상, 다섯 명의 후(侯), 장군이 십여 명입니다.\" 손호가 말하였다. \"성대하구려!\" 육개가 말하였다. \"임금이 어질고 신하가 충성하는 것이 나라의 성대함입니다. 아비가 자애롭고 자식이 효도하는 것이 집안의 성대함입니다. 지금 정치는 황폐하고 백성은 피폐하여 멸망을 두려워하는 터인데, 신이 어찌 감히 성대하다 말하겠습니까!\"", ["충직", "간언", "겸손"]], ["規箴", 6, "何晏、鄧颺令管輅作卦，云：「不知位至三公不？」卦成，輅稱引古義，深以戒之。颺曰：「此老生之常談。」\n晏曰：「知幾其神乎！古人以為難。交疎吐誠，今人以為難。今君一面盡二難之道，可謂『明德惟馨』。詩不云乎：『中心藏之，何日忘之！』」", "하안(何晏)과 등양(鄧颺)이 관로(管輅)에게 점괘를 뽑게 하며 말하였다. \"우리가 삼공(三公)의 자리에 오를지 모르겠으니 보아 주시오.\" 점괘가 이루어지자 관로는 옛 뜻을 끌어다 깊이 경계하였다. 등양이 말하였다. \"이는 늙은 서생의 흔한 이야기로다.\" 하안이 말하였다. \"기미를 아는 것이 신묘함이런가! 옛사람도 어렵게 여겼소. 사귐이 성근데도 진심을 토로하는 것을 지금 사람들은 어렵게 여기오. 지금 그대는 한 번 만남에 이 두 가지 어려운 도를 다하였으니, 가히 '밝은 덕은 오직 향기롭다'고 할 만하오. 『시경(詩經)』에 이르지 않았소? '마음속에 간직하니, 어느 날인들 잊으리오!'\"", ["예언", "간언", "우정"]], ["規箴", 7, "晉武帝既不悟太子之愚，必有傳後意。諸名臣亦多獻直言。帝嘗在陵雲臺上坐，衛瓘在側，欲申其懷，因如醉跪帝前，以手撫牀曰：「此坐可惜。」帝雖悟，因笑曰：「公醉邪？」", "진(晉) 무제(司馬炎)는 태자의 어리석음을 깨닫지 못하였으니, 반드시 뒤를 잇게 하려는 뜻이 있었다. 여러 명신들도 직언을 많이 올렸다. 무제가 일찍이 능운대(陵雲臺) 위에 앉아 있고 위관(衛瓘)이 곁에 있었는데, 그 마음을 펴고자 취한 척하며 무제 앞에 무릎 꿇고 손으로 자리를 어루만지며 말하였다. \"이 자리가 아깝습니다.\" 무제는 비록 그 뜻을 알았으나 웃으며 말하였다. \"공이 취하였소?\"", ["간언", "권력", "술수"]], ["規箴", 8, "王夷甫婦郭泰寧女，才拙而性剛，聚斂無厭，干豫人事。夷甫患之而不能禁。時其鄉人幽州刺史李陽，京都大俠，猶漢之樓護，郭氏憚之。夷甫驟諫之，乃曰：「非但我言卿不可，李陽亦謂卿不可。」郭氏小為之損。", "왕이보(王衍)의 아내는 곽태녕(郭泰寧)의 딸로, 재주는 졸렬하고 성품은 굳세며, 재물을 모으는 데 만족할 줄 모르고 남의 일에 간섭하였다. 왕이보가 이를 근심하였으나 막을 수 없었다. 당시 그 고향 사람으로 유주자사(幽州刺史) 이양(李陽)은 경성의 큰 협객이라, 한나라의 누호(樓護)와 같은 인물이어서 곽씨가 그를 두려워하였다. 왕이보가 거듭 간하여 마침내 말하였다. \"나만 그대더러 옳지 않다고 하는 것이 아니라, 이양도 그대더러 옳지 않다고 하오.\" 그제야 곽씨가 다소 줄였다.", ["여인", "인색", "간언"]], ["規箴", 9, "王夷甫雅尚玄遠，常嫉其婦貪濁，口未嘗言「錢」字。婦欲試之，令婢以錢遶牀，不得行。夷甫晨起，見錢閡行，呼婢曰：「舉卻阿堵物。」", "왕이보(王衍)는 평소 현원(玄遠)을 숭상하여, 늘 그 아내의 탐욕스럽고 더러움을 싫어하여 입으로 '돈(錢)'이라는 글자를 말한 적이 없었다. 아내가 그를 시험하고자 계집종을 시켜 돈으로 침상을 둘러싸게 하여 다니지 못하게 하였다. 왕이보가 아침에 일어나 돈에 가로막혀 다닐 수 없자 계집종을 불러 말하였다. \"이 물건을 치워라.\"", ["청빈", "여인", "인색"]], ["規箴", 10, "王平子年十四、五，見王夷甫妻郭氏貪欲，令婢路上儋糞。平子諫之，並言不可。郭大怒，謂平子曰：「昔夫人臨終，以小郎囑新婦，不以新婦囑小郎！」急捉衣裾，將與杖。平子饒力，爭得脫，踰窗而走。", "왕평자(王澄)가 열네다섯 살 때 왕이보(王衍)의 아내 곽씨가 탐욕스러운 것을 보았는데, 계집종을 시켜 길에서 거름을 지게 하였다. 평자가 이를 간하며 아울러 옳지 않다고 말하였다. 곽씨가 크게 노하여 평자에게 말하였다. \"지난날 시어머니께서 임종하실 때 작은 도련님을 새 며느리에게 부탁하셨지, 새 며느리를 작은 도련님에게 부탁하지는 않으셨다!\" 그러고는 다급히 옷자락을 붙잡고 매를 치려 하였다. 평자는 힘이 세어 다투어 벗어나 창문을 넘어 달아났다.", ["간언", "여인", "분노"]], ["規箴", 11, "元帝過江猶好酒，王茂弘與帝有舊，常流涕諫。帝許之，命酌酒，一酣，從是遂斷。", "원제(元帝)가 강을 건넌 뒤에도 여전히 술을 좋아하니, 왕무홍(王導)이 황제와 옛 정이 있어 늘 눈물을 흘리며 간하였다. 황제가 이를 허락하여 술을 따르게 하더니, 한 번 흠뻑 마신 뒤로 마침내 끊었다.", ["간언", "술과취흥", "충직"]], ["規箴", 12, "謝鯤為豫章太守，從大將軍下至石頭。敦謂鯤曰：「余不得復為盛德之事矣。」鯤曰：「何為其然？但使自今已後，日亡日去耳！」敦又稱疾不朝，鯤諭敦曰：「近者，明公之舉，雖欲大存社稷，然四海之內，實懷未達。若能朝天子，使羣臣釋然，萬物之心，於是乃服。仗民望以從眾懷，盡沖退以奉主上，如斯，則勳侔一匡，名垂千載。」時人以為名言。", "사곤(謝鯤)이 예장태수(豫章太守)가 되어 대장군(왕돈)을 따라 석두(石頭)에 이르렀다. 왕돈(王敦)이 사곤에게 말하였다. \"나는 다시는 성대한 덕의 일을 할 수 없게 되었소.\" 사곤이 말하였다. \"어찌 그러하겠습니까? 다만 지금부터 날로 잘못을 없애고 날로 떨쳐버리시기만 하면 됩니다!\" 왕돈이 또 병을 핑계로 조정에 나아가지 않으니, 사곤이 왕돈을 깨우쳐 말하였다. \"근래에 명공(明公)의 거사는 비록 사직을 크게 보존하려는 것이었으나, 천하 안에서는 실로 그 뜻을 깨닫지 못한 마음을 품고 있습니다. 만약 천자께 조회하여 신하들을 안심케 하신다면 만물의 마음이 이에 비로소 복종할 것입니다. 백성의 기대에 기대어 뭇사람의 마음을 따르고, 겸허히 물러남을 다하여 주상을 받드신다면, 이와 같이 하면 공로는 한 번 바로잡음에 견줄 만하고 이름은 천 년에 드리울 것입니다.\" 당시 사람들이 이를 명언으로 여겼다.", ["간언", "충직", "권력"]], ["規箴", 13, "元皇帝時，廷尉張闓在小市居，私作都門，早閉晚開。羣小患之，詣州府訴，不得理，遂至檛登聞鼓，猶不被判。聞賀司空出，至破岡，連名詣賀訴。賀曰：「身被徵作禮官，不關此事。」羣小叩頭曰：「若府君復不見治，便無所訴。」賀未語，令且去，見張廷尉當為及之。張聞，即毀門，自至方山迎賀。賀出見辭之曰：「此不必見關，但與君門情，相為惜之。」張愧謝曰：「小人有如此，始不即知，蚤已毀壞。」", "원황제(元帝) 때 정위(廷尉) 장개(張闓)가 소시(小市)에 살면서 사사로이 큰 문을 만들어 일찍 닫고 늦게 열었다. 뭇 백성들이 이를 괴로워하여 주부(州府)에 나아가 호소하였으나 처리되지 않았고, 마침내 등문고(登聞鼓)를 치기에 이르렀으나 그래도 판결이 내려지지 않았다. 사공(司空) 하순(賀循)이 나온다는 말을 듣고 파강(破岡)에 이르자 이름을 잇대어 적어 하순에게 나아가 호소하였다. 하순이 말하였다. \"나는 부름을 받아 예관(禮官)이 되었으니 이 일과는 관계가 없소.\" 뭇 백성들이 머리를 조아리며 말하였다. \"만약 부군(府君)께서도 다스려 주지 않으시면 곧 호소할 데가 없습니다.\" 하순이 말하지 않고 우선 물러가게 하며, 장정위를 만나 마땅히 그 일을 언급하겠다고 하였다. 장개가 이를 듣고 즉시 문을 헐고 몸소 방산(方山)에 이르러 하순을 맞이하였다. 하순이 나와 그를 만나 사양하며 말하였다. \"이 일은 반드시 내가 관여할 바는 아니나, 다만 그대와의 가문의 정으로 그대를 위해 아껴서 그러는 것이오.\" 장개가 부끄러워 사죄하며 말하였다. \"소인이 이런 일이 있었으나 처음에 곧 알지 못하였으니, 이미 헐어 없앴습니다.\"", ["간언", "권력", "우정"]], ["規箴", 14, "郗太尉晚節好談，既雅非所經，而甚矜之。後朝覲，以王丞相末年多可恨，每見，必欲苦相規誡。王公知其意，每引作它言。臨還鎮，故命駕詣丞相。丞相翹須厲色，上坐便言：「方當乖別，必欲言其所見。」意滿口重，辭殊不流。王公攝其次曰：「後面未期，亦欲盡所懷，願公勿復談。」郗遂大瞋，冰衿而出，不得一言。", "치태위(郗鑒)가 만년에 담론을 좋아하였는데, 본디 그가 익힌 바가 아니었으나 매우 으스댔다. 뒷날 조정에 알현하면서, 왕승상(王導)이 말년에 못마땅한 점이 많다 하여, 만날 때마다 반드시 애써 규계(規誡)하고자 하였다. 왕공(王導)은 그 뜻을 알고 만날 때마다 다른 말로 끌어 돌렸다. 진(鎭)으로 돌아갈 무렵 일부러 수레를 명하여 승상에게 나아갔다. 승상은 수염을 곧추세우고 낯빛을 엄히 하였다. 윗자리에 앉자마자 곧 말하였다. \"이제 막 헤어지게 되었으니 반드시 그 본 바를 말하고자 하오.\" 뜻은 가득하고 말은 무거워 말이 도무지 매끄럽게 나오지 않았다. 왕공이 그 말 차례를 가로채어 말하였다. \"훗날 다시 만날 기약이 없으니 나 또한 품은 바를 다하고자 하오. 바라건대 공은 다시 담론하지 마시오.\" 치감은 마침내 크게 성내어, 얼어붙은 옷깃처럼 굳은 얼굴로 나가버려 한마디도 하지 못하였다.", ["간언", "청담", "분노"]], ["規箴", 15, "王丞相為揚州，遣八部從事之職。顧和時為下傳還，同時俱見。諸從事各奏二千石官長得失，至和獨無言。王問顧曰：「卿何所聞？」答曰：「明公作輔，寧使網漏吞舟，何緣采聽風聞，以為察察之政？」丞相咨嗟稱佳，諸從事自視缺然也。", "왕승상(王導)이 양주(揚州)를 맡았을 때 여덟 부(部)의 종사(從事)를 직임으로 파견하였다. 고화(顧和)가 이때 하전(下傳)이 되어 돌아와 함께 모두 알현하였다. 여러 종사들이 각기 이천석(二千石) 관장(官長)의 잘잘못을 아뢰는데, 고화에 이르러서는 홀로 아무 말이 없었다. 왕도가 고화에게 물었다. \"그대는 들은 바가 무엇이오?\" 답하였다. \"명공께서 재상을 맡으셨으니, 차라리 배를 삼킬 만한 큰 고기가 빠져나가게 그물을 성기게 두실지언정, 어찌 풍문을 주워듣고서 까다로운 정치로 삼겠습니까?\" 승상이 감탄하며 훌륭하다 칭찬하니, 여러 종사들이 스스로 부족하다 여겼다.", ["간언", "도량", "권력"]], ["規箴", 16, "蘇峻東征沈充，請吏部郎陸邁與俱。將至吳，密勑左右，令入閶門放火以示威。陸知其意，謂峻曰：「吳治平未久，必將有亂。若為亂階，請從我家始。」峻遂止。", "소준(蘇峻)이 동쪽으로 심충(沈充)을 정벌할 때 이부랑(吏部郎) 육매(陸邁)에게 청하여 함께 갔다. 오(吳)에 이르려 할 무렵 은밀히 좌우에게 명하여 창문(閶門)으로 들어가 불을 놓아 위엄을 보이게 하였다. 육매가 그 뜻을 알고 소준에게 말하였다. \"오 땅은 다스려져 평안해진 지 오래되지 않았으니 반드시 난리가 날 것입니다. 만약 난리의 단초로 삼으시려거든 청컨대 제 집에서부터 시작하소서.\" 소준이 마침내 그만두었다.", ["간언", "용기", "충직"]], ["規箴", 17, "陸玩拜司空，有人詣之，索美酒，得，便自起，瀉箸梁柱間地，祝曰：「當今乏才，以爾為柱石之用，莫傾人棟梁。」玩笑曰：「戢卿良箴。」", "육완(陸玩)이 사공(司空)에 임명되었을 때, 어떤 이가 그를 찾아와 좋은 술을 청하여 얻자, 곧 스스로 일어나 들보와 기둥 사이의 땅에 부으며 빌어 말하였다. \"지금 인재가 부족하여 그대를 기둥과 주춧돌의 쓰임으로 삼았으니, 사람의 마룻대와 들보를 기울게 하지 마소서.\" 육완이 웃으며 말하였다. \"그대의 좋은 경계의 말을 새겨 두겠소.\"", ["간언", "겸손", "기지"]], ["規箴", 18, "小庾在荊州，公朝大會，問諸僚佐曰：「我欲為漢高、魏武何如？」一坐莫答，長史江虨曰：「願明公為桓、文之事，不願作漢高、魏武也。」", "소유(小庾, 庾翼)가 형주(荊州)에 있을 때 공조(公朝)의 큰 모임에서 여러 막료들에게 물었다. \"내가 한나라 고조나 위나라 무제처럼 되고자 하는데 어떠한가?\" 자리에 있던 이들이 아무도 답하지 못하였는데, 장사(長史) 강분(江虨)이 말하였다. \"바라건대 명공께서는 제 환공이나 진 문공의 일을 하시고, 한 고조나 위 무제처럼 되시기를 바라지 않습니다.\"", ["간언", "권력", "충직"]], ["規箴", 19, "羅君章為桓宣武從事，謝鎮西作江夏，往檢校之。羅既至，初不問郡事；徑就謝數日，飲酒而還。桓公問有何事？君章云：「不審公謂謝尚何似人？」桓公曰：「仁祖是勝我許人。」君章云：「豈有勝公人而行非者，故一無所問。」桓公奇其意而不責也。", "나군장(羅君章)이 환선무(桓溫)의 종사(從事)가 되었을 때, 사진서(謝尚)가 강하(江夏)를 다스리고 있어 가서 검열하게 되었다. 나군장이 이르러서는 처음부터 군(郡)의 일은 묻지 않고, 곧장 사상에게 가서 며칠 동안 술만 마시고 돌아왔다. 환공이 무슨 일이 있더냐고 물으니, 나군장이 말하였다. \"공께서는 사상을 어떤 사람으로 여기시는지 모르겠습니다.\" 환공이 말하였다. \"인조(謝尚)는 나보다 나은 정도의 사람이오.\" 나군장이 말하였다. \"공보다 나은 사람이 그릇된 일을 행할 리가 있겠습니까. 그래서 하나도 묻지 않았습니다.\" 환공이 그 뜻을 기특히 여겨 책망하지 않았다.", ["비평", "지혜", "우정"]], ["規箴", 20, "王右軍與王敬仁、許玄度並善。二人亡後，右軍為論議更克。孔巖誡之曰：「明府昔與王、許周旋有情，及逝沒之後，無慎終之好，民所不取。」右軍甚愧。", "왕우군(王羲之)은 왕경인(王脩), 허현도(許詢)와 모두 사이가 좋았다. 두 사람이 죽은 뒤 우군이 논의를 더욱 각박하게 하였다. 공암(孔巖)이 그를 경계하여 말하였다. \"명부(明府)께서는 지난날 왕씨, 허씨와 교유하며 정이 있으셨는데, 그들이 죽고 난 뒤에 끝까지 삼가는 우의가 없으니, 제가 취하지 않는 바입니다.\" 우군이 매우 부끄러워하였다.", ["절교", "간언", "비평"]], ["規箴", 21, "謝中郎在壽春敗，臨奔走，猶求玉帖鐙。太傅在軍，前後初無損益之言。爾日猶云：「當今豈須煩此？」", "사중랑(謝萬)이 수춘(壽春)에서 패하여 달아날 즈음에도 여전히 옥으로 장식한 등자를 구하였다. 태부(謝安)가 군중에 있었는데, 앞뒤로 처음부터 보태거나 덜어내는 말이 없었다. 그날도 다만 이렇게 말하였다. \"지금 어찌 이런 것에 번거로워야 하겠는가?\"", ["도량", "비평", "오만"]], ["規箴", 22, "王大語東亭：「卿乃復論成不惡，那得與僧彌戲！」", "왕대(王忱)가 동정(왕순)에게 말하였다. \"그대가 도리어 논의함이 나쁘지 않으니, 어찌 승미(僧彌)와 더불어 겨룰 수 있겠는가!\"", ["비평", "청담"]], ["規箴", 23, "殷覬病困，看人政見半面。殷荊州興晉陽之甲，往與覬別，涕零，屬以消息所患。覬答曰：「我病自當差，正憂汝患耳！」", "은의(殷覬)가 병이 위중하여 사람을 보면 겨우 얼굴 반쪽만 알아볼 정도였다. 은형주(殷仲堪)가 진양(晉陽)의 군사를 일으키며 가서 은의와 작별하면서 눈물을 흘리고, 앓고 있는 병의 소식을 당부하였다. 은의가 답하였다. \"내 병은 저절로 나을 것이니, 다만 그대가 앓는 것이 걱정될 뿐이오!\"", ["병과늙음", "우정", "죽음"]], ["規箴", 24, "遠公在廬山中，雖老，講論不輟。弟子中或有墮者，遠公曰：「桑榆之光，理無遠照；但願朝陽之暉，與時並明耳。」執經登坐，諷誦朗暢，詞色甚苦。高足之徒，皆肅然增敬。", "원공(遠公, 慧遠)이 여산(廬山) 가운데 있을 때, 비록 늙었으나 강론을 그치지 않았다. 제자 가운데 더러 게으른 자가 있으니 원공이 말하였다. \"뽕나무 느릅나무 사이로 비치는 저녁빛은 이치상 멀리 비출 수 없다. 다만 바라건대 아침 해의 빛이 때와 더불어 함께 밝아지기를 바랄 뿐이다.\" 경전을 들고 자리에 올라 외고 읽는 것이 낭랑하고 막힘이 없으며, 말과 낯빛이 매우 간절하였다. 뛰어난 제자들이 모두 숙연히 공경을 더하였다.", ["학문", "병과늙음", "간언"]], ["規箴", 25, "桓南郡好獵，每田狩，車騎甚盛。五六十里中，旌旗蔽隰。騁良馬，馳擊若飛，雙甄所指，不避陵壑。或行陳不整，麏兔騰逸，參佐無不被繫束。桓道恭，玄之族也，時為賊曹參軍，頗敢直言。常自帶絳綿繩箸腰中，玄問「此何為？」答曰：「公獵，好縛人士，會當被縛，手不能堪芒也。」玄自此小差。", "환남군(桓玄)이 사냥을 좋아하여, 사냥할 때마다 거기(車騎)가 매우 성대하였다. 오륙십 리 안에 깃발이 진펄을 뒤덮었다. 좋은 말을 달려 나는 듯이 내달리며 치니, 양 날개가 가리키는 곳은 언덕이나 골짜기를 피하지 않았다. 혹 행렬이 가지런하지 않거나 노루와 토끼가 뛰어 달아나면 막료 가운데 묶이지 않는 이가 없었다. 환도공(桓道恭)은 환현(桓玄)의 일족으로, 당시 적조참군(賊曹參軍)이 되었는데, 자못 감히 직언하였다. 늘 진홍빛 솜 노끈을 띠처럼 허리에 차고 있으니, 환현이 \"이것은 무엇에 쓰는 것인가?\" 하고 물었다. 답하였다. \"공께서 사냥하실 때 인사(人士)를 묶기를 좋아하시니, 저도 마땅히 묶이게 될 터인데 손이 까끄라기를 견디지 못하기 때문입니다.\" 환현이 이로부터 다소 줄였다.", ["간언", "권력", "기지"]], ["規箴", 26, "王緒、王國寶相為脣齒，並上下權要。王大不平其如此，乃謂緒曰：「汝為此歘歘，曾不慮獄吏之為貴乎？」", "왕서(王緒)와 왕국보(王國寶)가 서로 입술과 이처럼 의지하여 함께 권력의 요직을 위아래로 차지하였다. 왕대(王忱)가 그러한 것을 못마땅히 여겨 왕서에게 말하였다. \"네가 이렇게 서둘러 날뛰면서, 옥리(獄吏)가 귀하게 되는 것은 일찍이 염려하지 않느냐?\"", ["권력", "간언", "예언"]], ["規箴", 27, "桓玄欲以謝太傅宅為營，謝混曰：「召伯之仁，猶惠及甘棠；文靖之德，更不保五畝之宅。」玄慙而止。", "환현(桓玄)이 사태부(謝安)의 집을 군영으로 삼고자 하니, 사혼(謝混)이 말하였다. \"소백(召伯)의 어짊은 그래도 은혜가 감당나무에까지 미쳤거늘, 문정공(謝安)의 덕은 도리어 다섯 묘의 집조차 보전하지 못한단 말입니까.\" 환현이 부끄러워 그만두었다.", ["간언", "권력", "충직"]], ["捷悟", 1, "楊德祖為魏武主簿，時作相國門，始搆榱桷，魏武自出看，使人題門，作「活」字，便去。楊見，即令壞之。既竟，曰：「門中『活』，『闊』字。王正嫌門大也。」", "양덕조(楊脩)가 위 무제(曹操)의 주부(主簿)였을 때, 마침 상국(相國)의 문을 짓느라 비로소 서까래를 얽는데, 위 무제가 몸소 나와 보고는 사람을 시켜 문에 '활(活)' 자를 쓰게 하고는 곧 가버렸다. 양수가 보고 즉시 그것을 헐게 하였다. 다 헐고 나서 말하였다. \"문(門) 가운데 '활(活)'은 '활(闊)' 자이니, 왕께서는 바로 문이 큰 것을 싫어하신 것이다.\"", ["기지", "지혜"]], ["捷悟", 2, "人餉魏武一桮酪，魏武噉少許，蓋頭上題「合」字以示眾。眾莫能解。次至楊脩，脩便噉，曰：「公教人噉一口也，復何疑？」", "어떤 사람이 위 무제(曹操)에게 한 잔의 유락(酪)을 바치니, 위 무제가 조금 맛보고는 뚜껑 위에 '합(合)' 자를 써서 여러 사람에게 보였다. 사람들이 아무도 풀지 못하였다. 차례가 양수(楊脩)에게 이르자 양수가 곧 먹으며 말하였다. \"공께서 사람마다 한 입씩(一口) 먹으라 하셨으니, 다시 무엇을 의심하리오?\"", ["기지", "지혜"]], ["捷悟", 3, "魏武嘗過曹娥碑下，楊脩從，碑背上見題作「黃絹幼婦，外孫臼」八字。魏武謂脩曰：「解不？」答曰：「解。」魏武曰：「卿未可言，待我思之。」行三十里，魏武乃曰：「吾已得。」令脩別記所知。脩曰：「黃絹，色絲也，於字為絕。幼婦，少女也，於字為妙。外孫，女子也，於字為好。臼，受辛也，於字為辭。所謂『絕妙好辭』也。」魏武亦記之，與脩同，乃歎曰：「我才不及卿，乃覺三十里。」", "위 무제(曹操)가 일찍이 조아비(曹娥碑) 아래를 지나는데 양수(楊脩)가 따랐다. 비석 뒷면에 '황견유부(黃絹幼婦), 외손제구(外孫臼)' 여덟 글자가 쓰여 있는 것을 보았다. 위 무제가 양수에게 말하였다. \"풀겠는가?\" 답하였다. \"풀었습니다.\" 위 무제가 말하였다. \"그대는 아직 말하지 말라. 내가 생각할 동안 기다리라.\" 삼십 리를 가서야 위 무제가 말하였다. \"내가 이미 알아냈다.\" 양수에게 아는 바를 따로 적게 하였다. 양수가 적었다. \"황견(黃絹)은 빛깔 있는 실(色絲)이니 글자로는 '절(絶)'이 됩니다. 유부(幼婦)는 어린 여자(少女)이니 글자로는 '묘(妙)'가 됩니다. 외손(外孫)은 딸의 자식(女子)이니 글자로는 '호(好)'가 됩니다. 구(臼)는 매운 것을 받는 것(受辛)이니 글자로는 '사(辭)'가 됩니다. 이른바 '절묘호사(絶妙好辭)'입니다.\" 위 무제도 적은 것이 양수와 같으니, 이에 탄식하며 말하였다. \"내 재주가 그대에게 미치지 못하니, 삼십 리나 가서야 깨달았구려.\"", ["기지", "지혜", "비평"]], ["捷悟", 4, "魏武征袁本初，治裝，餘有數十斛竹片，咸長數寸，眾云並不堪用，正令燒除。太祖思所以用之，謂可為竹椑楯，而未顯其言。馳使問主簿楊德祖。應聲答之，與帝心同。眾伏其辯悟。", "위무제(魏武帝)가 원본초(袁本初)를 정벌하러 행장을 꾸리는데, 대나무 조각 수십 곡이 남았으니 모두 길이가 몇 치였다. 사람들이 다 쓸모가 없다 하여 그저 태워 없애려 했다. 태조(太祖)는 그것을 쓸 방법을 생각하여 대나무 방패(竹椑楯)를 만들 만하다고 여겼으나 그 말을 드러내지 않았다. 사람을 급히 보내 주부(主簿) 양덕조(楊德祖)에게 물으니, 그가 즉시 대답한 것이 황제의 생각과 같았다. 사람들이 그의 분별과 깨우침에 탄복했다.", ["지혜", "재능"]], ["捷悟", 5, "王敦引軍垂至大桁，明帝自出中堂。溫嶠為丹陽尹，帝令斷大桁，故未斷，帝大怒，瞋目，左右莫不悚懼。召諸公來。嶠至不謝，但求酒炙。王導須臾至，徒跣下地，謝曰：「天威在顏，遂使溫嶠不容得謝。」嶠於是下謝，帝迺釋然。諸公共嘆王機悟名言。", "왕돈(王敦)이 군대를 이끌고 대항(大桁)에 거의 이르렀을 때, 명제(明帝)가 몸소 중당(中堂)으로 나왔다. 온교(溫嶠)가 단양윤(丹陽尹)이었는데, 황제가 그에게 대항을 끊으라 명했으나 일부러 끊지 않았다. 황제가 크게 노하여 눈을 부릅뜨니 좌우가 두려워하지 않는 이가 없었다. 여러 공을 불러오게 했다. 온교가 이르러 사죄하지 않고 다만 술과 안주를 구할 뿐이었다. 왕도(王導)가 잠시 후 이르러 맨발로 땅에 내려 사죄하며 말하기를 \"천자의 위엄이 얼굴에 서려 있어 마침내 온교로 하여금 사죄할 틈을 얻지 못하게 하였습니다\"라고 했다. 온교가 이에 내려와 사죄하니 황제가 비로소 노여움을 풀었다. 여러 공이 함께 왕도의 기지 있는 깨달음과 명언을 감탄했다.", ["기지", "도량", "권력"]], ["捷悟", 6, "郗司空在北府，桓宣武惡其居兵權。郗於事機素暗，遣牋詣桓：「方欲共獎王室，脩復園陵。」世子嘉賓出行，於道上聞信至，急取牋，視竟，寸寸毀裂，便回。還更作牋，自陳老病，不堪人間，欲乞閑地自養。宣武得牋大喜，即詔轉公督五郡，會稽太守。", "치사공(郗司空)이 북부(北府)에 있을 때, 환선무(桓宣武)가 그가 병권을 쥐고 있음을 싫어했다. 치공은 평소 사태의 기미에 어두워, 환온(桓溫)에게 편지를 보내 \"바야흐로 함께 왕실을 돕고 능원(園陵)을 수복하고자 합니다\"라고 했다. 세자 가빈(嘉賓)이 외출하다가 길에서 사자가 이르렀다는 말을 듣고 급히 편지를 빼앗아 다 보고는 마디마디 찢어버리고 곧 돌아왔다. 돌아와 다시 편지를 지어, 스스로 늙고 병들어 인간세상을 감당하지 못하니 한가한 땅을 얻어 몸을 보양하기를 청한다고 했다. 선무가 편지를 얻고 크게 기뻐하여 즉시 조서로 치공을 다섯 군을 감독하는 회계태수(會稽太守)로 옮겼다.", ["술수", "지혜", "권력"]], ["捷悟", 7, "王東亭作宣武主簿，嘗春月與石頭兄弟乘馬出郊。時彥同遊者，連鑣俱進。唯東亭一人常在前，覺數十步，諸人莫之解。石頭等既疲倦，俄而乘輿回，諸人皆似從官，唯東亭弈弈在前。其悟捷如此。", "왕동정(王東亭)이 선무(宣武)의 주부(主簿)였을 때, 일찍이 봄날에 석두(石頭)의 형제들과 말을 타고 교외로 나갔다. 그때 함께 노닌 명사들이 재갈을 나란히 하여 함께 나아갔다. 오직 동정 한 사람만이 항상 앞에 있어 수십 보를 앞섰는데 여러 사람이 그 까닭을 알지 못했다. 석두 등이 이미 지치자 이윽고 수레가 돌아오니, 여러 사람은 모두 종관(從官) 같았고 오직 동정만이 의젓하게 앞에 있었다. 그의 깨달음과 민첩함이 이와 같았다.", ["지혜", "재능"]], ["夙惠", 1, "賓客詣陳太丘宿，太丘使元方、季方炊。客與太丘論議，二人進火，俱委而竊聽。炊忘箸箄，飯落釜中。太丘問：「炊何不餾？」元方、季方長跪曰：「大人與客語，乃俱竊聽，炊忘箸箄，飯今成糜。」太丘曰：「爾頗有所識不？」對曰：「仿佛志之。」二子俱說，更相易奪，言無遺失。太丘曰：「如此，但糜自可，何必飯也？」", "손님이 진태구(陳太丘)를 찾아와 묵게 되자, 태구가 원방(元方)과 계방(季方)에게 밥을 짓게 했다. 손님이 태구와 더불어 논의하니, 두 사람이 불을 때다가 모두 그것을 내버려두고 몰래 엿들었다. 밥 짓는데 시루받침을 두는 것을 잊어 밥이 솥 안으로 떨어졌다. 태구가 묻기를 \"밥을 어찌 찌지 않았느냐?\"라고 했다. 원방과 계방이 무릎을 꿇고 말하기를 \"아버님께서 손님과 이야기하시기에 저희가 모두 몰래 엿듣다가 밥 짓는데 시루받침 두기를 잊어 밥이 지금 죽이 되었습니다\"라고 했다. 태구가 \"너희가 자못 들은 것이 있느냐?\"라고 물으니, 대답하기를 \"어렴풋이 기억합니다\"라고 했다. 두 아들이 함께 말하면서 서로 번갈아 주고받으니 빠뜨린 말이 없었다. 태구가 말하기를 \"이와 같다면 죽이라도 좋으니 어찌 굳이 밥이어야 하겠느냐?\"라고 했다.", ["신동", "학문", "효"]], ["夙惠", 2, "何晏七歲，明惠若神，魏武奇愛之。因晏在宮內，欲以為子。晏乃畫地令方，自處其中。人問其故？答曰：「何氏之廬也。」魏武知之，即遣還。", "하안(何晏)이 일곱 살에 총명함이 신과 같으니 위무제(魏武帝)가 기특히 여겨 사랑했다. 하안이 궁 안에 있었으므로 그를 아들로 삼고자 했다. 하안이 이에 땅에 네모를 그려 그 안에 스스로 앉았다. 사람이 그 까닭을 물으니, 대답하기를 \"하씨(何氏)의 집입니다\"라고 했다. 위무제가 이를 알고 곧 돌려보냈다.", ["신동", "기지"]], ["夙惠", 3, "晉明帝數歲，坐元帝厀上。有人從長安來，元帝問洛下消息，潸然流涕。明帝問何以致泣？具以東渡意告之。因問明帝：「汝意謂長安何如日遠？」答曰：「日遠。不聞人從日邊來，居然可知。」元帝異之。明日集羣臣宴會，告以此意，更重問之。乃答曰：「日近。」元帝失色，曰：「爾何故異昨日之言邪？」答曰：「舉目見日，不見長安。」", "진명제(晉明帝)가 몇 살일 때 원제(元帝)의 무릎 위에 앉아 있었다. 어떤 사람이 장안(長安)에서 왔으므로 원제가 낙양(洛陽)의 소식을 묻고는 줄줄 눈물을 흘렸다. 명제가 어찌 우시는지 물으니, 동쪽으로 건너온 뜻을 자세히 일러주었다. 이어 명제에게 묻기를 \"네 생각에 장안과 해 가운데 어느 것이 더 머냐?\"라고 했다. 대답하기를 \"해가 멉니다. 사람이 해 가에서 왔다는 말은 듣지 못했으니 자연히 알 수 있습니다\"라고 했다. 원제가 기특히 여겼다. 이튿날 신하들을 모아 잔치하며 이 뜻을 알리고 다시 거듭 물었다. 이에 대답하기를 \"해가 가깝습니다\"라고 했다. 원제가 낯빛을 잃고 \"너는 어찌 어제의 말과 다르냐?\"라고 하니, 대답하기를 \"눈을 들면 해는 보이나 장안은 보이지 않습니다\"라고 했다.", ["신동", "기지"]], ["夙惠", 4, "司空顧和與時賢共清言，張玄之、顧敷是中外孫，年並七歲，在牀邊戲。于時聞語，神情如不相屬。瞑於燈下，二兒共敘客主之言，都無遺失。顧公越席而提其耳曰：「不意衰宗復生此寶。」", "사공(司空) 고화(顧和)가 당시의 현인들과 함께 청담(淸談)을 했다. 장현지(張玄之)와 고부(顧敷)는 내외(內外)의 손자로 나이가 모두 일곱 살이었는데 평상 곁에서 놀고 있었다. 그때 이야기를 들으면서도 신정(神情)이 마치 무관한 듯했다. 등불 아래서 졸다가 두 아이가 함께 손님과 주인의 말을 서술하니 전혀 빠뜨림이 없었다. 고공이 자리를 넘어가 그 귀를 잡으며 말하기를 \"뜻밖에 쇠한 집안에 다시 이런 보배가 났구나\"라고 했다.", ["신동", "청담"]], ["夙惠", 5, "韓康伯數歲，家酷貧，至大寒，止得襦。母殷夫人自成之，令康伯捉熨斗，謂康伯曰：「且箸襦，尋作複。」兒云：「已足，不須複也。」母問其故？答曰：「火在熨斗中而柄熱，今既箸襦，下亦當煗，故不須耳。」母甚異之，知為國器。", "한강백(韓康伯)이 몇 살일 때 집이 몹시 가난하여, 큰 추위에 이르도록 다만 저고리(襦)만 입을 수 있었다. 어머니 은부인(殷夫人)이 손수 그것을 만들면서 강백에게 다리미를 잡게 하고 강백에게 말하기를 \"우선 저고리를 입어라. 머지않아 겹옷을 지어주마\"라고 했다. 아이가 말하기를 \"이미 충분하니 겹옷은 필요없습니다\"라고 했다. 어머니가 그 까닭을 물으니, 대답하기를 \"불이 다리미 안에 있으면 자루가 뜨겁습니다. 이제 저고리를 입었으니 아래도 마땅히 따뜻할 것이라 겹옷은 필요없습니다\"라고 했다. 어머니가 매우 기특히 여겨 나라의 그릇(國器)이 될 줄 알았다.", ["신동", "청빈", "지혜"]], ["夙惠", 6, "晉孝武年十二，時冬天，晝日不箸複衣，但箸單練衫五六重，夜則累茵褥。謝公諫曰：「聖體宜令有常。陛下晝過冷，夜過熱，恐非攝養之術。」帝曰：「晝動夜靜。」謝公出嘆曰：「上理不減先帝。」", "진효무제(晉孝武帝)가 열두 살일 때, 겨울날에 낮에는 겹옷을 입지 않고 다만 홑명주 적삼을 대여섯 겹만 입었으나, 밤에는 자리와 요를 겹쳐 깔았다. 사공(謝公)이 간하여 말하기를 \"성체(聖體)는 마땅히 일정함이 있어야 합니다. 폐하께서 낮에는 지나치게 춥고 밤에는 지나치게 더우시니 섭생(攝養)의 방법이 아닐까 두렵습니다\"라고 했다. 황제가 말하기를 \"낮에는 움직이고 밤에는 고요하지 않은가\"라고 했다. 사공이 나와 탄식하기를 \"황상의 이치가 선제(先帝)에 못지않다\"라고 했다.", ["신동", "간언", "지혜"]], ["夙惠", 7, "桓宣武薨，桓南郡年五歲，服始除，桓車騎與送故文武別，因指語南郡：「此皆汝家故吏佐。」玄應聲慟哭，酸感傍人。車騎每自目己坐曰：「靈寶成人，當以此坐還之。」鞠愛過於所生。", "환선무(桓宣武)가 죽었을 때, 환남군(桓南郡)은 나이 다섯 살이었는데 상복을 막 벗었다. 환거기(桓車騎)가 옛 부하 문무관들과 작별하면서 남군을 가리켜 말하기를 \"이들은 모두 네 집안의 옛 관리와 보좌들이다\"라고 했다. 현(玄)이 그 말에 응하여 통곡하니 그 슬픔이 곁의 사람들을 감동시켰다. 거기가 매번 스스로 자기 자리를 가리키며 말하기를 \"영보(靈寶)가 어른이 되면 마땅히 이 자리를 그에게 돌려주리라\"라고 했다. 길러주고 사랑함이 친자식보다 더했다.", ["효", "죽음", "신동"]], ["豪爽", 1, "王大將軍年少時，舊有田舍名，語音亦楚。武帝喚時賢共言伎蓺事。人皆多有所知，唯王都無所關，意色殊惡，自言知打鼓吹。帝令取鼓與之，於坐振袖而起，揚槌奮擊，音節諧捷，神氣豪上，傍若無人。舉坐嘆其雄爽。", "왕대장군(王大將軍)이 젊었을 때 본래 시골뜨기(田舍)라는 별명이 있었고 말씨 또한 초(楚) 지방 사투리였다. 무제(武帝)가 당시의 현인들을 불러 함께 기예(伎藝)에 관한 일을 논했다. 사람들이 모두 아는 것이 많았으나 오직 왕만은 전혀 관여하는 바가 없어 안색이 자못 좋지 않더니, 스스로 북치는 것을 안다고 했다. 황제가 북을 가져다 주게 하니, 자리에서 소매를 떨치며 일어나 북채를 들고 힘껏 두드리는데 음절이 어울리고 빨라 신기(神氣)가 호방하게 솟구쳐 곁에 사람이 없는 듯했다. 온 좌중이 그 웅장하고 시원함을 감탄했다.", ["음악", "풍류", "재능"]], ["豪爽", 2, "王處仲世許高尚之目，嘗荒恣於色，體為之弊。左右諫之，處仲曰：「吾乃不覺爾。如此者，甚易耳！」乃開後閤，驅諸婢妾數十人出路，任其所之，時人嘆焉。", "왕처중(王處仲)이 세상에서 고상하다는 평을 받았으나, 일찍이 색(色)에 빠져 방종하여 몸이 그 때문에 쇠약해졌다. 좌우가 그것을 간하니, 처중이 말하기를 \"나는 미처 깨닫지 못했다. 이와 같은 것이라면 매우 쉽다\"라고 했다. 이에 뒤쪽 문을 열어 여러 비첩 수십 명을 길로 내쫓아 가는 대로 맡기니, 당시 사람들이 그를 감탄했다.", ["부부", "도량", "뉘우침"]], ["豪爽", 3, "王大將軍自目：「高朗疎率，學通左氏。」", "왕대장군(王大將軍)이 스스로 평하기를 \"높고 명랑하며 소탈하고 거침없으니, 학문은 좌씨(左氏)에 통달했다\"라고 했다.", ["오만", "비평", "학문"]], ["豪爽", 4, "王處仲每酒後輒詠「老驥伏櫪，志在千里。烈士暮年，壯心不已」。以如意打唾壺，壺口盡缺。", "왕처중(王處仲)이 매번 술 마신 뒤면 늘 \"늙은 준마는 마구간에 엎드려 있어도 뜻은 천 리에 있고, 열사는 늘그막에도 장한 마음이 그치지 않는다\"라고 읊었다. 여의(如意)로 타호(唾壺)를 두드려 호의 주둥이가 모두 이지러졌다.", ["풍류", "술과취흥", "용기"]], ["豪爽", 5, "晉明帝欲起池臺，元帝不許。帝時為太子，好養武士。一夕中作池，比曉便成。今太子西池是也。", "진명제(晉明帝)가 연못과 누대를 만들고자 했으나 원제(元帝)가 허락하지 않았다. 명제는 그때 태자였는데 무사 기르기를 좋아했다. 하룻밤 사이에 연못을 만들어 새벽이 되자 곧 완성했다. 지금의 태자 서지(西池)가 그것이다.", ["권력", "재능"]], ["豪爽", 6, "王大將軍始欲下都處分樹置，先遣參軍告朝廷，諷旨時賢。祖車騎尚未鎮壽春，瞋目厲聲語使人曰：「卿語阿黑：何敢不遜！催攝面去，須臾不爾，我將三千兵，槊腳令上！」王聞之而止。", "왕대장군(王大將軍)이 처음 도성으로 내려가 인사를 조처하여 심으려 할 때, 먼저 참군(參軍)을 보내 조정에 알리고 당시의 현인들에게 뜻을 넌지시 비쳤다. 조거기(祖車騎)가 아직 수춘(壽春)을 진수하기 전이었는데, 눈을 부릅뜨고 사나운 소리로 사자에게 말하기를 \"그대는 아흑(阿黑)에게 전하라. 어찌 감히 불손한가! 빨리 거두어 물러가라. 잠시라도 그렇지 않으면 내가 삼천 병사로 창으로 다리를 찔러 올려보내겠다!\"라고 했다. 왕이 이를 듣고 그만두었다.", ["용기", "분노", "권력"]], ["豪爽", 7, "庾穉恭既常有中原之志，文康時權重，未在己。及季堅作相，忌兵畏禍，與穉恭歷同異者久之，乃果行。傾荊、漢之力，窮舟車之勢，師次于襄陽。大會參佐，陳其旌甲，親授弧矢曰：「我之此行，若此射矣！」遂三起三疊，徒眾屬目，其氣十倍。", "유치공(庾穉恭)이 일찍이 중원(中原)을 회복할 뜻을 늘 품고 있었으나, 문강(文康)이 그때 권세가 무거워 자기에게 있지 않았다. 계견(季堅)이 재상이 되자 군사를 꺼리고 화를 두려워하여 치공과 이견의 같고 다름을 오래도록 다투다가, 마침내 결행했다. 형주(荊州)와 한수(漢水)의 힘을 기울이고 배와 수레의 형세를 다하여 군대가 양양(襄陽)에 머물렀다. 참모와 보좌들을 크게 모아 깃발과 갑옷을 늘어놓고, 친히 활과 화살을 잡고 말하기를 \"나의 이번 출정은 이 활쏘기와 같으리라!\"라고 했다. 마침내 세 번 일어나 세 번 명중시키니, 무리가 주목하여 그 기세가 열 배가 되었다.", ["용기", "권력", "재능"]], ["豪爽", 8, "桓宣武平蜀，集參僚置酒於李勢殿，巴、蜀縉紳，莫不來萃。桓既素有雄情爽氣，加爾日音調英發，敘古今成敗由人，存亡繫才。其狀磊落，一坐嘆賞。既散，諸人追味餘言。于時尋陽周馥曰：「恨卿輩不見王大將軍。」", "환선무(桓宣武)가 촉(蜀)을 평정하고 참모와 막료들을 모아 이세(李勢)의 궁전에서 술자리를 베푸니, 파(巴)·촉(蜀)의 사대부들이 모여들지 않는 이가 없었다. 환은 본래 웅대한 정과 시원한 기운을 지녔는데, 게다가 그날 음조가 영발(英發)하여 고금의 성패가 사람에게 달려 있고 존망이 인재에 매여 있음을 서술하니, 그 모습이 뇌락(磊落)하여 온 자리가 감탄하고 칭송했다. 자리가 파한 뒤 사람들이 그 남은 말을 음미했다. 그때 심양(尋陽)의 주복(周馥)이 말하기를 \"그대들이 왕대장군(王大將軍)을 보지 못한 것이 한스럽소\"라고 했다.", ["풍류", "비평", "권력"]], ["豪爽", 9, "桓公讀高士傳，至於陵仲子，便擲去曰：「誰能作此溪刻自處！」", "환공(桓公)이 『고사전(高士傳)』을 읽다가 어릉중자(於陵仲子)에 이르러 곧 던져버리며 말하기를 \"누가 능히 이렇게 각박하게 처신하겠는가!\"라고 했다.", ["비평", "은둔"]], ["豪爽", 10, "桓石虔，司空豁之長庶也。小字鎮惡。年十七八未被舉，而童隸已呼為鎮惡郎。嘗住宣武齋頭。從征枋頭，車騎沖沒陳，左右莫能先救。宣武謂曰：「汝叔落賊，汝知不？」石虔聞之，氣甚奮。命朱辟為副，策馬於數萬眾中，莫有抗者，徑致沖還，三軍嘆服。河朔後以其名斷瘧。", "환석건(桓石虔)은 사공(司空) 환활(桓豁)의 맏서자다. 어릴 적 이름은 진악(鎮惡)이었다. 나이 열일고여덟에 아직 천거되지 않았는데도 어린 종들이 이미 그를 진악랑(鎮惡郎)이라 불렀다. 일찍이 선무(宣武)의 서재 곁에 머물렀다. 방두(枋頭) 정벌을 따라갔을 때, 거기(車騎) 환충(桓沖)이 적진에 빠졌는데 좌우가 능히 먼저 구하지 못했다. 선무가 말하기를 \"네 숙부가 적에게 떨어졌는데 너는 아느냐?\"라고 했다. 석건이 이를 듣고 기운이 몹시 떨쳐올랐다. 주벽(朱辟)을 부장으로 삼아 수만 무리 가운데로 말을 달리니 막아서는 자가 없어, 곧장 환충을 데려 돌아오니 삼군이 감탄하고 탄복했다. 하삭(河朔) 사람들이 뒤에 그의 이름으로 학질을 떼었다.", ["용기", "재능"]], ["豪爽", 11, "陳林道在西岸，都下諸人共要至牛渚會。陳理既佳，人欲共言折。陳以如意拄頰，望雞籠山嘆曰：「孫伯符志業不遂！」於是竟坐不得談。", "진림도(陳林道)가 서쪽 강가에 있을 때, 도성의 여러 사람이 함께 그를 우저(牛渚)로 청하여 모였다. 진의 이치(理)가 이미 훌륭하여 사람들이 함께 논박하고자 했다. 진이 여의(如意)로 뺨을 괴고 계롱산(雞籠山)을 바라보며 탄식하기를 \"손백부(孫伯符)가 뜻과 사업을 이루지 못했구나!\"라고 했다. 이에 끝내 온 자리가 담론하지 못했다.", ["청담", "오만", "기지"]], ["豪爽", 12, "王司州在謝公坐，詠「入不言兮出不辭，乘回風兮載雲旗」。語人云：「當爾時，覺一坐無人。」", "왕사주(王司州)가 사공(謝公)의 자리에 있을 때 \"들어와서도 말하지 않고 나가면서도 인사하지 않으며, 회오리바람을 타고 구름 깃발을 싣는다\"라고 읊었다. 사람들에게 말하기를 \"그때 온 자리에 사람이 없는 듯이 느껴졌다\"라고 했다.", ["풍류", "오만"]], ["豪爽", 13, "桓玄西下，入石頭。外白：「司馬梁王奔叛。」玄時事形已濟，在平乘上笳鼓並作，直高詠云：「簫管有遺音，梁王安在哉？」", "환현(桓玄)이 서쪽에서 내려와 석두(石頭)로 들어갔다. 밖에서 아뢰기를 \"사마양왕(司馬梁王)이 달아나 배반했습니다\"라고 했다. 현은 그때 일의 형세가 이미 이루어져, 평승(平乘) 위에서 호드기와 북이 함께 울리는 가운데 곧장 높이 읊기를 \"퉁소와 피리에 남은 소리 있건만 양왕(梁王)은 어디에 있는가?\"라고 했다.", ["권력", "풍류", "술수"]], ["容止", 1, "魏武將見匈奴使，自以形陋，不足雄遠國，使崔季珪代，帝自捉刀立牀頭。既畢，令間諜問曰：「魏王何如？」匈奴使答曰：「魏王雅望非常，然牀頭捉刀人，此乃英雄也。」魏武聞之，追殺此使。", "위무제(魏武帝)가 흉노의 사자를 만나려 하면서, 스스로 용모가 추하여 먼 나라에 위엄을 보이기에 부족하다고 여겨, 최계규(崔季珪)로 대신하게 하고 자신은 칼을 잡고 평상 머리에 섰다. 만남이 끝나자, 간첩을 시켜 묻기를 \"위왕(魏王)이 어떠한가?\"라고 했다. 흉노 사자가 대답하기를 \"위왕의 고아한 풍모가 비상하나, 평상 머리에서 칼을 잡은 사람, 그가 바로 영웅입니다\"라고 했다. 위무제가 이를 듣고 사람을 보내 이 사자를 뒤쫓아 죽였다.", ["용모", "기지", "원한"]], ["容止", 2, "何平叔美姿儀，面至白；魏明帝疑其傅粉。正夏月，與熱湯。既噉，大汗出，以朱衣自拭，色轉皎然。", "하평숙(何平叔)은 자태와 거동이 아름답고 얼굴이 지극히 희었다. 위명제(魏明帝)가 그가 분을 바른 것이 아닌가 의심했다. 바로 여름철에 뜨거운 국수를 주었다. 다 먹고 나서 크게 땀이 나니, 붉은 옷으로 스스로 닦았으나 낯빛이 도리어 더욱 희고 깨끗해졌다.", ["용모"]], ["容止", 3, "魏明帝使后弟毛曾與夏侯玄共坐，時人謂「蒹葭倚玉樹」。", "위명제(魏明帝)가 황후의 아우 모증(毛曾)을 하후현(夏侯玄)과 함께 앉게 하니, 당시 사람들이 \"갈대가 옥나무에 기댔다\"라고 했다.", ["용모", "비평"]], ["容止", 4, "時人目「夏侯太初朗朗如日月之入懷，李安國頹唐如玉山之將崩」。", "당시 사람들이 평하기를 \"하후태초(夏侯太初)는 밝고 밝아 해와 달이 품에 들어온 듯하고, 이안국(李安國)은 무너질 듯하여 옥산(玉山)이 막 무너지려는 듯하다\"라고 했다.", ["용모", "비평"]], ["容止", 5, "嵇康身長七尺八寸，風姿特秀。見者歎曰：「蕭蕭肅肅，爽朗清舉。」或云：「肅肅如松下風，高而徐引。」山公曰：「嵇叔夜之為人也，巖巖若孤松之獨立；其醉也，傀俄若玉山之將崩。」", "혜강(嵇康)은 신장이 일곱 자 여덟 치였고 풍자(風姿)가 특별히 빼어났다. 본 자가 감탄하기를 \"소소하고 숙숙하며, 상쾌하고 명랑하며 맑게 빼어났다\"라고 했다. 혹은 \"숙숙하기가 소나무 아래 바람 같아 높으면서도 천천히 끄는 듯하다\"라고 했다. 산공(山公)이 말하기를 \"혜숙야(嵇叔夜)의 사람됨은 우뚝하기가 외로운 소나무가 홀로 선 듯하고, 그가 취하면 무너질 듯 옥산(玉山)이 막 무너지려는 듯하다\"라고 했다.", ["용모", "비평"]], ["容止", 6, "裴令公目王安：「豐眼爛爛如巖下電。」", "배령공(裴令公)이 왕안(王安)을 평하기를 \"풍성한 눈이 번쩍번쩍하여 바위 아래 번개 같다\"라고 했다.", ["용모", "비평"]], ["容止", 7, "潘岳妙有姿容，好神情。少時挾彈出洛陽道，婦人遇者，莫不連手共縈之。左太沖絕醜，亦復效岳遊遨，於是羣嫗齊共亂唾之，委頓而返。", "반악(潘岳)은 묘하게 자태와 용모가 있고 신정(神情)을 좋아했다. 젊었을 때 탄궁을 끼고 낙양(洛陽)의 길로 나가면, 마주치는 부인들이 손을 잡고 함께 그를 에워싸지 않는 이가 없었다. 좌태충(左太沖)은 몹시 추했는데, 또한 반악을 본떠 노닐러 나가니, 이에 여러 노파들이 일제히 함께 어지러이 침을 뱉어, 풀이 죽어 돌아왔다.", ["용모", "비평"]], ["容止", 8, "王夷甫容貌整麗，妙於談玄，恆捉白玉柄麈尾，與手都無分別。", "왕이보(王夷甫)는 용모가 단정하고 아름다웠으며 현담(玄談)에 묘했는데, 늘 백옥 자루의 주미(麈尾)를 잡았으니 손과 전혀 분간이 없었다.", ["용모", "청담"]], ["容止", 9, "潘安仁、夏侯湛並有美容，喜同行，時人謂之「連璧」。", "반안인(潘安仁)과 하후담(夏侯湛)이 모두 아름다운 용모가 있어 함께 다니기를 좋아하니, 당시 사람들이 그들을 \"연벽(連璧)\"이라 불렀다.", ["용모", "우정"]], ["容止", 10, "裴令公有儁容姿，一旦有疾至困，惠帝使王夷甫往看，裴方向壁臥，聞王使至，強回視之。王出語人曰：「雙眸閃閃，若巖下電，精神挺動，體中故小惡。」", "배령공(裴令公)은 뛰어난 용모와 자태가 있었는데, 하루는 병이 들어 위독한 지경에 이르렀다. 혜제(惠帝)가 왕이보(王夷甫)를 보내 가서 보게 하니, 배는 마침 벽을 향해 누워 있다가 왕의 사자가 이르렀다는 말을 듣고 억지로 돌아보았다. 왕이 나와 사람들에게 말하기를 \"두 눈동자가 반짝반짝하여 바위 아래 번개 같고 정신이 꼿꼿이 움직이니, 몸은 다만 조금 좋지 않을 뿐이다\"라고 했다.", ["용모", "병과늙음", "비평"]], ["容止", 11, "有人語王戎曰：「嵇延祖卓卓如野鶴之在雞羣。」答曰：「君未見其父耳！」", "어떤 사람이 왕융(王戎)에게 말하기를 \"혜연조(嵇延祖)는 우뚝하기가 들판의 학이 닭 무리 가운데 있는 듯하다\"라고 했다. 대답하기를 \"그대가 그 아비를 보지 못했을 뿐이오!\"라고 했다.", ["용모", "비평"]], ["容止", 12, "裴令公有儁容儀，脫冠冕，麤服亂頭皆好。時人以為「玉人」。見者曰：「見裴叔則如玉山上行，光映照人。」", "배령공(裴楷)은 빼어난 용모와 거동을 지녔으니, 관을 벗고 거친 옷에 흐트러진 머리를 해도 모두 아름다웠다. 당시 사람들은 그를 '옥인(玉人)'이라 여겼다. 그를 본 자가 말하였다. \"배숙칙(裴楷)을 보면 옥산 위를 거니는 듯하여 그 빛이 사람을 비춘다.\"", ["용모", "비평"]], ["容止", 13, "劉伶身長六尺，貌甚醜顇，而悠悠忽忽，土木形骸。", "유령(劉伶)은 키가 여섯 자에 용모가 매우 못생기고 초췌하였으나, 유유하고 활달하여 흙과 나무처럼 자기 몸을 내버려 두었다.", ["용모", "풍류"]], ["容止", 14, "驃騎王武子是衛玠之舅，儁爽有風姿，見玠輒歎曰：「珠玉在側，覺我形穢！」", "표기장군 왕무자(王武子)는 위개(衛玠)의 외삼촌으로, 빼어나고 시원스러우며 풍채가 있었는데, 위개를 볼 때마다 탄식하며 말하였다. \"주옥이 곁에 있으니 내 모습이 추하게 느껴진다!\"", ["용모", "비평", "겸손"]], ["容止", 15, "有人詣王太尉，遇安豐、大將軍、丞相在坐；往別屋見季胤、平子。還，語人曰：「今日之行，觸目見琳琅珠玉。」", "어떤 사람이 왕태위(王衍)를 찾아갔다가, 안풍(王戎)과 대장군(王敦)과 승상(王導)이 자리에 함께 있는 것을 만났고, 다른 방으로 가서 계윤과 평자를 보았다. 돌아와서 사람들에게 말하였다. \"오늘의 걸음은 눈길 닿는 곳마다 아름다운 주옥을 보았다.\"", ["용모", "비평"]], ["容止", 16, "王丞相見衛洗馬曰：「居然有羸形，雖復終日調暢，若不堪羅綺。」", "왕승상(王導)이 위세마(衛玠)를 보고 말하였다. \"확연히 여윈 모습이라, 비록 종일토록 조화롭고 화창하더라도 비단옷조차 감당하지 못할 듯하다.\"", ["용모", "비평"]], ["容止", 17, "王大將軍稱太尉：「處眾人中，似珠玉在瓦石間。」", "왕대장군(王敦)이 태위(王衍)를 칭하여 말하였다. \"뭇사람 가운데 있으니, 주옥이 기와와 돌 사이에 있는 듯하다.\"", ["용모", "비평"]], ["容止", 18, "庾子嵩長不滿七尺，腰帶十圍，頹然自放。", "유자숭(庾子嵩)은 키가 일곱 자가 못 되었으나 허리띠가 열 아름이었고, 늘어진 채 스스로를 거리낌 없이 내버려 두었다.", ["용모", "풍류"]], ["容止", 19, "衛玠從豫章至下都，人久聞其名，觀者如堵牆。玠先有羸疾，體不堪勞，遂成病而死。時人謂「看殺衛玠」。", "위개(衛玠)가 예장(豫章)에서 하도(下都)에 이르니, 사람들이 그 이름을 오래 들었던 터라 구경하는 자가 담장처럼 늘어섰다. 위개는 본래 여윈 병이 있어 몸이 수고로움을 감당하지 못하였는데, 마침내 병이 되어 죽었다. 당시 사람들은 \"위개를 보아서 죽였다\"고 하였다.", ["용모", "죽음", "병과늙음"]], ["容止", 20, "周伯仁道桓茂倫：「嶔崎歷落可笑人。」或云謝幼輿言。", "주백인(周顗)이 환무륜(桓溫)을 평하였다. \"우뚝하고 빼어나며 두드러져 사람을 웃게 하는 자다.\" 혹은 사유여(謝鯤)의 말이라고도 한다.", ["용모", "비평"]], ["容止", 21, "周侯說王長史父：形貌既偉，雅懷有概，保而用之，可作諸許物也。", "주후(周顗)가 왕장사(王濛)의 부친을 평하였다. 형모가 이미 위대하고, 우아한 회포에 기개가 있어, 그것을 잘 지녀 쓰면 여러 가지 일을 해낼 만하다.", ["용모", "비평"]], ["容止", 22, "祖士少見衛君長云：「此人有旄仗下形。」", "조사소(祖逖)가 위군장(衛玠)을 보고 말하였다. \"이 사람은 깃발과 의장 아래 설 만한 모습이 있다.\"", ["용모", "비평"]], ["容止", 23, "石頭事故，朝廷傾覆。溫忠武與庾文康投陶公求救，陶公云：「肅祖顧命不見及，且蘇峻作亂，釁由諸庾，誅其兄弟，不足以謝天下。」\n于時庾在溫船後聞之，憂怖無計。別日，溫勸庾見陶，庾猶豫未能往，溫曰：「溪狗我所悉，卿但見之，必無憂也！」庾風姿神貌，陶一見便改觀。談宴竟日，愛重頓至。", "석두(石頭)의 변고로 조정이 무너졌다. 온충무(溫嶠)가 유문강(庾亮)과 함께 도공(陶侃)에게 가서 구원을 청하니, 도공이 말하였다. \"숙조(肅祖)의 고명(顧命)에 나는 끼지 못하였고, 또 소준(蘇峻)의 난은 그 빌미가 여러 유씨에게서 비롯되었으니, 그 형제를 베어도 천하에 사죄하기에 부족하다.\" 그때 유량은 온교의 배 뒤에 있다가 이를 듣고, 근심하고 두려워하며 어찌할 바를 몰랐다. 다른 날 온교가 유량에게 도공을 만나보라 권하니, 유량이 머뭇거리며 가지 못하였다. 온교가 말하였다. \"계구(溪狗)는 내가 잘 아는 자이니, 그대는 만나기만 하면 반드시 근심할 것이 없을 것이오!\" 유량의 풍자와 신모(神貌)에 도공은 한 번 보고 곧 보는 눈을 바꾸었다. 종일토록 담소하며 잔치하니, 사랑하고 중히 여김이 단번에 지극해졌다.", ["용모", "권력", "도량"]], ["容止", 24, "庾太尉在武昌，秋夜氣佳景清，使吏殷浩、王胡之之徒登南樓理詠。音調始遒，聞函道中有屐聲甚厲，定是庾公。俄而率左右十許人步來，諸賢欲起避之。公徐云：「諸君少住，老子於此處興復不淺！」因便據胡牀，與諸人詠謔，竟坐甚得任樂。後王逸少下，與丞相言及此事。丞相曰：「元規爾時風範，不得不小穨。」右軍答曰：「唯丘壑獨存。」", "유태위(庾亮)가 무창(武昌)에 있을 때, 가을밤 기운이 아름답고 경치가 맑았다. 관리인 은호(殷浩)와 왕호지(王胡之) 무리로 하여금 남루(南樓)에 올라 시를 읊게 하였다. 음조가 막 무르익으려는데, 복도 가운데서 나막신 소리가 매우 사납게 들리니, 분명 유공이었다. 이윽고 좌우 열 명 남짓을 거느리고 걸어오니, 여러 어진 이들이 일어나 피하려 하였다. 유공이 천천히 말하였다. \"여러분, 잠시 머무시오. 이 늙은이가 이곳에서의 흥취가 또한 얕지 않소!\" 그러고는 호상(胡牀)에 기대어 여러 사람과 함께 시를 읊고 농담하니, 끝내 좌중이 자유로운 즐거움을 흠뻑 누렸다. 뒤에 왕일소(王羲之)가 내려와 승상(王導)과 이 일을 이야기하게 되었다. 승상이 말하였다. \"원규(庾亮)가 그때의 풍범(風範)이라면, 다소 무너지지 않을 수 없었겠지요.\" 우군(王羲之)이 답하였다. \"오직 산수의 정취만은 홀로 남아 있었지요.\"", ["풍류", "자연과산수", "도량"]], ["容止", 25, "王敬豫有美形，問訊王公。王公撫其肩曰：「阿奴恨才不稱！」又云：「敬豫事事似王公。」", "왕경예(王坦之)는 아름다운 형모를 지녔는데, 왕공(王導)에게 안부를 물으니, 왕공이 그 어깨를 어루만지며 말하였다. \"아노(阿奴)는 재주가 모습에 걸맞지 못함이 한스럽구나!\" 또 말하기를 \"경예는 일마다 왕공을 닮았다\"고 하였다.", ["용모", "비평", "재능"]], ["容止", 26, "王右軍見杜弘治，歎曰：「面如凝脂，眼如點漆，此神仙中人。」時人有稱王長史形者，蔡公曰：「恨諸人不見杜弘治耳！」", "왕우군(王羲之)이 두홍치(杜弘治)를 보고 탄식하였다. \"얼굴은 엉긴 기름 같고 눈은 점찍은 옻칠 같으니, 이는 신선 가운데 사람이다.\" 당시 사람 가운데 왕장사(王濛)의 형모를 칭찬하는 이가 있자, 채공(蔡公)이 말하였다. \"여러 사람이 두홍치를 보지 못한 것이 한스러울 뿐이다!\"", ["용모", "비평"]], ["容止", 27, "劉尹道桓公：鬢如反猬皮，眉如紫石稜，自是孫仲謀、司馬宣王一流人。", "유윤(劉惔)이 환공(桓溫)을 평하였다. 살쩍은 거꾸로 선 고슴도치 가죽 같고, 눈썹은 자줏빛 돌의 모서리 같으니, 본래 손중모(孫仲謀)와 사마선왕(司馬宣王) 같은 부류의 사람이다.", ["용모", "비평"]], ["容止", 28, "王敬倫風姿似父，作侍中，加授桓公，公服從大門入。桓公望之，曰：「大奴固自有鳳毛。」", "왕경륜(王坦之)은 풍자가 부친을 닮았다. 시중이 되어 환공(桓溫)에게 가관(加官)될 때, 관복을 입고 대문으로 들어왔다. 환공이 그를 바라보며 말하였다. \"큰 종놈에게는 본래 봉황의 털이 있구나.\"", ["용모", "비평"]], ["容止", 29, "林公道王長史：「斂衿作一來，何其軒軒韶舉！」", "임공(支遁)이 왕장사(王濛)를 평하였다. \"옷깃을 여미고 한 번 다가오니, 어찌 그리 의젓하고 아름다운 거동인가!\"", ["용모", "비평"]], ["容止", 30, "時人目王右軍：「飄如遊雲，矯若驚龍。」", "당시 사람들이 왕우군(王羲之)을 평하였다. \"떠도는 구름처럼 표연하고, 놀란 용처럼 굳세다.\"", ["용모", "비평"]], ["容止", 31, "王長史嘗病，親疎不通。林公來，守門人遽啟之曰：「一異人在門，不敢不啟。」王笑曰：「此必林公。」", "왕장사(王濛)가 일찍이 병들어 친소를 막론하고 통하지 못하게 하였다. 임공(支遁)이 오자 문지기가 황급히 아뢰었다. \"기이한 사람 하나가 문에 있어 감히 아뢰지 않을 수 없습니다.\" 왕장사가 웃으며 말하였다. \"이는 분명 임공이다.\"", ["용모", "비평", "우정"]], ["容止", 32, "或以方謝仁祖不乃重者。桓大司馬曰：「諸君莫輕道，仁祖企腳北窗下彈琵琶，故自有天際真人想。」", "어떤 사람이 사인조(謝尚)를 그다지 중히 여기지 않는 자에 견주었다. 환대사마(桓溫)가 말하였다. \"여러분은 가벼이 말하지 마시오. 인조가 북창 아래 다리를 뻗고 비파를 타니, 본래 천제(天際)의 진인(眞人) 같은 상상이 절로 든다오.\"", ["비평", "음악", "풍류"]], ["容止", 33, "王長史為中書郎，往敬和許。爾時積雪，長史從門外下車，步入尚書，著公服。敬和遙望，歎曰：「此不復似世中人！」", "왕장사(王濛)가 중서랑이 되어 경화의 처소로 갔다. 그때 눈이 쌓여 있었는데, 왕장사가 문밖에서 수레를 내려 걸어서 상서성으로 들어가니, 관복을 입고 있었다. 경화가 멀리 바라보며 탄식하였다. \"이는 더 이상 세상 사람 같지 않구나!\"", ["용모", "비평"]], ["容止", 34, "簡文作相王時，與謝公共詣桓宣武。王珣先在內，桓語王：「卿嘗欲見相王，可住帳裏。」二客既去，桓謂王曰：「定何如？」王曰：「相王作輔，自然湛若神君，公亦萬夫之望。不然，僕射何得自沒？」", "간문제(簡文帝)가 상왕(相王)이던 때, 사공(謝安)과 함께 환선무(桓溫)를 찾아갔다. 왕순(王珣)이 먼저 안에 있었는데, 환온이 왕순에게 말하였다. \"그대가 일찍이 상왕을 만나보고자 하였으니, 휘장 안에 머물러 있으라.\" 두 손님이 떠난 뒤, 환온이 왕순에게 말하였다. \"과연 어떠하던가?\" 왕순이 말하였다. \"상왕이 보필을 맡으니 자연히 깊고 그윽함이 신군(神君)과 같았고, 공 또한 만인이 우러르는 분이었습니다. 그렇지 않다면 복야(僕射)가 어찌 스스로 가라앉을 수 있었겠습니까?\"", ["비평", "용모"]], ["容止", 35, "海西時，諸公每朝，朝堂猶暗；唯會稽王來，軒軒如朝霞舉。", "해서공(海西公) 때, 여러 공이 조회할 때마다 조당(朝堂)이 오히려 어두웠으나, 오직 회계왕(會稽王)이 오면 의젓하여 마치 아침놀이 솟는 듯하였다.", ["용모", "비평"]], ["容止", 36, "謝車騎道謝公：「遊肆復無乃高唱，但恭坐捻鼻顧睞，便自有寢處山澤閒儀。」", "사거기(謝玄)가 사공(謝安)을 평하였다. \"노닐며 즐길 때도 높이 읊조림이 없고, 다만 공손히 앉아 코를 매만지며 좌우를 돌아볼 뿐인데, 그 자체로 산수에 누워 지내는 거동이 있었다.\"", ["비평", "풍류", "자연과산수"]], ["容止", 37, "謝公云：「見林公雙眼，黯黯明黑。」孫興公見林公：「稜稜露其爽。」", "사공(謝安)이 말하였다. \"임공(支遁)의 두 눈을 보니, 검고도 밝게 빛나더라.\" 손흥공(孫綽)이 임공을 보고 말하였다. \"모가 나고 날카로워 그 시원함을 드러낸다.\"", ["용모", "비평"]], ["容止", 38, "庾長仁與諸弟入吳，欲住亭中宿。諸弟先上，見羣小滿屋，都無相避意。長仁曰：「我試觀之。」乃策杖將一小兒，始入門，諸客望其神姿，一時退匿。", "유장인(庾亮)이 여러 아우와 함께 오(吳) 땅에 들어가 정자 안에서 묵으려 하였다. 여러 아우가 먼저 올라가 보니 잡인들이 방에 가득하여 전혀 비켜줄 뜻이 없었다. 장인이 말하였다. \"내가 한번 살펴보겠다.\" 이에 지팡이를 짚고 어린아이 하나를 데리고 막 문에 들어서니, 여러 손님이 그 신자(神姿)를 바라보고는 일시에 물러나 숨었다.", ["용모", "도량"]], ["容止", 39, "有人歎王恭形茂者，云：「濯濯如春月柳。」", "어떤 사람이 왕공(王恭)의 빼어난 형모를 탄식하며 말하였다. \"윤기 흐르는 것이 봄날의 버들 같다.\"", ["용모", "비평"]], ["自新", 1, "周處年少時，兇彊俠氣，為鄉里所患。又義興水中有蛟，山中有邅跡虎，並皆暴犯百姓，義興人謂為三橫，而處尤劇。或說處殺虎斬蛟，實冀三橫唯餘其一。處即刺殺虎，又入水擊蛟，蛟或浮或沒，行數十里，處與之俱。經三日三夜，鄉里皆謂已死，更相慶，竟殺蛟而出。聞里人相慶，始知為人情所患，有自改意。乃自吳尋二陸，平原不在，正見清河，具以情告，幷云：「欲自修改，而年已蹉跎，終無所成。」清河曰：「古人貴朝聞夕死，況君前途尚可。且人患志之不立，亦何憂令名不彰邪？」處遂改勵，終為忠臣孝子。", "주처(周處)는 젊었을 때 흉포하고 강하며 협기가 있어 향리의 근심거리가 되었다. 또 의흥(義興)의 물속에는 교룡이 있고 산중에는 발자국을 끄는 호랑이가 있어, 모두 백성을 사납게 해치니, 의흥 사람들은 이를 세 가지 횡포라 일컬었는데, 주처가 더욱 심하였다. 어떤 이가 주처에게 호랑이를 죽이고 교룡을 베라고 권하였으니, 실은 세 가지 횡포 중 하나만 남기를 바란 것이었다. 주처가 곧 호랑이를 찔러 죽이고, 또 물에 들어가 교룡을 쳤다. 교룡이 떴다 가라앉았다 하며 수십 리를 갔는데, 주처도 함께 갔다. 사흘 밤낮이 지나도록 향리에서는 모두 그가 이미 죽었다 여겨 서로 경하하였으나, 마침내 교룡을 죽이고 나왔다. 마을 사람들이 서로 경하한다는 말을 듣고서야 비로소 자기가 사람들의 근심거리였음을 알고, 스스로 고치려는 뜻을 품었다. 이에 오(吳)로 가서 두 육씨를 찾았는데, 평원(陸機)은 없고 마침 청하(陸雲)만 보았다. 사정을 갖추어 고하고 아울러 말하였다. \"스스로 닦아 고치고자 하나 나이가 이미 어그러져 끝내 이룰 바가 없을까 합니다.\" 청하가 말하였다. \"옛사람은 아침에 도를 들으면 저녁에 죽어도 좋다 하였거늘, 하물며 그대의 앞길은 아직 가능함에랴. 또 사람은 뜻을 세우지 못함을 근심할 뿐이니, 어찌 훌륭한 이름이 드러나지 않음을 근심하겠소?\" 주처가 마침내 고치고 힘써, 끝내 충신이요 효자가 되었다.", ["뉘우침", "용기", "학문"]], ["自新", 2, "戴淵少時，遊俠不治行檢，嘗在江、淮間攻掠商旅。陸機赴假還洛，輜重甚盛。淵使少年掠劫，淵在岸上，據胡牀，指麾左右，皆得其宜。淵既神姿峯頴，雖處鄙事，神氣猶異。機於船屋上遙謂之曰：「卿才如此，亦復作劫邪？」淵便泣涕，投劍歸機，辭厲非常。機彌重之，定交，作筆薦焉。過江，仕至征西將軍。", "대연(戴淵)은 젊었을 때 협객 노릇을 하며 품행을 다스리지 않아, 일찍이 강수와 회수 사이에서 상인과 나그네를 노략질하였다. 육기(陸機)가 휴가에서 낙양으로 돌아오는데 짐이 매우 많았다. 대연이 젊은이들을 시켜 노략질하게 하면서, 자신은 언덕 위에서 호상(胡牀)에 기대어 좌우를 지휘하니 모두 마땅함을 얻었다. 대연은 본래 신자(神姿)가 우뚝하고 빼어나, 비록 비천한 일에 처하였으나 신기(神氣)는 여전히 남달랐다. 육기가 배의 지붕 위에서 멀리 그에게 말하였다. \"그대의 재주가 이러한데 또한 노략질을 한단 말인가?\" 대연이 곧 눈물을 흘리며 칼을 던지고 육기에게 귀의하니, 말씨가 비상하였다. 육기가 더욱 그를 중히 여겨 사귐을 맺고, 글을 지어 천거하였다. 강을 건너 벼슬이 정서장군에 이르렀다.", ["뉘우침", "재능", "우정"]], ["企羡", 1, "王丞相拜司空，桓廷尉作兩髻、葛帬、策杖，路邊窺之，歎曰：「人言阿龍超，阿龍故自超。」不覺至臺門。", "왕승상(王導)이 사공에 제수되니, 환정위(桓溫)가 두 갈래로 상투를 틀고 갈포 치마를 입고 지팡이를 짚고서 길가에서 엿보며 탄식하였다. \"사람들이 아룡(阿龍)이 빼어나다 하더니, 아룡은 과연 빼어나구나.\" 그러고는 자신도 모르게 대문(臺門)에 이르렀다.", ["용모", "비평"]], ["企羡", 2, "王丞相過江，自說昔在洛水邊，數與裴成公、阮千里諸賢共談道。羊曼曰：「人久以此許卿，何須復爾？」王曰：「亦不言我須此，但欲爾時不可得耳！」", "왕승상(王導)이 강을 건넌 뒤, 옛날 낙수 가에 있을 때 배성공(裴楷)과 완천리(阮瞻) 등 여러 어진 이와 함께 도를 담론하던 일을 스스로 이야기하였다. 양만(羊曼)이 말하였다. \"사람들이 오래도록 이 일로 그대를 높이 여겼는데, 어찌 다시 그러시오?\" 왕승상이 말하였다. \"또한 내가 이것을 자랑할 것은 못 되나, 다만 그때를 다시 얻을 수 없음이 아쉬울 뿐이오!\"", ["청담", "겸손", "우정"]], ["企羡", 3, "王右軍得人以蘭亭集序方金谷詩序，又以已敵石崇，甚有欣色。", "왕우군(王羲之)은 어떤 사람이 「난정집서(蘭亭集序)」를 「금곡시서(金谷詩序)」에 견주고, 또 자신을 석숭(石崇)에 맞먹게 하는 것을 듣고 매우 기뻐하는 빛이 있었다.", ["서화", "오만", "비평"]], ["企羡", 4, "王司州先為庾公記室參軍，後取殷浩為長史。始到，庾公欲遣王使下都。王自啟求住曰：「下官希見盛德，淵源始至，猶貪與少日周旋。」", "왕사주(王胡之)가 먼저 유공(庾亮)의 기실참군이 되었다가, 뒤에 은호(殷浩)를 장사로 데려왔다. 은호가 막 도착하자 유공이 왕사주를 하도(下都)로 보내고자 하였다. 왕사주가 스스로 아뢰어 머물기를 청하며 말하였다. \"제가 성덕(盛德)을 보기를 바랐는데, 연원(殷浩)이 막 이르렀으니, 그래도 며칠이나마 함께 지내기를 탐내옵니다.\"", ["비평", "우정"]], ["企羡", 5, "郗嘉賓得人以己比符堅，大喜。", "치가빈(郗超)은 어떤 사람이 자기를 부견(符堅)에 견주는 것을 듣고 크게 기뻐하였다.", ["비평", "오만"]], ["企羡", 6, "孟昶未達時，家在京口。嘗見王恭乘高輿，被鶴氅裘。于時微雪，昶於籬間窺之，歎曰：「此真神仙中人！」", "맹창(孟昶)이 아직 현달하지 못하였을 때, 집이 경구(京口)에 있었다. 일찍이 왕공(王恭)이 높은 수레를 타고 학창의(鶴氅裘)를 걸친 것을 보았는데, 그때 가는 눈이 내렸다. 맹창이 울타리 사이로 엿보며 탄식하였다. \"이는 참으로 신선 가운데 사람이로다!\"", ["용모", "비평"]], ["傷逝", 1, "王仲宣好驢鳴。既葬，文帝臨其喪，顧語同遊曰：「王好驢鳴，可各作一聲以送之。」赴客皆一作驢鳴。", "왕중선(王粲)은 나귀 울음소리를 좋아하였다. 장사를 지낸 뒤, 문제(文帝)가 그 상에 임하여 함께 노닐던 이들을 돌아보며 말하였다. \"왕중선이 나귀 울음을 좋아하였으니, 각자 한 소리씩 내어 그를 보내자.\" 조문 온 손님들이 모두 한 차례 나귀 울음을 내었다.", ["죽음", "우정", "풍류"]], ["傷逝", 2, "王濬沖為尚書令，著公服，乘軺車，經黃公酒壚下過，顧謂後車客：「吾昔與嵇叔夜、阮嗣宗共酣飲於此壚，竹林之遊，亦預其末。自嵇生夭、阮公亡以來，便為時所羈紲。今日視此雖近，邈若山河。」", "왕준충(王戎)이 상서령이 되어 관복을 입고 초거(軺車)를 타고 황공의 술집 아래를 지나가다가, 뒷수레의 손님을 돌아보며 말하였다. \"내가 옛날 혜숙야(嵇康), 완사종(阮籍)과 함께 이 술집에서 흠뻑 마셨고, 죽림(竹林)의 노닒에도 그 말석에 참여하였다. 혜강이 요절하고 완공이 죽은 뒤로는 곧 시속에 얽매이게 되었다. 오늘 이곳을 보니 비록 가깝지만 산하처럼 아득하구나.\"", ["죽음", "우정", "풍류"]], ["傷逝", 3, "孫子荊以有才，少所推服，唯雅敬王武子。武子喪時，名士無不至者。子荊後來，臨屍慟哭，賓客莫不垂涕。哭畢，向靈牀曰：「卿常好我作驢鳴，今我為卿作。」體似真聲，賓客皆笑。孫舉頭曰：「使君輩存，令此人死！」", "손자형(孫綽)은 재주가 있다 하여 남을 인정하고 따르는 일이 드물었으나, 오직 왕무자(王武子)만은 우러러 공경하였다. 왕무자가 죽었을 때 이름난 선비로 이르지 않은 이가 없었다. 손자형이 뒤늦게 와서 주검 앞에서 통곡하니, 손님들이 눈물을 흘리지 않는 이가 없었다. 곡을 마치고 영상(靈牀)을 향하여 말하였다. \"그대가 늘 내가 나귀 울음 내는 것을 좋아하였으니, 이제 내가 그대를 위해 내겠소.\" 그 소리가 진짜 같으니 손님들이 모두 웃었다. 손

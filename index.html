자형이 머리를 들고 말하였다. \"그대들 같은 무리는 살려 두고, 이 사람을 죽게 하였구나!\"", ["죽음", "우정", "풍류"]], ["傷逝", 4, "王戎喪兒萬子，山簡往省之，王悲不自勝。簡曰：「孩抱中物，何至於此？」王曰：「聖人忘情，最下不及情；情之所鍾，正在我輩。」簡服其言，更為之慟。", "왕융(王戎)이 아들 만자(萬子)를 잃자, 산간(山簡)이 가서 위문하니, 왕융이 슬픔을 스스로 가누지 못하였다. 산간이 말하였다. \"품 안의 아이일 뿐인데, 어찌 이 지경에 이르렀습니까?\" 왕융이 말하였다. \"성인은 정(情)을 잊고, 가장 못난 자는 정에 미치지 못하니, 정이 모이는 곳은 바로 우리 같은 무리에게 있소.\" 산간이 그 말에 감복하여 다시 그를 위해 통곡하였다.", ["죽음", "효", "도량"]], ["傷逝", 5, "有人哭和長輿曰：「峨峨若千丈松崩。」", "어떤 사람이 화장여(和嶠)를 곡하며 말하였다. \"우뚝하기가 천 길의 소나무가 무너지는 듯하다.\"", ["죽음", "비평", "용모"]], ["傷逝", 6, "衛洗馬以永嘉六年喪，謝鯤哭之，感動路人。咸和中，丞相王公教曰：「衛洗馬當改葬。此君風流名士，海內所瞻，可脩薄祭，以敦舊好。」", "위세마(衛玠)가 영가(永嘉) 6년에 죽으니, 사곤(謝鯤)이 그를 곡하여 길 가던 사람들까지 감동시켰다. 함화(咸和) 연간에 승상 왕공(王導)이 교(敎)를 내려 말하였다. \"위세마를 마땅히 개장(改葬)해야 한다. 이 분은 풍류 있는 명사로 천하가 우러르던 바이니, 박한 제사라도 마련하여 옛 정을 도탑게 함이 옳다.\"", ["죽음", "용모", "풍류"]], ["傷逝", 7, "顧彥先平生好琴，及喪，家人常以琴置靈牀上。張季鷹往哭之，不勝其慟，遂徑上牀，鼓琴，作數曲竟，撫琴曰：「顧彥先頗復賞此不？」因又大慟，遂不執孝子手而出。", "고언선(顧愷之의 일족 顧榮)은 평생 거문고를 좋아하였는데, 죽자 집안사람들이 늘 거문고를 영상(靈牀) 위에 놓아두었다. 장계응(張翰)이 가서 곡하다가 그 슬픔을 이기지 못하고, 마침내 곧장 영상에 올라가 거문고를 타서 몇 곡을 마친 뒤, 거문고를 어루만지며 말하였다. \"고언선은 자못 이를 다시 감상하시는지요?\" 그러고는 또 크게 통곡하고, 마침내 효자의 손을 잡지도 않고 나가 버렸다.", ["죽음", "음악", "우정"]], ["傷逝", 8, "庾亮兒遭蘇峻難遇害。諸葛道明女為庾兒婦，既寡，將改適，與亮書及之。亮答曰：「賢女尚少，故其宜也。感念亡兒，若在初沒。」", "유량(庾亮)의 아들이 소준(蘇峻)의 난을 만나 해를 입었다. 제갈도명(諸葛道明)의 딸이 유량 아들의 아내였는데, 과부가 되자 다시 시집가게 되어, 유량에게 보내는 편지에서 이를 언급하였다. 유량이 답하였다. \"어진 따님이 아직 젊으니 진실로 마땅한 일이오. 죽은 아들을 생각하니, 마치 막 죽었을 때와 같소.\"", ["죽음", "부부", "도량", "제갈씨"]], ["傷逝", 9, "庾文康亡，何揚州臨葬云：「埋玉樹箸土中，使人情何能已已！」", "유문강(庾亮)이 죽자, 하양주(何充)가 장사에 임하여 말하였다. \"옥수(玉樹)를 흙 속에 묻으니, 사람의 정이 어찌 그칠 수 있겠는가!\"", ["죽음", "비평", "용모"]], ["傷逝", 10, "王長史病篤，寢臥燈下，轉麈尾視之，歎曰：「如此人，曾不得四十！」及亡，劉尹臨殯，以犀柄麈尾箸柩中，因慟絕。", "왕장사(王長史)가 병이 위독하여 등불 아래 누워 있다가, 주미(麈尾)를 돌려보며 탄식하기를 \"이런 사람이 마흔도 못 채우다니!\"라고 하였다. 그가 죽자 유윤(劉尹)이 빈소에 임하여 무소뿔 자루의 주미를 관 속에 넣고는 이내 통곡하다가 까무러쳤다.", ["죽음", "병과늙음", "우정"]], ["傷逝", 11, "支道林喪法虔之後，精神霣喪，風味轉墜。常謂人曰：「昔匠石廢斤於郢人，牙生輟絃於鍾子，推己外求，良不虛也！冥契既逝，發言莫賞，中心蘊結，余其亡矣！」卻後一年，支遂殞。", "지도림(支道林)이 법건(法虔)을 잃은 뒤로 정신이 무너지고 풍취가 점점 쇠하였다. 늘 사람들에게 말하기를 \"옛날 장석(匠石)이 영(郢) 땅 사람을 잃자 도끼질을 그만두었고, 백아(伯牙)가 종자기(鍾子期)를 잃자 거문고 줄을 끊었다 하니, 내 처지로 미루어 헤아려 보건대 참으로 헛된 말이 아니로다! 그윽이 통하던 벗이 이미 떠나니 말을 해도 알아줄 이가 없고, 마음속에 응어리가 맺히니 나도 곧 죽겠구나!\"라고 하였다. 그 뒤 일 년이 지나 지둔(支遁)도 마침내 세상을 떠났다.", ["죽음", "우정", "병과늙음"]], ["傷逝", 12, "郗嘉賓喪，左右白郗公「郎喪」，既聞，不悲，因語左右：「殯時可道。」公往臨殯，一慟幾絕。", "치가빈(郗嘉賓)이 죽자 좌우에서 치공(郗公)에게 \"낭(郎)께서 돌아가셨습니다\"라고 아뢰었다. 듣고서도 슬퍼하지 않고 좌우에게 이르기를 \"빈소를 차릴 때 말하라\"고 하였다. 치공이 가서 빈소에 임하여서는 한 번 통곡하다가 거의 까무러쳤다.", ["죽음", "도량"]], ["傷逝", 13, "戴公見林法師墓，曰：「德音未遠，而拱木已積。冀神理緜緜，不與氣運俱盡耳！」", "대공(戴公)이 임법사(林法師)의 무덤을 보고 말하기를 \"덕음(德音)이 아직 멀어지지 않았는데 무덤가 나무는 벌써 한 아름이 되었구나. 신령한 이치(理)가 면면히 이어져 기운(氣運)과 함께 다하지 않기를 바랄 뿐이다!\"라고 하였다.", ["죽음", "병과늙음"]], ["傷逝", 14, "王子敬與羊綏善。綏清淳簡貴，為中書郎，少亡。王深相痛悼，語東亭云：「是國家可惜人！」", "왕자경(王子敬)은 양수(羊綏)와 사이가 좋았다. 양수는 맑고 순박하며 간소하고 고귀하여 중서랑(中書郎)이 되었으나 젊어서 죽었다. 왕자경이 깊이 애통해하며 동정(東亭, 왕순王珣)에게 말하기를 \"이 사람은 나라로서도 아까운 사람이다!\"라고 하였다.", ["죽음", "우정", "비평"]], ["傷逝", 15, "王東亭與謝公交惡。王在東聞謝喪，便出都詣子敬道：「欲哭謝公。」子敬始臥，聞其言，便驚起曰：「所望於法護。」王於是往哭。督帥刁約不聽前，曰：「官平生在時，不見此客。」王亦不與語，直前，哭甚慟，不執末婢手而退。", "왕동정(王東亭, 왕순王珣)이 사공(謝公, 사안謝安)과 사이가 나빴다. 왕동정이 동쪽에 있다가 사안의 부음을 듣고는 곧바로 도성으로 나와 자경(子敬, 왕헌지)을 찾아가 말하기를 \"사공을 위해 곡하고자 한다\"고 하였다. 자경이 마침 누워 있다가 그 말을 듣고 놀라 일어나 말하기를 \"법호(法護)에게 바라던 바로다\"라고 하였다. 왕동정이 이에 가서 곡하였다. 독수(督帥) 조약(刁約)이 앞으로 나아가지 못하게 하며 말하기를 \"관(官, 사안)께서 평생 살아 계실 때 이 손님을 보지 못하셨다\"고 하였다. 왕동정은 그와 말을 섞지 않고 곧장 앞으로 나아가 매우 애통하게 곡하였으며, 상주의 손을 잡지 않고 물러났다.", ["죽음", "절교", "우정"]], ["傷逝", 16, "王子猷、子敬俱病篤，而子敬先亡。子猷問左右：「何以都不聞消息？此已喪矣！」語時了不悲。便索輿來奔喪，都不哭。子敬素好琴，便徑入坐靈牀上，取子敬琴彈，弦既不調，擲地云：「子敬！子敬！人琴俱亡。」因慟絕良久，月餘亦卒。", "왕자유(王子猷, 왕휘지)와 자경(子敬, 왕헌지)이 모두 병이 위독하였는데 자경이 먼저 죽었다. 자유가 좌우에게 묻기를 \"어찌하여 도무지 소식이 들리지 않는가? 이는 이미 죽은 것이다!\"라고 하는데, 말할 때 조금도 슬퍼하지 않았다. 이내 수레를 가져오라 하여 상가로 달려갔으나 전혀 곡하지 않았다. 자경은 평소 거문고를 좋아했으므로 곧장 들어가 영상(靈牀) 위에 앉아 자경의 거문고를 가져다 탔다. 줄이 고르지 않자 땅에 던지며 말하기를 \"자경아! 자경아! 사람도 거문고도 다 떠났구나\"라고 하였다. 이에 통곡하다가 한참을 까무러쳤고, 달포 뒤에 그 역시 죽었다.", ["죽음", "음악", "우정"]], ["傷逝", 17, "孝武山陵夕，王孝伯入臨，告其諸弟曰：「雖榱桷惟新，便自有黍離之哀！」", "효무제(孝武帝)의 능을 조성하던 저녁에 왕효백(王孝伯, 왕공王恭)이 들어가 곡하고는 여러 아우들에게 일러 말하기를 \"비록 서까래는 새로 갈렸으나 곧 절로 「서리(黍離)」의 슬픔이 있구나!\"라고 하였다.", ["죽음", "권력"]], ["傷逝", 18, "羊孚年三十一卒，桓玄與羊欣書曰：「賢從情所信寄，暴疾而殞，祝予之歎，如何可言！」", "양부(羊孚)가 서른한 살에 죽자 환현(桓玄)이 양흔(羊欣)에게 편지를 보내 말하기를 \"어진 종형은 정으로 믿고 의지하던 바였는데 급작스러운 병으로 죽었으니, '나를 저주하는구나' 하는 탄식을 어찌 말로 할 수 있겠는가!\"라고 하였다.", ["죽음", "우정"]], ["傷逝", 19, "桓玄當篡位，語卞鞠云：「昔羊子道恆禁吾此意。今腹心喪羊孚，爪牙失索元，而怱怱作此詆突，詎允天心？」", "환현(桓玄)이 제위를 찬탈하려 할 때 변국(卞鞠)에게 일러 말하기를 \"옛날 양자도(羊子道)는 늘 나의 이 뜻을 막았다. 이제 심복으로는 양부(羊孚)를 잃고 손발로는 색원(索元)을 잃었으니, 이렇게 황급히 무모한 일을 벌인들 어찌 하늘의 뜻에 맞겠는가?\"라고 하였다.", ["권력", "죽음", "술수"]], ["棲逸", 1, "阮步兵嘯，聞數百步。蘇門山中，忽有真人，樵伐者咸共傳說。阮籍往觀，見其人擁厀巖側。籍登嶺就之，箕踞相對。籍商略終古，上陳黃、農玄寂之道，下考三代盛德之美，以問之，仡然不應。復敘有為之教，棲神導氣之術以觀之，彼猶如前，凝矚不轉。籍因對之長嘯。良久，乃笑曰：「可更作。」籍復嘯。意盡，退，還半嶺許，聞上然有聲，如數部鼓吹，林谷傳響。顧看，迺向人嘯也。", "완보병(阮步兵, 완적阮籍)의 휘파람은 수백 보 밖에서도 들렸다. 소문산(蘇門山) 가운데 홀연히 진인(眞人)이 있다고 나무꾼들이 모두 함께 전하여 말하였다. 완적이 가서 보니 그 사람이 바위 곁에서 무릎을 안고 앉아 있었다. 완적이 고개에 올라 그에게 다가가 다리를 뻗고 마주 앉았다. 완적이 태곳적 일을 헤아려, 위로는 황제(黃帝)와 신농(神農)의 그윽하고 고요한 도를 펴고 아래로는 삼대(三代)의 성덕(盛德)의 아름다움을 살펴 그에게 물었으나, 의연히 응답하지 않았다. 다시 유위(有爲)의 가르침과 정신을 깃들이고 기운을 이끄는 술법을 펴서 그의 기색을 살폈으나, 그는 여전히 앞서와 같아 응시한 채 눈동자를 돌리지 않았다. 완적이 이에 그를 마주하여 길게 휘파람을 불었다. 한참 만에 그가 웃으며 말하기를 \"다시 해 보라\"고 하였다. 완적이 다시 휘파람을 불었다. 흥이 다하여 물러나, 고개 중턱쯤에 이르렀을 때 위에서 무슨 소리가 울리는데, 마치 여러 부대의 고취(鼓吹)와도 같아 숲과 골짜기에 메아리가 퍼졌다. 돌아보니 곧 아까 그 사람의 휘파람이었다.", ["음악", "은둔", "청담"]], ["棲逸", 2, "嵇康遊於汲郡山中，遇道士孫登，遂與之遊。康臨去，登曰：「君才則高矣，保身之道不足。」", "혜강(嵇康)이 급군(汲郡)의 산속에서 노닐다가 도사 손등(孫登)을 만나 마침내 그와 어울려 노닐었다. 혜강이 떠나려 할 때 손등이 말하기를 \"그대의 재주는 높으나 몸을 보전하는 도가 부족하다\"고 하였다.", ["은둔", "예언", "비평"]], ["棲逸", 3, "山公將去選曹，欲舉嵇康；康與書告絕。", "산공(山公, 산도)이 선조(選曹)를 떠나려 할 때 혜강(嵇康)을 천거하고자 하였다. 혜강은 그에게 절교의 편지를 보냈다.", ["절교", "은둔", "거절"]], ["棲逸", 4, "李廞是茂曾第五子，清貞有遠操，而少羸病，不肯婚宦。居在臨海，住兄侍中墓下。既有高名，王丞相欲招禮之，故辟為府掾。廞得牋命，笑曰：「茂弘乃復以一爵假人！」", "이흠(李廞)은 무증(茂曾)의 다섯째 아들로, 맑고 곧으며 원대한 지조가 있었으나 어려서부터 몸이 약하고 병이 있어 혼인하거나 벼슬하려 하지 않았다. 임해(臨海)에 살면서 형인 시중(侍中)의 무덤 아래 머물렀다. 이미 높은 명성이 있었으므로 왕승상(王丞相, 왕도)이 그를 불러 예우하고자 부의 연(掾)으로 불러들였다. 이흠이 임명 문서를 받고 웃으며 말하기를 \"무홍(茂弘, 왕도)이 또한 벼슬 하나로 사람을 빌리려 하는구나!\"라고 하였다.", ["은둔", "거절", "병과늙음"]], ["棲逸", 5, "何驃騎弟以高情避世，而驃騎勸之令仕。答曰：「予第五之名，何必減驃騎？」", "하표기(何驃騎)의 아우가 높은 뜻으로 세상을 피하니, 표기가 그에게 벼슬하기를 권하였다. 그가 답하기를 \"제 다섯째라는 이름이 어찌 반드시 표기보다 못하겠습니까?\"라고 하였다.", ["은둔", "거절", "기지"]], ["棲逸", 6, "阮光祿在東山，蕭然無事，常內足於懷。有人以問王右軍，右軍曰：「此君近不驚寵辱，雖古之沈冥，何以過此？」", "완광록(阮光祿)이 동산(東山)에 있으면서 쓸쓸히 일이 없었으나 늘 마음속으로 스스로 만족하였다. 어떤 사람이 이를 왕우군(王右軍, 왕희지)에게 물으니, 우군이 말하기를 \"이 사람은 가까이로는 영예와 치욕에 놀라지 않으니, 비록 옛날의 침잠한 은자라 한들 어찌 이보다 낫겠는가?\"라고 하였다.", ["은둔", "청빈", "비평"]], ["棲逸", 7, "孔車騎少有嘉遁意，年四十餘，始應安東命。未仕宦時，常獨寢，歌吹自箴誨，自稱孔郎，遊散名山。百姓謂有道術，為生立廟。今猶有孔郎廟。", "공거기(孔車騎)는 젊어서부터 아름다운 은둔의 뜻이 있었는데, 마흔이 넘어서야 비로소 안동(安東)의 부름에 응하였다. 벼슬하기 전에는 늘 홀로 자며 노래하고 휘파람 불어 스스로를 경계하고 가르쳤으며, 스스로 공랑(孔郎)이라 일컫고 이름난 산들을 노닐며 다녔다. 백성들은 그가 도술이 있다 여겨 살아 있는 그를 위해 사당을 세웠다. 지금도 공랑묘(孔郎廟)가 남아 있다.", ["은둔", "풍류"]], ["棲逸", 8, "南陽劉驎之，高率善史傳，隱於陽岐。于時符堅臨江，荊州刺史桓沖將盡訏謨之益，徵為長史，遣人船往迎，贈貺甚厚。驎之聞命，便升舟，悉不受所餉，緣道以乞窮乏，比至上明亦盡。一見沖，因陳無用，翛然而退。居陽岐積年，衣食有無常與村人共。值己匱乏，村人亦如之。甚厚，為鄉閭所安。", "남양(南陽)의 유린지(劉驎之)는 고상하고 솔직하며 사서와 전기에 밝았는데 양기(陽岐)에 은거하였다. 그때 부견(符堅)이 장강에 임박해 있어, 형주자사(荊州刺史) 환충(桓沖)이 큰 계책의 도움을 다하고자 그를 장사(長史)로 불러 사람과 배를 보내 맞이하게 하고 선물을 매우 후하게 주었다. 유린지는 명을 듣자 곧 배에 올랐으나 보내온 선물은 모두 받지 않고 길을 따라가며 궁핍한 이들에게 나누어 주어, 상명(上明)에 이르렀을 때는 다 떨어졌다. 환충을 한 번 보고는 자신은 쓸모없다고 아뢰고 유유히 물러났다. 양기에 여러 해 살면서 입을 것과 먹을 것의 있고 없음을 늘 마을 사람들과 함께 나누었고, 자기가 궁핍할 때면 마을 사람들도 그와 같이 하였다. 매우 후덕하여 마을 사람들이 그를 편안히 여겼다.", ["은둔", "베풂", "거절"]], ["棲逸", 9, "南陽翟道淵與汝南周子南少相友，共隱于尋陽。庾太尉說周以當世之務，周遂仕，翟秉志彌固。其後周詣翟，翟不與語。", "남양(南陽)의 적도연(翟道淵)과 여남(汝南)의 주자남(周子南)은 어려서부터 서로 벗하여 함께 심양(尋陽)에 은거하였다. 유태위(庾太尉, 유량)가 주자남에게 당세의 일을 권하니 주자남이 마침내 벼슬에 나아갔고, 적도연은 뜻을 지킴이 더욱 굳었다. 그 뒤 주자남이 적도연을 찾아갔으나 적도연은 그와 말을 섞지 않았다.", ["은둔", "절교", "우정"]], ["棲逸", 10, "孟萬年及弟少孤，居武昌陽新縣。萬年遊宦，有盛名當世，少孤未嘗出，京邑人士思欲見之，乃遣信報少孤，云「兄病篤」。狼狽至都。時賢見之者，莫不嗟重，因相謂曰：「少孤如此，萬年可死。」", "맹만년(孟萬年)과 아우 소고(少孤)는 무창(武昌) 양신현(陽新縣)에 살았다. 맹만년은 벼슬길을 돌며 당세에 큰 명성이 있었으나, 소고는 일찍이 세상에 나온 적이 없었다. 경읍(京邑)의 인사들이 그를 보고 싶어 하여 이에 소고에게 기별을 보내 \"형이 병이 위독하다\"고 알렸다. 소고가 황급히 도성에 이르렀다. 그때 어진 이들 가운데 그를 본 자들이 탄복하고 중히 여기지 않는 이가 없어, 이에 서로 일러 말하기를 \"소고가 이러하니 만년은 죽어도 좋겠다\"고 하였다.", ["은둔", "비평", "술수"]], ["棲逸", 11, "康僧淵在豫章，去郭數十里，立精舍。旁連嶺，帶長川，芳林列於軒庭，清流激於堂宇。乃閒居研講，希心理味，庾公諸人多往看之。觀其運用吐納，風流轉佳。加已處之怡然，亦有以自得，聲名乃興。後不堪，遂出。", "강승연(康僧淵)이 예장(豫章)에 있을 때 성곽에서 수십 리 떨어진 곳에 정사(精舍)를 세웠다. 곁으로는 산봉우리가 이어지고 긴 냇물이 둘러 있으며, 향기로운 숲이 처마와 뜰에 늘어서고 맑은 물이 당우(堂宇)에 부딪쳐 흘렀다. 이에 한가로이 머물며 강론을 닦고 이치의 맛(理味)에 마음을 두니, 유공(庾公, 유량)을 비롯한 여러 사람이 자주 그를 보러 갔다. 그가 학문을 펼치고 토론하는 것을 보니 풍류가 점점 아름다워졌다. 게다가 그 자리에 처함이 태연하여 또한 스스로 터득한 바가 있으니, 명성이 이에 일어났다. 뒤에 견디지 못하여 마침내 그곳을 떠났다.", ["은둔", "청담", "자연과산수"]], ["棲逸", 12, "戴安道既厲操東山，而其兄欲建式遏之功。\n謝太傅曰：「卿兄弟志業，何其太殊？」戴曰：「下官『不堪其憂』，家弟『不改其樂』。」", "대안도(戴安道, 대규)는 이미 동산(東山)에서 지조를 닦고 있었으나 그 형은 적을 막아 지키는 공을 세우고자 하였다. 사태부(謝太傅, 사안)가 말하기를 \"그대 형제의 뜻과 사업이 어찌 그리 크게 다른가?\"라고 하였다. 대안도가 답하기를 \"하관(下官)은 '그 근심을 견디지 못하고', 제 아우는 '그 즐거움을 바꾸지 않습니다'\"라고 하였다.", ["은둔", "학문", "비평"]], ["棲逸", 13, "許玄度隱在永興南幽穴中，每致四方諸侯之遺。或謂許曰：「嘗聞箕山人，似不爾耳！」許曰：「筐篚苞苴，故當輕於天下之寶耳！」", "허현도(許玄度, 허순)가 영흥(永興) 남쪽의 그윽한 동굴에 은거하면서 늘 사방 제후들의 선물을 받았다. 어떤 이가 허순에게 말하기를 \"일찍이 들으니 기산(箕山)의 은자는 이렇지 않았다고 합니다\"라고 하였다. 허순이 말하기를 \"광주리에 담은 선물이야 본디 천하의 보배보다는 가벼운 것이지요!\"라고 하였다.", ["은둔", "기지", "거절"]], ["棲逸", 14, "范宣未嘗入公門。韓康伯與同載，遂誘俱入郡。范便於車後趨下。", "범선(范宣)은 일찍이 관청 문에 들어간 적이 없었다. 한강백(韓康伯)이 그와 함께 수레를 타고 마침내 그를 꾀어 함께 군(郡)으로 들어가려 하였다. 범선은 곧 수레 뒤로 종종걸음으로 내려가 버렸다.", ["은둔", "거절"]], ["棲逸", 15, "郗超每聞欲高尚隱退者，輒為辦百萬資，并為造立居宇。在剡為戴公起宅，甚精整。戴始往舊居，與所親書曰：「近至剡，如官舍。」郗為傅約亦辦百萬資，傅隱事差互，故不果遺。", "치초(郗超)는 고상하게 은퇴하려는 자가 있다는 말을 들을 때마다 번번이 백만의 자금을 마련해 주고 아울러 거처할 집까지 지어 주었다. 섬(剡)에서 대공(戴公, 대규)을 위해 집을 지어 주었는데 매우 정교하고 단정하였다. 대공이 처음 옛 거처에 갔다가 친한 이에게 편지를 보내 말하기를 \"요사이 섬에 이르니 관사(官舍)와도 같구나\"라고 하였다. 치초가 부약(傅約)을 위해서도 백만의 자금을 마련했으나, 부약의 은거 일이 어긋났으므로 결국 보내지 못하였다.", ["베풂", "은둔"]], ["棲逸", 16, "許掾好遊山水，而體便登陟。時人云：「許非徒有勝情，實有濟勝之具。」", "허연(許掾, 허순)은 산수에서 노니는 것을 좋아하였고 몸이 산을 오르내리기에 알맞았다. 당시 사람들이 말하기를 \"허순은 그저 빼어난 정취만 있는 것이 아니라 실로 명승을 누빌 만한 몸까지 갖추었다\"고 하였다.", ["자연과산수", "풍류", "비평"]], ["棲逸", 17, "郗尚書與謝居士善。常稱：「謝慶緒識見雖不絕人，可以累心處都盡。」", "치상서(郗尚書)는 사거사(謝居士)와 사이가 좋았다. 늘 칭찬하기를 \"사경서(謝慶緒)는 식견이 비록 남보다 뛰어나지는 않으나, 마음을 얽매는 것들은 다 끊어 버린 사람이다\"라고 하였다.", ["은둔", "비평"]], ["賢媛", 1, "陳嬰者，東陽人。少脩德行，箸稱鄉黨。秦末大亂，東陽人欲奉嬰為主，母曰：「不可！自我為汝家婦，少見貧賤，一旦富貴，不祥！不如以兵屬人：事成，少受其利；不成，禍有所歸。」", "진영(陳嬰)은 동양(東陽) 사람이다. 젊어서 덕행을 닦아 향당에 이름이 드러났다. 진(秦)나라 말 큰 난리에 동양 사람들이 진영을 받들어 우두머리로 삼으려 하자, 어머니가 말하기를 \"안 된다! 내가 너희 집안의 며느리가 된 이래 줄곧 빈천하게 지냈는데, 하루아침에 부귀하게 되는 것은 상서롭지 못하다! 차라리 군사를 남에게 맡기는 것만 못하다. 일이 이루어지면 조금이나마 그 이익을 받을 것이고, 이루어지지 못해도 화가 돌아갈 데가 있을 것이다\"라고 하였다.", ["여인", "지혜", "겸손"]], ["賢媛", 2, "漢元帝宮人既多，乃令畫工圖之，欲有呼者，輒披圖召之。其中常者，皆行貨賂。王明君姿容甚麗，志不苟求，工遂毀為其狀。後匈奴來和，求美女於漢帝，帝以明君充行。既召見而惜之。但名字已去，不欲中改，於是遂行。", "한(漢)나라 원제(元帝)는 궁인이 워낙 많아 화공에게 그들을 그리게 하고, 부르고자 할 때면 그림을 펼쳐 불렀다. 그 가운데 평범한 자들은 모두 뇌물을 바쳤다. 왕명군(王明君)은 자태와 용모가 매우 아름다웠으나 구차하게 구하려 하지 않으니, 화공이 마침내 그 모습을 추하게 그렸다. 뒤에 흉노가 화친을 청하며 한나라 황제에게 미녀를 구하자, 황제가 명군을 보내기로 하였다. 불러 보고서야 아까워하였으나, 이미 이름이 정해진 뒤라 도중에 바꾸고 싶지 않아 마침내 보냈다.", ["여인", "술수", "용모"]], ["賢媛", 3, "漢成帝幸趙飛燕，飛燕讒班婕妤祝詛，於是考問。辭曰：「妾聞死生有命，富貴在天。脩善尚不蒙福，為邪欲以何望？若鬼神有知，不受邪佞之訴；若其無知，訴之何益？故不為也。」", "한(漢)나라 성제(成帝)가 조비연(趙飛燕)을 총애하였는데, 조비연이 반첩여(班婕妤)가 저주를 하였다고 참소하여 이에 신문하게 되었다. 반첩여가 진술하기를 \"제가 듣건대 죽고 사는 것은 명(命)에 달려 있고 부귀는 하늘에 달려 있다 하였습니다. 선을 닦아도 오히려 복을 받지 못하거늘, 사악한 짓을 하여 무엇을 바라겠습니까? 만약 귀신이 안다면 사악하고 아첨하는 호소를 받아들이지 않을 것이요, 만약 알지 못한다면 호소한들 무슨 이로움이 있겠습니까? 그러므로 하지 않았습니다\"라고 하였다.", ["여인", "질투", "지혜"]], ["賢媛", 4, "魏武帝崩，文帝悉取武帝宮人自侍。及帝病困，卞后出看疾。太后入戶，見直侍並是昔日所愛幸者。太后問：「何時來邪？」云：「正伏魄時過。」因不復前而歎曰：「狗鼠不食汝餘，死故應爾！」至山陵，亦竟不臨。", "위무제(魏武帝)가 죽자 문제(文帝)가 무제의 궁인을 모두 데려다 자기 시중을 들게 하였다. 문제가 병이 위독해지자 변후(卞后)가 나와 병을 살폈다. 태후가 방문에 들어서니 곁에서 시중드는 자들이 모두 옛날 무제가 아끼고 총애하던 자들이었다. 태후가 묻기를 \"언제 왔느냐?\"고 하니, \"막 혼백을 부르실 무렵에 왔습니다\"라고 하였다. 이에 태후는 더 나아가지 않고 탄식하며 말하기를 \"개나 쥐도 네가 남긴 것은 먹지 않을 것이니, 죽어 마땅하다!\"라고 하였다. 능에 모실 때에도 끝내 곡하러 가지 않았다.", ["여인", "분노", "죽음"]], ["賢媛", 5, "趙母嫁女，女臨去，敕之曰：「慎勿為好！」女曰：「不為好，可為惡邪？」母曰：「好尚不可為，其況惡乎？」", "조씨 어머니(趙母)가 딸을 시집보내며, 딸이 떠나려 할 때 경계하여 말하기를 \"부디 좋은 일을 하지 말라!\"고 하였다. 딸이 말하기를 \"좋은 일을 하지 말라 하시면 나쁜 일을 하라는 것입니까?\"라고 하니, 어머니가 말하기를 \"좋은 일도 해서는 안 되거늘 하물며 나쁜 일이겠느냐?\"라고 하였다.", ["여인", "지혜", "간언"]], ["賢媛", 6, "許允婦是阮衛尉女，德如妹，奇醜。交禮竟，允無復入理，家人深以為憂。會允有客至，婦令婢視之，還答曰：「是桓郎。」桓郎者，桓範也。婦云：「無憂，桓必勸入。」桓果語許云：「阮家既嫁醜女與卿，故當有意，卿宜察之。」許便回入內。既見婦，即欲出。婦料其此出，無復入理，便捉裾停之。」許因謂曰：「婦有四德，卿有其幾？」婦曰：「新婦所乏唯容爾。然士有百行，君有幾？」許云：「皆備。」婦曰：「夫百行以德為首，君好色不好德，何謂皆備？」允有慚色，遂相敬重。", "허윤(許允)의 아내는 완위위(阮衛尉)의 딸이요 덕여(德如)의 누이로, 몹시 못생겼다. 혼례를 마치고 나서 허윤은 다시 들어갈 마음이 없으니 집안사람들이 깊이 근심하였다. 마침 허윤에게 손님이 오자 아내가 시비에게 살펴보게 하니, 돌아와 답하기를 \"환랑(桓郎)입니다\"라고 하였다. 환랑이란 환범(桓範)이다. 아내가 말하기를 \"근심할 것 없다. 환범이 반드시 들어가라 권할 것이다\"라고 하였다. 환범이 과연 허윤에게 말하기를 \"완씨 집안이 못생긴 딸을 그대에게 시집보낸 데는 까닭이 있을 것이니, 그대는 마땅히 잘 살펴보라\"고 하였다. 허윤이 곧 돌아 안으로 들어갔다. 아내를 보고는 이내 나가려 하니, 아내는 그가 이번에 나가면 다시는 들어올 리 없음을 헤아려 곧 옷자락을 붙잡아 멈추게 하였다. 허윤이 이에 말하기를 \"부인에게는 네 가지 덕이 있다는데, 그대는 그 가운데 몇 가지를 갖추었소?\"라고 하였다. 아내가 말하기를 \"제게 부족한 것은 오직 용모뿐입니다. 그러나 선비에게는 백 가지 행실이 있다는데, 당신은 몇 가지나 갖추셨습니까?\"라고 하였다. 허윤이 \"다 갖추었소\"라고 하자, 아내가 말하기를 \"무릇 백 가지 행실은 덕을 으뜸으로 삼는데, 당신은 색을 좋아하고 덕을 좋아하지 않으니 어찌 다 갖추었다 하겠습니까?\"라고 하였다. 허윤이 부끄러운 기색을 보이고는 마침내 서로 공경하고 중히 여기게 되었다.", ["부부", "용모", "지혜", "여인"]], ["賢媛", 7, "許允為吏部郎，多用其鄉里，魏明帝遣虎賁收之。其婦出誡允曰：「明主可以理奪，難以情求。」既至，帝覈問之。允對曰：「『舉爾所知。』臣之鄉人，臣所知也。陛下檢校為稱職與不？若不稱職，臣受其罪。」既檢校，皆官得其人，於是乃釋。允衣服敗壞，詔賜新衣。初，允被收，舉家號哭。阮新婦自若云：「勿憂，尋還。」作粟粥待，頃之允至。", "허윤(許允)이 이부랑(吏部郎)이 되어 자기 고향 사람을 많이 등용하니, 위명제(魏明帝)가 호분(虎賁)을 보내 그를 잡아오게 하였다. 그 아내가 나와 허윤을 경계하여 말하기를 \"밝은 임금은 이치로 설득할 수는 있어도 정으로 구하기는 어렵습니다\"라고 하였다. 허윤이 이르자 황제가 캐물었다. 허윤이 대답하기를 \"'네가 아는 사람을 천거하라' 하였습니다. 신의 고향 사람은 신이 아는 자들입니다. 폐하께서 직책에 걸맞은지 아닌지를 살펴 주십시오. 만약 직책에 걸맞지 않다면 신이 그 죄를 받겠습니다\"라고 하였다. 살펴보니 모두 관직에 마땅한 사람을 얻었으므로 이에 풀어 주었다. 허윤의 옷이 해어졌으므로 조서를 내려 새 옷을 하사하였다. 처음에 허윤이 잡혀갈 때 온 집안이 울부짖었으나, 완씨 며느리는 태연히 말하기를 \"근심하지 마십시오. 곧 돌아올 것입니다\"라고 하였다. 좁쌀죽을 쑤어 기다리니 얼마 안 되어 허윤이 돌아왔다.", ["여인", "지혜", "기지"]], ["賢媛", 8, "許允為晉景王所誅，門生走入告其婦。婦正在機中，神色不變，曰：「蚤知爾耳！」門人欲藏其兒，婦曰：「無豫諸兒事。」後徙居墓所，景王遣鍾會看之，若才流及父，當收。兒以咨母。母曰：「汝等雖佳，才具不多，率胸懷與語，便無所憂。不須極哀，會止便止。又可少問朝事。」兒從之。會反以狀對，卒免。", "허윤(許允)이 진(晉) 경왕(景王)에게 죽임을 당하자, 문하생이 달려 들어가 그 아내에게 알렸다. 아내는 마침 베틀에 앉아 있었는데, 안색을 바꾸지 않고 말하였다. \"진작에 이리 될 줄 알았소.\" 문인들이 그 아이들을 숨기려 하자 아내가 말하였다. \"아이들과는 상관없는 일이오.\" 뒤에 묘소가 있는 곳으로 옮겨 살게 되었는데, 경왕이 종회(鍾會)를 보내 살펴보게 하면서, 만약 재능이 아비에 미치면 잡아들이라 하였다. 아이들이 어머니에게 여쭈니 어머니가 말하였다. \"너희가 비록 뛰어나기는 하나 재능이 많지 않으니, 마음속에 있는 대로 솔직히 말하면 걱정할 것이 없다. 지나치게 슬퍼할 것 없이 종회가 그치면 너희도 그쳐라. 또 조정 일을 조금 물어도 좋다.\" 아이들이 그대로 따랐다. 종회가 돌아가 그 상황을 보고하니, 끝내 화를 면하였다.", ["여인", "죽음", "지혜", "담대한죽음"]], ["賢媛", 9, "王公淵娶諸葛誕女。入室，言語始交，王謂婦曰：「新婦神色卑下，殊不似公休！」婦曰：「大丈夫不能仿佛彥雲，而令婦人比蹤英傑！」", "왕공연(王公淵)이 제갈탄(諸葛誕)의 딸을 아내로 맞았다. 신방에 들어 비로소 말을 나누는데, 왕(王)이 아내에게 말하였다. \"신부의 신색(神色)이 비루하니, 도무지 공휴(公休)를 닮지 않았구려.\" 아내가 말하였다. \"대장부가 언운(彥雲)을 비슷이라도 따르지 못하면서, 부인더러 영걸의 발자취를 따르라 하시는군요.\"", ["부부", "기지", "용모", "제갈씨"]], ["賢媛", 10, "王經少貧苦，仕至二千石，母語之曰：「汝本寒家子，仕至二千石，此可以止乎！」經不能用。為尚書，助魏，不忠於晉，被收。涕泣辭母曰：「不從母敕，以至今日！」母都無慽容，語之曰：「為子則孝，為臣則忠。有孝有忠，何負吾邪？」", "왕경(王經)은 젊어서 가난하게 고생하다가, 벼슬이 이천석(二千石)에 이르렀다. 어머니가 그에게 말하였다. \"너는 본래 한미한 집안의 자식인데 벼슬이 이천석에 이르렀으니, 이쯤에서 그만두어도 좋겠다.\" 그러나 왕경은 따르지 못하였다. 상서(尙書)가 되어 위(魏)를 돕고 진(晉)에 충성하지 않다가 잡혀갔다. 눈물을 흘리며 어머니께 작별하면서 말하였다. \"어머니의 말씀을 따르지 않아 오늘에 이르렀습니다.\" 어머니는 조금도 슬픈 기색이 없이 그에게 말하였다. \"자식이 되어서는 효도하고, 신하가 되어서는 충성하는 법이다. 효도도 있고 충성도 있으니, 무엇이 나를 저버린 것이겠느냐?\"", ["충직", "효", "간언"]], ["賢媛", 11, "山公與嵇、阮一面，契若金蘭。山妻韓氏，覺公與二人異於常交，問公。公曰：「我當年可以為友者，唯此二生耳！」妻曰：「負羈之妻亦親觀狐、趙，意欲窺之，可乎？」他日，二人來，妻勸公止之宿，具酒肉。夜穿墉以視之，達旦忘反。公入曰：「二人何如？」妻曰：「君才致殊不如，正當以識度相友耳。」公曰：「伊輩亦常以我度為勝。」", "산공(山公, 산도)이 혜강(嵇康)·완적(阮籍)과 한 번 만나고는 사귐이 금란(金蘭)처럼 두터웠다. 산공의 아내 한씨(韓氏)는 산공이 두 사람과 사귀는 것이 보통의 사귐과 다름을 알아채고 산공에게 물었다. 산공이 말하였다. \"내 평생에 벗으로 삼을 만한 사람은 오직 이 두 사람뿐이오.\" 아내가 말하였다. \"부기(負羈)의 아내도 호언(狐偃)과 조최(趙衰)를 친히 살펴보았다 하니, 저도 그들을 엿보고 싶은데 되겠습니까?\" 다른 날 두 사람이 오자, 아내는 산공에게 권하여 그들을 묵어가게 하고 술과 고기를 갖추었다. 밤에 담장을 뚫어 그들을 엿보다가 날이 새도록 돌아갈 줄 몰랐다. 산공이 들어와 말하였다. \"두 사람이 어떻소?\" 아내가 말하였다. \"당신의 재주와 운치는 도무지 그들만 못하니, 다만 식견과 도량으로 벗을 삼아야 할 것입니다.\" 산공이 말하였다. \"저들도 늘 내 도량이 낫다고 여긴다오.\"", ["우정", "여인", "비평"]], ["賢媛", 12, "王渾妻鍾氏生女令淑，武子為妹求簡美對而未得。有兵家子，有儁才，欲以妹妻之，乃白母曰：「誠是才者，其地可遺，然要令我見。」武子乃令兵兒與羣小雜處，使母帷中察之。既而，母謂武子曰：「如此衣形者，是汝所擬者，非邪？」武子曰：「是也。」母曰：「此才足以拔萃，然地寒，不有長年，不得申其才用。觀其形骨，必不壽，不可與婚。」武子從之。兵兒數年果亡。", "왕혼(王渾)의 아내 종씨(鍾氏)가 아름답고 정숙한 딸을 낳았는데, 무자(武子, 왕제)가 누이를 위해 어질고 잘난 배필을 구하였으나 얻지 못하였다. 어떤 병가(兵家)의 아들이 빼어난 재주가 있어, 누이를 그에게 시집보내고자 어머니께 아뢰었다. \"참으로 재주 있는 자라면 그 출신은 괜찮습니다만, 다만 제가 그를 보아야겠습니다.\" 무자가 그 병가의 아들을 여러 천한 무리들과 뒤섞여 있게 하고, 어머니로 하여금 휘장 안에서 살펴보게 하였다. 이윽고 어머니가 무자에게 말하였다. \"이러이러한 옷차림과 모습을 한 자가 네가 점찍은 사람이 아니냐?\" 무자가 말하였다. \"그렇습니다.\" 어머니가 말하였다. \"그 재주는 무리에서 뛰어날 만하나 출신이 한미하고, 또 오래 살 사람이 아니니 그 재능을 펼치지 못할 것이다. 그 형체와 골상을 보니 반드시 장수하지 못할 것이라 혼인시킬 수 없다.\" 무자가 그 말을 따랐다. 병가의 아들은 몇 년 뒤 과연 죽었다.", ["여인", "예언", "비평"]], ["賢媛", 13, "賈充前婦，是李豐女。豐被誅，離婚徙邊。後遇赦得還，充先已取郭配女。武帝特聽置左右夫人。李氏別住外，不肯還充舍。郭氏語充：「欲就省李。」充曰：「彼剛介有才氣，卿往不如不去。」郭氏於是盛威儀，多將侍婢。既至，入戶，李氏起迎，郭不覺腳自屈，因跪再拜。既反，語充，充曰：「語卿道何物？」", "가충(賈充)의 전처는 이풍(李豐)의 딸이다. 이풍이 주살되자 이혼하고 변방으로 유배되었다. 뒤에 사면을 만나 돌아올 수 있게 되었는데, 가충은 이미 곽배(郭配)의 딸을 아내로 맞은 뒤였다. 무제(武帝)가 특별히 좌·우 두 부인을 두는 것을 허락하였다. 이씨는 따로 바깥에 거처하며 가충의 집으로 돌아오려 하지 않았다. 곽씨가 가충에게 말하였다. \"이씨에게 가서 문안하고자 합니다.\" 가충이 말하였다. \"그녀는 강직하고 재기(才氣)가 있으니, 당신이 가는 것이 가지 않느니만 못하오.\" 곽씨가 이에 위의(威儀)를 성대히 갖추고 시비들을 많이 거느리고 갔다. 이르러 문에 들어서니 이씨가 일어나 맞이하는데, 곽씨는 자기도 모르게 다리가 절로 굽혀져 무릎을 꿇고 두 번 절하였다. 돌아와 가충에게 말하니, 가충이 말하였다. \"당신에게 무어라 말하더이까?\"", ["여인", "부부", "도량"]], ["賢媛", 14, "賈充妻李氏作女訓，行於世。李氏女，齊獻王妃，郭氏女，惠帝后。充卒，李、郭女各欲令其母合葬，經年不決。賈后廢，李氏乃祔，葬遂定。", "가충(賈充)의 아내 이씨(李氏)가 『여훈(女訓)』을 지었는데 세상에 널리 퍼졌다. 이씨의 딸은 제헌왕(齊獻王)의 비(妃)요, 곽씨의 딸은 혜제(惠帝)의 황후이다. 가충이 죽자 이씨와 곽씨의 딸이 각기 자기 어머니를 합장하고자 하여 여러 해가 지나도록 결말이 나지 않았다. 뒤에 가후(賈后)가 폐위되자 이씨를 합장하니 장례가 마침내 정해졌다.", ["여인", "죽음", "학문"]], ["賢媛", 15, "王汝南少無婚，自求郝普女。司空以其癡，會無婚處，任其意，便許之。既婚，果有令姿淑德。生東海，遂為王氏母儀。或問汝南何以知之？曰：「嘗見井上取水，舉動容止不失常，未嘗忤觀。以此知之。」", "왕여남(王汝南)은 젊어서 혼처가 없어 스스로 학보(郝普)의 딸에게 구혼하였다. 사공(司空)은 그가 어리석은 데다 마침 혼처도 없던 터라 그 뜻대로 하게 두어 곧 허락하였다. 혼인하고 보니 과연 아름다운 자태와 정숙한 덕을 갖추었다. 동해(東海, 왕승)를 낳아 마침내 왕씨 집안의 모범이 되었다. 누군가 왕여남에게 어떻게 그것을 알았느냐 물으니, 그가 말하였다. \"일찍이 우물가에서 물을 긷는 것을 보았는데, 거동과 몸가짐이 평상시 모습을 잃지 않았고 한 번도 거슬리게 보이지 않았소. 이로써 알았소.\"", ["부부", "여인", "지혜"]], ["賢媛", 16, "王司徒婦，鍾氏女，太傅曾孫，亦有俊才女德。鍾、郝為娣姒，雅相親重。鍾不以貴陵郝，郝亦不以賤下鍾。東海家內，則郝夫人之法。京陵家內，範鍾夫人之禮。", "왕사도(王司徒)의 아내는 종씨(鍾氏)의 딸로, 태부(太傅)의 증손녀이며 또한 빼어난 재주와 여자의 덕을 갖추었다. 종씨와 학씨(郝氏)는 동서 사이였는데, 서로 매우 친애하고 존중하였다. 종씨는 귀하다 하여 학씨를 업신여기지 않았고, 학씨도 천하다 하여 종씨에게 자신을 낮추지 않았다. 동해(東海)의 집안에서는 학부인의 법도를 본받았고, 경릉(京陵)의 집안에서는 종부인의 예법을 본받았다.", ["여인", "겸손", "도량"]], ["賢媛", 17, "李平陽，秦州子，中夏名士。于時以比王夷甫。孫秀初欲立威權，咸云：「樂令民望不可殺，減李重者又不足殺。」遂逼重自裁。初，重在家，有人走從門入，出髻中疏示重。重看之色動，入內示其女，女直叫「絕」。了其意，出則自裁。此女甚高明，重每咨焉。", "이평양(李平陽)은 진주(秦州)의 아들로 중원의 명사였다. 당시 사람들이 왕이보(王夷甫, 왕연)에 견주었다. 손수(孫秀)가 처음 권위를 세우고자 할 때, 모두가 말하였다. \"악령(樂令, 악광)은 백성의 신망이 있어 죽일 수 없고, 이중(李重)보다 못한 자는 또 죽일 만하지 못하다.\" 그리하여 이중을 핍박하여 자결하게 하였다. 처음 이중이 집에 있을 때, 어떤 사람이 문으로 달려 들어와 상투 속에서 글을 꺼내 이중에게 보였다. 이중이 그것을 보고 안색이 변하더니, 안으로 들어가 그 딸에게 보이니 딸이 곧장 \"끝났다\"고 외쳤다. 그 뜻을 알아채고는 나가서 자결하였다. 이 딸은 매우 고명하여 이중이 늘 그녀에게 의논하였다.", ["죽음", "여인", "지혜"]], ["賢媛", 18, "周浚作安東時，行獵，值暴雨，過汝南李氏。李氏富足，而男子不在。有女名絡秀，聞外有貴人，與一婢於內宰豬羊，作數十人飲食，事事精辦，不聞有人聲。密覘之，獨見一女子，狀貌非常，浚因求為妾。父兄不許。絡秀曰：「門戶殄瘁，何惜一女？若連姻貴族，將來或大益。」父兄從之。遂生伯仁兄弟。絡秀語伯仁等：「我所以屈節為汝家作妾，門戶計耳！汝若不與吾家作親親者，吾亦不惜餘年。」伯仁等悉從命。由此李氏在世，得方幅齒遇。", "주준(周浚)이 안동(安東)으로 있을 때, 사냥을 나갔다가 폭우를 만나 여남(汝南)의 이씨(李氏) 집에 들렀다. 이씨는 부유하였으나 남자가 집에 없었다. 낙수(絡秀)라는 딸이 있었는데, 바깥에 귀인이 왔다는 말을 듣고 한 여종과 함께 안에서 돼지와 양을 잡아 수십 명의 음식을 마련하니, 일마다 정교하게 갖추어졌으나 사람 소리는 들리지 않았다. 가만히 엿보니 한 여자만 보이는데 모습이 비범하였다. 주준이 이에 첩으로 삼기를 청하였다. 아버지와 오라비가 허락하지 않았다. 낙수가 말하였다. \"가문이 쇠퇴하였는데 어찌 딸 하나를 아끼겠습니까? 만약 귀족과 혼인을 맺으면 장래에 혹 큰 이익이 있을 것입니다.\" 아버지와 오라비가 그 말을 따랐다. 마침내 백인(伯仁, 주의) 형제를 낳았다. 낙수가 백인 등에게 말하였다. \"내가 절개를 굽혀 너희 집의 첩이 된 까닭은 가문을 위한 계책일 뿐이다. 너희가 만약 우리 집안을 친척으로 대우하지 않는다면, 나도 남은 목숨을 아끼지 않겠다.\" 백인 등이 모두 명을 따랐다. 이로 말미암아 이씨 집안은 세상에서 반듯한 대우를 받게 되었다.", ["여인", "지혜", "부부"]], ["賢媛", 19, "陶公少有大志，家酷貧，與母湛氏同居。同郡范逵素知名，舉孝廉，投侃宿。于時冰雪積日，侃室如懸磬，而逵馬僕甚多。侃母湛氏語侃曰：「汝但出外留客，吾自為計。」湛頭髮委地，下為二髲，賣得數斛米，斫諸屋柱，悉割半為薪，剉諸薦以為馬草。日夕，遂設精食，從者皆無所乏。逵既歎其才辯，又深愧其厚意。明旦去，侃追送不已，且百里許。逵曰：「路已遠，君宜還。」侃猶不返，逵曰：「卿可去矣！至洛陽，當相為美談。」侃迺返。逵及洛，遂稱之於羊晫、顧榮諸人，大獲美譽。", "도공(陶公, 도간)은 젊어서 큰 뜻을 품었으나 집안이 몹시 가난하여 어머니 담씨(湛氏)와 함께 살았다. 같은 고을의 범규(范逵)는 평소 이름이 알려진 이로, 효렴(孝廉)에 천거되어 도간의 집에 들러 묵었다. 그때는 눈과 얼음이 며칠째 쌓여 있었고, 도간의 집은 텅 비어 매단 경쇠처럼 가난한데 범규의 말과 종복은 매우 많았다. 도간의 어머니 담씨가 도간에게 말하였다. \"너는 그저 나가서 손님을 머무르게 하여라. 내가 알아서 마련하마.\" 담씨는 땅에 끌리는 머리채를 잘라 두 다래로 만들어 팔아 쌀 몇 섬을 얻고, 집의 기둥들을 깎아 모두 반씩 잘라 땔감으로 삼았으며, 깔개들을 썰어 말꼴로 삼았다. 날이 저물자 마침내 정갈한 음식을 차려 내니 따르는 자들도 모두 부족함이 없었다. 범규는 그 재주와 언변에 감탄하고, 또 그 두터운 마음에 깊이 감격하였다. 이튿날 아침 떠날 때 도간이 따라가 전송하기를 그치지 않아 거의 백 리쯤에 이르렀다. 범규가 말하였다. \"길이 이미 멀어졌으니 그대는 돌아가는 것이 좋겠소.\" 도간이 그래도 돌아가지 않으니, 범규가 말하였다. \"그대는 이제 돌아가도 좋소. 낙양(洛陽)에 이르면 그대를 위해 좋은 말을 해주겠소.\" 도간이 그제야 돌아갔다. 범규는 낙양에 이르러 마침내 양탁(羊晫)·고영(顧榮) 등 여러 사람에게 그를 칭찬하니, 도간이 크게 아름다운 명성을 얻었다.", ["효", "청빈", "베풂", "여인"]], ["賢媛", 20, "陶公少時，作魚梁吏，嘗以坩餉母。母封付使，反書責侃曰：「汝為吏，以官物見餉，非唯不益，乃增吾憂也。」", "도공(陶公, 도간)이 젊을 때 어량(魚梁)의 관리가 되어, 일찍이 절인 생선 한 단지를 어머니께 보냈다. 어머니는 그것을 봉하여 심부름꾼에게 돌려보내며, 편지로 도간을 꾸짖어 말하였다. \"네가 관리가 되어 관청의 물건을 내게 보내니, 이는 도움이 되지 않을 뿐 아니라 도리어 내 근심을 더할 뿐이다.\"", ["청빈", "효", "간언"]], ["賢媛", 21, "桓宣武平蜀，以李勢妹為妾，甚有寵，常著齋後。主始不知，既聞，與數十婢拔白刃襲之。正值李梳頭，髮委藉地，膚色玉曜，不為動容。徐曰：「國破家亡，無心至此。今日若能見殺，乃是本懷。」主慚而退。", "환선무(桓宣武, 환온)가 촉(蜀)을 평정하고 이세(李勢)의 누이를 첩으로 삼았는데, 매우 총애하여 늘 서재 뒤에 두었다. 부인(공주)이 처음에는 몰랐으나, 듣고 나서 수십 명의 여종과 함께 흰 칼날을 빼들고 그녀를 습격하였다. 마침 이씨가 머리를 빗고 있었는데, 머리채가 땅에 드리워지고 살결이 옥처럼 빛났으며, 조금도 안색을 바꾸지 않았다. 천천히 말하였다. \"나라가 망하고 집안이 무너져 마음에 없이 여기까지 이르렀습니다. 오늘 만약 죽임을 당할 수 있다면 그것이 곧 본래의 바람입니다.\" 부인은 부끄러워하며 물러갔다.", ["담대한죽음", "용기", "부부", "여인"]], ["賢媛", 22, "庾玉臺，希之弟也。希誅，將戮玉臺。玉臺子婦，宣武弟桓豁女也。\n徒跣求進，閽禁不內。女厲聲曰：「是何小人？我伯父門，不聽我前！」因突入，號泣請曰：「庾玉臺常因人腳短三寸，當復能作賊不？」宣武笑曰：「壻故自急。」遂原玉臺一門。", "유옥대(庾玉臺)는 유희(庾希)의 아우이다. 유희가 주살되자 유옥대도 죽이려 하였다. 유옥대의 며느리는 선무(宣武, 환온)의 아우 환활(桓豁)의 딸이었다. 맨발로 들어가 뵙기를 청하였으나 문지기가 막아 들이지 않았다. 며느리가 소리 높여 말하였다. \"이게 무슨 소인배냐? 내 백부의 문인데 나를 들이지 않다니!\" 그러고는 곧장 뛰어들어 통곡하며 청하였다. \"유옥대는 늘 남보다 다리가 세 치나 짧은데 다시 도적질을 할 수 있겠습니까?\" 선무가 웃으며 말하였다. \"사위가 본디 다급한 게로구나.\" 마침내 유옥대 한 집안을 용서하였다.", ["기지", "용기", "도량", "여인"]], ["賢媛", 23, "謝公夫人幃諸婢，使在前作伎，使太傅暫見，便下幃。太傅索更開，夫人云：「恐傷盛德。」", "사공(謝公, 사안)의 부인이 여종들에게 휘장을 치고 앞에서 기예를 펼치게 한 다음, 태부(太傅)로 하여금 잠깐 보게 하고는 곧 휘장을 내렸다. 태부가 다시 열기를 청하니, 부인이 말하였다. \"성덕(盛德)을 해칠까 두렵습니다.\"", ["여인", "질투", "부부"]], ["賢媛", 24, "桓車騎不好箸新衣。浴後，婦故送新衣與。車騎大怒，催使持去。婦更持還，傳語云：「衣不經新，何由而故？」桓公大笑，箸之。", "환거기(桓車騎, 환충)는 새 옷 입기를 좋아하지 않았다. 목욕한 뒤에 부인이 일부러 새 옷을 보내자, 거기가 크게 노하여 빨리 가져가라고 재촉하였다. 부인이 다시 그 옷을 가지고 돌아와 말을 전하였다. \"옷이 새것을 거치지 않으면 어찌 헌것이 되겠습니까?\" 환공이 크게 웃고는 그것을 입었다.", ["부부", "기지", "여인"]], ["賢媛", 25, "王右軍郗夫人謂二弟司空、中郎曰：「王家見二謝，傾筐倒庋；見汝輩來，平平爾。汝可無煩復往。」", "왕우군(王右軍, 왕희지)의 부인 치씨(郗氏)가 두 아우 사공(司空)과 중랑(中郎)에게 말하였다. \"왕씨 집안은 두 사씨(謝氏)를 보면 광주리를 기울이고 시렁을 다 쏟아 대접하더니, 너희가 오면 그저 그러할 뿐이다. 너희는 번거롭게 다시 갈 것 없다.\"", ["여인", "비평", "우정"]], ["賢媛", 26, "王凝之謝夫人既往王氏，大薄凝之。既還謝家，意大不說。太傅慰釋之曰：「王郎，逸少之子，人材亦不惡，汝何以恨迺爾？」荅曰：「一門叔父，則有阿大、中郎。羣從兄弟，則有封、胡、遏、末。不意天壤之中，乃有王郎！」", "왕응지(王凝之)의 아내 사부인(謝夫人)이 왕씨 집안에 시집간 뒤 응지를 몹시 가벼이 여겼다. 친정 사씨 집으로 돌아와서는 마음이 매우 언짢았다. 태부(太傅, 사안)가 위로하여 말하였다. \"왕랑(王郎)은 일소(逸少, 왕희지)의 아들이고 인재로도 나쁘지 않은데, 너는 어찌 그토록 한탄하느냐?\" 대답하였다. \"한 집안의 숙부로는 아대(阿大)와 중랑(中郎)이 있고, 사촌 형제로는 봉(封)·호(胡)·알(遏)·말(末)이 있습니다. 천지간에 왕랑 같은 사람이 있을 줄은 생각지도 못했습니다.\"", ["여인", "비평", "부부"]], ["賢媛", 27, "韓康伯母，隱古几毀壞，卞鞠見几惡，欲易之。答曰：「我若不隱此，汝何以得見古物？」", "한강백(韓康伯)의 어머니가 기대던 낡은 안석이 망가져 있었는데, 변국(卞鞠)이 안석이 나쁜 것을 보고 바꾸어 드리려 하였다. 어머니가 대답하였다. \"내가 만약 이것에 기대지 않는다면, 네가 어찌 옛 물건을 볼 수 있겠느냐?\"", ["여인", "청빈", "겸손"]], ["賢媛", 28, "王江州夫人語謝遏曰：「汝何以都不復進，為是塵務經心，天分有限。」", "왕강주(王江州)의 부인이 사알(謝遏, 사현)에게 말하였다. \"너는 어찌하여 도무지 더 나아가지 못하느냐. 속된 일에 마음을 쓰기 때문이냐, 아니면 타고난 분수가 한정이 있어서냐?\"", ["여인", "비평"]], ["賢媛", 29, "郗嘉賓喪，婦兄弟欲迎妹還，終不肯歸。曰：「生縱不得與郗郎同室，死寧不同穴！」", "치가빈(郗嘉賓, 치초)이 죽자 아내의 형제들이 누이를 맞아 데려가려 하였으나, 끝내 돌아가려 하지 않았다. 누이가 말하였다. \"살아서 비록 치랑(郗郎)과 한 방에서 함께하지 못하더라도, 죽어서야 어찌 한 무덤에 들지 못하겠는가!\"", ["부부", "여인", "죽음"]], ["賢媛", 30, "謝遏絕重其姊，張玄常稱其妹，欲以敵之。有濟尼者，並遊張、謝二家。人問其優劣？答曰：「王夫人神情散朗，故有林下風氣。顧家婦清心玉映，自是閨房之秀。」", "사알(謝遏, 사현)은 자기 누이를 지극히 존중하였고, 장현(張玄)은 늘 자기 누이를 칭찬하여 그에 맞서고자 하였다. 제니(濟尼)라는 비구니가 있어 장씨와 사씨 두 집을 다 드나들었다. 사람들이 그 우열을 물으니 대답하였다. \"왕부인(王夫人, 사도온)은 신정(神情)이 시원하고 밝아 본래 죽림(竹林)의 풍기가 있고, 고씨 집안의 부인(장현의 누이)은 마음이 맑아 옥처럼 빛나니 본디 규방의 빼어난 인물입니다.\"", ["비평", "여인"]], ["賢媛", 31, "王尚書惠嘗看王右軍夫人，問：「眼耳未覺惡不？」答曰：「髮白齒落，屬乎形骸；至於眼耳，關於神明，那可便與人隔？」", "왕상서 혜(王尚書惠)가 일찍이 왕우군(王右軍, 왕희지)의 부인을 찾아뵙고 물었다. \"눈과 귀가 아직 나빠지지 않으셨습니까?\" 부인이 대답하였다. \"머리가 세고 이가 빠지는 것은 형체에 속하는 일이거니와, 눈과 귀로 말하면 신명(神明)에 관계되는 것이니 어찌 쉬이 남과 막히겠는가?\"", ["여인", "기지", "병과늙음"]], ["賢媛", 32, "韓康伯母殷，隨孫繪之之衡陽，於闔廬洲中逢桓南郡。卞鞠是其外孫，時來問訊。謂鞠曰：「我不死，見此豎二世作賊！」在衡陽數年，繪之遇桓景真之難也，殷撫屍哭曰：「汝父昔罷豫章，徵書朝至夕發。汝去郡邑數年，為物不得動，遂及於難，夫復何言？」", "한강백(韓康伯)의 어머니 은씨(殷氏)가 손자 회지(繪之)를 따라 형양(衡陽)으로 가다가 합려주(闔廬洲)에서 환남군(桓南郡, 환현)을 만났다. 변국(卞鞠)은 그 외손이었는데 그때 와서 문안하였다. 은씨가 변국에게 말하였다. \"내가 죽지 않고 이 더벅머리 놈이 이대(二代)에 걸쳐 도적질하는 것을 보는구나.\" 형양에서 몇 해를 지내는 동안 회지가 환경진(桓景眞)의 난을 당하니, 은씨가 시신을 어루만지며 통곡하여 말하였다. \"네 아버지가 옛날 예장(豫章)에서 벼슬을 그만둘 때, 부르는 글이 아침에 이르자 저녁에 떠났다. 너는 군읍을 떠난 지 몇 해가 되도록 사람됨이 움직일 줄을 몰라 마침내 화를 당하고 말았으니, 다시 무슨 말을 하겠느냐?\"", ["여인", "죽음", "예언"]], ["術解", 1, "荀勖善解音聲，時論謂之闇解。遂調律呂，正雅樂。每至正會，殿庭作樂，自調宮商，無不諧韻。阮咸妙賞，時謂神解。每公會作樂，而心謂之不調。既無一言直勖，意忌之，遂出阮為始平太守。後有一田父耕於野，得周時玉尺，便是天下正尺。荀試以校己所治鐘鼓、金石、絲竹，皆覺短一黍，於是伏阮神識。", "순욱(荀勖)은 음악과 소리를 잘 풀이하여 당시 사람들은 그를 두고 어두운 가운데서도 풀이한다고 하였다. 마침내 율려(律呂)를 조율하고 아악(雅樂)을 바로잡았다. 매번 정월 조회 때에 궁정 뜰에서 음악을 연주할 적에 스스로 궁상(宮商)을 조율하면 음운이 맞지 않는 것이 없었다. 완함(阮咸)은 음악을 절묘하게 감상하니 당시에 신묘하게 풀이한다고 하였다. 매번 공식 모임에서 음악을 연주할 때마다 마음속으로 음이 맞지 않다고 여겼으나, 한마디도 순욱에게 직언하지 않으니 순욱이 그를 꺼려 마침내 완함을 내보내어 시평태수(始平太守)로 삼았다. 뒤에 한 농부가 들에서 밭을 갈다가 주(周)나라 때의 옥자[玉尺]를 얻었는데, 곧 천하의 바른 자였다. 순욱이 시험 삼아 자기가 다스린 종과 북, 금석(金石), 사죽(絲竹)을 견주어 보니 모두 기장 한 알만큼 짧음을 깨달았으니, 이에 완함의 신묘한 식견에 탄복하였다.", ["음악", "재능", "질투"]], ["術解", 2, "荀勖嘗在晉武帝坐上食筍進飯，謂在坐人曰：「此是勞薪炊也。」坐者未之信，密遣問之，實用故車腳。", "순욱(荀勖)이 일찍이 진무제(晉武帝)의 자리에서 죽순과 밥을 먹다가 자리에 앉은 사람들에게 말하였다. \"이것은 헌 수레로 불을 때어 지은 것입니다.\" 자리에 있던 이들이 믿지 않고 몰래 사람을 보내 물어보니, 실로 낡은 수레의 바퀴굴대를 썼던 것이었다.", ["지혜", "재능"]], ["術解", 3, "人有相羊祜父墓，後應出受命君。祜惡其言，遂掘斷墓後，以壞其勢。相者立視之曰：「猶應出折臂三公。」俄而祜墜馬折臂，位果至公。", "어떤 이가 양호(羊祜)의 아버지 무덤을 보고는 후에 마땅히 천명을 받을 임금이 나올 자리라 하였다. 양호가 그 말을 싫어하여 마침내 무덤 뒤를 파서 끊어 그 형세를 망가뜨렸다. 관상 보는 이가 곧장 그것을 보고 말하였다. \"그래도 팔이 부러진 삼공(三公)은 나오겠소.\" 얼마 뒤 양호가 말에서 떨어져 팔이 부러졌고, 지위는 과연 삼공에 이르렀다.", ["예언", "권력"]], ["術解", 4, "王武子善解馬性。嘗乘一馬，箸連錢障泥。前有水，終日不肯渡。王云：「此必是惜障泥。」使人解去，便徑渡。", "왕무자(王武子)는 말의 성질을 잘 풀이하였다. 일찍이 한 말을 탔는데 동전 무늬가 이어진 진흙받이를 매고 있었다. 앞에 물이 있었는데 종일토록 건너려 하지 않았다. 왕무자가 말하였다. \"이는 필시 진흙받이를 아끼는 것이다.\" 사람을 시켜 풀어 치우게 하니 곧장 건넜다.", ["재능", "지혜"]], ["術解", 5, "陳述為大將軍掾，甚見愛重。及亡，郭璞往哭之，甚哀，乃呼曰：「嗣祖，焉知非福！」俄而大將軍作亂，如其所言。", "진술(陳述)이 대장군(大將軍)의 속관(掾)이 되어 매우 사랑과 존중을 받았다. 그가 죽자 곽박(郭璞)이 가서 곡하며 몹시 슬퍼하다가 이내 부르짖었다. \"사조(嗣祖)여, 이것이 복이 아님을 어찌 알겠는가!\" 얼마 뒤 대장군이 난을 일으켰으니, 그 말과 같았다.", ["예언", "죽음"]], ["術解", 6, "晉明帝解占塚宅，聞郭璞為人葬，帝微服往看。因問主人：「何以葬龍角？此法當滅族！」主人曰：「郭云：『此葬龍耳，不出三年，當致天子。』」帝問：「為是出天子邪？」答曰：「非出天子，能致天子問耳。」", "진명제(晉明帝)는 무덤과 집터의 점을 풀이할 줄 알았는데, 곽박(郭璞)이 어떤 이를 위해 장사를 지낸다는 말을 듣고 미복(微服) 차림으로 가서 보았다. 이에 상주에게 물었다. \"어찌하여 용의 뿔[龍角]에 장사를 지내는가? 이 법대로라면 마땅히 일족이 멸할 것이다!\" 상주가 말하였다. \"곽박이 이르기를 '이는 용의 귀[龍耳]에 장사를 지내는 것이니, 삼 년이 못 되어 마땅히 천자(天子)를 이르게 할 것이다'라 하였습니다.\" 명제가 물었다. \"이는 천자가 나오게 된다는 것인가?\" 대답하였다. \"천자가 나오는 것이 아니라, 천자가 물어오게 할 수 있다는 것입니다.\"", ["예언", "술수"]], ["術解", 7, "郭景純過江，居于暨陽，墓去水不盈百步，時人以為近水。景純曰：「將當為陸。」今沙漲，去墓數十里皆為桑田。其詩曰：「北阜烈烈，巨海混混；壘壘三墳，唯母與昆。」", "곽경순(郭景純, 곽박)이 강을 건너와 기양(暨陽)에 살았는데, 무덤이 물에서 백 보도 채 떨어지지 않아 당시 사람들이 물에 너무 가깝다고 여겼다. 경순이 말하였다. \"장차 마땅히 뭍이 될 것이다.\" 지금은 모래가 불어나 무덤에서 수십 리 떨어진 곳까지 모두 뽕밭이 되었다. 그 시에 이르기를 \"북쪽 언덕은 우뚝하고 큰 바다는 넘실넘실, 겹겹의 세 무덤은 오직 어머니와 형제뿐이라네\" 하였다.", ["예언", "죽음"]], ["術解", 8, "王丞相令郭璞試作一卦，卦成，郭意色甚惡，云：「公有震厄！」王問：「有可消伏理不？」郭曰：「命駕西出數里，得一柏樹，截斷如公長，置牀上常寢處，災可消矣。」王從其語。數日中，果震柏粉碎，子弟皆稱慶。大將軍云：「君乃復委罪於樹木。」", "왕승상(王丞相, 왕도)이 곽박(郭璞)에게 시험 삼아 점괘 하나를 뽑게 하니, 괘가 이루어지자 곽박의 안색이 몹시 좋지 않으며 말하였다. \"공께서는 벼락의 액운이 있습니다!\" 왕도가 물었다. \"없앨 수 있는 이치가 있는가?\" 곽박이 말하였다. \"수레를 몰아 서쪽으로 몇 리쯤 나가면 잣나무 하나를 얻을 것이니, 공의 키만큼 잘라 평소 주무시는 침상 위에 두십시오. 그러면 재앙을 없앨 수 있습니다.\" 왕도가 그 말을 따랐다. 며칠 안에 과연 잣나무가 벼락에 가루처럼 부서지니 자제들이 모두 경하하였다. 대장군(大將軍, 왕돈)이 말하였다. \"그대는 도리어 죄를 나무에 떠넘겼구려.\"", ["예언", "지혜"]], ["術解", 9, "桓公有主簿善別酒，有酒輒令先嘗。好者謂「青州從事」，惡者謂「平原督郵」。青州有齊郡，平原有鬲縣。「從事」言「到臍」，「督郵」言在「鬲上住」。", "환공(桓公, 환온)에게는 술을 잘 가리는 주부(主簿)가 있었는데, 술이 있으면 늘 먼저 맛보게 하였다. 좋은 것은 '청주종사(靑州從事)'라 하고 나쁜 것은 '평원독우(平原督郵)'라 하였다. 청주(靑州)에는 제군(齊郡)이 있고 평원(平原)에는 격현(鬲縣)이 있다. '종사(從事)'란 배꼽[臍]까지 이른다는 말이요, '독우(督郵)'란 횡격막[鬲] 위에 머무른다는 말이다.", ["기지", "술과취흥"]], ["術解", 10, "郗愔信道甚精勤，常患腹內惡，諸醫不可療。聞于法開有名，往迎之。既來，便脈云：「君侯所患，正是精進太過所致耳。」合一劑湯與之。一服，即大下，去數段許紙如拳大；剖看，乃先所服符也。", "치음(郗愔)은 도(道)를 매우 정밀하고 부지런히 믿었는데, 늘 뱃속이 좋지 않아 여러 의원이 치료하지 못하였다. 우법개(于法開)가 이름이 높다는 말을 듣고 가서 그를 맞이하였다. 그가 와서 곧 맥을 짚고 말하였다. \"군후(君侯)께서 앓으시는 바는 바로 정진(精進)이 지나친 까닭에 생긴 것일 뿐입니다.\" 탕약 한 제를 지어 주었다. 한 번 복용하자 곧 크게 설사하여 주먹만 한 크기의 종이 몇 덩이가 나왔는데, 갈라 보니 곧 전에 복용한 부적이었다.", ["재능", "기지", "지혜"]], ["術解", 11, "殷中軍妙解經脉，中年都廢。有常所給使，忽叩頭流血。浩問其故？云：「有死事，終不可說。」詰問良久，乃云：「小人母年垂百歲，抱疾來久，若蒙官一脈，便有活理。訖就屠戮無恨。」浩感其至性，遂令舁來，為診脉處方。始服一劑湯，便愈。於是悉焚經方。", "은중군(殷中軍, 은호)은 경맥(經脈)을 절묘하게 풀이하였으나 중년에 이르러 모두 그만두었다. 늘 부리던 심부름꾼이 갑자기 머리를 조아려 피를 흘렸다. 은호가 그 까닭을 물으니 말하였다. \"죽을 일이 있으나 끝내 말씀드릴 수 없습니다.\" 한참을 캐물으니 그제야 말하였다. \"소인의 어미가 나이 백 세에 가까운데 병을 안고 지낸 지 오래입니다. 만약 나리께서 한 번 맥을 짚어 주신다면 살아날 도리가 있겠습니다. 그러고 나면 도륙을 당해도 한이 없겠습니다.\" 은호가 그 지극한 성정(性)에 감동하여 마침내 그 어미를 메고 오게 하여 진맥하고 처방하였다. 처음 탕약 한 제를 복용하자 곧 나았다. 이에 경방(經方)을 모두 불태웠다.", ["재능", "효", "도량"]], ["巧蓺", 1, "彈棊始自魏宮內，用妝奩戲。文帝於此戲特妙，用手巾角拂之，無不中。有客自云能，帝使為之。客箸葛巾角，低頭拂棊，妙踰於帝。", "탄기(彈棊)는 위(魏)나라 궁중에서 비롯되었는데, 화장갑[妝奩]을 가지고 놀이하던 것이다. 문제(文帝)가 이 놀이에 특히 빼어났으니, 수건의 모서리로 튕겨도 맞히지 않는 것이 없었다. 어떤 손이 스스로 할 수 있다 하자, 문제가 그더러 해 보게 하였다. 손이 칡베 두건의 모서리를 대고 머리를 숙여 알을 튕기니, 그 절묘함이 문제보다 뛰어났다.", ["재능", "풍류"]], ["巧蓺", 2, "陵雲臺樓觀精巧，先稱平眾木輕重，然後造構，乃無錙銖相負揭。臺雖高峻，常隨風搖動，而終無傾倒之理。魏明帝登臺，懼其勢危，別以大材扶持之，樓即穨壞。論者謂輕重力偏故也。", "능운대(陵雲臺)의 누각은 정교하였으니, 먼저 여러 목재의 가볍고 무거움을 헤아려 고르게 한 뒤에 짜 올려, 조금[錙銖]도 서로 어긋남이 없었다. 누대가 비록 높고 가팔라 늘 바람을 따라 흔들렸으나 끝내 기울어 무너질 이치는 없었다. 위명제(魏明帝)가 누대에 올랐다가 그 형세가 위태로움을 두려워하여 따로 큰 재목으로 떠받치게 하니, 누각이 곧 무너졌다. 논하는 이들은 가볍고 무거운 힘이 치우친 까닭이라 하였다.", ["재능", "지혜"]], ["巧蓺", 3, "韋仲將能書。魏明帝起殿，欲安榜，使仲將登梯題之。既下，頭鬢皓然，因敕兒孫：「勿復學書。」", "위중장(韋仲將)은 글씨를 잘 썼다. 위명제(魏明帝)가 전각을 세우고 현판을 달고자 하여 위중장으로 하여금 사다리에 올라 글씨를 쓰게 하였다. 다 쓰고 내려오니 머리와 살쩍이 하얗게 세었다. 이에 자손에게 분부하였다. \"다시는 글씨를 배우지 말라.\"", ["서화", "재능", "뉘우침"]], ["巧蓺", 4, "鍾會是荀濟北從舅，二人情好不協。荀有寶劍，可直百萬，常在母鍾夫人許。會善書，學荀手跡，作書與母取劍，仍竊去不還。荀勖知是鍾而無由得也，思所以報之。後鍾兄弟以千萬起一宅，始成，甚精麗，未得移住。荀極善畫，乃潛往畫鍾門堂，作太傅形象，衣冠狀貌如平生。二鍾入門，便大感慟，宅遂空廢。", "종회(鍾會)는 순제북(荀濟北, 순욱)의 외사촌이었는데, 두 사람은 사이가 좋지 않았다. 순욱에게 백만의 값어치가 나가는 보검이 있었는데, 늘 어머니 종부인(鍾夫人) 곁에 두었다. 종회는 글씨를 잘 썼는데, 순욱의 필적을 흉내 내어 어머니에게 편지를 써서 검을 받아 가지고는 훔쳐 가서 돌려주지 않았다. 순욱은 이것이 종회의 짓임을 알았으나 되찾을 길이 없자, 보복할 방법을 궁리하였다. 뒤에 종씨 형제가 천만의 돈으로 집 하나를 지었는데, 막 완성되어 매우 정교하고 화려하였으나 아직 옮겨 살지는 못하였다. 순욱은 그림을 매우 잘 그렸으니, 이에 몰래 가서 종씨 집의 대청에 그림을 그려 태부(太傅, 종회 부친)의 형상을 그렸는데, 의관과 모습이 살아 있을 때와 같았다. 두 종씨가 문에 들어서자 곧 크게 감동하여 통곡하니, 집은 마침내 비어 황폐해졌다.", ["원한", "술수", "서화"]], ["巧蓺", 5, "羊長和博學工書，能騎射，善圍棊。諸羊後多知書，而射、弈餘蓺莫逮。", "양장화(羊長和)는 박학하고 글씨에 능했으며 말타기와 활쏘기를 할 줄 알고 바둑을 잘 두었다. 여러 양씨가 후에 글씨를 아는 이가 많았으나, 활쏘기와 바둑 등 나머지 재예(才藝)는 그에게 미치지 못하였다.", ["재능", "서화"]], ["巧蓺", 6, "戴安道就范宣學，視范所為：范讀書亦讀書，范抄書亦抄書。唯獨好畫，范以為無用，不宜勞思於此。戴乃畫南都賦圖；范看畢咨嗟，甚以為有益，始重畫。", "대안도(戴安道, 대규)가 범선(范宣)에게 나아가 배우면서 범선이 하는 것을 보아, 범선이 책을 읽으면 자기도 책을 읽고 범선이 책을 베끼면 자기도 베꼈다. 다만 홀로 그림 그리기를 좋아했는데, 범선은 그것을 쓸모없다 여겨 이에 마음을 쓰는 것이 마땅치 않다고 하였다. 대규가 이에 「남도부(南都賦)」를 그림으로 그리니, 범선이 보고 나서 감탄하며 매우 유익하다 여기고는 비로소 그림을 중히 여겼다.", ["서화", "학문"]], ["巧蓺", 7, "謝太傅云：「顧長康畫，有蒼生來所無。」", "사태부(謝太傅, 사안)가 말하였다. \"고장강(顧長康, 고개지)의 그림은 백성이 생긴 이래로 없던 것이다.\"", ["서화", "비평"]], ["巧蓺", 8, "戴安道中年畫行像甚精妙。庾道季看之，語戴云：「神明太俗，由卿世情未盡。」戴云：「唯務光當免卿此語耳。」", "대안도(戴安道, 대규)가 중년에 불상[行像]을 그린 것이 매우 정묘하였다. 유도계(庾道季)가 그것을 보고 대규에게 말하였다. \"신명(神明)이 너무 세속적이니, 이는 그대의 세속적 감정이 아직 다 가시지 않은 탓이오.\" 대규가 말하였다. \"오직 무광(務光)이라야 그대의 이런 말을 면할 수 있을 것이오.\"", ["서화", "비평"]], ["巧蓺", 9, "顧長康畫裴叔則，頰上益三毛。人問其故？顧曰：「裴楷儁朗有識具，正此是其識具。」看畫者尋之，定覺益三毛如有神明，殊勝未安時。", "고장강(顧長康, 고개지)이 배숙칙(裴叔則, 배해)을 그릴 때 뺨 위에 터럭 세 가닥을 더 그렸다. 사람들이 그 까닭을 물으니 고개지가 말하였다. \"배해는 준수하고 명랑하며 식견[識具]이 있는데, 바로 이것이 그 식견이오.\" 그림을 보는 이들이 살펴보니, 정녕 터럭 세 가닥을 더한 것이 마치 신명(神明)이 있는 듯하여, 더하기 전보다 훨씬 나음을 깨달았다.", ["서화", "재능"]], ["巧蓺", 10, "王中郎以圍棊是坐隱，支公以圍棊為手談。", "왕중랑(王中郎)은 바둑을 두고 은거하는 것[坐隱]이라 하였고, 지공(支公, 지둔)은 바둑을 손으로 하는 청담[手談]이라 하였다.", ["청담", "은둔", "비평"]], ["巧蓺", 11, "顧長康好寫起人形。欲圖殷荊州，殷曰：「我形惡，不煩耳。」顧曰：「明府正為眼爾。但明點童子，飛白拂其上，使如輕雲之蔽日。」", "고장강(顧長康, 고개지)은 사람의 모습 그리기를 좋아하였다. 은형주(殷荊州)를 그리고자 하니 은형주가 말하였다. \"내 모습은 흉하니 수고롭게 하지 마시오.\" 고개지가 말하였다. \"명부(明府)께서는 바로 눈 때문이지요. 다만 눈동자를 밝게 점찍고 그 위에 비백(飛白)으로 슬쩍 스치게 하여, 마치 엷은 구름이 해를 가린 듯하게 하면 됩니다.\"", ["서화", "재능"]], ["巧蓺", 12, "顧長康畫謝幼輿在巖石裏。人問其所以？顧曰：「謝云：『一丘一壑，自謂過之。』此子宜置丘壑中。」", "고장강(顧長康, 고개지)이 사유여(謝幼輿, 사곤)를 바위 속에 그렸다. 사람들이 그 까닭을 물으니 고개지가 말하였다. \"사곤이 이르기를 '언덕 하나와 골짜기 하나에서 노니는 것은 스스로 그대보다 낫다고 여기오'라 하였소. 이 사람은 마땅히 언덕과 골짜기 가운데 두어야 하오.\"", ["서화", "은둔"]], ["巧蓺", 13, "顧長康畫人，或數年不點目精。人問其故？顧曰：「四體妍蚩，本無關於妙處；傳神寫照，正在阿堵中。」", "고장강(顧長康, 고개지)은 사람을 그리되 더러 몇 해가 지나도록 눈동자를 점찍지 않았다. 사람들이 그 까닭을 물으니 고개지가 말하였다. \"사지(四體)의 아름다움과 추함은 본디 절묘한 곳과 관계가 없소. 정신을 전하고 모습을 그려 내는 것[傳神寫照]은 바로 이 눈동자[阿堵] 가운데 있소.\"", ["서화", "재능"]], ["巧蓺", 14, "顧長康道畫：「手揮五絃易，目送歸鴻難。」", "고장강(顧長康, 고개지)이 그림에 대해 말하였다. \"손으로 오현금을 타는 것은 그리기 쉽고, 눈으로 돌아가는 기러기를 보내는 것은 그리기 어렵다.\"", ["서화", "재능"]], ["寵禮", 1, "元帝正會，引王丞相登御牀，王公固辭，中宗引之彌苦。王公曰：「使太陽與萬物同暉，臣下何以瞻仰？」", "원제(元帝)가 정월 조회 때에 왕승상(王丞相, 왕도)을 이끌어 어좌(御牀)에 오르게 하니, 왕공(王公)이 한사코 사양하였다. 중종(中宗, 원제)이 이끄는 것이 더욱 간곡하였다. 왕공이 말하였다. \"태양으로 하여금 만물과 더불어 빛을 같이하게 하신다면, 신하들이 무엇을 우러러보겠습니까?\"", ["겸손", "거절", "권력"]], ["寵禮", 2, "桓宣武嘗請參佐入宿，袁宏、伏滔相次而至，蒞名府中，復有袁參軍，彥伯疑焉，令傳教更質。傳教曰：「參軍是袁、伏之袁，復何所疑？」", "환선무(桓宣武, 환온)가 일찍이 막료들을 청하여 숙직하게 하였는데, 원굉(袁宏)과 복도(伏滔)가 잇따라 이르렀다. 부중(府中)에 이름을 적으니, 또 원참군(袁參軍)이 있어 언백(彦伯, 원굉)이 의아해하며 전령을 시켜 다시 따져 묻게 하였다. 전령이 말하였다. \"참군은 원(袁)·복(伏)의 그 원씨이니, 다시 무엇을 의심하십니까?\"", ["기지", "비평"]], ["寵禮", 3, "王珣、郗超並有奇才，為大司馬所眷拔。珣為主簿，超為記室參軍。超為人多須，珣狀短小。于時荊州為之語曰：「髯參軍，短主簿。能令公喜，能令公怒。」", "왕순(王珣)과 치초(郗超)는 모두 빼어난 재주가 있어 대사마(大司馬, 환온)에게 사랑받고 발탁되었다. 왕순은 주부(主簿)가 되고 치초는 기실참군(記室參軍)이 되었다. 치초는 사람됨이 수염이 많고 왕순은 키가 작고 왜소하였다. 그때 형주(荊州)에서 그들을 두고 이렇게 말하였다. \"수염 난 참군, 키 작은 주부. 공을 기쁘게도 하고, 공을 노하게도 한다네.\"", ["비평", "용모", "재능"]], ["寵禮", 4, "許玄度停都一月，劉尹無日不往，乃歎曰：「卿復少時不去，我成輕薄京尹！」", "허현도(許玄度, 허순)가 도성에 한 달을 머무는데 유윤(劉尹, 유담)이 하루도 찾지 않는 날이 없었다. 이에 탄식하며 말하였다. \"그대가 다시 얼마간 떠나지 않으면, 나는 경박한 경윤(京尹)이 되고 말겠소!\"", ["우정", "기지"]], ["寵禮", 5, "孝武在西堂會，伏滔預坐。還，下車呼其兒，語之曰：「百人高會，臨坐未得他語，先問『伏滔何在？在此不？』此故未易得。為人作父如此，何如？」", "효무제(孝武帝)가 서당(西堂)에서 모임을 열었는데 복도(伏滔)가 자리에 참석하였다. 돌아와 수레에서 내려 그 아들을 불러 말하였다. \"백 사람이 모인 큰 모임에서, 자리에 임하시어 다른 말씀을 하시기 전에 먼저 '복도는 어디 있는가? 여기 있느냐?'고 물으셨다. 이는 참으로 쉽게 얻을 수 있는 일이 아니다. 남의 아비 된 자가 이러하니 어떠하냐?\"", ["권력", "비평"]], ["寵禮", 6, "卞範之為丹陽尹，羊孚南州暫還，往卞許，云：「下官疾動不堪坐。」卞便開帳拂褥，羊徑上大牀，入被須枕。卞回坐傾睞，移晨達莫。羊去，卞語曰：「我以第一理期卿，卿莫負我。」", "변범지(卞範之)가 단양윤(丹陽尹)이 되었을 때, 양부(羊孚)가 남주(南州)에서 잠시 돌아와 변범지에게 가서 말하였다. \"하관(下官)이 병이 도져 앉아 있을 수가 없습니다.\" 변범지가 곧 휘장을 걷고 요를 털어 놓으니, 양부가 곧장 큰 침상에 올라 이불 속에 들어가 베개를 챙겨 베었다. 변범지가 돌아앉아 정을 기울여 바라보며, 아침부터 저물녘까지 함께하였다. 양부가 떠나자 변범지가 말하였다. \"나는 제일가는 이치[第一理]로 그대에게 기대하니, 그대는 나를 저버리지 마시오.\"", ["우정", "풍류"]], ["任誕", 1, "陳留阮籍，譙國嵇康，河內山濤，三人年皆相比，康年少亞之。預此契者：沛國劉伶，陳留阮咸，河內向秀，琅邪王戎。七人常集于竹林之下，肆意酣暢，故世謂「竹林七賢」。", "진류(陳留)의 완적(阮籍), 초국(譙國)의 혜강(嵇康), 하내(河內)의 산도(山濤), 이 세 사람은 나이가 모두 서로 비슷하였고 혜강이 그다음으로 조금 어렸다. 이 모임에 함께한 이로는 패국(沛國)의 유령(劉伶), 진류(陳留)의 완함(阮咸), 하내(河內)의 향수(向秀), 낭야(琅邪)의 왕융(王戎)이 있었다. 일곱 사람이 늘 대숲 아래 모여 마음껏 거나하게 즐겼으므로 세상에서 '죽림칠현(竹林七賢)'이라 일렀다.", ["풍류", "우정", "은둔"]], ["任誕", 2, "阮籍遭母喪，在晉文王坐，進酒肉。司隸何曾亦在坐，曰：「明公方以孝治天下，而阮籍以重喪，顯於公坐，飲酒食肉，宜流之海外，以正風教。」文王曰：「嗣宗毀頓如此，君不能共憂之，何謂？且有疾而飲酒食肉，固喪禮也！」籍飲噉不輟，神色自若。", "완적(阮籍)이 어머니 상을 당하였는데, 진문왕(晉文王, 사마소)의 자리에서 술과 고기를 들었다. 사례(司隸) 하증(何曾)도 자리에 있다가 말하였다. \"명공(明公)께서 바야흐로 효(孝)로써 천하를 다스리시거늘, 완적은 무거운 상중에 공의 자리에 드러내 놓고 술 마시고 고기를 먹으니, 마땅히 바다 밖으로 내쳐 풍교(風敎)를 바로잡아야 합니다.\" 문왕이 말하였다. \"사종(嗣宗, 완적)이 이처럼 슬픔에 야위어 무너졌거늘, 그대가 함께 근심하지는 못할망정 무슨 말인가? 또 병이 있어 술 마시고 고기 먹는 것은 본디 상례(喪禮)에 맞는 일이다!\" 완적은 마시고 먹기를 그치지 않았으며, 안색이 태연자약하였다.", ["술과취흥", "효", "죽음"]], ["任誕", 3, "劉伶病酒，渴甚，從婦求酒。婦捐酒毀器，涕泣諫曰：「君飲太過，非攝生之道，必宜斷之！」伶曰：「甚善。我不能自禁，唯當祝鬼神，自誓斷之耳！便可具酒肉。」婦曰：「敬聞命。」供酒肉於神前，請伶祝誓。伶跪而祝曰：「天生劉伶，以酒為名，一飲一斛，五斗解酲。婦人之言，慎不可聽。」便引酒進肉，隗然已醉矣。", "유령(劉伶)이 술병이 나서 목이 몹시 말라 아내에게 술을 청하였다. 아내가 술을 쏟아 버리고 그릇을 깨뜨리며 눈물 흘려 간하였다. \"당신은 마시는 것이 너무 지나치니, 양생(攝生)의 도리가 아닙니다. 반드시 끊으셔야 합니다!\" 유령이 말하였다. \"참 좋소. 내 스스로 금할 수 없으니, 다만 마땅히 귀신께 빌어 스스로 끊기를 맹세하리다! 곧 술과 고기를 갖추시오.\" 아내가 말하였다. \"분부를 삼가 받들겠습니다.\" 술과 고기를 신 앞에 차리고 유령에게 빌어 맹세하기를 청하였다. 유령이 꿇어앉아 빌며 말하였다. \"하늘이 유령을 내시매 술로써 이름을 삼으니, 한 번 마시면 한 섬이요 닷 말로 해장을 한다네. 아녀자의 말은 삼가 들을 것이 못 되도다.\" 그러고는 술을 끌어당겨 고기를 먹으니, 어느새 무너지듯 이미 취하였다.", ["술과취흥", "부부"]], ["任誕", 4, "劉公榮與人飲酒，雜穢非類，人或譏之。答曰：「勝公榮者，不可不與飲；不如公榮者，亦不可不與飲；是公榮輩者，又不可不與飲。」故終日共飲而醉。", "유공영(劉公榮)이 사람들과 술을 마시는데 잡되고 거칠어 동류가 아닌 자들과도 어울리니, 어떤 이가 그를 나무랐다. 그가 대답하였다. \"공영보다 나은 자와는 함께 마시지 않을 수 없고, 공영만 못한 자와도 함께 마시지 않을 수 없으며, 공영과 같은 무리와도 또한 함께 마시지 않을 수 없소.\" 그리하여 종일토록 함께 마시며 취하였다.", ["술과취흥", "도량"]], ["任誕", 5, "步兵校尉缺，廚中有貯酒數百斛，阮籍乃求為步兵校尉。", "보병교위(步兵校尉) 자리가 비었는데, 그 주방에 술 수백 섬이 쌓여 있었다. 완적(阮籍)은 이에 보병교위가 되기를 청하였다.", ["술과취흥", "권력"]], ["任誕", 6, "劉伶恆縱酒放達，或脫衣裸形在屋中，人見譏之。伶曰：「我以天地為棟宇，屋室為衣，諸君何為入我中？」", "유령(劉伶)은 늘 술을 마시며 거리낌 없이 분방하였는데, 더러 옷을 벗고 알몸으로 방 안에 있었다. 사람들이 보고 나무라니 유령이 말하였다. \"나는 천지를 집으로 삼고 방을 잠방이로 삼는데, 그대들은 어찌하여 내 잠방이 속으로 들어왔는가?\"", ["술과취흥", "오만"]], ["任誕", 7, "阮籍嫂嘗還家，籍見與別。或譏之。籍曰：「禮豈為我輩設也？」", "완적(阮籍)의 형수가 한번은 친정으로 돌아가게 되자, 완적이 만나 작별 인사를 나누었다. 어떤 이가 이를 나무라니 완적이 말했다. \"예법(禮)이 어찌 우리 같은 무리를 위해 마련된 것이겠는가?\"", ["술과취흥", "오만"]], ["任誕", 8, "阮公鄰家婦有美色，當壚酤酒。阮與王安豐常從婦飲酒，阮醉，便眠其婦側。夫始殊疑之，伺察，終無他意。", "완공(阮公, 阮籍)의 이웃집 아낙이 미색이 있어 술청에서 술을 팔았다. 완적은 왕안풍(王安豐, 王戎)과 늘 그 아낙에게 가서 술을 마셨는데, 완적이 취하면 곧 그 아낙 곁에서 잠들곤 하였다. 남편이 처음에는 몹시 의심하여 엿보아 살폈으나, 끝내 다른 뜻이 없었다.", ["술과취흥", "도량"]], ["任誕", 9, "阮籍當葬母，蒸一肥豚，飲酒二斗，然後臨訣，直言「窮矣」！都得一號，因吐血，廢頓良久。", "완적(阮籍)이 어머니의 장례를 치르게 되자, 살찐 돼지 한 마리를 쪄서 술 두 말을 마신 뒤에야 영결에 임하였는데, 다만 \"끝났구나(窮矣)!\"라고만 말하였다. 모두 한 번 곡하고는 그대로 피를 토하고 오래도록 쓰러져 있었다.", ["술과취흥", "효", "죽음"]], ["任誕", 10, "阮仲容、步兵居道南，諸阮居道北。北阮皆富，南阮貧。七月七日，北阮盛曬衣，皆紗羅錦綺。仲容以竿挂大布犢鼻於中庭。人或怪之，答曰：「未能免俗，聊復爾耳！", "완중용(阮仲容, 阮咸)과 보병(步兵, 阮籍)은 길 남쪽에 살고, 여러 완씨(阮氏)는 길 북쪽에 살았다. 북쪽 완씨는 모두 부유하고 남쪽 완씨는 가난하였다. 칠월 칠일에 북쪽 완씨들이 옷을 성대하게 내다 말렸는데, 모두 비단과 무늬 있는 옷감이었다. 중용은 장대에 굵은 베로 만든 잠방이를 마당 가운데에 걸어두었다. 어떤 이가 이를 괴이하게 여기니, 그가 대답하였다. \"속됨을 면치 못하여 그저 이렇게 해본 것일 뿐이오!\"", ["청빈", "풍류"]], ["任誕", 11, "阮步兵喪母，裴令公往弔之。阮方醉，散髮坐牀，箕踞不哭。裴至，下席於地，哭弔喭畢，便去。或問裴：「凡弔，主人哭，客乃為禮。阮既不哭，君何為哭？」裴曰：「阮方外之人，故不崇禮制；我輩俗中人，故以儀軌自居。」時人歎為兩得其中。", "완보병(阮步兵, 阮籍)이 어머니 상을 당했을 때, 배령공(裴令公, 裴楷)이 조문하러 갔다. 완적은 마침 취하여 머리를 풀어 헤치고 평상에 앉아 두 다리를 뻗고 있었으며 곡을 하지 않았다. 배해(裴楷)가 이르러 땅에 자리를 깔고 곡하며 조문을 마치고는 곧 떠났다. 어떤 이가 배해에게 물었다. \"무릇 조문이란 주인이 곡을 하면 손님이 예를 행하는 것입니다. 완적이 곡을 하지 않았는데 그대는 어찌하여 곡을 하였소?\" 배해가 말했다. \"완적은 세속 밖의 사람이라 예법과 제도를 숭상하지 않지만, 우리 같은 무리는 세속 안의 사람이라 의례와 법도로 처신하는 것이오.\" 당시 사람들은 두 사람이 모두 그 중도를 얻었다고 감탄하였다.", ["술과취흥", "죽음", "도량"]], ["任誕", 12, "諸阮皆能飲酒，仲容至宗人閒共集，不復用常桮斟酌，以大甕盛酒，圍坐，相向大酌。時有羣豬來飲，直接去上，便共飲之。", "여러 완씨(阮氏)는 모두 술을 잘 마셨는데, 중용(仲容, 阮咸)이 일족 사람들과 함께 모일 때면 더 이상 보통 술잔으로 따라 마시지 않고 큰 항아리에 술을 담아 둘러앉아 서로 마주하여 크게 퍼마셨다. 그때 돼지 떼가 와서 마시면 곧바로 윗부분을 떠내고는 함께 마셨다.", ["술과취흥", "풍류"]], ["任誕", 13, "阮渾長成，風氣韻度似父，亦欲作達。步兵曰：「仲容已預之，卿不得復爾。」", "완혼(阮渾)이 장성하니, 기풍과 운치가 아버지를 닮아 또한 통달한 행세를 하려 하였다. 보병(步兵, 阮籍)이 말했다. \"중용(仲容, 阮咸)이 이미 그러한 무리에 끼어 있으니, 너는 다시 그래서는 안 된다.\"", ["풍류", "간언"]], ["任誕", 14, "裴成公婦，王戎女。王戎晨往裴許，不通徑前。裴從牀南下，女從北下，相對作賓主，了無異色。", "배성공(裴成公, 裴楷)의 아내는 왕융(王戎)의 딸이다. 왕융이 아침에 배해(裴楷)의 처소에 갔는데, 알리지도 않고 곧장 들어갔다. 배해는 평상의 남쪽으로 내려오고 딸은 북쪽으로 내려와, 서로 마주하여 손님과 주인의 예를 갖추었으며 조금도 이상한 기색이 없었다.", ["부부", "용모"]], ["任誕", 15, "阮仲容先幸姑家鮮卑婢。及居母喪，姑當遠移，初云當留婢，既發，定將去。仲容借客驢箸重服自追之，累騎而返。曰：「人種不可失！」即遙集之母也。", "완중용(阮仲容, 阮咸)이 일찍이 고모 집의 선비(鮮卑) 여종을 가까이하였다. 어머니 상중에 있을 때 고모가 먼 곳으로 옮겨 가게 되었는데, 처음에는 여종을 남겨두겠다고 하였으나 막상 떠날 때는 결국 데리고 가버렸다. 중용은 손님의 나귀를 빌려 상복을 입은 채 직접 뒤쫓아가서 함께 말을 타고 돌아왔다. 그가 말했다. \"사람의 씨앗을 잃을 수는 없다!\" 이가 바로 요집지(遙集之)의 어머니이다.", ["술과취흥", "여인", "부부"]], ["任誕", 16, "任愷既失權勢，不復自檢括。或謂和嶠曰：「卿何以坐視元裒敗而不救？」和曰：「元裒如北夏門，拉攞自欲壞，非一木所能支。」", "임개(任愷)는 권세를 잃은 뒤로 다시는 스스로를 단속하지 않았다. 어떤 이가 화교(和嶠)에게 말했다. \"그대는 어찌하여 원부(元裒, 任愷)가 무너지는 것을 앉아서 보기만 하고 구하지 않는가?\" 화교가 말했다. \"원부는 북하문(北夏門)과 같으니, 비스듬히 기울어 스스로 무너지려 하는데 나무 하나로 떠받칠 수 있는 것이 아니오.\"", ["비평", "권력"]], ["任誕", 17, "劉道真少時，常漁草澤，善歌嘯，聞者莫不留連。有一老嫗，識其非常人，甚樂其歌嘯，乃殺豚進之。道真食豚盡，了不謝。嫗見不飽，又進一豚，食半餘半，迺還之。後為吏部郎，嫗兒為小令史，道真超用之。不知所由，問母；母告之。於是齎牛酒詣道真，道真曰：「去！去！無可復用相報。」", "유도진(劉道眞)이 젊었을 때 늘 늪에서 고기를 잡았는데, 노래와 휘파람을 잘하여 듣는 이마다 머물러 떠나지 못하였다. 한 노파가 있어 그가 범상치 않은 사람임을 알아보고 그의 노래와 휘파람을 매우 즐거워하여 돼지를 잡아 대접하였다. 도진은 돼지를 다 먹고도 전혀 고마워하지 않았다. 노파가 그가 배부르지 않은 것을 보고 또 돼지 한 마리를 대접하니, 절반을 먹고 나머지 절반은 그대로 돌려주었다. 뒤에 이부랑(吏部郞)이 되었는데, 노파의 아들이 하급 영사(令史)가 되어 있자 도진이 그를 파격적으로 등용하였다. 그 까닭을 알지 못하여 어머니에게 물으니 어머니가 그 일을 일러주었다. 이에 소와 술을 가지고 도진을 찾아가니, 도진이 말했다. \"가시오! 가시오! 보답으로 더 등용할 자리가 없소.\"", ["베풂", "음악"]], ["任誕", 18, "阮宣子常步行，以百錢挂杖頭，至酒店，便獨酣暢。雖當世貴盛，不肯詣也。", "완선자(阮宣子, 阮脩)는 늘 걸어 다녔는데, 백 전(錢)을 지팡이 끝에 걸고 술집에 이르면 곧 혼자서 흠뻑 취하도록 마셨다. 비록 당대의 귀하고 권세 있는 자라 해도 찾아가려 하지 않았다.", ["술과취흥", "은둔", "청빈"]], ["任誕", 19, "山季倫為荊州，時出酣暢。人為之歌曰：「山公時一醉，徑造高陽池。日莫倒載歸，茗艼無所知。復能乘駿馬，倒箸白接籬。舉手問葛彊，何如并州兒？」高陽池在襄陽。彊是其愛將，并州人也。", "산계륜(山季倫, 山簡)이 형주(荊州)에 있을 때 때때로 나가 흠뻑 취하곤 하였다. 사람들이 그를 위해 노래를 지어 불렀다. \"산공(山公)이 때로 한 번 취하면 곧장 고양지(高陽池)로 간다네. 날 저물면 거꾸로 실려 돌아오니 곤드레만드레 아무것도 모른다네. 또 능히 준마를 타고 백접리(白接籬)를 거꾸로 쓴다네. 손을 들어 갈강(葛彊)에게 묻기를, 병주(并州)의 사내와 비하면 어떠한가?\" 고양지는 양양(襄陽)에 있다. 갈강은 그가 아끼던 장수로 병주 사람이다.", ["술과취흥", "풍류", "음악"]], ["任誕", 20, "張季鷹縱任不拘，時人號為江東步兵。或謂之曰：「卿乃可縱適一時，獨不為身後名邪？」答曰：「使我有身後名，不如即時一桮酒！」", "장계응(張季鷹, 張翰)은 제멋대로 행동하며 거리낌이 없어 당시 사람들이 강동(江東)의 보병(步兵)이라 불렀다. 어떤 이가 그에게 말했다. \"그대는 한때 마음껏 즐길 수는 있으나, 어찌 죽은 뒤의 명성은 생각하지 않는가?\" 그가 대답했다. \"나에게 죽은 뒤의 명성이 있게 하느니, 차라리 지금 한 잔의 술을 마시는 것이 낫소!\"", ["술과취흥", "풍류"]], ["任誕", 21, "畢茂世云：「一手持蟹螯，一手持酒桮，拍浮酒池中，便足了一生。」", "필무세(畢茂世, 畢卓)가 말했다. \"한 손에는 게의 집게발을 들고 한 손에는 술잔을 들고서 술 못 속에 둥둥 떠다닌다면, 곧 한평생을 마치기에 충분하다.\"", ["술과취흥", "풍류"]], ["任誕", 22, "賀司空入洛赴命，為太孫舍人。經吳閶門，在船中彈琴。張季鷹本不相識，先在金閶亭，聞絃甚清，下船就賀，因共語。便大相知說。問賀：「卿欲何之？」賀曰：「入洛赴命，正爾進路。」張曰：「吾亦有事北京。」因路寄載，便與賀同發。初不告家，家追問迺知。", "하사공(賀司空, 賀循)이 낙양(洛陽)으로 들어가 명을 받들어 태손사인(太孫舍人)이 되었다. 오(吳) 땅의 창문(閶門)을 지날 때 배 안에서 거문고를 탔다. 장계응(張季鷹, 張翰)은 본래 그와 알지 못하였는데, 먼저 금창정(金閶亭)에 있다가 거문고 소리가 매우 맑은 것을 듣고는 배에서 내려 하순(賀循)에게 다가가 함께 이야기를 나누었다. 곧 서로 크게 마음이 통하여 기뻐하였다. 하순에게 물었다. \"그대는 어디로 가시오?\" 하순이 말했다. \"낙양으로 들어가 명을 받들고자 마침 길을 가는 중이오.\" 장한이 말했다. \"나도 북경(北京)에 볼일이 있소.\" 그러고는 길에서 그 배에 얹혀 타고 하순과 함께 떠났다. 처음에 집에는 알리지 않았고, 집에서 뒤쫓아 물은 뒤에야 알게 되었다.", ["우정", "음악", "풍류"]], ["任誕", 23, "祖車騎過江時，公私儉薄，無好服玩。王、庾諸公共就祖，忽見裘袍重疊，珍飾盈列，諸公怪問之。祖曰：「昨夜復南塘一出。」祖于時恆自使健兒鼓行劫鈔，在事之人，亦容而不問。", "조거기(祖車騎, 祖逖)가 강을 건너왔을 때, 공사 간에 모두 검소하고 빈약하여 좋은 옷이나 패물이 없었다. 왕씨(王氏)와 유씨(庾氏) 등 여러 공이 함께 조적(祖逖)을 찾아갔는데, 갑자기 갖옷과 도포가 겹겹이 쌓여 있고 진귀한 장식이 가득 늘어선 것을 보았다. 여러 공이 괴이하게 여겨 물으니 조적이 말했다. \"어젯밤에 또 남당(南塘)을 한 번 다녀왔소.\" 조적은 당시 늘 건장한 병졸들을 시켜 북을 치며 나아가 약탈하게 하였는데, 일을 맡은 자들도 너그러이 보아 넘기고 묻지 않았다.", ["술수", "베풂"]], ["任誕", 24, "鴻臚卿孔羣好飲酒。王丞相語云：「卿何為恆飲酒？不見酒家覆瓿布，日月糜爛？」羣曰：「不爾，不見糟肉，乃更堪久。」羣嘗書與親舊：「今年田得七百斛秫米，不了麴蘖事。」", "홍려경(鴻臚卿) 공군(孔羣)이 술을 즐겨 마셨다. 왕승상(王丞相, 王導)이 그에게 말했다. \"그대는 어찌하여 늘 술을 마시는가? 술집의 항아리를 덮은 베가 날이 갈수록 문드러지는 것을 보지 못하였는가?\" 공군이 말했다. \"그렇지 않습니다. 술지게미에 절인 고기가 오히려 더 오래 견디는 것을 보지 못하셨습니까?\" 공군이 일찍이 친구와 옛 벗에게 편지를 써서 보냈다. \"올해 밭에서 차조 칠백 곡(斛)을 얻었으나 누룩으로 술 담그는 일을 다 감당하지 못하겠네.\"", ["술과취흥", "기지"]], ["任誕", 25, "有人譏周僕射：「與親友言戲，穢雜無檢節。」周曰：「吾若萬里長江，何能不千里一曲。」", "어떤 이가 주복야(周僕射, 周顗)를 나무랐다. \"친구들과 농담을 나눌 때 더럽고 잡스러워 절도가 없습니다.\" 주의(周顗)가 말했다. \"나는 만 리의 긴 강과 같으니, 어찌 천 리에 한 번쯤 굽이가 없을 수 있겠는가.\"", ["술과취흥", "기지"]], ["任誕", 26, "溫太真位未高時，屢與揚州、淮中估客樗蒱，與輒不競。嘗一過，大輸物，戲屈，無因得反。與庾亮善，於舫中大喚亮曰：「卿可贖我！」庾即送直，然後得還。經此數四。", "온태진(溫太眞, 溫嶠)이 지위가 아직 높지 않았을 때, 자주 양주(揚州)와 회중(淮中)의 장사꾼들과 저포(樗蒱) 노름을 하였는데, 할 때마다 이기지 못하였다. 한번은 크게 물건을 잃어 노름에 곤궁해져서 돌아갈 방도가 없게 되었다. 유량(庾亮)과 사이가 좋았으므로, 배 안에서 유량을 크게 불러 말했다. \"그대가 나를 좀 구해주게!\" 유량이 곧 돈을 보내준 뒤에야 돌아갈 수 있었다. 이런 일을 서너 차례 겪었다.", ["술과취흥", "우정"]], ["任誕", 27, "溫公喜慢語，卞令禮法自居。至庾公許，大相剖擊。溫發口鄙穢，庾公徐曰：「太真終日無鄙言。」", "온공(溫公, 溫嶠)은 함부로 하는 말을 좋아하였고, 변령(卞令, 卞壼)은 예법으로 처신하였다. 유공(庾公, 庾亮)의 처소에 이르러 서로 크게 따지고 공격하였다. 온교가 입을 열어 비속하고 더러운 말을 하니, 유량이 천천히 말했다. \"태진(太眞, 溫嶠)은 종일토록 비속한 말이 없구려.\"", ["술과취흥", "비평"]], ["任誕", 28, "周伯仁風德雅重，深達危亂。過江積年，恆大飲酒。嘗經三日不醒，時人謂之「三日僕射」。", "주백인(周伯仁, 周顗)은 풍모와 덕망이 우아하고 중후하였으며 위태로움과 혼란에 깊이 통달하였다. 강을 건너온 지 여러 해 동안 늘 크게 술을 마셨다. 일찍이 사흘이 지나도록 깨어나지 않은 적이 있어 당시 사람들이 그를 \"사흘 복야(三日僕射)\"라 불렀다.", ["술과취흥", "용모"]], ["任誕", 29, "衛君長為溫公長史，溫公甚善之。每率爾提酒脯就衛，箕踞相對彌日。衛往溫許，亦爾。", "위군장(衛君長, 衛永)이 온공(溫公, 溫嶠)의 장사(長史)가 되었는데, 온공이 그를 매우 좋아하였다. 매번 거리낌 없이 술과 마른안주를 들고 위영(衛永)을 찾아가 두 다리를 뻗고 마주 앉아 종일을 보냈다. 위영이 온교의 처소에 갈 때도 또한 그러하였다.", ["우정", "술과취흥", "풍류"]], ["任誕", 30, "蘇峻亂，諸庾逃散。庾冰時為吳郡，單身奔亡，民吏皆去。唯郡卒獨以小船載冰出錢塘口，蘧篨覆之。時峻賞募覓冰，屬所在搜檢甚急。卒捨船市渚，因飲酒醉還，舞棹向船曰：「何處覓庾吳郡？此中便是。」冰大惶怖，然不敢動。監司見船小裝狹，謂卒狂醉，都不復疑。自送過淛江，寄山陰魏家，得免。後事平，冰欲報卒，適其所願。卒曰：「出自廝下，不願名器。少苦執鞭，恆患不得快飲酒。使其酒足餘年畢矣，無所復須。」冰為起大舍，市奴婢，使門內有百斛酒，終其身。時謂此卒非唯有智，且亦達生。", "소준(蘇峻)의 난 때 여러 유씨(庾氏)가 도망쳐 흩어졌다. 유빙(庾冰)은 당시 오군(吳郡) 태수였는데, 홀몸으로 달아나니 백성과 관리가 모두 떠나버렸다. 오직 군졸 하나만이 작은 배에 유빙을 태워 전당(錢塘) 어귀로 빠져나가, 거적으로 그를 덮었다. 그때 소준이 상을 걸고 유빙을 찾으니, 곳곳에서 수색이 매우 급박하였다. 군졸이 배를 시장 물가에 대놓고 술을 마셔 취해서는 돌아와, 노를 휘두르며 배를 향해 말했다. \"어디서 유오군(庾吳郡)을 찾는가? 이 안에 바로 있도다.\" 유빙이 크게 두려워하였으나 감히 움직이지 못하였다. 감독하는 관리가 배가 작고 짐칸이 좁은 것을 보고, 군졸이 미친 듯이 취했다 여겨 더 이상 의심하지 않았다. 군졸이 직접 절강(淛江)을 건너 보내 산음(山陰)의 위씨(魏氏) 집에 의탁하게 하여 화를 면하게 하였다. 뒤에 일이 평정되자 유빙이 군졸에게 보답하고자 그가 원하는 바를 들어주려 하였다. 군졸이 말했다. \"천한 하인 출신이라 명예나 벼슬은 바라지 않습니다. 어려서부터 채찍 잡는 일에 고생하였고, 늘 술을 실컷 마시지 못함을 근심하였습니다. 남은 평생 술이나 넉넉히 하게 해주신다면 그뿐, 더 바랄 것이 없습니다.\" 유빙이 그를 위해 큰 집을 지어주고 노비를 사주었으며, 집 안에 술 백 곡(斛)을 두게 하여 평생토록 하게 하였다. 당시 사람들은 이 군졸이 지혜가 있을 뿐만 아니라 또한 삶에 통달하였다고 하였다.", ["지혜", "용기", "술과취흥"]], ["任誕", 31, "殷洪喬作豫章郡，臨去，都下人因附百許函書。既至石頭，悉擲水中，因祝曰：「沈者自沈，浮者自浮，殷洪喬不能作致書郵。」", "은홍교(殷洪喬, 殷羨)가 예장군(豫章郡)의 태수가 되어 떠날 즈음에, 도읍 사람들이 백여 통의 편지를 그에게 부탁하였다. 석두(石頭)에 이르자 모두 물속에 던져 넣고는 이렇게 빌었다. \"가라앉을 것은 절로 가라앉고 뜰 것은 절로 뜨라. 은홍교는 편지 배달부 노릇을 할 수 없노라.\"", ["풍류", "오만"]], ["任誕", 32, "王長史、謝仁祖同為王公掾。長史云：「謝掾能作異舞。」謝便起舞，神意甚暇。王公熟視，謂客曰：「使人思安豐。」", "왕장사(王長史, 王濛)와 사인조(謝仁祖, 謝尚)가 함께 왕공(王公, 王導)의 속관이 되었다. 장사가 말했다. \"사 속관(謝掾, 謝尚)은 기이한 춤을 잘 춥니다.\" 사상이 곧 일어나 춤을 추니 정신과 뜻이 매우 한가로웠다. 왕공이 찬찬히 바라보고 손님에게 말했다. \"사람으로 하여금 안풍(安豐, 王戎)을 생각나게 하는구려.\"", ["풍류", "비평", "음악"]], ["任誕", 33, "王、劉共在杭南，酣宴於桓子野家。謝鎮西往尚書墓還，葬後三日反哭。諸人欲要之，初遣一信，猶未許，然已停車。重要，便回駕。諸人門外迎之，把臂便下，裁得脫幘箸帽。酣宴半坐，乃覺未脫衰。", "왕씨(王氏, 王濛)와 유씨(劉氏, 劉惔)가 함께 항남(杭南)에 있으면서 환자야(桓子野, 桓伊)의 집에서 흥겹게 잔치를 벌였다. 사진서(謝鎭西, 謝尚)가 상서(尙書)의 묘에 갔다가 돌아오는 길이었는데, 장례 후 사흘째 되는 날 곡을 하고 돌아오는 중이었다. 여러 사람이 그를 청하고자 처음 한 번 사람을 보내니 아직 허락하지 않았으나, 이미 수레는 멈춰 있었다. 거듭 청하니 곧 수레를 돌렸다. 여러 사람이 문밖에서 그를 맞이하여 팔을 잡고 곧 내리게 하니, 겨우 두건을 벗고 모자를 쓸 수 있었다. 흥겹게 잔치하던 자리가 절반쯤 지나서야 아직 상복을 벗지 못한 것을 깨달았다.", ["술과취흥", "풍류", "우정"]], ["任誕", 34, "桓宣武少家貧，戲大輸，債主敦求甚切，思自振之方，莫知所出。陳郡袁躭，俊邁多能。宣武欲求救於躭，躭時居艱，恐致疑，試以告焉。應聲便許，略無嫌吝。遂變服懷布帽隨溫去，與債主戲。躭素有蓺名，債主就局曰：「汝故當不辦作袁彥道邪？」遂共戲。十萬一擲，直上百萬數。投馬絕叫，傍若無人，探布帽擲對人曰：「汝竟識袁彥道不？」", "환선무(桓宣武, 桓溫)는 젊어서 집이 가난하였는데, 노름에 크게 져서 빚쟁이의 독촉이 매우 다급하였으나 스스로 떨쳐 일어날 방도를 생각해도 어찌할 바를 몰랐다. 진군(陳郡)의 원탐(袁躭)은 빼어나고 재능이 많은 사람이었다. 환온이 원탐에게 도움을 청하고자 하였으나, 원탐이 당시 상중에 있어 의심을 살까 두려워, 시험 삼아 그 일을 알렸다. 원탐은 말이 떨어지기 무섭게 승낙하며 조금도 꺼리거나 인색해하지 않았다. 마침내 옷을 갈아입고 베로 만든 모자를 품에 넣은 채 환온을 따라가 빚쟁이와 노름을 하였다. 원탐은 본디 노름 재주로 이름이 있었는데, 빚쟁이가 판에 다가와 말했다. \"너는 설마 원언도(袁彥道, 袁躭)처럼 할 수는 없겠지?\" 마침내 함께 노름을 하였다. 십만 전을 한 번에 던져 곧장 백만의 액수까지 올라갔다. 패를 던지며 큰 소리로 외치고 곁에 사람이 없는 듯이 행동하더니, 품에서 베 모자를 꺼내 상대에게 던지며 말했다. \"너는 끝내 원언도를 알아보겠느냐 못 알아보겠느냐?\"", ["술수", "우정", "재능"]], ["任誕", 35, "王光祿云：「酒，正使人人自遠。」", "왕광록(王光祿, 王蘊)이 말했다. \"술이란 바로 사람마다 스스로 초연해지게 한다.\"", ["술과취흥", "풍류"]], ["任誕", 36, "劉尹云：「孫承公狂士，每至一處，賞翫累日，或回至半路卻返。」", "유윤(劉尹, 劉惔)이 말했다. \"손승공(孫承公, 孫統)은 미친 선비라, 어느 곳에 이를 때마다 며칠씩 구경하며 즐기고, 어떤 때는 돌아오다가 반쯤 와서 다시 되돌아가기도 한다.\"", ["자연과산수", "풍류"]], ["任誕", 37, "袁彥道有二妹：一適殷淵源，一適謝仁祖。語桓宣武云：「恨不更有一人配卿。」", "원언도(袁彥道, 袁躭)에게는 두 누이가 있었는데, 하나는 은연원(殷淵源, 殷浩)에게 시집가고 하나는 사인조(謝仁祖, 謝尚)에게 시집갔다. 환선무(桓宣武, 桓溫)에게 말했다. \"한 사람을 더 두어 그대에게 짝지어 주지 못함이 한스럽소.\"", ["부부", "기지"]], ["任誕", 38, "桓車騎在荊州，張玄為侍中，使至江陵，路經陽岐村，俄見一人，持半小籠生魚，徑來造船云：「有魚，欲寄作膾。」張乃維舟而納之。問其姓字，稱是劉遺民。張素聞其名，大相忻待。劉既知張銜命，問：「謝安、王文度並佳不？」張甚欲話言，劉了無停意。既進膾，便去，云：「向得此魚，觀君船上當有膾具，是故來耳。」於是便去。張乃追至劉家，為設酒，殊不清旨。張高其人，不得已而飲之。方共對飲，劉便先起，云：「今正伐荻，不宜久廢。」張亦無以留之。", "환거기(桓車騎, 桓沖)가 형주(荊州)에 있을 때, 장현(張玄)이 시중(侍中)이 되어 강릉(江陵)에 사신으로 갔는데, 길에 양기촌(陽岐村)을 지나다가 문득 한 사람을 보니, 작은 광주리에 생선을 반쯤 들고서 곧장 배로 다가와 말했다. \"생선이 있으니 회를 떠 만들었으면 합니다.\" 장현이 이에 배를 매어 그를 들였다. 그 성명을 물으니 유유민(劉遺民)이라 하였다. 장현은 본래 그 이름을 들어왔던지라 크게 기뻐하며 대접하였다. 유유민은 장현이 명을 받들고 가는 줄 알고 물었다. \"사안(謝安)과 왕문도(王文度, 王坦之)는 모두 잘 지내십니까?\" 장현이 무척 이야기를 나누고 싶어 하였으나, 유유민은 도무지 머물 뜻이 없었다. 회를 들이고 나자 곧 떠나며 말했다. \"아까 이 생선을 얻었는데, 그대 배에 회 뜨는 도구가 있을 듯하여 그래서 온 것뿐이오.\" 이에 곧 떠났다. 장현이 유유민의 집까지 뒤쫓아가니 술을 차려주었는데 도무지 맑고 좋지 않았다. 장현은 그 사람을 높이 여겨 마지못해 그 술을 마셨다. 막 마주하여 마시려는데 유유민이 곧 먼저 일어나 말했다. \"지금 마침 갈대를 베는 중이라 오래 멈추는 것은 마땅치 않소.\" 장현도 그를 붙잡을 도리가 없었다.", ["은둔", "풍류", "거절"]], ["任誕", 39, "王子猷詣郗雍州，雍州在內，見有毾，云：「阿乞那得此物？」令左右送還家。郗出覓之，王曰：「向有大力者負之而趨。」郗無忤色。", "왕자유(王子猷, 王徽之)가 치옹주(郗雍州, 郗恢)를 찾아갔는데, 옹주가 안에 있을 때 모담요(毾㲪)가 있는 것을 보고 말했다. \"아걸(阿乞)은 어디서 이런 물건을 얻었는가?\" 그러고는 곁의 사람을 시켜 그것을 자기 집으로 보내게 하였다. 치회(郗恢)가 나와서 그것을 찾으니 왕휘지(王徽之)가 말했다. \"아까 힘센 자가 그것을 짊어지고 달아났소.\" 치회는 거스르는 기색이 없었다.", ["기지", "오만", "도량"]], ["任誕", 40, "謝安始出西戲，失車牛，便杖策步歸。道逢劉尹，語曰：「安石將無傷？」謝乃同載而歸。", "사안(謝安)이 처음 서쪽으로 나가 놀다가 수레의 소를 잃고는, 곧 지팡이를 짚고 걸어서 돌아왔다. 도중에 유윤(劉尹, 劉惔)을 만나니, 그가 말했다. \"안석(安石, 謝安)은 상하지 않으셨소?\" 사안은 이에 함께 수레를 타고 돌아왔다.", ["풍류", "우정"]], ["任誕", 41, "襄陽羅友有大韻，少時多謂之癡。嘗伺人祠，欲乞食，往太蚤，門未開。主人迎神出見，問以非時，何得在此？答曰：「聞卿祠，欲乞一頓食耳。」遂隱門側。至曉，得食便退，了無怍容。為人有記功，從桓宣武平蜀，按行蜀城闕觀宇，內外道陌廣狹，植種果竹多少，皆默記之。後宣武漂洲與簡文集，友亦預焉。共道蜀中事，亦有所遺忘，友皆名列，曾無錯漏。宣武驗以蜀城闕簿，皆如其言。坐者歎服。謝公云：「羅友詎減魏陽元！」後為廣州刺史，當之鎮，刺史桓豁語令莫來宿。答曰：「民已有前期。主人貧，或有酒饌之費，見與甚有舊，請別日奉命。」征西密遣人察之。至日，乃往荊州門下書佐家，處之怡然，不異勝達。在益州語兒云：「我有五百人食器。」家中大驚。其由來清，而忽有此物，定是二百五十沓烏樏。", "양양(襄陽)의 나우(羅友)는 큰 운치가 있었으나, 젊었을 때에는 사람들이 그를 어리석다 여기는 일이 많았다. 일찍이 남이 제사 지내는 것을 엿보아 음식을 얻어먹으려 했는데, 너무 일찍 가서 문이 아직 열리지 않았다. 주인이 신을 맞이하러 나오다가 그를 보고, 때도 아닌데 어찌 여기 있느냐고 물으니, 그가 답하기를 \"그대가 제사 지낸다는 말을 듣고 한 끼 밥을 얻어먹으려 했을 뿐이오\"라 하고는, 마침내 문 옆에 숨어 있었다. 새벽이 되자 음식을 얻고서 곧 물러갔는데, 전혀 부끄러워하는 기색이 없었다. 사람됨이 기억력이 뛰어나, 환선무(환온, 桓溫)를 따라 촉(蜀)을 평정할 때, 촉성(蜀城)의 궐과 누대 사당, 안팎의 길이 넓고 좁은 것, 심은 과실과 대나무가 많고 적은 것을 두루 둘러보고 모두 묵묵히 기억하였다. 뒤에 선무(환온)가 표주(漂洲)에서 간문제(簡文)와 모였는데 나우 또한 그 자리에 참석하였다. 함께 촉중의 일을 이야기하다가 잊어버린 것이 있어도, 나우가 모두 조목조목 들어 말하니 한 군데도 틀리거나 빠진 것이 없었다. 선무가 촉성 궐의 장부로 대조해 보니 모두 그의 말과 같았다. 자리에 있던 이들이 탄복하였다. 사공(사안, 謝安)이 말하기를 \"나우가 어찌 위양원(魏陽元)만 못하겠는가!\"라 하였다. 뒤에 광주자사(廣州刺史)가 되어 부임지로 가려 할 때, 자사 환활(桓豁)이 그에게 내일은 와서 묵으라고 일렀다. 그가 답하기를 \"제게는 이미 먼저 한 약속이 있습니다. 그 주인은 가난하여 혹 술과 음식 차리는 비용이 들 터인데, 저와는 매우 오랜 친분이 있으니, 다른 날 명을 받들기를 청합니다\"라 하였다. 정서장군(환활)이 몰래 사람을 보내 그를 살피게 하였다. 그날이 되니 그는 형주(荊州)의 문하 서좌(書佐)의 집으로 가서, 그곳에 태연히 거하기를 뛰어난 명사를 대하는 것과 다름없이 하였다. 익주(益州)에 있을 때 아들에게 말하기를 \"내게 오백 인분의 식기가 있다\"라 하니, 집안에서 크게 놀랐다. 그는 본래 청렴하였는데 갑자기 이런 물건이 있다 하니, 알고 보니 검은 칠을 한 식합(食盒) 이백오십 개였다.", ["기지", "재능", "청빈"]], ["任誕", 42, "桓子野每聞清歌，輒喚：「奈何！」謝公聞之曰：「子野可謂一往有深情。」", "환자야(환이, 桓伊)는 맑은 노랫소리를 들을 때마다 곧 \"어쩌란 말인가!\"라 외쳤다. 사공(사안, 謝安)이 이를 듣고 말하기를 \"자야는 한결같이 깊은 정을 지녔다 할 만하다\"라 하였다.", ["음악", "풍류"]], ["任誕", 43, "張湛好於齋前種松柏。時袁山松出遊，每好令左右作挽歌。時人謂「張屋下陳屍，袁道上行殯」。", "장담(張湛)은 서재 앞에 소나무와 잣나무 심기를 좋아하였다. 그때 원산송(袁山松)은 놀러 나갈 때마다 늘 좌우에게 만가(挽歌)를 부르게 하기를 좋아하였다. 당시 사람들이 이를 두고 \"장담은 집 아래에 시체를 늘어놓고, 원산송은 길 위에서 상여를 행한다\"라 하였다.", ["풍류", "죽음"]], ["任誕", 44, "羅友作荊州從事，桓宣武為王車騎集別。友進坐良久，辭出，宣武曰：「卿向欲咨事，何以便去？」答曰：「友聞白羊肉美，一生未曾得喫，故冒求前耳。無事可咨。今已飽，不復須駐。」了無慚色。", "나우(羅友)가 형주(荊州)의 종사(從事)로 있을 때, 환선무(환온, 桓溫)가 왕거기(王車騎)를 위해 송별 모임을 베풀었다. 나우가 들어가 앉은 지 한참 만에 하직하고 나가려 하니, 선무가 말하기를 \"그대는 아까 일을 여쭈려 하더니 어찌 곧 가는가?\"라 하였다. 그가 답하기를 \"제가 흰 양고기가 맛있다는 말을 들었으나 평생 한 번도 먹어본 적이 없어, 그래서 무릅쓰고 와서 앞에 나아갔을 뿐입니다. 여쭐 일은 없습니다. 이제 이미 배가 부르니 더 머무를 필요가 없습니다\"라 하고는, 전혀 부끄러워하는 기색이 없었다.", ["기지", "오만", "풍류"]], ["任誕", 45, "張驎酒後挽歌甚悽苦，桓車騎曰：「卿非田橫門人，何乃頓爾至致？」", "장린(張驎)이 술 마신 뒤에 부르는 만가가 매우 처량하고 애절하니, 환거기(환충, 桓沖)가 말하기를 \"그대는 전횡(田橫)의 문인도 아닌데 어찌 이리도 절절한 경지에 이르는가?\"라 하였다.", ["음악", "술과취흥"]], ["任誕", 46, "王子猷嘗暫寄人空宅住，便令種竹。或問：「暫住何煩爾？」王嘯詠良久，直指竹曰：「何可一日無此君？」", "왕자유(왕휘지, 王徽之)가 일찍이 잠시 남의 빈집을 빌려 묵게 되었는데, 곧 대나무를 심게 하였다. 누군가 묻기를 \"잠시 머무는데 어찌 그리 번거롭게 하시오?\"라 하니, 왕이 한참 휘파람 불며 읊조리다가 곧장 대나무를 가리키며 말하기를 \"어찌 하루인들 이 군자 없이 지낼 수 있겠는가?\"라 하였다.", ["풍류", "은둔"]], ["任誕", 47, "王子猷居山陰，夜大雪，眠覺，開室，命酌酒。四望皎然，因起仿偟，詠左思招隱詩。忽憶戴安道，時戴在剡，即便夜乘小船就之。經宿方至，造門不前而返。人問其故，王曰：「吾本乘興而行，興盡而返，何必見戴？」", "왕자유(왕휘지, 王徽之)가 산음(山陰)에 살았는데, 밤에 큰 눈이 내려 잠에서 깨어 방문을 열고 술을 따르게 하였다. 사방을 둘러보니 온통 환하게 밝아, 이에 일어나 거닐며 좌사(左思)의 「초은시(招隱詩)」를 읊었다. 문득 대안도(대규, 戴逵)가 생각났는데, 그때 대규는 섬(剡)에 있었다. 곧바로 밤에 작은 배를 타고 그를 찾아갔다. 밤을 새워 비로소 이르렀으나, 문 앞에 이르고도 들어가지 않고 돌아왔다. 사람들이 그 까닭을 물으니, 왕이 말하기를 \"나는 본래 흥에 겨워 갔다가 흥이 다해 돌아왔으니, 어찌 꼭 대규를 만나야 하겠는가?\"라 하였다.", ["풍류", "자연과산수", "술과취흥"]], ["任誕", 48, "王衛軍云：「酒正自引人箸勝地。」", "왕위군(왕희지, 王羲之)이 말하기를 \"술은 참으로 사람을 좋은 경지로 끌어들인다\"라 하였다.", ["술과취흥", "풍류"]], ["任誕", 49, "王子猷出都，尚在渚下。舊聞桓子野善吹笛，而不相識。遇桓於岸上過，王在船中，客有識之者云：「是桓子野。」王便令人與相聞云：「聞君善吹笛，試為我一奏。」桓時已貴顯，素聞王名，即便回下車，踞胡牀，為作三調。弄畢，便上車去。客主不交一言。", "왕자유(왕휘지, 王徽之)가 도성으로 가던 중, 아직 물가에 머물러 있었다. 전부터 환자야(환이, 桓伊)가 피리를 잘 분다는 말은 들었으나 서로 알지는 못하였다. 마침 환이가 강 언덕 위를 지나가는데, 왕은 배 안에 있었고, 손님 중에 그를 아는 이가 말하기를 \"저 사람이 환자야요\"라 하였다. 왕이 곧 사람을 시켜 그에게 전하기를 \"그대가 피리를 잘 분다 들었으니, 한번 나를 위해 한 곡 불어주시오\"라 하였다. 환이는 그때 이미 귀하고 현달한 신분이었으나 평소 왕의 명성을 들어왔던 터라, 곧 수레를 돌려 내려와 호상(胡牀)에 걸터앉아 세 곡조를 불어주었다. 다 부르고 나서는 곧 수레에 올라 떠났다. 손님과 주인은 한마디도 나누지 않았다.", ["음악", "풍류"]], ["任誕", 50, "桓南郡被召作太子洗馬，船泊荻渚。王大服散後已小醉，往看桓。桓為設酒，不能冷飲，頻語左右：「令溫酒來！」桓乃流涕嗚咽，王便欲去。桓以手巾掩淚，因謂王曰：「犯我家諱，何預卿事？」王歎曰：「靈寶故自達。」", "환남군(환현, 桓玄)이 부름을 받아 태자세마(太子洗馬)가 되어, 배를 적저(荻渚)에 댔다. 왕대(왕침, 王忱)가 산(散)을 복용한 뒤 이미 약간 취해 있었는데, 환현을 보러 갔다. 환현이 그를 위해 술을 차렸으나, 왕대가 찬 술은 마시지 못하여 자꾸 좌우에게 \"따뜻한 술을 가져오라!\"라고 하였다. 그러자 환현이 눈물을 흘리며 흐느꼈다. 왕대가 곧 떠나려 하니, 환현이 수건으로 눈물을 가리며 왕대에게 말하기를 \"제 집안의 휘(諱)를 범한 것이니, 어찌 그대의 일이겠소?\"라 하였다. 왕대가 탄식하며 말하기를 \"영보(靈寶)는 참으로 통달한 사람이로다\"라 하였다.", ["효", "술과취흥", "죽음"]], ["任誕", 51, "王孝伯問王大：「阮籍何如司馬相如？」王大曰：「阮籍胸中壘塊，故須酒澆之。」", "왕효백(왕공, 王恭)이 왕대(왕침, 王忱)에게 묻기를 \"완적(阮籍)은 사마상여(司馬相如)와 견주면 어떠합니까?\"라 하니, 왕대가 답하기를 \"완적은 가슴속에 쌓인 응어리가 있어, 그래서 술로 씻어내야 했던 것이오\"라 하였다.", ["술과취흥", "비평"]], ["任誕", 52, "王佛大歎言：「三日不飲酒，覺形神不復相親。」", "왕불대(왕침, 王忱)가 탄식하여 말하기를 \"사흘만 술을 마시지 않으면 몸과 정신이 다시는 서로 친하지 않은 듯하다\"라 하였다.", ["술과취흥"]], ["任誕", 53, "王孝伯言：「名士不必須奇才。但使常得無事，痛飲酒，熟讀離騷，便可稱名士。」", "왕효백(왕공, 王恭)이 말하기를 \"명사(名士)에게 반드시 뛰어난 재주가 있어야 하는 것은 아니다. 다만 늘 일 없이 지내며 술을 실컷 마시고 『이소(離騷)』를 익히 읽기만 하면 곧 명사라 일컬을 만하다\"라 하였다.", ["술과취흥", "비평", "풍류"]], ["任誕", 54, "王長史登茅山，大慟哭曰：「琅邪王伯輿，終當為情死。」", "왕장사(왕몽, 王濛)가 모산(茅山)에 올라 크게 통곡하며 말하기를 \"낭야(琅邪)의 왕백여(王伯輿)는 끝내 정(情) 때문에 죽으리라\"라 하였다.", ["풍류", "죽음"]], ["簡傲", 1, "晉文王功德盛大，坐席嚴敬，擬於王者。唯阮籍在坐，箕踞嘯歌，酣放自若。", "진(晉)나라 문왕(사마소, 司馬昭)은 공덕이 성대하여, 그 자리에는 엄숙하고 공경스러움이 마치 왕자(王者)를 대하는 것 같았다. 오직 완적(阮籍)만은 그 자리에 있으면서 두 다리를 뻗고 앉아 휘파람 불며 노래하고, 술에 취해 거리낌 없이 평소처럼 행동하였다.", ["술과취흥", "오만", "풍류"]], ["簡傲", 2, "王戎弱冠詣阮籍，時劉公榮在坐。阮謂王曰：「偶有二斗美酒，當與君共飲。彼公榮者，無預焉。」二人交觴酬酢，公榮遂不得一桮。而言語談戲，三人無異。或有問之者，阮答曰：「勝公榮者，不得不與飲酒；不如公榮者，不可不與飲酒；唯公榮，可不與飲酒。」", "왕융(王戎)이 약관의 나이에 완적(阮籍)을 찾아갔는데, 그때 유공영(劉公榮)이 자리에 있었다. 완적이 왕융에게 말하기를 \"마침 좋은 술 두 말이 있으니, 마땅히 그대와 함께 마셔야겠소. 저 공영이라는 자는 끼지 못하오\"라 하였다. 두 사람은 술잔을 주고받으며 마셨으나 공영은 끝내 한 잔도 얻지 못하였다. 그러나 이야기를 나누고 농담하는 데에는 세 사람이 다름이 없었다. 누군가 그 까닭을 물으니, 완적이 답하기를 \"공영보다 나은 자와는 함께 술을 마시지 않을 수 없고, 공영만 못한 자와도 함께 술을 마시지 않을 수 없으나, 오직 공영만은 함께 술을 마시지 않아도 되오\"라 하였다.", ["술과취흥", "우정", "비평"]], ["簡傲", 3, "鍾士季精有才理，先不識嵇康。鍾要于時賢儁之士，俱往尋康。康方大樹下鍛，向子期為佐鼓排。康揚槌不輟，傍若無人，移時不交一言。鍾起去，康曰：「何所聞而來？何所見而去？」鍾曰：「聞所聞而來，見所見而去。」", "종사계(종회, 鍾會)는 빼어난 재주와 명리(名理)를 지녔으나, 앞서 혜강(嵇康)과는 알지 못하였다. 종회가 당시의 어질고 빼어난 인사들을 불러 함께 혜강을 찾아갔다. 혜강은 마침 큰 나무 아래에서 쇠를 두드리고 있었고, 향자기(향수, 向秀)가 풀무질을 도와주고 있었다. 혜강은 망치를 휘두르기를 그치지 않으며 곁에 아무도 없는 듯이 하여, 한참이 지나도록 한마디도 나누지 않았다. 종회가 일어나 떠나려 하니, 혜강이 말하기를 \"무엇을 듣고 왔으며, 무엇을 보고 떠나는가?\"라 하니, 종회가 답하기를 \"들은 것을 듣고 왔으며, 본 것을 보고 떠나오\"라 하였다.", ["기지", "오만", "청담"]], ["簡傲", 4, "嵇康與呂安善，每一相思，千里命駕。\n安後來，值康不在，喜出戶延之，不入。題門上作「鳳」字而去。喜不覺，猶以為欣，故作。「鳳」字，凡鳥也。", "혜강(嵇康)은 여안(呂安)과 사이가 좋아, 서로 그리울 때마다 천 리 길에도 수레를 몰았다. 여안이 뒤에 찾아왔을 때 마침 혜강이 없었는데, 혜희(嵇喜)가 문을 나서 그를 맞아들이려 했으나 여안은 들어가지 않고, 문 위에 \"봉(鳳)\" 자를 써놓고 떠났다. 혜희는 그 뜻을 깨닫지 못하고 도리어 기뻐하였으니, 그래서 \"봉\" 자를 쓴 것이었다. \"봉(鳳)\" 자는 곧 보통의 새〔凡鳥〕라는 뜻이었다.", ["우정", "기지", "비평"]], ["簡傲", 5, "陸士衡初入洛，咨張公所宜詣；劉道真是其一。陸既往，劉尚在哀制中。性嗜酒，禮畢，初無他言，唯問：「東吳有長柄壺盧，卿得種來不？」陸兄弟殊失望，乃悔往。", "육사형(육기, 陸機)이 처음 낙양(洛陽)에 들어갔을 때, 장공(장화, 張華)에게 찾아가 마땅히 만나야 할 사람을 물으니, 유도진(劉道眞)이 그중 하나였다. 육기가 찾아갔을 때 유도진은 아직 상중(喪中)에 있었다. 그는 천성이 술을 즐겼는데, 예를 마치고 나서도 처음에는 다른 말은 없이 다만 묻기를 \"동오(東吳)에는 자루가 긴 표주박이 있다는데, 그대는 그 씨앗을 얻어 왔는가?\"라고만 하였다. 육기 형제는 몹시 실망하여, 찾아온 것을 후회하였다.", ["술과취흥", "오만"]], ["簡傲", 6, "王平子出為荊州，王太尉及時賢送者傾路。時庭中有大樹，上有鵲巢。平子脫衣巾，徑上樹取鵲子。涼衣拘閡樹枝，便復脫去。得鵲子還，下弄，神色自若，傍若無人。", "왕평자(왕징, 王澄)가 형주(荊州)로 나가게 되자, 왕태위(왕연, 王衍)와 당시의 어진 이들이 전송하느라 길을 가득 메웠다. 그때 뜰 가운데 큰 나무가 있고 그 위에 까치집이 있었다. 평자가 옷과 두건을 벗고 곧장 나무에 올라가 새끼 까치를 잡았다. 속옷이 나뭇가지에 걸리자 곧 그것마저 벗어버렸다. 새끼 까치를 잡아 내려와서는 그것을 가지고 놀았는데, 신색(神色)이 태연하여 곁에 아무도 없는 듯하였다.", ["오만", "풍류"]], ["簡傲", 7, "高坐道人於丞相坐，恆偃臥其側。見卞令，肅然改容云：「彼是禮法人。」", "고좌(高坐) 도인이 승상(왕도, 王導)의 자리에서 늘 그 곁에 누워 있었다. 그러나 변령(卞壼)을 보면 엄숙히 낯빛을 고치며 말하기를 \"저분은 예법(禮法)을 지키는 사람이오\"라 하였다.", ["풍류", "비평"]], ["簡傲", 8, "桓宣武作徐州，時謝奕為晉陵。先粗經虛懷，而乃無異常。及桓還荊州，將西之間，意氣甚篤，奕弗之疑。唯謝虎子婦王悟其旨。\n每曰：「桓荊州用意殊異，必與晉陵俱西矣！」俄而引奕為司馬。奕既上，猶推布衣交。在溫坐，岸幘嘯詠，無異常日。宣武每曰：「我方外司馬。」遂因酒，轉無朝夕禮。桓舍入內，奕輒復隨去。後至奕醉，溫往主許避之。主曰：「君無狂司馬，我何由得相見？」", "환선무(환온, 桓溫)가 서주(徐州)를 다스릴 때, 그 무렵 사혁(謝奕)은 진릉(晉陵)을 맡고 있었다. 앞서 대략 마음을 터놓은 정도였을 뿐, 별다른 사이는 아니었다. 환온이 형주(荊州)로 돌아가 장차 서쪽으로 가려 할 무렵에는 정의가 매우 도타워졌으나, 사혁은 이를 의심하지 않았다. 오직 사호자(謝虎子)의 아내 왕씨만이 그 뜻을 알아차렸다. 그녀는 늘 말하기를 \"환형주(환온)의 마음 씀이 자못 별스러우니, 반드시 진릉(사혁)과 함께 서쪽으로 갈 것이다!\"라 하였다. 이윽고 사혁을 끌어다 사마(司馬)로 삼았다. 사혁은 부임한 뒤에도 여전히 포의(布衣)의 사귐을 내세웠다. 환온의 자리에서 두건을 비스듬히 쓰고 휘파람 불며 읊조리기를 평소와 다름없이 하였다. 선무는 늘 말하기를 \"나의 방외(方外)의 사마로다\"라 하였다. 마침내 술에 기대어 더욱 아침저녁의 예의도 없어졌다. 환온이 자리를 떠나 안으로 들어가면 사혁은 그때마다 또 따라 들어갔다. 뒤에 사혁이 취하기에 이르자, 환온은 안주인의 처소로 가서 그를 피하였다. 안주인이 말하기를 \"그대에게 미친 사마가 없었다면, 내가 어찌 그대를 만날 수 있었겠소?\"라 하였다.", ["우정", "예언", "풍류"]], ["簡傲", 9, "謝萬在兄前，欲起索便器。于時阮思曠在坐曰：「新出門戶，篤而無禮。」", "사만(謝萬)이 형 앞에서 일어나 요강을 찾으려 하였다. 그때 완사광(阮思曠)이 자리에 있다가 말하기를 \"새로 일어난 가문이라 도탑긴 하나 예의가 없구나\"라 하였다.", ["오만", "비평"]], ["簡傲", 10, "謝中郎是王藍田女壻，嘗箸白綸巾，肩輿徑至揚州聽事見王，直言曰：「人言君侯癡，君侯信自癡。」藍田曰：「非無此論，但晚令耳。」", "사중랑(사만, 謝萬)은 왕남전(왕술, 王述)의 사위였는데, 일찍이 흰 윤건(綸巾)을 쓰고 가마를 타고 곧장 양주(揚州)의 청사로 가서 왕술을 보고는 대뜸 말하기를 \"사람들이 군후(君侯)께서 어리석다 하더니, 군후께서는 참으로 어리석으십니다\"라 하였다. 남전(왕술)이 말하기를 \"그런 말이 없는 것은 아니다. 다만 내가 늦게야 이름을 얻었을 뿐이다\"라 하였다.", ["오만", "기지"]], ["簡傲", 11, "王子猷作桓車騎騎兵參軍，桓問曰：「卿何署？」答曰：「不知何署，時見牽馬來，似是馬曹。」桓又問：「官有幾馬？」答曰：「不問馬，何由知其數？」又問：「馬比死多少？」答曰：「未知生，焉知死？」", "왕자유(왕휘지, 王徽之)가 환거기(환충, 桓沖)의 기병참군(騎兵參軍)이 되었는데, 환충이 묻기를 \"그대는 어느 관서에 있는가?\"라 하니, 답하기를 \"어느 관서인지 모르겠으나, 때때로 말을 끌고 오는 것을 보니 마조(馬曹)인 듯합니다\"라 하였다. 환충이 또 묻기를 \"관아에 말이 몇 마리 있는가?\"라 하니, 답하기를 \"말을 묻지 않거늘 어찌 그 수를 알겠습니까?\"라 하였다. 또 묻기를 \"근래 말이 죽은 것은 얼마나 되는가?\"라 하니, 답하기를 \"삶도 아직 모르거늘 어찌 죽음을 알겠습니까?\"라 하였다.", ["기지", "오만", "청담"]], ["簡傲", 12, "謝公嘗與謝萬共出西，過吳郡。阿萬欲相與共萃王恬許，太傅云：「恐伊不必酬汝，意不足爾！」萬猶苦要，太傅堅不回，萬乃獨往。坐少時，王便入門內，謝殊有欣色，以為厚待已。良久，乃沐頭散髮而出，亦不坐，仍據胡牀，在中庭曬頭，神氣傲邁，了無相酬對意。謝於是乃還。未至船，逆呼太傅。安曰：「阿螭不作爾！」", "사공(사안, 謝安)이 일찍이 사만(謝萬)과 함께 서쪽으로 나가다가 오군(吳郡)을 지나게 되었다. 아만(사만)이 함께 왕념(王恬)의 처소에 가 머물려 하니, 태부(사안)가 말하기를 \"아마 그가 반드시 너를 상대해 주지는 않을 것이고, 내키지 않아 할 것이다\"라 하였다. 사만이 그래도 간곡히 청하니, 태부가 굳이 마음을 돌리지 않으므로 사만이 혼자 갔다. 앉은 지 얼마 되지 않아 왕념이 곧 문 안으로 들어가니, 사만은 자못 기뻐하는 빛이 있어 자기를 후하게 대접하는 것이라 여겼다. 한참 만에 왕념은 머리를 감고 머리를 풀어헤친 채 나왔는데, 앉지도 않고 그대로 호상(胡牀)에 걸터앉아 뜰 가운데서 머리를 말리며, 신기(神氣)가 오만하고 거만하여 전혀 상대하려는 뜻이 없었다. 사만은 이에 곧 돌아왔다. 배에 이르기도 전에 멀리서 태부를 불렀다. 사안이 말하기를 \"아리(阿螭, 왕념)는 그러지 않을 것이다\"라 하였다.", ["오만", "비평"]], ["簡傲", 13, "王子猷作桓車騎參軍。桓謂王曰：「卿在府久，比當相料理。」初不答，直高視，以手版拄頰云：「西山朝來，致有爽氣。」", "왕자유(왕휘지, 王徽之)가 환거기(환충, 桓沖)의 참군이 되었다. 환충이 왕에게 말하기를 \"그대가 부(府)에 있은 지 오래되었으니, 마땅히 그대 일을 처리해 주어야겠소\"라 하였다. 왕은 처음에는 답하지 않고 그저 높이 바라보다가, 손에 든 홀(笏)로 뺨을 괴며 말하기를 \"서산(西山)에 아침이 오니, 자못 상쾌한 기운이 이르는구나\"라 하였다.", ["오만", "풍류"]], ["簡傲", 14, "謝萬北征，常以嘯詠自高，未嘗撫慰眾士。謝公甚器愛萬，而審其必敗，乃俱行。從容謂萬曰：「汝為元帥，宜數喚諸將宴會，以說眾心。」萬從之。因召集諸將，都無所說，直以如意指四坐云：「諸君皆是勁卒。」諸將甚忿恨之。謝公欲深箸恩信，自隊主將帥以下，無不身造，厚相遜謝。及萬事敗，軍中因欲除之。復云：「當為隱士。」故幸而得免。", "사만(謝萬)이 북벌(北征)에 나섰을 때, 늘 휘파람 불며 읊조리기로 스스로 높은 체하고, 한 번도 여러 장병들을 위로한 적이 없었다. 사공(사안, 謝安)은 사만을 매우 아꼈으나 그가 반드시 패할 것을 살펴 알고, 이에 함께 갔다. 조용히 사만에게 일러 말하기를 \"너는 원수(元帥)이니, 마땅히 여러 장수들을 자주 불러 연회를 베풀어 뭇 사람의 마음을 기쁘게 해야 한다\"라 하였다. 사만이 그 말을 따랐다. 이에 여러 장수들을 불러 모았으나 아무 말도 하지 않고, 그저 여의(如意)로 사방의 자리를 가리키며 말하기를 \"그대들은 모두 굳센 병졸이오\"라 하였다. 여러 장수들이 그를 몹시 분하게 여기고 원망하였다. 사공이 깊이 은혜와 신의를 베풀고자 하여, 부대의 우두머리 장수로부터 그 아래에 이르기까지 몸소 찾아가지 않은 곳이 없이 두텁게 겸손히 사례하였다. 사만의 일이 실패하기에 이르러 군중(軍中)에서 그를 죽이려 하였다. 그러나 다시 말하기를 \"이분(사안)을 위해서라도 은사(隱士)로 두는 것이 마땅하다\"라 하였다. 그래서 다행히 화를 면할 수 있었다.", ["겸손", "도량", "권력"]], ["簡傲", 15, "王子敬兄弟見郗公，躡履問訊，甚脩外生禮。及嘉賓死，皆箸高屐，儀容輕慢。命坐，皆云：「有事，不暇坐。」既去，郗公慨然曰：「使嘉賓不死，鼠輩敢爾！」", "왕자경(왕헌지, 王獻之) 형제가 치공(치음, 郗愔)을 뵐 때에는 신을 끌며 문안드리고 외숙에 대한 예를 매우 정중히 갖추었다. 그러나 가빈(치초, 郗超)이 죽고 나서는 모두 굽 높은 나막신을 신고 와서 거동이 가볍고 거만하였다. 앉으라 명하면 모두 \"일이 있어 앉을 겨를이 없습니다\"라 하였다. 그들이 떠난 뒤에 치공이 개탄하며 말하기를 \"가빈(치초)이 죽지 않았다면 쥐새끼 같은 놈들이 감히 이러겠는가!\"라 하였다.", ["오만", "원한"]], ["簡傲", 16, "王子猷嘗行過吳中，見一士大夫家，極有好竹。主已知子猷當往，乃灑埽施設，在聽事坐相待。王肩輿徑造竹下，諷嘯良久。主已失望，猶冀還當通，遂直欲出門。主人大不堪，便令左右閉門不聽出。王更以此賞主人，乃留坐，盡歡而去。", "왕자유(왕휘지, 王徽之)가 일찍이 오중(吳中)을 지나다가 한 사대부의 집에 매우 좋은 대나무가 있는 것을 보았다. 주인은 이미 자유가 오리라는 것을 알고 물 뿌리고 청소한 뒤 자리를 마련하고 청사(聽事)에 앉아 기다렸다. 왕은 가마를 타고 곧장 대나무 아래로 가서 한참 동안 읊조리며 휘파람을 불었다. 주인은 이미 실망하였으나, 그래도 돌아갈 때는 마땅히 들러 인사하리라 바랐는데, 왕은 마침내 곧장 문을 나서려 하였다. 주인이 몹시 참지 못하여 곧 좌우에게 문을 닫고 나가지 못하게 하였다. 왕은 이 일로 도리어 주인을 가상히 여겨, 마침내 머물러 앉아 흥을 다하고 떠났다.", ["풍류", "도량"]], ["簡傲", 17, "王子敬自會稽經吳，聞顧辟疆有名園。先不識主人，徑往其家，值顧方集賓友酣燕。而王遊歷既畢，指麾好惡，傍若無人。顧勃然不堪曰：「傲主人，非禮也；以貴驕人，非道也。失此二者，不足齒人，傖耳！」便驅其左右出門。王獨在輿上回轉，顧望左右移時不至，然後令送箸門外，怡然不屑。", "왕자경(王獻之)이 회계(會稽)에서 오(吳)를 지나다가 고벽강(顧辟疆)에게 이름난 정원이 있다는 말을 들었다. 그는 본래 주인과 면식이 없었으나 곧장 그 집으로 갔는데, 마침 고벽강은 빈객과 벗들을 모아 흥겹게 잔치를 벌이고 있었다. 그런데 왕자경은 정원을 두루 거닐고 나서 좋고 나쁨을 손가락질하며 평하기를, 곁에 사람이 없는 듯 하였다. 고벽강이 발끈하여 참지 못하고 말하였다. \"주인에게 오만한 것은 예가 아니요, 귀함으로 남에게 교만한 것은 도가 아니다. 이 두 가지를 잃었으니 사람 축에 들 것이 못 되는 촌놈일 뿐이다!\" 그러고는 좌우를 시켜 그를 문 밖으로 몰아냈다. 왕자경은 홀로 수레 위에서 빙빙 돌며 좌우의 종자들을 기다렸으나 한참이 지나도 오지 않았다. 그런 뒤에야 고벽강이 그를 문 밖으로 내보내게 하니, 왕자경은 태연하여 개의치 않았다.", ["오만", "도량"]], ["排調", 1, "諸葛瑾為豫州，遣別駕到臺，語云：「小兒知談，卿可與語。」連往詣恪，恪不與相見。後於張輔吳坐中相遇，別駕喚恪：「咄咄郎君。」恪因嘲之曰：「豫州亂矣，何咄咄之有？」答曰：「君明臣賢，未聞其亂。」恪曰：「昔唐堯在上，四凶在下。」答曰：「非唯四凶，亦有丹朱。」於是一坐大笑。", "제갈근(諸葛瑾)이 예주(豫州)를 다스릴 때 별가(別駕)를 도성(臺)으로 보내며 말하였다. \"내 아들이 담론을 할 줄 아니, 그대가 더불어 이야기해 볼 만하오.\" 별가가 잇따라 제갈각(諸葛恪)을 찾아갔으나 제갈각은 만나 주지 않았다. 뒤에 장보오(張輔吳)의 자리에서 서로 만났는데, 별가가 제갈각을 부르며 \"기세 등등한 도련님이로다\" 하였다. 제갈각이 이에 그를 조롱하여 말하였다. \"예주가 어지러운데 무슨 기세 등등함이 있겠소?\" 별가가 대답하였다. \"임금이 밝고 신하가 어진데 어지럽다는 말은 듣지 못했소.\" 제갈각이 말하였다. \"옛날 당요(唐堯)가 위에 계실 때에도 아래에 사흉(四凶)이 있었소.\" 별가가 대답하였다. \"사흉뿐 아니라 단주(丹朱)도 있었소.\" 이에 좌중이 크게 웃었다.", ["기지", "비평", "제갈씨"]], ["排調", 2, "晉文帝與二陳共車，過喚鍾會同載，即駛車委去。比出，已遠。既至，因嘲之曰：「與人期行，何以遲遲？望卿遙遙不至。」會答曰：「矯然懿實，何必同羣？」帝復問會：「臯繇何如人？」答曰：「上不及堯、舜，下不逮周、孔，亦一時之懿士。」", "진(晉) 문제(司馬昭)가 두 진씨(陳氏)와 함께 수레를 타고 가다가 종회(鍾會)를 지나며 불러 함께 타게 하였는데, 곧바로 수레를 몰아 버려두고 떠나 버렸다. 종회가 나왔을 때는 이미 멀리 가 있었다. 종회가 당도하자 문제가 그를 조롱하여 말하였다. \"사람과 동행하기로 약속하고서 어찌 그리 늦었는가? 그대가 멀리서 오지 않을까 바라보았네.\" 종회가 대답하였다. \"꿋꿋하고 아름다운 덕을 지녔으니 어찌 굳이 무리와 함께하겠습니까?\" 문제가 다시 종회에게 물었다. \"고요(臯繇)는 어떤 사람인가?\" 종회가 대답하였다. \"위로는 요(堯)·순(舜)에 미치지 못하고 아래로는 주공(周公)·공자(孔子)에 미치지 못하나, 또한 한 시대의 아름다운 선비입니다.\"", ["기지", "비평"]], ["排調", 3, "鍾毓為黃門郎，有機警，在景王坐燕飲。時陳羣子玄伯、武周子元夏同在坐，共嘲毓。景王曰：「臯繇何如人？」對曰：「古之懿士。」顧謂玄伯、元夏曰：「君子周而不比，羣而不黨。」", "종육(鍾毓)이 황문랑(黃門郎)으로 있을 때 기지와 민첩함이 있었는데, 경왕(景王)의 자리에서 잔치하며 술을 마셨다. 그때 진군(陳羣)의 아들 현백(玄伯)과 무주(武周)의 아들 원하(元夏)가 함께 자리에 있어 종육을 조롱하였다. 경왕이 말하였다. \"고요(臯繇)는 어떤 사람인가?\" 종육이 대답하였다. \"옛날의 아름다운 선비입니다.\" 그러고는 현백과 원하를 돌아보며 말하였다. \"군자는 두루 사귀되 편당하지 않고, 무리를 이루되 패거리를 짓지 않는다.\"", ["기지", "비평"]], ["排調", 4, "嵇、阮、山、劉在竹林酣飲，王戎後往。步兵曰：「俗物已復來敗人意！」王笑曰：「卿輩意，亦復可敗邪？」", "혜강(嵇康)·완적(阮籍)·산도(山濤)·유령(劉伶)이 죽림에서 흥겹게 술을 마시는데, 왕융(王戎)이 뒤늦게 왔다. 보병(步兵, 완적)이 말하였다. \"속물이 또 와서 사람의 흥을 깨뜨리는구나!\" 왕융이 웃으며 말하였다. \"그대들의 흥취도 깨뜨릴 수 있는 것이오?\"", ["기지", "술과취흥"]], ["排調", 5, "晉武帝問孫皓：「聞南人好作爾汝歌，頗能為不？」皓正飲酒，因舉觴勸帝而言曰：「昔與汝為鄰，今與汝為臣。上汝一桮酒，令汝壽萬春。」帝悔之。", "진(晉) 무제(司馬炎)가 손호(孫皓)에게 물었다. \"듣자니 남방 사람들은 '너나(爾汝)' 노래를 즐겨 짓는다는데, 그대도 좀 지을 수 있는가?\" 손호는 마침 술을 마시던 차라 잔을 들어 무제에게 권하며 말하였다. \"옛날엔 너와 이웃이었더니, 이제는 너와 임금과 신하가 되었네. 너에게 한 잔 술을 올리니, 너로 하여금 만년토록 살게 하리라.\" 무제는 그 말을 후회하였다.", ["기지", "권력"]], ["排調", 6, "孫子荊年少時欲隱，語王武子「當枕石漱流」，誤曰「漱石枕流」。王曰：「流可枕，石可漱乎？」孫曰：「所以枕流，欲洗其耳；所以漱石，欲礪其齒。」", "손자형(孫子荊)이 젊었을 때 은거하고자 하여 왕무자(王武子)에게 \"마땅히 돌을 베고 흐르는 물에 양치질하겠다(枕石漱流)\"고 말하려다가 잘못하여 \"돌로 양치질하고 흐르는 물을 베겠다(漱石枕流)\"고 하였다. 왕무자가 말하였다. \"흐르는 물을 벨 수 있고, 돌로 양치질할 수 있단 말인가?\" 손자형이 말하였다. \"흐르는 물을 베려는 까닭은 귀를 씻으려 함이요, 돌로 양치질하려는 까닭은 이를 갈아 단단히 하려 함이오.\"", ["기지", "은둔"]], ["排調", 7, "頭責秦子羽云：「子曾不如太原溫顒、潁川荀、范陽張華、士卿劉許、義陽鄒湛、河南鄭詡。此數子者，或謇喫無宮商，或尪陋希言語，或淹伊多姿態，或讙譁少智諝，或口如含膠飴，或頭如巾齏杵。而猶以文采可觀，意思詳序，攀龍附鳳，並登天府。」", "머리(頭)가 진자우(秦子羽)를 꾸짖어 말하였다. \"그대는 태원(太原)의 온옹(溫顒), 영천(潁川)의 순씨(荀氏), 범양(范陽)의 장화(張華), 사경(士卿)의 유허(劉許), 의양(義陽)의 추담(鄒湛), 하남(河南)의 정후(鄭詡)만도 못하다. 이 몇 사람은, 혹은 말을 더듬어 가락이 없고, 혹은 비쩍 마르고 누추하여 말이 적으며, 혹은 머뭇거리며 자태만 많고, 혹은 떠들썩하기만 하고 지혜는 적으며, 혹은 입이 엿을 머금은 듯하고, 혹은 머리가 절구공이 같다. 그런데도 오히려 문채가 볼 만하고 생각이 자상하고 조리가 있어, 용을 잡고 봉황에 붙어 모두 조정(天府)에 올랐다.\"", ["비평", "기지"]], ["排調", 8, "王渾與婦鍾氏共坐，見武子從庭過，渾欣然謂婦曰：「生兒如此，足慰人意。」婦笑曰：「若使新婦得配參軍，生兒故可不啻如此！」", "왕혼(王渾)이 아내 종씨(鍾氏)와 함께 앉아 있다가 무자(武子)가 뜰을 지나가는 것을 보고, 왕혼이 흐뭇하여 아내에게 말하였다. \"이런 아들을 낳았으니 족히 사람의 마음을 위로하오.\" 아내가 웃으며 말하였다. \"만약 제가 시동생인 참군(參軍)과 짝을 맺었더라면, 낳은 아들이 이만 못하지는 않았을 것입니다!\"", ["기지", "여인"]], ["排調", 9, "荀鳴鶴、陸士龍二人未相識，俱會張茂先坐。張令共語。以其並有大才，可勿作常語。陸舉手曰：「雲間陸士龍。」荀答曰：「日下荀鳴鶴。」陸曰：「既開青雲覩白雉，何不張爾弓，布爾矢？」荀答曰：「本謂雲龍騤騤，定是山鹿野麋。獸弱弩彊，是以發遲。」張乃撫掌大笑。", "순명학(荀鳴鶴)과 육사룡(陸士龍) 두 사람은 서로 면식이 없었는데, 함께 장무선(張茂先)의 자리에 모였다. 장무선이 둘에게 더불어 이야기하게 하면서, 둘 다 큰 재주가 있으니 평범한 말은 하지 말라고 하였다. 육사룡이 손을 들어 말하였다. \"구름 사이의 육사룡(雲間陸士龍)이오.\" 순명학이 대답하였다. \"해 아래의 순명학(日下荀鳴鶴)이오.\" 육사룡이 말하였다. \"이미 푸른 구름이 열려 흰 꿩을 보았으니, 어찌 그대의 활을 당기고 그대의 화살을 메기지 않으시오?\" 순명학이 대답하였다. \"본래 구름 속의 용이 힘차게 달리는 줄 알았더니, 알고 보니 산속의 사슴이요 들녘의 고라니로다. 짐승이 약하고 쇠뇌가 강하니, 그래서 쏘기를 늦추는 것이오.\" 장무선이 이에 손뼉을 치며 크게 웃었다.", ["기지", "재능"]], ["排調", 10, "陸太尉詣王丞相，王公食以酪。陸還遂病。明日與王牋云：「昨食酪小過，通夜委頓。民雖吳人，幾為傖鬼。」", "육태위(陸太尉)가 왕승상(王導)을 찾아갔는데, 왕공이 그에게 유제품(酪)을 먹였다. 육태위는 돌아와 마침내 병이 났다. 이튿날 왕공에게 편지를 보내어 말하였다. \"어제 유제품을 조금 과하게 먹었더니 밤새 노곤하였습니다. 제가 비록 오(吳) 사람이나 하마터면 촌놈 귀신이 될 뻔했습니다.\"", ["기지", "병과늙음"]], ["排調", 11, "元帝皇子生，普賜羣臣。殷洪喬謝曰：「皇子誕育，普天同慶。臣無勳焉，而猥頒厚賚。」中宗笑曰：「此事豈可使卿有勳邪？」", "원제(元帝)의 황자가 태어나자 신하들에게 두루 상을 내렸다. 은홍교(殷洪喬)가 사양하여 말하였다. \"황자께서 태어나심은 온 천하가 함께 경하할 일입니다. 신은 아무 공이 없는데도 외람되이 후한 하사를 받았습니다.\" 중종(中宗, 元帝)이 웃으며 말하였다. \"이 일이 어찌 그대로 하여금 공을 세우게 할 수 있는 일이겠는가?\"", ["거절", "겸손"]], ["排調", 12, "諸葛令、王丞相共爭姓族先後，王曰：「何不言葛、王，而云王、葛？」令曰：「譬言驢馬，不言馬驢，驢寧勝馬邪？」", "제갈령(諸葛令)과 왕승상(王導)이 함께 성씨의 선후를 다투었다. 왕도가 말하였다. \"어찌 갈왕(葛王)이라 하지 않고 왕갈(王葛)이라 하는가?\" 제갈령이 말하였다. \"비유컨대 '나귀와 말(驢馬)'이라 하지 '말과 나귀(馬驢)'라 하지 않으니, 나귀가 어찌 말보다 낫겠소?\"", ["기지", "비평", "제갈씨"]], ["排調", 13, "劉真長始見王丞相，時盛暑之月，丞相以腹熨彈棊局，曰：「何乃渹？」劉既出，人問：「見王公云何？」劉曰：「未見他異，唯聞作吳語耳！」", "유진장(劉惔)이 처음 왕승상(王導)을 뵈었는데, 그때는 한여름이었다. 왕도가 배를 탄기국(彈棊局, 탄기판)에 대고 말하였다. \"어찌 이리 시원한고(渹)?\" 유진장이 나오자 사람들이 물었다. \"왕공을 뵙고 뭐라 하시던가?\" 유진장이 말하였다. \"별다른 점은 보지 못했고, 오직 오(吳) 지방 말을 하는 것만 들었을 뿐이오!\"", ["기지"]], ["排調", 14, "王公與朝士共飲酒，舉瑠璃盌謂伯仁曰：「此盌腹殊空，謂之寶器，何邪？」答曰：「此盌英英，誠為清徹，所以為寶耳！」", "왕공(王導)이 조정의 선비들과 함께 술을 마시다가 유리잔을 들어 백인(伯仁, 周顗)에게 말하였다. \"이 잔은 속이 텅 비었는데도 보배로운 그릇이라 하니, 어찌된 일이오?\" 백인이 대답하였다. \"이 잔은 영롱하고 참으로 맑고 투명하니, 그래서 보배가 되는 것이오!\"", ["기지", "청담"]], ["排調", 15, "謝幼輿謂周侯曰：「卿類社樹，遠望之，峨峨拂青天；就而視之，其根則羣狐所託，下聚溷而已！」答曰：「枝條拂青天，不以為高；羣狐亂其下，不以為濁；聚溷之穢，卿之所保，何足自稱？」", "사유여(謝幼輿)가 주후(周顗)에게 말하였다. \"그대는 사당의 나무(社樹)와 같소. 멀리서 바라보면 우뚝 솟아 푸른 하늘을 스치지만, 가까이 가서 보면 그 뿌리는 여우 떼가 깃든 곳이요, 아래에는 더러운 것만 모여 있을 뿐이오!\" 주후가 대답하였다. \"가지가 푸른 하늘을 스쳐도 높다 여기지 않고, 여우 떼가 그 아래 어지러워도 흐리다 여기지 않소. 더러운 것이 모인 그 추함은 그대가 지키는 바이거늘, 어찌 스스로 일컬을 만하겠소?\"", ["비평", "기지"]], ["排調", 16, "王長豫幼便和令，丞相愛恣甚篤。每共圍棊，丞相欲舉行，長豫按指不聽。丞相笑曰：「詎得爾？相與似有瓜葛。」", "왕장예(王長豫)는 어려서부터 온화하고 어질어 승상(王導)이 매우 두텁게 사랑하고 마음대로 하게 두었다. 매번 함께 바둑을 두는데, 승상이 한 수를 두려 하면 장예가 손가락을 눌러 두지 못하게 하였다. 승상이 웃으며 말하였다. \"이래도 되느냐? 너와 나는 친척의 인연(瓜葛)이 있는 듯하구나.\"", ["우정", "도량"]], ["排調", 17, "明帝問周伯仁：「真長何如人？」答曰：「故是千斤犗特。」王公笑其言。伯仁曰：「不如捲角牸，有盤辟之好。」", "명제(明帝)가 주백인(周顗)에게 물었다. \"진장(劉惔)은 어떤 사람인가?\" 주백인이 대답하였다. \"실로 천 근짜리 거세한 황소(犗特)입니다.\" 왕공(王導)이 그 말을 듣고 웃었다. 주백인이 말하였다. \"뿔 굽은 암소(牸)가 빙빙 도는 재주를 부리는 것만은 못하지요.\"", ["비평", "기지"]], ["排調", 18, "王丞相枕周伯仁厀，指其腹曰：「卿此中何所有？」答曰：「此中空洞無物，然容卿輩數百人。」", "왕승상(王導)이 주백인(周顗)의 무릎을 베고 그의 배를 가리키며 말하였다. \"그대의 이 속에는 무엇이 들었소?\" 주백인이 대답하였다. \"이 속은 텅 비어 아무것도 없으나, 그래도 그대 같은 사람 수백 명은 담을 수 있소.\"", ["기지", "도량"]], ["排調", 19, "干寶向劉真長敘其搜神記，劉曰：「卿可謂鬼之董狐。」", "간보(干寶)가 유진장(劉惔)에게 그의 『수신기(搜神記)』를 들려주자, 유진장이 말하였다. \"그대는 귀신의 동호(董狐)라 할 만하오.\"", ["비평", "학문"]], ["排調", 20, "許文思往顧和許，顧先在帳中眠。許至，便徑就牀角枕共語。既而喚顧共行，顧乃命左右取枕上新衣，易己體上所著。許笑曰：「卿乃復有行來衣乎？」", "허문사(許文思)가 고화(顧和)의 처소로 갔는데, 고화가 먼저 휘장 안에서 자고 있었다. 허문사가 이르러 곧장 침상 모서리에 나아가 베개를 베고 함께 이야기하였다. 이윽고 고화를 불러 함께 나가자 하니, 고화가 좌우에게 명하여 베개 위의 새 옷을 가져오게 하여 제 몸에 입고 있던 것을 갈아입었다. 허문사가 웃으며 말하였다. \"그대는 외출용 옷이 따로 있구려?\"", ["기지", "오만"]], ["排調", 21, "康僧淵目深而鼻高，王丞相每調之。僧淵曰：「鼻者面之山，目者面之淵。山不高則不靈，淵不深則不清。」", "강승연(康僧淵)은 눈이 깊고 코가 높았는데, 왕승상(王導)이 늘 그를 놀렸다. 강승연이 말하였다. \"코는 얼굴의 산이요, 눈은 얼굴의 못이오. 산이 높지 않으면 신령하지 못하고, 못이 깊지 않으면 맑지 못한 법이오.\"", ["기지", "용모"]], ["排調", 22, "何次道往瓦官寺禮拜甚勤。阮思曠語之曰：「卿志大宇宙，勇邁終古。」何曰：「卿今日何故忽見推？」阮曰：「我圖數千戶郡，尚不能得；卿迺圖作佛，不亦大乎！」", "하차도(何次道)가 와관사(瓦官寺)에 가서 예배를 매우 부지런히 드렸다. 완사광(阮思曠)이 그에게 말하였다. \"그대의 뜻은 우주보다 크고, 그 용맹은 만고를 뛰어넘소.\" 하차도가 말하였다. \"그대는 오늘 무슨 까닭으로 갑자기 나를 이리 추켜세우시오?\" 완사광이 말하였다. \"나는 수천 호의 고을을 도모하여도 오히려 얻지 못하는데, 그대는 부처가 되기를 도모하니 또한 크지 않소!\"", ["기지", "비평"]], ["排調", 23, "庾征西大舉征胡，既成行，止鎮襄陽。殷豫章與書，送一折角如意以調之。庾答書曰：「得所致，雖是敗物，猶欲理而用之。」", "유정서(庾翼)가 크게 군사를 일으켜 오랑캐를 치려고 출정 채비를 마쳤으나, 양양(襄陽)에 머무르며 지켰다. 은예장(殷豫章)이 그에게 편지를 보내면서 뿔이 부러진 여의(如意)를 하나 보내어 놀렸다. 유정서가 답장하여 말하였다. \"보내 주신 것을 받았소. 비록 망가진 물건이나, 그래도 손질하여 쓰고 싶소.\"", ["기지", "권력"]], ["排調", 24, "桓大司馬乘雪欲獵，先過王、劉諸人許。真長見其裝束單急，問：「老賊欲持此何作？」桓曰：「我若不為此，卿輩亦那得坐談？」", "환대사마(桓溫)가 눈 내린 날 사냥을 가려고 먼저 왕씨·유씨 등 여러 사람의 처소를 들렀다. 진장(劉惔)이 그가 가볍고 날렵하게 차림한 것을 보고 물었다. \"늙은 도적이 이 차림으로 무엇을 하려 하오?\" 환온이 말하였다. \"내가 이런 일을 하지 않으면 그대들이 또한 어찌 앉아서 담론할 수 있겠소?\"", ["기지", "권력"]], ["排調", 25, "褚季野問孫盛：「卿國史何當成？」孫云：「久應竟，在公無暇，故至今日。」褚曰：「古人『述而不作』，何必在蠶室中？」", "저계야(褚季野)가 손성(孫盛)에게 물었다. \"그대의 국사(國史)는 언제 완성되오?\" 손성이 말하였다. \"진작에 마쳤어야 했으나, 공무에 겨를이 없어 오늘에 이르렀소.\" 저계야가 말하였다. \"옛사람은 '서술하되 짓지는 않는다(述而不作)'고 하였으니, 어찌 굳이 잠실(蠶室) 안에 있을 필요가 있겠소?\"", ["기지", "학문"]], ["排調", 26, "謝公在東山，朝命屢降而不動。後出為桓宣武司馬，將發新亭，朝士咸出瞻送。高靈時為中丞，亦往相祖。先時，多少飲酒，因倚如醉，戲曰：「卿屢違朝旨，高臥東山，諸人每相與言：『安石不肯出，將如蒼生何？』今亦蒼生將如卿何？」謝笑而不答。", "사공(謝安)이 동산(東山)에 있을 때 조정의 부름이 여러 번 내려왔으나 움직이지 않았다. 뒤에 나아가 환선무(桓溫)의 사마(司馬)가 되어 신정(新亭)에서 떠나려 하자, 조정의 선비들이 모두 나와 전송하였다. 고령(高靈)이 그때 중승(中丞)으로 있었는데, 역시 가서 전별하였다. 그에 앞서 술을 얼마간 마신 터라 취한 척 비스듬히 기대어 농하여 말하였다. \"그대는 여러 번 조정의 뜻을 어기고 동산에 높이 누워 있었소. 사람들이 매번 서로 말하기를 '안석(謝安)이 나오려 하지 않으니, 장차 백성(蒼生)을 어찌할 것인가?' 하였소. 이제 백성이 장차 그대를 어찌해야 하겠소?\" 사안은 웃기만 하고 답하지 않았다.", ["은둔", "권력", "기지"]], ["排調", 27, "初，謝安在東山居，布衣，時兄弟已有富貴者，翕集家門，傾動人物。劉夫人戲謂安曰：「大丈夫不當如此乎？」謝乃捉鼻曰：「但恐不免耳！」", "처음에 사안(謝安)이 동산(東山)에 살며 벼슬 없는 선비(布衣)로 지낼 때, 형제 가운데 이미 부귀를 누리는 이가 있어 집안에 사람들이 모여들어 인물들을 휩쓸었다. 유부인(劉夫人)이 사안에게 농담으로 말하였다. \"대장부라면 마땅히 이래야 하지 않겠습니까?\" 사안이 이에 코를 잡으며 말하였다. \"다만 이를 면치 못할까 두려울 뿐이오!\"", ["은둔", "기지", "권력"]], ["排調", 28, "支道林因人就深公買印山，深公答曰：「未聞巢、由買山而隱。」", "지도림(支遁)이 사람을 통하여 심공(深公)에게 인산(印山)을 사려 하였다. 심공이 대답하였다. \"소부(巢父)나 허유(許由)가 산을 사서 은거했다는 말은 듣지 못했소.\"", ["은둔", "거절", "기지"]], ["排調", 29, "王、劉每不重蔡公。二人嘗詣蔡，語良久，乃問蔡曰：「公自言何如夷甫？」答曰：「身不如夷甫。」王、劉相目而笑曰：「公何處不如？」答曰：「夷甫無君輩客！」", "왕씨와 유씨(王濛·劉惔)는 매번 채공(蔡公)을 중하게 여기지 않았다. 두 사람이 일찍이 채공을 찾아가 한참 동안 이야기하다가 채공에게 물었다. \"공께서는 스스로 이보(夷甫, 王衍)와 견주어 어떻다고 여기시오?\" 채공이 대답하였다. \"나는 이보만 못하오.\" 왕씨와 유씨가 서로 바라보며 웃고 말하였다. \"공께서는 어느 점이 못하시오?\" 채공이 대답하였다. \"이보에게는 그대들 같은 손님이 없었소!\"", ["기지", "비평"]], ["排調", 30, "張吳興年八歲，虧齒，先達知其不常，故戲之曰：「君口中何為開狗竇？」張應聲答曰：「正使君輩從此中出入！」", "장오흥(張吳興)이 여덟 살 때 이가 빠져 있었다. 한 선배가 그가 범상치 않음을 알고 일부러 놀려 말하였다. \"그대의 입 안에 어찌 개구멍(狗竇)이 열렸는가?\" 장오흥이 소리 나는 대로 대답하였다. \"바로 그대 같은 분이 이곳으로 드나들게 하려는 것이오!\"", ["신동", "기지"]], ["排調", 31, "郝隆七月七日出日中仰臥。人問其故？答曰：「我曬書。」", "학륭(郝隆)이 칠월 칠일에 나가 햇볕 속에 벌렁 누웠다. 사람들이 그 까닭을 물으니 대답하였다. \"내 책을 볕에 말리는 것이오.\"", ["기지", "학문"]], ["排調", 32, "謝公始有東山之志，後嚴命屢臻，勢不獲已，始就桓公司馬。于時人有餉桓公藥草，中有「遠志」。公取以問謝：「此藥又名『小草』，何一物而有二稱？」謝未即答。時郝隆在坐，應聲答曰：「此甚易解：處則為遠志，出則為小草。」謝甚有愧色。桓公目謝而笑曰：「郝參軍此過乃不惡，亦極有會。」", "사공(謝安)이 처음에는 동산(東山)에 은거할 뜻이 있었으나, 뒤에 엄한 부름이 여러 번 이르러 형세상 어쩔 수 없이 비로소 환공(桓溫)의 사마(司馬)가 되었다. 그때 어떤 사람이 환공에게 약초를 보냈는데, 그 가운데 '원지(遠志)'가 있었다. 환공이 그것을 집어 사안에게 물었다. \"이 약초는 또 '소초(小草)'라고도 하는데, 어찌 한 물건에 두 이름이 있소?\" 사안이 미처 대답하지 못했다. 그때 학륭(郝隆)이 자리에 있다가 소리 나는 대로 대답하였다. \"이것은 풀이하기가 아주 쉽습니다. 산속에 있으면(處) 원지가 되고, 세상에 나오면(出) 소초가 되는 것입니다.\" 사안은 몹시 부끄러운 빛을 띠었다. 환공이 사안을 바라보며 웃고 말하였다. \"학참군의 이 말이 나쁘지 않을뿐더러 또한 매우 들어맞는구려.\"", ["기지", "은둔", "권력"]], ["排調", 33, "庾園客詣孫監，值行，見齊莊在外，尚幼，而有神意。庾試之曰：「孫安國何在？」即答曰：「庾穉恭家。」庾大笑曰：「諸孫大盛，有兒如此！」又答曰：「未若諸庾之翼翼。」還，語人曰：「我故勝，得重喚奴父名。」", "유원객(庾園客)이 손감(孫監)을 찾아갔는데 마침 외출 중이었다. 제장(齊莊)이 밖에 있는 것을 보니 아직 어렸으나 신묘한 기색이 있었다. 유원객이 그를 시험하여 물었다. \"손안국(孫安國)은 어디 계시냐?\" 제장이 곧 대답하였다. \"유치공(庾穉恭)의 집에 계십니다.\" 유원객이 크게 웃으며 말하였다. \"손씨 집안이 크게 번성하여 이런 아이가 있구나!\" 제장이 또 대답하였다. \"여러 유씨 집안의 번창함만은 못합니다.\" 유원객이 돌아가 사람들에게 말하였다. \"내가 그래도 이겼다. 그 종놈의 아비 이름을 거듭 부를 수 있었으니.\"", ["신동", "기지"]], ["排調", 34, "范玄平在簡文坐，談欲屈，引王長史曰：「卿助我。」王曰：「此非拔山力所能助！」", "범현평(范玄平)이 간문제(簡文帝)의 자리에서 담론하다가 막히려 하자, 왕장사(王濛)를 끌어들여 말하였다. \"그대가 나를 도와주시오.\" 왕장사가 말하였다. \"이것은 산을 뽑는 힘으로도 도울 수 있는 것이 아니오!\"", ["기지", "청담"]], ["排調", 35, "郝隆為桓公南蠻參軍，三月三日會，作詩。不能者，罰酒三升。隆初以不能受罰，既飲，攬筆便作一句云：「娵隅躍清池。」桓問：「娵隅是何物？」答曰：「蠻名魚為娵隅。」桓公曰：「作詩何以作蠻語？」隆曰：「千里投公，始得蠻府參軍，那得不作蠻語也？」", "학륭(郝隆)이 환공(桓公, 환온)의 남만참군(南蠻參軍)이 되었는데, 삼월 삼일 모임에서 시를 짓게 되었다. 짓지 못하는 자는 벌주 석 되를 마셔야 했다. 학륭은 처음에 짓지 못하여 벌을 받았는데, 마신 다음 붓을 잡고 곧 한 구절을 지어 이르기를 \"추우(娵隅)가 맑은 못에서 뛰노네\"라 하였다. 환공이 \"추우란 무슨 물건인가?\"라고 묻자, 대답하기를 \"만족(蠻族)은 물고기를 추우라 부릅니다\"라고 하였다. 환공이 \"시를 짓는데 어찌 만족의 말을 쓰는가?\"라고 하니, 학륭이 \"천 리를 와서 공에게 의탁하여 겨우 만부(蠻府)의 참군이 되었거늘, 어찌 만족의 말을 쓰지 않을 수 있겠습니까?\"라고 하였다.", ["기지", "권력", "술과취흥"]], ["排調", 36, "袁羊嘗詣劉恢，恢在內眠未起。袁因作詩調之曰：「角枕粲文茵，錦衾爛長筵。」劉尚晉明帝女，主見詩，不平曰：「袁羊，古之遺狂！」", "원양(袁羊)이 일찍이 유회(劉恢)를 찾아갔는데, 유회가 안에서 자고 아직 일어나지 않았다. 원양이 이에 시를 지어 그를 놀려 이르기를 \"각진 베개는 무늬 자리에 찬란하고, 비단 이불은 긴 자리에 눈부시네\"라고 하였다. 유회는 진(晉) 명제(明帝)의 딸을 아내로 맞았는데, 공주가 이 시를 보고 언짢아하며 \"원양은 옛적부터 내려온 미치광이로구나!\"라고 하였다.", ["기지", "부부"]], ["排調", 37, "殷洪遠答孫興公詩云：「聊復放一曲。」劉真長笑其語拙，問曰：「君欲云那放？」殷曰：「臘亦放，何必其鎗鈴邪？」", "은홍원(殷洪遠)이 손흥공(孫興公, 손작)의 시에 답하여 이르기를 \"잠시 다시 한 곡조를 놓아 보네(放)\"라고 하였다. 유진장(劉眞長, 유담)이 그 말이 졸렬함을 비웃으며 묻기를 \"그대는 어떻게 놓는다는 말인가?\"라고 하였다. 은홍원이 \"섣달에도 또한 놓거늘, 어찌 반드시 쟁쟁 울리는 소리뿐이겠는가?\"라고 하였다.", ["기지", "비평", "음악"]], ["排調", 38, "桓公既廢海西，立簡文，侍中謝公見桓公拜。桓驚笑曰：「安石，卿何事至爾？」謝曰：「未有君拜於前，臣立於後！」", "환공(桓公, 환온)이 이미 해서공(海西公)을 폐하고 간문제(簡文帝)를 세우자, 시중(侍中) 사공(謝公, 사안)이 환공을 뵙고 절을 하였다. 환온이 놀라 웃으며 \"안석(安石)이여, 그대는 무슨 일로 이렇게까지 하는가?\"라고 하였다. 사안이 \"임금이 앞에서 절하고 신하가 뒤에 서 있는 일은 아직 없었습니다!\"라고 하였다.", ["충직", "기지", "권력"]], ["排調", 39, "郗重熙與謝公書，道：「王敬仁聞一年少懷問鼎。不知桓公德衰，為復後生可畏？」", "치중희(郗重熙)가 사공(謝公, 사안)에게 보낸 편지에서 말하기를 \"왕경인(王敬仁, 왕몽)이 듣자니 한 젊은이가 솥의 무게를 묻는 야심을 품었다 합니다. 환공(桓公, 환온)의 덕이 쇠한 것인지, 아니면 또한 후생을 두려워할 만한 것인지 모르겠습니다\"라고 하였다.", ["권력", "비평"]], ["排調", 40, "張蒼梧是張憑之祖，嘗語憑父曰：「我不如汝。」憑父未解所以。蒼梧曰：「汝有佳兒。」憑時年數歲，歛手曰：「阿翁，詎宜以子戲父？」", "장창오(張蒼梧)는 장빙(張憑)의 조부인데, 일찍이 장빙의 아버지에게 \"나는 너만 못하다\"라고 하였다. 장빙의 아버지가 그 까닭을 알지 못하자, 장창오가 \"너에게는 훌륭한 아들이 있다\"라고 하였다. 장빙은 그때 나이 몇 살이었는데, 손을 모으고 \"할아버지, 어찌 아들로 아버지를 희롱하는 것이 마땅하겠습니까?\"라고 하였다.", ["신동", "기지", "겸손"]], ["排調", 41, "習鑿齒、孫興公未相識，同在桓公坐。桓語孫「可與習參軍共語。」孫云：「『蠢爾蠻荊』，敢與大邦為讐？」習云：「『薄伐獫狁』，至于太原。」", "습착치(習鑿齒)와 손흥공(孫興公, 손작)은 서로 알지 못했는데, 함께 환공(桓公, 환온)의 자리에 있었다. 환온이 손흥공에게 \"습참군과 더불어 이야기를 나눌 만하다\"라고 하였다. 손흥공이 \"'꿈틀거리는 저 만형(蠻荊)이여', 감히 큰 나라와 원수가 되려는가?\"라고 하니, 습착치가 \"'험윤(獫狁)을 가벼이 쳐서', 태원(太原)에까지 이르렀노라\"라고 하였다.", ["기지", "학문"]], ["排調", 42, "桓豹奴是王丹陽外生，形似其舅，桓甚諱之。宣武云：「不恆相似，時似耳！恆似是形，時似是神。」桓逾不說。", "환표노(桓豹奴)는 왕단양(王丹陽)의 생질로 외삼촌을 닮았는데, 환표노는 이를 몹시 꺼렸다. 선무(宣武, 환온)가 말하기를 \"늘 닮은 것이 아니라 때때로 닮을 뿐이다! 늘 닮은 것은 형상이요, 때때로 닮은 것은 정신이다\"라고 하였다. 환표노는 더욱 기뻐하지 않았다.", ["용모", "비평"]], ["排調", 43, "王子猷詣謝萬，林公先在坐，瞻矚甚高。王曰：「若林公鬚髮並全，神情當復勝此不？」謝曰：「脣齒相須，不可以偏亡。鬚髮何關於神明？」林公意甚惡。曰：「七尺之軀，今日委君二賢。」", "왕자유(王子猷, 왕휘지)가 사만(謝萬)을 찾아갔는데, 임공(林公, 지둔)이 먼저 자리에 있었고 그 우러르는 기상이 매우 높았다. 왕자유가 \"만약 임공의 수염과 머리털이 다 갖추어졌다면, 신정(神情)이 이보다 더 나았겠습니까?\"라고 하니, 사만이 \"입술과 이는 서로 의지하니 어느 하나도 없어서는 안 되거니와, 수염과 머리털이 신명(神明)과 무슨 상관이 있겠는가?\"라고 하였다. 임공의 마음이 매우 언짢아져 \"일곱 자의 몸을 오늘 그대 두 현인에게 맡기노라\"라고 하였다.", ["용모", "기지", "비평"]], ["排調", 44, "郗司空拜北府，王黃門詣郗門拜，云：「應變將略，非其所長。」驟詠之不已。郗倉謂嘉賓曰：「公今日拜，子猷言語殊不遜，深不可容！」嘉賓曰：「此是陳壽作諸葛評。人以汝家比武侯，復何所言？」", "치사공(郗司空, 치감)이 북부(北府)에 임명되자, 왕황문(王黃門, 왕휘지)이 치공의 문에 찾아가 절하며 \"임기응변과 장수의 책략은 그가 잘하는 바가 아니다\"라고 하면서, 거듭 이를 읊기를 그치지 않았다. 치창(郗倉)이 가빈(嘉賓, 치초)에게 이르기를 \"공이 오늘 임명되었는데, 자유(子猷, 왕휘지)의 말이 너무도 불손하니 결코 용납할 수 없습니다!\"라고 하였다. 가빈이 \"이는 진수(陳壽)가 제갈량(諸葛亮)을 평한 말이다. 사람들이 우리 집안을 무후(武侯, 제갈량)에 견주었으니, 더 무슨 말을 하겠느냐?\"라고 하였다.", ["기지", "비평", "권력", "제갈씨"]], ["排調", 45, "王子猷詣謝公，謝曰：「云何七言詩？」子猷承問，答曰：「昂昂若千里之駒，汎汎若水中之鳧。」", "왕자유(王子猷, 왕휘지)가 사공(謝公, 사안)을 찾아가니, 사공이 \"칠언시(七言詩)란 무엇인가?\"라고 하였다. 자유가 물음을 받고 답하기를 \"기운차기는 천 리를 달리는 망아지 같고, 떠다니기는 물 가운데 오리 같습니다\"라고 하였다.", ["기지", "학문"]], ["排調", 46, "王文度、范榮期俱為簡文所要。范年大而位小，王年小而位大。將前，更相推在前。既移久，王遂在范後。王因謂曰：「簸之揚之，穅秕在前。」范曰：「洮之汰之，沙礫在後。」", "왕문도(王文度, 왕탄지)와 범영기(范榮期)가 함께 간문제(簡文帝)의 부름을 받았다. 범영기는 나이가 많으나 지위가 낮았고, 왕문도는 나이가 적으나 지위가 높았다. 나아가려 할 때 서로 앞서 가라고 양보하였다. 한참을 그러다가 왕문도가 마침내 범영기 뒤에 서게 되었다. 왕문도가 이에 \"까불러 날리면 쭉정이와 겨가 앞에 가는 법이오\"라고 하니, 범영기가 \"일어 가려내면 모래와 자갈이 뒤에 남는 법이오\"라고 하였다.", ["기지", "겸손"]], ["排調", 47, "劉遵祖少為殷中軍所知，稱之於庾公。庾公甚忻然，便取為佐。既見，坐之獨榻上與語。劉爾日殊不稱，庾小失望，遂名之為「羊公鶴」。昔羊叔子有鶴善舞，嘗向客稱之。客試使驅來，氃氋而不肯舞。故稱比之。", "유준조(劉遵祖)는 젊어서 은중군(殷中軍, 은호)에게 인정받았는데, 은호가 그를 유공(庾公, 유량)에게 칭찬하였다. 유공이 매우 기뻐하며 곧 그를 보좌로 삼았다. 막상 만나서는 그를 따로 평상 위에 앉혀 더불어 이야기하였다. 유준조는 그날 도무지 기대에 미치지 못하여 유공이 다소 실망하였고, 마침내 그를 \"양공(羊公)의 학\"이라 이름하였다. 옛날 양숙자(羊叔子)에게 춤을 잘 추는 학이 있어 일찍이 손님에게 그것을 자랑하였다. 손님이 시험삼아 몰아오게 하였더니, 깃털만 부풀린 채 춤추려 하지 않았다. 그래서 그를 이에 빗댄 것이다.", ["비평", "재능"]], ["排調", 48, "魏長齊雅有體量，而才學非所經。初宦當出，虞存嘲之曰：「與卿約法三章：談者死，文筆者刑，商略抵罪。」魏怡然而笑，無忤於色。", "위장제(魏長齊)는 평소 체통과 기량(器量)이 있었으나 재주와 학문은 그가 익힌 바가 아니었다. 처음 벼슬길에 나가게 되었을 때, 우존(虞存)이 그를 놀려 이르기를 \"그대와 법 세 가지를 약속하겠소. 청담(淸談)하는 자는 죽이고, 글 짓는 자는 형벌을 주며, 평론하고 따지는 자는 죄로 다스리겠소\"라고 하였다. 위장제는 부드럽게 웃을 뿐 얼굴에 거슬리는 기색이 없었다.", ["도량", "겸손", "청담"]], ["排調", 49, "郗嘉賓書與袁虎，道戴安道、謝居士云：「恆任之風，當有所弘耳。」以袁無恆，故以此激之。", "치가빈(郗嘉賓, 치초)이 원호(袁虎)에게 보낸 편지에서 대안도(戴安道, 대규)와 사거사(謝居士)를 말하여 이르기를 \"한결같이 맡기는 풍모는 마땅히 넓혀야 할 바가 있을 것이오\"라고 하였다. 원호가 한결같음이 없었기에 이로써 그를 격려한 것이다.", ["우정", "간언", "비평"]], ["排調", 50, "范啟與郗嘉賓書曰：「子敬舉體無饒縱，掇皮無餘潤。」郗答曰：「舉體無餘潤，何如舉體非真者？」范性矜假多煩，故嘲之。", "범계(范啟)가 치가빈(郗嘉賓, 치초)에게 보낸 편지에서 \"자경(子敬, 왕헌지)은 온몸에 너그러이 풀어진 데가 없고, 껍질을 벗겨도 윤기라곤 남아 있지 않소\"라고 하였다. 치가빈이 답하기를 \"온몸에 윤기가 남아 있지 않은 것이, 온몸이 진실하지 못한 것에 비하면 어떻소?\"라고 하였다. 범계는 성품이 거짓 꾸밈과 번거로움이 많았던 까닭에 그를 놀린 것이다.", ["비평", "기지"]], ["排調", 51, "二郗奉道，二何奉佛，皆以財賄。謝中郎云：「二郗諂於道，二何佞於佛。」", "두 치씨(郗氏)는 도교(道敎)를 받들고 두 하씨(何氏)는 불교(佛敎)를 받들었는데, 모두 재물로써 하였다. 사중랑(謝中郎, 사만)이 이르기를 \"두 치씨는 도교에 아첨하고, 두 하씨는 불교에 아부한다\"라고 하였다.", ["비평", "기지"]], ["排調", 52, "王文度在西州，與林法師講，韓、孫諸人並在坐。林公理每欲小屈，孫興公曰：「法師今日如著弊絮在荊棘中，觸地挂閡。」", "왕문도(王文度, 왕탄지)가 서주(西州)에 있을 때 임법사(林法師, 지둔)와 더불어 강론하였는데, 한씨(韓氏)와 손씨(孫氏) 등 여러 사람이 함께 자리에 있었다. 임공(林公, 지둔)의 이치(理)가 매번 다소 굽히려 할 때마다 손흥공(孫興公, 손작)이 \"법사께서 오늘은 마치 해진 솜옷을 입고 가시덤불 속에 있는 것 같아 가는 곳마다 걸리는구려\"라고 하였다.", ["청담", "비평", "기지"]], ["排調", 53, "范榮期見郗超俗情不淡，戲之曰：「夷、齊、巢、許，一詣垂名。何必勞神苦形，支策據梧邪？」郗未答。韓康伯曰：「何不使遊刃皆虛？」", "범영기(范榮期)가 치초(郗超)의 속된 정이 담박하지 못함을 보고 그를 놀려 이르기를 \"백이(伯夷)·숙제(叔齊)와 소부(巢父)·허유(許由)는 한번 나아가 이름을 드리웠소. 어찌 반드시 정신을 수고롭게 하고 몸을 괴롭히며 지팡이에 기대고 오동나무에 의지하겠소?\"라고 하였다. 치초가 미처 답하지 못하자, 한강백(韓康伯)이 \"어찌하여 칼날이 노니는 곳이 모두 빈 곳이게 하지 않으시오?\"라고 하였다.", ["청담", "기지", "비평"]], ["排調", 54, "簡文在殿上行，右軍與孫興公在後。右軍指簡文語孫曰：「此噉名客！」簡文顧曰：「天下自有利齒兒。」後王光祿作會稽，謝車騎出曲阿祖之。王孝伯罷秘書丞在坐，謝言及此事，因視孝伯曰：「王丞齒似不鈍。」王曰：「不鈍，頗亦驗。」", "간문제(簡文帝)가 궁전 위를 거닐 때, 우군(右軍, 왕희지)과 손흥공(孫興公, 손작)이 뒤에 있었다. 우군이 간문제를 가리키며 손흥공에게 \"저이는 명예를 탐하는 객이오\"라고 하였다. 간문제가 돌아보며 \"천하에는 본래 날카로운 이를 가진 자가 있는 법이지\"라고 하였다. 뒤에 왕광록(王光祿)이 회계(會稽)의 자사가 되어 떠날 때, 사거기(謝車騎, 사현)가 곡아(曲阿)로 나와 전송하였다. 왕효백(王孝伯, 왕공)이 비서승(秘書丞)에서 물러나 자리에 있었는데, 사현이 이 일을 언급하다가 효백을 보며 \"왕승(王丞)의 이도 무딘 것 같지 않구려\"라고 하였다. 효백이 \"무디지 않을 뿐 아니라 자못 효험도 있지요\"라고 하였다.", ["기지", "비평"]], ["排調", 55, "謝遏夏月嘗仰臥，謝公清晨卒來，不暇著衣，跣出屋外，方躡履問訊。公曰：「汝可謂前倨而後恭。」", "사알(謝遏, 사현)이 여름철에 일찍이 반듯이 누워 있었는데, 사공(謝公, 사안)이 이른 새벽에 갑자기 오니, 옷 입을 겨를도 없이 맨발로 방 밖으로 나가서야 비로소 신을 신고 문안을 올렸다. 사공이 \"너는 가히 앞서는 거만하다가 뒤에는 공손하다 할 만하구나\"라고 하였다.", ["오만", "겸손", "기지"]], ["排調", 56, "顧長康作殷荊州佐，請假還東。爾時例不給布颿，顧苦求之，乃得發。至破冢，遭風大敗。作牋與殷云：「地名破冢，真破冢而出。行人安穩，布颿無恙。」", "고장강(顧長康, 고개지)이 은형주(殷荊州, 은중감)의 보좌가 되었다가 휴가를 청하여 동쪽으로 돌아가게 되었다. 그때 관례상 베 돛을 지급하지 않았는데, 고장강이 애써 청하여 비로소 출발할 수 있었다. 파총(破冢)에 이르렀을 때 바람을 만나 크게 낭패를 보았다. 은형주에게 편지를 지어 이르기를 \"지명이 파총인데, 참으로 무덤을 부수고 나온 격이었습니다. 그러나 가는 사람은 무사하고 베 돛도 탈이 없습니다\"라고 하였다.", ["기지", "풍류"]], ["排調", 57, "符朗初過江，王咨議大好事，問中國人物及風土所生，終無極已。朗大患之。次復問奴婢貴賤，朗云：「謹厚有識，中者，乃至十萬；無意為奴婢，問者，止數千耳。」", "부랑(符朗)이 처음 강을 건너왔을 때, 왕자의(王咨議)가 매우 호기심이 많아 중원의 인물과 풍토·산물을 물어 끝내 그칠 줄 몰랐다. 부랑이 이를 몹시 괴로워하였다. 다음에는 또 노비의 값을 물으니, 부랑이 \"삼가고 두터우며 식견 있는 자는 중간치라도 십만에 이르고, 노비 노릇할 뜻이 없으면서 캐묻기나 하는 자는 겨우 수천에 그치지요\"라고 하였다.", ["기지", "오만"]], ["排調", 58, "東府客館是版屋。謝景重詣太傅，時賓客滿中，初不交言，直仰視云：「王乃復西戎其屋。」", "동부(東府)의 객관(客館)은 널빤지로 지은 집이었다. 사경중(謝景重)이 태부(太傅, 사안)를 찾아갔을 때 마침 빈객이 가득 차 있었는데, 처음에는 말을 나누지 않고 곧장 천장을 올려다보며 \"왕(王)이 또 그 집을 서융(西戎)처럼 지었구나\"라고 하였다.", ["기지", "비평"]], ["排調", 59, "顧長康噉甘蔗，先食尾。人問所以，云：「漸至佳境。」", "고장강(顧長康, 고개지)이 사탕수수를 먹을 때 먼저 끝부분부터 먹었다. 사람들이 그 까닭을 물으니, \"점점 좋은 경지에 이르려는 것이오\"라고 하였다.", ["기지", "풍류"]], ["排調", 60, "孝武屬王珣求女壻，曰：「王敦、桓溫，磊砢之流，既不可復得，且小如意，亦好豫人家事，酷非所須。正如真長、子敬比，最佳。」珣舉謝混。後袁山松欲擬謝婚，王曰：「卿莫近禁臠。」", "효무제(孝武帝)가 왕순(王珣)에게 사위를 구하라고 부탁하며 말하기를 \"왕돈(王敦)·환온(桓溫) 같은 우뚝한 무리는 이미 다시 얻을 수 없거니와, 게다가 조금만 뜻에 맞으면 남의 집안일에 끼어들기를 좋아하니 결코 필요한 바가 아니오. 다만 진장(眞長, 유담)·자경(子敬, 왕헌지) 같은 자라면 가장 좋겠소\"라고 하였다. 왕순이 사혼(謝混)을 천거하였다. 뒤에 원산송(袁山松)이 사씨와 혼인을 맺으려 하니, 왕순이 \"그대는 금련(禁臠, 임금이 정해 둔 사위감)에 가까이 가지 마시오\"라고 하였다.", ["권력", "부부", "비평"]], ["排調", 61, "桓南郡與殷荊州語次，因共作了語。顧愷之曰：「火燒平原無遺燎。」桓曰：「白布纏棺豎旒旐。」殷曰：「投魚深淵放飛鳥。」次復作危語。桓曰：「矛頭淅米劍頭炊。」殷曰：「百歲老翁攀枯枝。」顧曰：「井上轆轤臥嬰兒。」殷有一參軍在坐，云：「盲人騎瞎馬，夜半臨深池。」殷曰：「咄咄逼人！」仲堪眇目故也。", "환남군(桓南郡, 환현)이 은형주(殷荊州, 은중감)와 이야기를 나누던 차에 함께 '끝맺는 말(了語)'을 짓게 되었다. 고개지(顧愷之)가 \"불이 평원을 태우니 남은 불씨가 없네\"라고 하였다. 환현이 \"흰 베로 관을 감으니 명정(銘旌)이 곧추서네\"라고 하였다. 은중감이 \"물고기를 깊은 못에 던지고 나는 새를 놓아주네\"라고 하였다. 다음에는 다시 '위태로운 말(危語)'을 지었다. 환현이 \"창끝에서 쌀을 일고 칼끝에서 밥을 짓네\"라고 하였다. 은중감이 \"백 살 늙은이가 마른 가지에 매달렸네\"라고 하였다. 고개지가 \"우물 위 도르래에 갓난아이가 누웠네\"라고 하였다. 은중감의 한 참군이 자리에 있다가 \"눈먼 사람이 눈먼 말을 타고 한밤중에 깊은 못가에 이르렀네\"라고 하였다. 은중감이 \"아아, 사람을 핍박하는구나!\"라고 하였으니, 중감(仲堪)이 한쪽 눈이 멀었던 까닭이다.", ["기지", "재능", "풍류"]], ["排調", 62, "桓玄出射，有一劉參軍與周參軍朋賭，垂成，唯少一破。劉謂周曰：「卿此起不破，我當撻卿。」周曰：「何至受卿撻！」劉曰：「伯禽之貴，尚不免撻，而況於卿？」周殊無忤色。桓語庾伯鸞曰：劉參軍宜停讀書，周參軍且勤學問。」", "환현(桓玄)이 활쏘기를 나갔는데, 한 유참군(劉參軍)이 주참군(周參軍)과 짝을 지어 내기를 하였다. 거의 이길 무렵에 다만 한 발만 모자랐다. 유참군이 주참군에게 \"그대가 이번에 맞히지 못하면 내가 그대를 매질하겠소\"라고 하니, 주참군이 \"어찌 그대의 매질을 받겠소!\"라고 하였다. 유참군이 \"백금(伯禽)의 귀함으로도 매질을 면치 못했거늘, 하물며 그대이겠소?\"라고 하였다. 주참군은 전혀 거슬리는 기색이 없었다. 환현이 유백란(庾伯鸞)에게 이르기를 \"유참군은 마땅히 책 읽기를 멈추어야 하고, 주참군은 또한 학문에 힘써야겠소\"라고 하였다.", ["기지", "학문", "비평"]], ["排調", 63, "桓南郡與道曜講老子，王侍中為主簿在坐。桓曰：「王主簿，可顧名思義。」王未答，且大笑。桓曰：「王思道能作大家兒笑。」", "환남군(桓南郡, 환현)이 도요(道曜)와 더불어 『노자(老子)』를 강론할 때, 왕시중(王侍中)이 주부(主簿)로서 자리에 있었다. 환현이 \"왕주부, 이름을 돌아보고 뜻을 생각해 볼 만하오\"라고 하였다. 왕시중은 미처 답하지 못하고 그저 크게 웃었다. 환현이 \"왕사도(王思道)는 능히 큰 집안 자제다운 웃음을 짓는구나\"라고 하였다.", ["청담", "기지"]], ["排調", 64, "祖廣行恒縮頭。詣桓南郡，始下車，桓曰：「天甚晴朗，祖參軍如從屋漏中來。」", "조광(祖廣)은 걸음을 걸을 때 늘 목을 움츠렸다. 환남군(桓南郡, 환현)을 찾아가 막 수레에서 내리자, 환현이 \"하늘이 매우 맑고 환한데, 조참군은 마치 비 새는 집 안에서 나온 것 같구려\"라고 하였다.", ["기지", "용모"]], ["排調", 65, "桓玄素輕桓崖，崖在京下有好桃，玄連就求之，遂不得佳者。玄與殷仲文書，以為嗤笑曰：「德之休明，肅慎貢其楛矢；如其不爾，籬壁間物，亦不可得也。」", "환현(桓玄)은 평소 환애(桓崖)를 가벼이 여겼는데, 환애가 서울에 좋은 복숭아를 가지고 있어 환현이 연거푸 청하였으나 끝내 좋은 것을 얻지 못하였다. 환현이 은중문(殷仲文)에게 보낸 편지에서 이를 비웃어 이르기를 \"덕이 아름답고 밝으면 숙신(肅愼)이 호시(楛矢)를 바치거니와, 만약 그렇지 못하면 울타리나 담장 사이의 물건조차도 얻을 수 없구려\"라고 하였다.", ["기지", "오만"]], ["輕詆", 1, "王太尉問眉子：「汝叔名士，何以不相推重？」眉子曰：「何有名士終日妄語？」", "왕태위(王太尉, 왕연)가 미자(眉子)에게 \"네 숙부는 명사(名士)인데 어찌하여 그를 떠받들어 중히 여기지 않느냐?\"라고 물었다. 미자가 \"어찌 명사가 종일토록 망령된 말을 하는 일이 있겠습니까?\"라고 하였다.", ["비평", "기지"]], ["輕詆", 2, "庾元規語周伯仁：「諸人皆以君方樂。」周曰：「何樂？謂樂毅邪？」庾曰：「不爾。樂令耳！」周曰：「何乃刻畫無鹽，以唐突西子也。」", "유원규(庾元規, 유량)가 주백인(周伯仁, 주의)에게 \"사람들이 모두 그대를 악(樂)에 견주오\"라고 하였다. 주의가 \"어느 악이오? 악의(樂毅)를 말하는 것이오?\"라고 하였다. 유량이 \"그렇지 않소. 악령(樂令, 악광)이오!\"라고 하였다. 주의가 \"어찌 추한 무염(無鹽)을 그려서 미인 서시(西子)에게 함부로 빗대는 것이오\"라고 하였다.", ["비평", "기지"]], ["輕詆", 3, "深公云：「人謂庾元規名士，胷中柴棘三斗許。」", "심공(深公)이 이르기를 \"사람들이 유원규(庾元規, 유량)를 명사(名士)라 하지만, 가슴속에는 가시덤불이 서 말쯤 들어 있다\"라고 하였다.", ["비평"]], ["輕詆", 4, "庾公權重，足傾王公。庾在石頭，王在冶城坐。大風揚塵，王以扇拂塵曰：「元規塵汙人！」", "유공(庾公, 유량)은 권세가 무거워 왕공(王公, 왕도)을 기울일 만하였다. 유공이 석두(石頭)에 있고 왕공이 야성(冶城)에 앉아 있을 때, 큰 바람이 먼지를 일으키니 왕공이 부채로 먼지를 떨치며 \"원규(元規)의 먼지가 사람을 더럽히는구나!\"라고 하였다.", ["권력", "분노", "비평"]], ["輕詆", 5, "王右軍少時甚澀訥，在大將軍許，王、庾二公後來，右軍便起欲去。大將軍留之曰：「爾家司空、元規，復可所難？」", "왕우군(王右軍, 왕희지)이 젊었을 때 매우 어눌하여 말을 더듬었는데, 대장군(大將軍, 왕돈)의 처소에 있을 때 왕공(王公, 왕도)과 유공(庾公, 유량) 두 분이 뒤따라 오자 우군이 곧 일어나 떠나려 하였다. 대장군이 그를 만류하며 \"네 집안의 사공(司空, 왕도)과 원규(元規, 유량)이거늘, 무엇이 어렵겠느냐?\"라고 하였다.", ["용모", "우정"]], ["輕詆", 6, "王丞相輕蔡
